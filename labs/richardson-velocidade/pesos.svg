<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img" aria-labelledby="title desc">
<title id="title">Os quatro pesos de Richardson para a derivada</title>
<desc id="desc">Nos pontos x menos h, x menos h sobre dois, x mais h sobre dois e x mais h, os pesos são um, menos oito, oito e menos um, todos divididos por seis h. A soma dos pesos é zero; a soma dos módulos após divisão é três sobre h.</desc>
<rect width="420" height="400" fill="#f4f3eb"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#20221e">
<text x="210" y="38" font-size="22">Quatro valores, pesos diferentes</text>
<text x="210" y="79" font-size="18">Pontos de avaliação</text>
<path d="M35 115H385" stroke="#20221e" stroke-width="2"/>
<g fill="#2348db"><circle cx="45" cy="115" r="5"/><circle cx="127.5" cy="115" r="5"/><circle cx="292.5" cy="115" r="5"/><circle cx="375" cy="115" r="5"/></g>
<text x="45" y="150" font-size="19">x−h</text><text x="127.5" y="150" font-size="19">x−h/2</text><text x="292.5" y="150" font-size="19">x+h/2</text><text x="375" y="150" font-size="19">x+h</text>
<text x="45" y="204" font-size="30">1</text><text x="127.5" y="204" font-size="30">−8</text><text x="292.5" y="204" font-size="30">8</text><text x="375" y="204" font-size="30">−1</text>
<text x="210" y="245" fill="#2348db" font-size="22">Todos divididos por 6h</text>
<path d="M40 272H380" stroke="#d3d7c9"/>
<text x="210" y="309" font-size="20">Pesos somam zero: 1−8+8−1</text>
<text x="210" y="345" font-size="20">Módulos: (1+8+8+1)/(6h) = 3/h</text>
<text x="210" y="384" font-size="15">Esquema algébrico; não representa dados medidos.</text>
</g></svg>
