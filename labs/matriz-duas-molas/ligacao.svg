<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" width="440" height="570" role="img" aria-labelledby="t desc"><title id="t">Ligação célula-matriz passa por receptores e adaptadores</title><desc id="desc">Proteína de matriz no exterior liga integrina alfa beta na membrana. A ligação intracelular segue por adaptadores, como talina, até actina. A figura mostra conexão física, não conversão entre moléculas.</desc><rect width="440" height="570" fill="#faf8f1"/><g font-family="sans-serif" fill="#17353d"><text x="24" y="34" font-size="21">Matriz e citoesqueleto se conectam</text><text x="24" y="68" font-size="14">Rota selecionada de adesão célula-matriz</text><text x="24" y="113" font-size="15">EXTERIOR</text><rect x="120" y="96" width="280" height="58" rx="5" fill="#e5dfcf"/><text x="142" y="131" font-size="18">Proteína de matriz</text><path d="M250 157 V195" stroke="#426e6a" stroke-width="5"/><rect x="24" y="224" width="392" height="25" fill="#d6e5df"/><path d="M235 201 V288 M266 201 V288" stroke="#985332" stroke-width="11"/><text x="284" y="207" font-size="16">Integrina αβ</text><text x="24" y="241" font-size="14">membrana</text><path d="M250 291 V322" stroke="#426e6a" stroke-width="5"/><rect x="125" y="323" width="275" height="57" rx="5" fill="#dce5e7"/><text x="143" y="346" font-size="16">Adaptadores</text><text x="143" y="368" font-size="14">incluindo talina nesta rota</text><path d="M250 383 V419" stroke="#426e6a" stroke-width="5"/><path d="M110 430 H397 M110 440 H397" stroke="#6b5a80" stroke-width="5"/><text x="24" y="440" font-size="16">actina</text><text x="24" y="485" font-size="15">CITOSOL</text><text x="24" y="521" font-size="14">Linhas: conexão, não conversão de moléculas.</text><text x="24" y="548" font-size="13">Não descreve todas as integrinas ou junções.</text></g></svg>