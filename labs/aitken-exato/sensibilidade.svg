<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Aitken e sensibilidade</title><desc id="desc">Três termos exatos resultam em2. Alterar o terceiro por0,00005 resulta em3, pois a segunda diferença é reduzida à metade.</desc><rect width="960" height="480" fill="#f5f2e9"/><g font-family="sans-serif" fill="#242c2a"><text x="48" y="60" font-size="28">Uma pequena mudança no dado</text><text x="48" y="96" font-size="21">x₀ = 1   ·   x₁ = 1,01   ·   muda apenas x₂</text><path d="M48 120H912" stroke="#b9bcb2"/><text x="48" y="170" font-size="22">SEM PERTURBAÇÃO</text><text x="510" y="170" font-size="22">COM +0,00005</text><text x="48" y="218" font-size="24">x₂ = 1,01990</text><text x="510" y="218" font-size="24">x₂ = 1,01995</text><text x="48" y="266" font-size="24">Δ²x = −0,00010</text><text x="510" y="266" font-size="24">Δ²x = −0,00005</text><g fill="#246153"><text x="48" y="342" font-size="44">Estimativa: 2</text><text x="510" y="342" font-size="44">Estimativa: 3</text></g><path d="M48 378H912" stroke="#b9bcb2"/><text x="48" y="420" font-size="21">Dados sintéticos · aritmética exata · sem garantia contra ruído</text></g></svg>