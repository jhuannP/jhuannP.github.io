<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">O domínio escolhe a solução</title><desc id="d">Na equação logaritmo de x menos 1 na base 2 mais logaritmo de x mais 1 na base 2 igual a 3, o domínio exige x maior que 1. A equação algébrica x ao quadrado menos 1 igual a 8 gera candidatos 3 e menos 3. Apenas 3 pertence ao domínio.</desc><rect width="440" height="420" fill="#f2f1e7"/><g font-family="sans-serif" fill="#262722"><text x="24" y="32" font-size="19" font-weight="bold">O domínio escolhe a solução.</text><text x="24" y="63" font-size="16">log₂(x−1)+log₂(x+1)=3</text><path d="M42 96V345" stroke="#273fbb" stroke-width="2"/><g fill="#273fbb"><circle cx="42" cy="112" r="5"/><circle cx="42" cy="180" r="5"/><circle cx="42" cy="248" r="5"/><circle cx="42" cy="316" r="5"/></g><g font-size="17"><text x="63" y="117">Domínio: x−1&gt;0 e x+1&gt;0 → x&gt;1</text><text x="63" y="185">No domínio: x²−1=8</text><text x="63" y="253">Candidatos algébricos: −3 e +3</text><text x="63" y="321" fill="#273fbb" font-weight="bold">Solução da equação original: 3</text></g><text x="24" y="376" font-size="15">Em −3, os dois argumentos são negativos.</text><text x="24" y="402" font-size="14">O produto positivo não valida os logaritmos separados.</text></g></svg>
