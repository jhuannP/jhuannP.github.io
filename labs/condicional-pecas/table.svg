<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><title>O denominador muda com a informação</title><desc>Tabela de100peças. Círculos:24azuis e6vermelhos,total30. Quadrados:14azuis e56vermelhos,total70. A coluna azul tem38peças;24delas são círculos.</desc><rect width="600" height="600" fill="#f6f5ed"/><g font-family="Arial,sans-serif" fill="#202722"><text x="35" y="45" font-size="24">Entre quais peças estamos contando?</text><text x="35" y="85" font-size="18">Uma peça física escolhida uniformemente entre 100</text><rect x="225" y="120" width="100" height="285" fill="#e5e4fa"/><g font-size="21"><text x="240" y="155">Azuis</text><text x="355" y="155">Vermelhas</text><text x="490" y="155">Total</text><path d="M35 175H565M35 345H565" stroke="#a1a69b"/><text x="35" y="235">Círculos</text><text x="255" y="235">24</text><text x="405" y="235">6</text><text x="505" y="235">30</text><text x="35" y="305">Quadrados</text><text x="255" y="305">14</text><text x="400" y="305">56</text><text x="505" y="305">70</text><text x="35" y="385">Total</text><text x="255" y="385">38</text><text x="400" y="385">62</text><text x="500" y="385">100</text><text x="35" y="460">Sabendo que é azul: 24 de 38 = 12/19.</text><text x="35" y="510">Sabendo que é círculo: 24 de 30 = 4/5.</text></g><text x="35" y="560" font-size="17">Dados originais; categorias não são equiprováveis.</text></g></svg>