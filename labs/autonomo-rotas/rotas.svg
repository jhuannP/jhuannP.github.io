<svg xmlns="http://www.w3.org/2000/svg" width="440" height="500" viewBox="0 0 440 500" role="img" aria-labelledby="title desc"><title id="title">Duas vias autonômicas típicas</title><desc id="desc">Nas duas vias, neurônio pré-ganglionar libera acetilcolina no gânglio e o receptor nicotínico medeia a transmissão rápida. Pós-ganglionar parassimpático libera acetilcolina no alvo muscarínico; simpático típico libera noradrenalina. Exceções são discutidas na aula.</desc><rect width="440" height="500" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384c"><text x="20" y="32" font-size="20" font-weight="bold">O transmissor depende da etapa</text><text x="20" y="57" font-size="14">A mesma ACh não identifica toda a via.</text><text x="20" y="97" font-size="17" font-weight="bold">Parassimpática típica</text><rect x="20" y="115" width="400" height="50" rx="8" fill="#dce7f4"/><text x="35" y="145" font-size="16">Pré-ganglionar · corpo celular no SNC</text><path d="M220 166 V196" stroke="#2459a0" stroke-width="3"/><text x="236" y="188" font-size="14">ACh</text><rect x="20" y="198" width="400" height="46" rx="8" fill="#edf0f4"/><text x="35" y="226" font-size="15">Gânglio: nicotínico → pós-ganglionar</text><path d="M220 245 V274" stroke="#2459a0" stroke-width="3"/><text x="236" y="266" font-size="14">ACh</text><text x="34" y="298" font-size="16" font-weight="bold">Alvo periférico: receptor muscarínico</text><path d="M20 321 H420" stroke="#aab3bf"/><text x="20" y="352" font-size="17" font-weight="bold">Simpática típica</text><text x="24" y="381" font-size="15">Pré → ACh → gânglio nicotínico</text><text x="24" y="409" font-size="15">Pós → noradrenalina → alvo</text><text x="24" y="437" font-size="14">Receptor adrenérgico e tecido importam.</text><text x="20" y="476" font-size="13">Esquema de conexões; comprimentos sem escala.</text></g></svg>