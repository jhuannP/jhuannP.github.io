<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="t d"><title id="t">Uma posição recebe o novo byte</title><desc id="d">Endereço dois, dado nove, habilitação e evento um. A posição dois passa de 170 a 9; as outras permanecem 3, 85 e 240.</desc><rect width="660" height="420" fill="#f0eee5"/><g font-family="sans-serif" fill="#263a38"><text x="28" y="40" font-size="24" font-weight="bold">Selecionar. Escrever. Preservar.</text><text x="28" y="73" font-size="17">Endereço 10₂ · D=9 · we=1 · event=1</text><path d="M28 137H632 M28 198H632 M28 259H632 M28 320H632" stroke="#87948c"/><rect x="28" y="263" width="604" height="53" fill="#d5e4da"/><g font-size="20"><text x="28" y="120">Índice</text><text x="190" y="120">Antes</text><text x="340" y="120">Depois</text><text x="490" y="120">Habilitação</text><text x="28" y="175">0</text><text x="190" y="175">3</text><text x="340" y="175">3</text><text x="530" y="175">0</text><text x="28" y="236">1</text><text x="190" y="236">85</text><text x="340" y="236">85</text><text x="530" y="236">0</text><text x="28" y="297">2</text><text x="190" y="297">170</text><text x="340" y="297">9</text><text x="530" y="297">1</text><text x="28" y="358">3</text><text x="190" y="358">240</text><text x="340" y="358">240</text><text x="530" y="358">0</text></g><text x="28" y="400" font-size="16">Uma transição idealizada; nenhuma posição não selecionada muda.</text></g></svg>
