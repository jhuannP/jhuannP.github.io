<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="title desc">
<title id="title">Probabilidade binomial exata e aproximação por áreas normais</title>
<desc id="desc">Para K binomial com n dezesseis e p um meio, barras são probabilidades exatas. A linha liga áreas da normal de média oito e desvio dois nas células de cada inteiro. Evento de seis a dez tem probabilidade exata 0,789886; aproximação corrigida 0,788700 e sem correção 0,682689. Caso raro de n cem e p 0,01 mantém erro maior.</desc>
<rect width="760" height="530" fill="#f7f7f0"/>
<g font-family="Arial,sans-serif" fill="#233638">
<text x="26" y="35" font-size="23" font-weight="bold">A curva aproxima áreas; a contagem continua discreta.</text>
<text x="26" y="64" font-size="17">K ~ Binomial(16, 1/2) · média 8 · desvio 2 · evento 6 ≤ K ≤ 10</text>
<text x="26" y="94" font-size="16">Barras: P(K = k). Linha: área normal da célula [k−0,5; k+0,5].</text>
<rect x="270" y="115" width="180" height="215" fill="#e8eddd"/>
