<text x="26" y="391" font-size="20" font-weight="bold">Exata: 25883/32768 ≈ 0,789886.</text>
<text x="26" y="424" font-size="18">Normal com correção: 0,788700 · erro absoluto ≈ 0,001186.</text>
<text x="26" y="455" font-size="18">Normal sem correção: 0,682689 · erro absoluto ≈ 0,107197.</text>
<text x="26" y="491" font-size="15">Raro: n=100, p=0,01. P(K=0): exata 0,366032; normal corrigida 0,307651.</text>
<text x="26" y="517" font-size="15">Leis e eventos prescritos, sem amostra simulada ou limiar universal de precisão.</text>
