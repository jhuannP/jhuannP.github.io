<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Concentração não decide sozinha</title><desc id="desc">Mesma razão interna externa 8. Energias em RT ln2: cátion com voltagem menos quatro tem soma menos um, entrada favorável; ânion com voltagem mais quatro tem soma sete, saída favorável; cátion com voltagem menos três tem soma zero, equilíbrio desta espécie.</desc><rect width="720" height="460" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="32" y="46" font-size="25" font-weight="bold">A mesma concentração. Três balanços.</text><text x="32" y="78" font-size="17">c dentro / c fora = 8 · energia para fora → dentro</text><text x="32" y="108" font-size="15">Unidade: RT ln 2 por mol · potenciais prescritos</text><g font-size="17"><text x="32" y="160">Espécie</text><text x="210" y="160">Química</text><text x="340" y="160">Elétrica</text><text x="470" y="160">Total</text><text x="560" y="160">Tendência</text></g><g stroke="#b5bbb1"><path d="M32 177H688M32 248H688M32 319H688M32 390H688"/></g><g font-size="22"><text x="32" y="222">z = +1</text><text x="230" y="222">+3</text><text x="360" y="222">−4</text><text x="480" y="222">−1</text><text x="560" y="222" font-size="18">Entrada</text><text x="32" y="293">z = −1</text><text x="230" y="293">+3</text><text x="360" y="293">+4</text><text x="480" y="293">+7</text><text x="560" y="293" font-size="18">Saída</text><text x="32" y="364">z = +1</text><text x="230" y="364">+3</text><text x="360" y="364">−3</text><text x="480" y="364">0</text><text x="560" y="364" font-size="18">Equilíbrio*</text></g><text x="32" y="423" font-size="15">*Desta espécie; não prova equilíbrio de toda a célula.</text><text x="32" y="446" font-size="14">Cenários ideais próprios. Não são fluxos medidos nem previsão de velocidade.</text></g></svg>