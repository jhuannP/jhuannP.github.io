<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700"><title>Colisão oblíqua: só as componentes normais mudam</title><desc>Modelo liso com m1doiskg,m2trêskg,normal3/5e4/5 e restituição1/2. Velocidade normal1 muda de2,6 para menos0,28; normal2 de menos0,6 para1,32. Tangenciais menos1,8 e0,8 não mudam. Energia cinética inicial11,5joules se divide em6,892 finais e4,608 convertidos em outros modos.</desc><rect width="760" height="700" fill="#f7f3e9"/><g font-family="system-ui" fill="#243c38"><text x="28" y="38" font-size="25" font-weight="bold">Restituição normal, tangente preservada</text><text x="28" y="73" font-size="18">n = (3/5,4/5) · τ = (−4/5,3/5) · e = 1/2</text><rect x="28" y="100" width="704" height="326" rx="8" fill="#e3eadd"/><g font-size="21"><text x="50" y="139" font-weight="bold">Componente / m·s⁻¹</text><text x="420" y="139" font-weight="bold">Antes</text><text x="580" y="139" font-weight="bold">Depois</text><path d="M48 157H710" stroke="#9eb4a6"/><text x="50" y="196">Corpo 1 · normal</text><text x="425" y="196">2,6</text><text x="585" y="196">−0,28</text><text x="50" y="239">Corpo 2 · normal</text><text x="425" y="239">−0,6</text><text x="585" y="239">1,32</text><text x="50" y="282">Corpo 1 · tangente</text><text x="425" y="282">−1,8</text><text x="585" y="282">−1,8</text><text x="50" y="325">Corpo 2 · tangente</text><text x="425" y="325">0,8</text><text x="585" y="325">0,8</text><path d="M48 345H710" stroke="#9eb4a6"/><text x="50" y="386">Relativa normal</text><text x="425" y="386">3,2</text><text x="585" y="386">−1,6</text></g><text x="28" y="468" font-size="22" font-weight="bold">Balanço: K inicial = 11,5 J</text><rect x="50" y="491" width="395.53" height="45" fill="#c9ded0"/><rect x="445.53" y="491" width="264.47" height="45" fill="#e9d3bc"/><text x="64" y="521" font-size="19">K final: 6,892 J</text><text x="459" y="521" font-size="19">Outros modos: 4,608 J</text><text x="28" y="577" font-size="19">Momento total: (3,2) kg·m/s antes e depois</text><text x="28" y="614" font-size="19">Impulso normal: J = 144/25 N·s</text><text x="28" y="661" font-size="16">Entrada prescrita, em SI; não é experimento ou trajetória medida.</text><text x="28" y="686" font-size="14">Sem atrito, adesão, impulso externo ou cálculo de contato/rotação.</text></g></svg>