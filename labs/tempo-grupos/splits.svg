<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" role="img" aria-labelledby="t d"><title id="t">O corte responde a uma pergunta</title><desc id="d">Separar linhas mantém os três grupos nos dois lados. Reservar C inteiro testa grupo novo. No corte temporal8 com horizonte2, a origem7 é removida do treino porque o rótulo chega em9.</desc><rect width="620" height="560" fill="#faf9f4"/><g font-family="Arial,sans-serif" fill="#292929"><text x="24" y="33" font-size="21">O que precisa ser novo na avaliação?</text><text x="24" y="62" font-size="15">T: treino · E: avaliação · P: purgo por rótulo indisponível</text><text x="24" y="111" font-size="17">Nova linha dos mesmos grupos</text><rect x="40" y="130" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="75" y="157" text-anchor="middle" fill="white" font-size="18">T</text><text x="75" y="196" text-anchor="middle" font-size="15">A₁</text><rect x="128" y="130" width="70" height="42" fill="#faf9f4" stroke="#555"/><text x="163" y="157" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="163" y="196" text-anchor="middle" font-size="15">A₂</text><rect x="216" y="130" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="251" y="157" text-anchor="middle" fill="white" font-size="18">T</text><text x="251" y="196" text-anchor="middle" font-size="15">B₁</text><rect x="304" y="130" width="70" height="42" fill="#faf9f4" stroke="#555"/><text x="339" y="157" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="339" y="196" text-anchor="middle" font-size="15">B₂</text><rect x="392" y="130" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="427" y="157" text-anchor="middle" fill="white" font-size="18">T</text><text x="427" y="196" text-anchor="middle" font-size="15">C₁</text><rect x="480" y="130" width="70" height="42" fill="#faf9f4" stroke="#555"/><text x="515" y="157" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="515" y="196" text-anchor="middle" font-size="15">C₂</text><text x="24" y="241" font-size="17">Grupo C inteiro reservado: um dos três folds</text><rect x="40" y="260" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="75" y="287" text-anchor="middle" fill="white" font-size="18">T</text><text x="75" y="326" text-anchor="middle" font-size="15">A₁</text><rect x="128" y="260" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="163" y="287" text-anchor="middle" fill="white" font-size="18">T</text><text x="163" y="326" text-anchor="middle" font-size="15">A₂</text><rect x="216" y="260" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="251" y="287" text-anchor="middle" fill="white" font-size="18">T</text><text x="251" y="326" text-anchor="middle" font-size="15">B₁</text><rect x="304" y="260" width="70" height="42" fill="#4f46a5" stroke="#555"/><text x="339" y="287" text-anchor="middle" fill="white" font-size="18">T</text><text x="339" y="326" text-anchor="middle" font-size="15">B₂</text><rect x="392" y="260" width="70" height="42" fill="#faf9f4" stroke="#555"/><text x="427" y="287" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="427" y="326" text-anchor="middle" font-size="15">C₁</text><rect x="480" y="260" width="70" height="42" fill="#faf9f4" stroke="#555"/><text x="515" y="287" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="515" y="326" text-anchor="middle" font-size="15">C₂</text><text x="24" y="381" font-size="17">Tempo: ajuste em c = 8 · alvo chega em t + 2</text><rect x="27" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="50" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="50" y="470" text-anchor="middle" font-size="16">0</text><rect x="84" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="107" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="107" y="470" text-anchor="middle" font-size="16">1</text><rect x="141" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="164" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="164" y="470" text-anchor="middle" font-size="16">2</text><rect x="198" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="221" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="221" y="470" text-anchor="middle" font-size="16">3</text><rect x="255" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="278" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="278" y="470" text-anchor="middle" font-size="16">4</text><rect x="312" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="335" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="335" y="470" text-anchor="middle" font-size="16">5</text><rect x="369" y="406" width="46" height="40" fill="#4f46a5" stroke="#555"/><text x="392" y="433" text-anchor="middle" fill="white" font-size="18">T</text><text x="392" y="470" text-anchor="middle" font-size="16">6</text><rect x="426" y="406" width="46" height="40" fill="#ddd" stroke="#555"/><text x="449" y="433" text-anchor="middle" fill="#292929" font-size="18">P</text><text x="449" y="470" text-anchor="middle" font-size="16">7</text><rect x="483" y="406" width="46" height="40" fill="#faf9f4" stroke="#555"/><text x="506" y="433" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="506" y="470" text-anchor="middle" font-size="16">8</text><rect x="540" y="406" width="46" height="40" fill="#faf9f4" stroke="#555"/><text x="563" y="433" text-anchor="middle" fill="#292929" font-size="18">E</text><text x="563" y="470" text-anchor="middle" font-size="16">9</text><text x="24" y="497" font-size="14">Origem t (intervalos unitários); previsões emitidas em cada origem.</text><path d="M24 512H596" stroke="#bbb"/><text x="24" y="538" font-size="15">A origem 7 é anterior ao teste; seu rótulo ainda chega tarde.</text></g></svg>