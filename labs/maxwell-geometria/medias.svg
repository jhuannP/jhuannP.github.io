<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Componente e rapidez respondem a perguntas diferentes</title><desc id="desc">Na escala s igual aum,uma componente é assinada,tem média0,segundo momento1e modo0. A rapidez é não negativa,tem média raiz de oito sobrepi,segundo momento3e modo raiz dedois.</desc><rect width="760" height="450" rx="18" fill="#f4f0e7"/><g font-family="sans-serif" fill="#20333b"><text x="38" y="48" font-size="25" font-weight="700">Média zero não significa gás parado</text><text x="38" y="79" font-size="16">Variáveis adimensionais: x = vₓ/s e u = |v|/s · s = √(θ/m)</text><path d="M38 111H722M38 176H722M38 240H722M38 304H722M38 368H722" stroke="#bdc8bf"/><g font-size="19" font-weight="700"><text x="50" y="150">Pergunta</text><text x="300" y="150">Componente x</text><text x="555" y="150">Rapidez u</text></g><g font-size="20"><text x="50" y="216">Suporte</text><text x="320" y="216">−∞ a +∞</text><text x="585" y="216">0 a +∞</text><text x="50" y="280">Média</text><text x="365" y="280">0</text><text x="575" y="280">√(8/π)</text><text x="50" y="344">Segundo momento</text><text x="365" y="344">1</text><text x="605" y="344">3</text><text x="50" y="408">Modo</text><text x="365" y="408">0</text><text x="600" y="408">√2</text></g></g></svg>