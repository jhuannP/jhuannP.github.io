<svg xmlns="http://www.w3.org/2000/svg" width="480" height="610" viewBox="0 0 480 610" role="img" aria-labelledby="title desc"><title id="title">Distribuição fixa com circulação</title><desc id="desc">Três estados A, B e C com avanço no ciclo de probabilidade um meio e permanência de um meio. A distribuição uniforme é estacionária. O fluxo A para B vale um sexto e o fluxo B para A vale zero. As correntes se compensam em cada estado sem serem zero em cada par.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#174c91"/></marker></defs>
<rect width="480" height="610" fill="#f7f8fa"/>
<g font-family="Arial, sans-serif" fill="#172334">
<text x="26" y="37" font-size="23" font-weight="700">Estacionária, com circulação</text>
<text x="26" y="70" font-size="18">π = (1/3, 1/3, 1/3)</text>
<path d="M263 169L342 302" stroke="#174c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M332 332H150" stroke="#174c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M132 302L216 170" stroke="#174c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="240" cy="146" r="30" fill="white" stroke="#174c91" stroke-width="2"/>
<circle cx="360" cy="332" r="30" fill="white" stroke="#174c91" stroke-width="2"/>
<circle cx="120" cy="332" r="30" fill="white" stroke="#174c91" stroke-width="2"/>
<text x="231" y="155" font-size="25">A</text><text x="351" y="341" font-size="25">B</text><text x="110" y="341" font-size="25">C</text>
<text x="316" y="224" font-size="18">1/2</text><text x="116" y="224" font-size="18">1/2</text><text x="220" y="365" font-size="18">1/2</text>
<text x="26" y="410" font-size="17">Cada estado também permanece com 1/2.</text>
<path d="M26 434H454" stroke="#bec7d2"/>
<text x="26" y="470" font-size="20" font-weight="700">F_AB = 1/6 ; F_BA = 0</text>
<text x="26" y="504" font-size="18">J_AB = J_BC = J_CA = 1/6</text>
<text x="26" y="541" font-size="17">Em A: J_AB + J_AC = 1/6 − 1/6 = 0.</text>
<text x="26" y="582" font-size="15">Probabilidades por passo; modelo sintético.</text>
</g></svg>
