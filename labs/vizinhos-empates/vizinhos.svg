<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">Vizinhos para consulta quatro</title><desc id="d">Na linha numérica estão0 e2 de classe0,3 e5 de classe1 e8 de classe0. Para consulta4 e k3, escolhem-se3,5,2, com distâncias1,1,2 e classe prevista1.</desc><rect width="440" height="420" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Quem vota na consulta q = 4?</text><text x="24" y="66" font-size="16">k = 3 · distância absoluta</text><path d="M40 150 H400" stroke="#64748b" stroke-width="2"/><path d="M220 112 V180" stroke="#192b45" stroke-dasharray="4 4"/><text x="201" y="102" font-size="16">q = 4</text><circle cx="40" cy="150" r="8" fill="#718096"/><text x="35" y="181" font-size="16">0</text><text x="24" y="211" font-size="13">y=0</text><circle cx="130" cy="150" r="8" fill="#718096"/><text x="125" y="181" font-size="16">2</text><text x="114" y="211" font-size="13">y=0</text><circle cx="175" cy="150" r="8" fill="#294dbc"/><text x="170" y="181" font-size="16">3</text><text x="159" y="211" font-size="13">y=1</text><circle cx="265" cy="150" r="8" fill="#294dbc"/><text x="260" y="181" font-size="16">5</text><text x="249" y="211" font-size="13">y=1</text><circle cx="400" cy="150" r="8" fill="#718096"/><text x="395" y="181" font-size="16">8</text><text x="384" y="211" font-size="13">y=0</text><path d="M175 130 Q197 112 220 130 M220 130 Q242 112 265 130 M130 126 Q175 76 220 126" fill="none" stroke="#294dbc" stroke-width="2"/><path d="M24 243 H416" stroke="#ccd3e6"/><text x="24" y="279" font-size="17">Selecionados: x = 3, 5, 2</text><text x="24" y="311" font-size="17">Distâncias: 1, 1, 2</text><text x="24" y="344" font-size="17">Votos: 1, 1, 0 → classe 1</text><text x="24" y="381" font-size="14">Fração 2/3 não demonstra calibração.</text><text x="24" y="407" font-size="12">Esquema original · conjunto sintético, sem dados reais</text></g></svg>