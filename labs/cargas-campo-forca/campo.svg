<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">Carga total zero, campo não nulo</title><desc id="desc">Fontes mais dois e menos dois nanocoulomb nas posições zero e zero vírgula quatro metro. O ponto P está no meio. Cada campo em P aponta à direita com módulo quatrocentos e cinquenta newtons por coulomb; a soma é novecentos à direita.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#2154a0"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="38" font-size="25" font-weight="bold">Carga total zero, campo não nulo</text><text x="24" y="75" font-size="20">Contribuições calculadas no mesmo ponto P</text><path d="M80 153H480" stroke="#aab7ca" fill="none"/><circle cx="95" cy="153" r="23" fill="#dfe8f5" stroke="#2154a0"/><text x="95" y="161" text-anchor="middle" font-size="25">+</text><circle cx="465" cy="153" r="23" fill="#dfe8f5" stroke="#2154a0"/><text x="465" y="161" text-anchor="middle" font-size="25">−</text><circle cx="280" cy="153" r="5" fill="#192e49"/><text x="273" y="128" font-size="21">P</text><text x="50" y="112" font-size="20">+2 nC</text><text x="425" y="112" font-size="20">−2 nC</text><text x="70" y="201" font-size="19">0 m</text><text x="247" y="201" font-size="19">0,20 m</text><text x="430" y="201" font-size="19">0,40 m</text><text x="26" y="256" font-size="21">Da positiva</text><path d="M230 250H350" stroke="#2154a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="382" y="257" font-size="21">+450 N/C</text><text x="26" y="310" font-size="21">Da negativa</text><path d="M230 304H350" stroke="#2154a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="382" y="311" font-size="21">+450 N/C</text><text x="26" y="367" font-size="22" font-weight="bold">Soma</text><path d="M230 360H470" stroke="#2154a0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="26" y="412" font-size="23" fill="#2154a0">E(P) = +900 N/C: direita positiva</text></g></svg>