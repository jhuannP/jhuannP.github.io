<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="t d"><title id="t">Três médias com contagens diferentes</title><desc id="d">Batch A tem quatro perdas um, B quatro perdas dois e C duas perdas três. Total dezoito em dez exemplos: média um vírgula oito. A média simples das três médias vale dois e atribui peso maior a cada item do último bloco.</desc><rect width="440" height="440" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384b"><text x="20" y="32" font-size="20" font-weight="bold">Cada exemplo conta uma vez</text><text x="20" y="58" font-size="14">Perdas fixas no mesmo estado do modelo</text><text x="20" y="94" font-size="15" font-weight="bold">Batch A</text><rect x="20" y="107" width="36" height="36" rx="4" fill="#dce7f4"/><text x="32" y="132" font-size="18">1</text><rect x="64" y="107" width="36" height="36" rx="4" fill="#dce7f4"/><text x="76" y="132" font-size="18">1</text><rect x="108" y="107" width="36" height="36" rx="4" fill="#dce7f4"/><text x="120" y="132" font-size="18">1</text><rect x="152" y="107" width="36" height="36" rx="4" fill="#dce7f4"/><text x="164" y="132" font-size="18">1</text><text x="225" y="131" font-size="16">Peso: 4/10 · média: 1</text><text x="20" y="185" font-size="15" font-weight="bold">Batch B</text><rect x="20" y="198" width="36" height="36" rx="4" fill="#e3eee5"/><text x="32" y="223" font-size="18">2</text><rect x="64" y="198" width="36" height="36" rx="4" fill="#e3eee5"/><text x="76" y="223" font-size="18">2</text><rect x="108" y="198" width="36" height="36" rx="4" fill="#e3eee5"/><text x="120" y="223" font-size="18">2</text><rect x="152" y="198" width="36" height="36" rx="4" fill="#e3eee5"/><text x="164" y="223" font-size="18">2</text><text x="225" y="222" font-size="16">Peso: 4/10 · média: 2</text><text x="20" y="276" font-size="15" font-weight="bold">Batch C</text><rect x="20" y="289" width="36" height="36" rx="4" fill="#f1e3d2"/><text x="32" y="314" font-size="18">3</text><rect x="64" y="289" width="36" height="36" rx="4" fill="#f1e3d2"/><text x="76" y="314" font-size="18">3</text><text x="225" y="313" font-size="16">Peso: 2/10 · média: 3</text><text x="20" y="365" font-size="17" font-weight="bold">(4×1+4×2+2×3)/10=1,8</text><text x="20" y="396" font-size="15">(1+2+3)/3=2 muda os pesos.</text><text x="20" y="423" font-size="13">Uma média por batch não define a unidade de peso.</text></g></svg>