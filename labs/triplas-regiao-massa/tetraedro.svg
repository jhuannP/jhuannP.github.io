<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">A região determina a altura</title><desc id="desc">Tetraedro limitado pelos eixos e pelo plano x mais y mais z igual a um. Para x igual y igual um quarto, z varia de zero até um meio.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#2154a0"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="35" font-size="25" font-weight="bold">A região determina a altura</text><path d="M110 315L450 350L30 200Z" fill="#e9edf3" stroke="#71839e"/><path d="M450 350L30 200L150 75Z" fill="#dfe8f5" fill-opacity=".8" stroke="#71839e" stroke-width="2"/><path d="M110 315L150 75" stroke="#71839e" stroke-dasharray="5 4" fill="none"/><text x="95" y="339" font-size="20">0</text><text x="432" y="379" font-size="21">x=1</text><text x="12" y="181" font-size="21">y=1</text><text x="134" y="62" font-size="21">z=1</text><text x="307" y="130" font-size="22">x+y+z=1</text><path d="M175 295L195 175" stroke="#2154a0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="175" cy="295" r="5" fill="#2154a0"/><text x="208" y="174" font-size="22" fill="#2154a0">z=1/2</text><text x="196" y="318" font-size="21">(x,y)=(1/4,1/4)</text><text x="24" y="417" font-size="22">0≤z≤1−x−y; não é todo o cubo.</text></g></svg>