<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Diluição no modelo ideal 2A em equilíbrio com B</title><desc id="desc">Com total de unidades A igual a três mol e K um: v um mol dá A um, B um; v oito mol dá A dois, B meio. O total A mais duas vezes B é conservado; a soma de mols de espécies muda.</desc><rect width="760" height="480" fill="#f5f3e8"/><g font-family="sans-serif" fill="#263d37"><text x="36" y="44" font-size="24" font-weight="bold">Diluir muda Q; K permanece fixo.</text><text x="36" y="78" font-size="18">2A ⇌ B · modelo ideal hipotético · K = 1</text><rect x="36" y="112" width="326" height="220" rx="12" fill="#dce8e1"/><rect x="390" y="112" width="334" height="220" rx="12" fill="#e9dfd0"/><text x="60" y="150" font-size="22">v = Vc° = 1 mol</text><text x="60" y="198" font-size="22">nA = 1 mol; nB = 1 mol</text><text x="60" y="244" font-size="20">Q = 1 × 1 / 1² = 1</text><text x="60" y="294" font-size="20">nA + nB = 2 mol</text><text x="412" y="150" font-size="22">v = Vc° = 8 mol</text><text x="412" y="198" font-size="22">nA = 2 mol; nB = 1/2 mol</text><text x="412" y="244" font-size="20">Q = 8 × (1/2) / 2² = 1</text><text x="412" y="294" font-size="20">nA + nB = 5/2 mol</text><text x="36" y="380" font-size="22" font-weight="bold">Nos dois estados: nA + 2nB = 3 mol.</text><text x="36" y="420" font-size="17">Estados finais, não uma trajetória temporal ou medição.</text><text x="36" y="450" font-size="17">Idealidade assumida; não prevê comportamento de substância real.</text></g></svg>