<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380" role="img" aria-labelledby="t d"><title id="t">Combinar registros após um resumo</title><desc id="d">Pesos dezesseis, seis e três sobre vinte e cinco para os registros um, zero um e zero zero um. Posteriores de H três quartos, metade e um quarto.</desc><rect width="420" height="380" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="37" font-size="19" font-weight="700">Sabemos: houve sucesso até 3</text><text x="24" y="63" font-size="12">Registro</text><text x="90" y="63" font-size="13">Peso P(r|S)</text><text x="327" y="63" font-size="13">P(H|r)</text><text x="24" y="117" font-size="17">1</text><rect x="82" y="91" width="192" height="37" rx="4" fill="#27665e"/><text x="96" y="115" fill="white" font-size="16">16/25</text><text x="337" y="115" font-size="17">3/4</text><text x="24" y="181" font-size="17">01</text><rect x="82" y="155" width="72" height="37" rx="4" fill="#27665e"/><text x="168" y="180" font-size="16">6/25</text><text x="337" y="180" font-size="17">1/2</text><text x="24" y="245" font-size="17">001</text><rect x="82" y="219" width="36" height="37" rx="4" fill="#27665e"/><text x="132" y="244" font-size="16">3/25</text><text x="337" y="244" font-size="17">1/4</text><path d="M24 278H396" stroke="#bdc7bf"/><text x="24" y="310" font-size="17" font-weight="700">Média ponderada: 63/100</text><text x="24" y="342" font-size="14">A média simples 1/2 usa outros pesos.</text></g></svg>