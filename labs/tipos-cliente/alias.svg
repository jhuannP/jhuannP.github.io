<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Dois nomes e uma lista compartilhada</title><desc id="desc">a e b apontam para a mesma lista[1,2] depois de b.append2. O retorno de append éNone. c é uma cópia externa e passa a[1,2,3] após seu próprioappend.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315d4f"/></marker></defs><rect width="760" height="440" fill="#f5f3e8"/><g font-family="sans-serif" fill="#293e36"><text x="30" y="40" font-size="24" font-weight="bold">Atribuir outro nome não duplica a lista.</text><text x="30" y="79" font-size="18">a = [1] · b = a · resultado = b.append(2)</text><text x="82" y="150" font-size="28">a</text><text x="82" y="230" font-size="28">b</text><rect x="320" y="125" width="300" height="120" rx="10" fill="#dce8e0"/><text x="403" y="193" font-size="32">[1, 2]</text><path d="M112 145L312 160M112 225L312 210" fill="none" stroke="#315d4f" stroke-width="3" marker-end="url(#arrow)"/><text x="53" y="292" font-size="23">resultado = None · o objeto foi alterado</text><rect x="50" y="318" width="660" height="70" rx="9" fill="#e8dfd0"/><text x="70" y="361" font-size="23">c = a.copy(); c.append(3) → c = [1, 2, 3]</text><text x="30" y="424" font-size="17">Cópia externa independente; elementos internos podem continuar compartilhados.</text></g></svg>