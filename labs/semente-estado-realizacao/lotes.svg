<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Reiniciar ou continuar?</title><desc id="d">Reiniciar a semente42 produz o mesmo lote repetido. Uma instância continuada produz trechos sucessivos do estado. Isso distingue controle de execução de independência estatística.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="40" font-size="25" font-weight="bold">A semente não conta tudo</text><text x="24" y="83" font-size="20">Reiniciar 42 em cada iteração</text><text x="24" y="137" font-size="23" fill="#2154a0">Início → lote A</text><text x="24" y="179" font-size="23" fill="#2154a0">Início → lote A → mesma realização</text><path d="M24 208h512" stroke="#a7b4c8" fill="none"/><text x="24" y="250" font-size="20">Continuar uma instância</text><text x="24" y="299" font-size="23" fill="#2154a0">Estado₀ → lote A → estado₁</text><text x="24" y="341" font-size="23" fill="#2154a0">Estado₁ → próximo lote → estado₂</text><text x="24" y="388" font-size="19">Sequências diferentes não provam independência.</text><text x="24" y="421" font-size="17">Algoritmo, versão e ordem de chamadas importam.</text></g></svg>