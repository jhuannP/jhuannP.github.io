<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img" aria-labelledby="t d"><title id="t">Estabilidade preserva a ordem dos rótulos empatados</title><desc id="d">Entrada dois A, um B, dois C, um D. Metades ordenadas um B, dois A e um D, dois C. Saída um B, um D, dois A, dois C, preservando B antes de D e A antes de C ao ordenar só pela chave numérica.</desc><rect width="440" height="430" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384b"><text x="20" y="32" font-size="20" font-weight="bold">Ordenar pela chave, preservar empates</text><text x="20" y="58" font-size="14">Rótulos A–D identificam a ordem original.</text><text x="20" y="90" font-size="16" font-weight="bold">Entrada</text><rect x="20" y="104" width="80" height="48" rx="5" fill="#f0e3d3"/><text x="40" y="135" font-size="19">2 · A</text><rect x="120" y="104" width="80" height="48" rx="5" fill="#dce7f4"/><text x="140" y="135" font-size="19">1 · B</text><rect x="220" y="104" width="80" height="48" rx="5" fill="#f0e3d3"/><text x="240" y="135" font-size="19">2 · C</text><rect x="320" y="104" width="80" height="48" rx="5" fill="#dce7f4"/><text x="340" y="135" font-size="19">1 · D</text><text x="20" y="190" font-size="16" font-weight="bold">Metades já ordenadas</text><rect x="20" y="204" width="80" height="48" rx="5" fill="#dce7f4"/><text x="40" y="235" font-size="19">1 · B</text><rect x="120" y="204" width="80" height="48" rx="5" fill="#f0e3d3"/><text x="140" y="235" font-size="19">2 · A</text><rect x="220" y="204" width="80" height="48" rx="5" fill="#dce7f4"/><text x="240" y="235" font-size="19">1 · D</text><rect x="320" y="204" width="80" height="48" rx="5" fill="#f0e3d3"/><text x="340" y="235" font-size="19">2 · C</text><path d="M210 198 V258" fill="none" stroke="#9faab9" stroke-dasharray="4 4"/><text x="20" y="290" font-size="16" font-weight="bold">Saída estável</text><rect x="20" y="304" width="80" height="48" rx="5" fill="#dce7f4"/><text x="40" y="335" font-size="19">1 · B</text><rect x="120" y="304" width="80" height="48" rx="5" fill="#dce7f4"/><text x="140" y="335" font-size="19">1 · D</text><rect x="220" y="304" width="80" height="48" rx="5" fill="#f0e3d3"/><text x="240" y="335" font-size="19">2 · A</text><rect x="320" y="304" width="80" height="48" rx="5" fill="#f0e3d3"/><text x="340" y="335" font-size="19">2 · C</text><text x="20" y="390" font-size="15">No empate, a metade esquerda vem primeiro.</text><text x="20" y="414" font-size="13">Comparação usa só o número; o rótulo não desempata.</text></g></svg>