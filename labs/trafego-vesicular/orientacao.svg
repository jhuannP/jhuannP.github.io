<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 625" role="img" aria-labelledby="title desc"><title id="title">Orientação de uma proteína na via secretora</title><desc id="desc">Esquema em três etapas: uma proteína de membrana no Golgi, a mesma orientação em uma vesícula secretora e, após fusão, na membrana plasmática. Quadrado indica domínio citosólico, que continua no citosol. Círculo indica domínio luminal, que se torna extracelular. Contornos simplificam a bicamada, sem mostrar os folhetos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#4f656b" stroke-width="1.5"/></marker></defs><rect width="440" height="625" rx="12" fill="#f4f6f0"/><g font-family="Arial,sans-serif" fill="#183038"><text x="24" y="34" font-size="22" font-weight="700">Uma proteína, duas faces</text><text x="24" y="61" font-size="15">Trecho simplificado da via secretora</text><text x="24" y="94" font-size="17" font-weight="700">1. Saída do Golgi</text><rect x="100" y="132" width="240" height="78" rx="15" fill="#e1edf9" stroke="#4f656b" stroke-width="2"/><text x="114" y="196" font-size="15">Lúmen</text><text x="24" y="127" font-size="14">Citosol</text><path d="M220 102V164" stroke="#183038" stroke-width="4"/><rect x="213" y="95" width="14" height="14" fill="#a34f28"/><circle cx="220" cy="164" r="8" fill="#294fbd"/><path d="M370 190V257" stroke="#4f656b" stroke-width="2" marker-end="url(#arrow)"/><text x="283" y="238" font-size="14">Brotamento</text><text x="24" y="247" font-size="17" font-weight="700">2. Vesícula</text><circle cx="220" cy="328" r="46" fill="#e1edf9" stroke="#4f656b" stroke-width="2"/><path d="M220 258V315" stroke="#183038" stroke-width="4"/><rect x="213" y="251" width="14" height="14" fill="#a34f28"/><circle cx="220" cy="315" r="8" fill="#294fbd"/><text x="24" y="329" font-size="14">Citosol</text><path d="M370 349V397" stroke="#4f656b" stroke-width="2" marker-end="url(#arrow)"/><text x="312" y="378" font-size="14">Fusão</text><text x="24" y="424" font-size="17" font-weight="700">3. Membrana plasmática</text><rect x="24" y="478" width="392" height="70" fill="#e1edf9"/><path d="M24 478H416" stroke="#4f656b" stroke-width="2"/><path d="M220 451V509" stroke="#183038" stroke-width="4"/><rect x="213" y="444" width="14" height="14" fill="#a34f28"/><circle cx="220" cy="509" r="8" fill="#294fbd"/><text x="24" y="467" font-size="14">Citosol</text><text x="36" y="529" font-size="15">Exterior</text><circle cx="32" cy="577" r="7" fill="#294fbd"/><text x="49" y="582" font-size="15">Domínio luminal → exterior</text><rect x="25" y="598" width="14" height="14" fill="#a34f28"/><text x="49" y="610" font-size="15">Domínio citosólico → citosol</text></g></svg>