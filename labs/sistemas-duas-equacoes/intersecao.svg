<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Duas contas e um único par de preços</title><desc id="desc">No plano de preços a e e, as retas 3a+2e=94 e 2a+3e=86 se encontram em a=22 e e=14 reais. Janela de a de zero a trinta e e de zero a cinquenta. A primeira reta é azul contínua e a segunda preta tracejada; o ponto satisfaz ambas.</desc><rect width="440" height="560" fill="#f5f4ef"/>
<g font-family="sans-serif" fill="#172b45"><text x="24" y="40" font-size="23">Duas contas, o mesmo par</text><text x="24" y="72" font-size="16">3a + 2e = 94 • azul contínuo</text><text x="24" y="98" font-size="16">2a + 3e = 86 • preto tracejado</text>
