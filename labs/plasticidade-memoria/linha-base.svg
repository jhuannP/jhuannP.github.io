<svg xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410"><title>Resposta final e aumento relativo</title><desc>Entrada A base dez e pós quinze, aumento cinquenta por cento. B base vinte e pós vinte e dois, aumento dez por cento. São dados sintéticos, não registros do artigo.</desc><rect width="420" height="410" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="36" font-size="20" font-weight="700">Compare com a própria base</text><text x="24" y="66" font-size="14">Exemplo sintético · unidades arbitrárias</text><rect x="24" y="92" width="372" height="42" fill="#dce8e1"/><g font-size="15"><text x="36" y="119">Entrada</text><text x="135" y="119">Base</text><text x="218" y="119">Pós</text><text x="297" y="119">Aumento</text></g><g font-size="19"><text x="51" y="178">A</text><text x="135" y="178">10</text><text x="218" y="178">15</text><text x="307" y="178">50%</text><text x="51" y="235">B</text><text x="135" y="235">20</text><text x="218" y="235">22</text><text x="307" y="235">10%</text></g><path d="M24 265H396" stroke="#bdc7bf"/><text x="24" y="298" font-size="17">A: 150% da base ≠ aumento de 150%.</text><text x="24" y="332" font-size="16">Diferença: 40 pontos percentuais</text><text x="24" y="366" font-size="14">Não demonstra mecanismo ou memória.</text><text x="24" y="392" font-size="12">Sem réplicas ou análise de significância.</text></g></svg>
