<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="t d"><title id="t">Carry e overflow não são o mesmo flag</title><desc id="d">Quatro somas prescritas cobrem as quatro combinações possíveis de C e V na ALU didática de quatro bits.</desc><rect width="660" height="420" fill="#f0eee5"/><g font-family="sans-serif" fill="#263a38"><text x="28" y="40" font-size="24" font-weight="bold">Dois diagnósticos. Quatro combinações.</text><text x="28" y="71" font-size="16">R: padrão lido sem sinal · C: carry · V: overflow assinado</text><path d="M28 130H630 M28 190H630 M28 250H630 M28 310H630" stroke="#87948c"/><g font-size="19"><text x="28" y="115">A + B</text><text x="190" y="115">R</text><text x="300" y="115">C</text><text x="370" y="115">V</text><text x="455" y="115">Leitura assinada</text><text x="28" y="167">7 + 1</text><text x="190" y="167">8</text><text x="300" y="167">0</text><text x="370" y="167">1</text><text x="455" y="167">7 + 1 → −8</text><text x="28" y="227">15 + 1</text><text x="190" y="227">0</text><text x="300" y="227">1</text><text x="370" y="227">0</text><text x="455" y="227">−1 + 1 → 0</text><text x="28" y="287">8 + 8</text><text x="190" y="287">0</text><text x="300" y="287">1</text><text x="370" y="287">1</text><text x="455" y="287">−8 − 8 → 0</text><text x="28" y="347">2 + 3</text><text x="190" y="347">5</text><text x="300" y="347">0</text><text x="370" y="347">0</text><text x="455" y="347">2 + 3 → 5</text></g><text x="28" y="397" font-size="15">As setas mostram o valor representado pelos bits após a soma modular.</text></g></svg>
