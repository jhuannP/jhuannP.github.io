<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="t d"><title id="t">Média zero e pressão positiva</title><desc id="d">Seis velocidades: mais e menos trezentos em cada eixo. Média x zero, média quadrática x trinta mil, pressão três mil pascals.</desc><rect width="420" height="420" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="36" font-size="22">Uma média pode cancelar</text><text x="24" y="72" font-size="18">Velocidades em m/s</text><g font-size="20"><text x="32" y="118">x: +300, −300</text><text x="32" y="155">y: +300, −300</text><text x="32" y="192">z: +300, −300</text></g><path d="M24 218H396" stroke="#bcc4c9"/><g font-size="20"><text x="24" y="255">⟨vₓ⟩ = 0</text><text x="24" y="293">⟨vₓ²⟩ = 30000 m²/s²</text><text x="24" y="336" fill="#285e88">Pₓ = Pᵧ = Pz = 3000 Pa</text></g><text x="24" y="390" font-size="18">Modelo discreto · não é Maxwell</text></g></svg>