<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc"><title id="title">O sinal da carga inverte a força</title><desc id="desc">No plano com x para a direita e y para cima, a velocidade aponta para x positivo e o campo para z positivo, saindo da página. Carga positiva recebe força para y negativo; carga negativa recebe força para y positivo. As setas representam sentidos, sem comparar comprimentos de grandezas com unidades diferentes.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245fbe"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b7682c"/></marker></defs><rect width="520" height="650" fill="#faf8f2"/><g font-family="system-ui,sans-serif" fill="#17382e"><text x="28" y="42" font-size="24" font-weight="700">O sinal da carga muda a força</text><text x="28" y="76" font-size="17">x para a direita · y para cima · B = +4z T</text><text x="28" y="108" font-size="17">⊙ Campo saindo do plano · v = +3x m/s</text><path d="M28 130H492" stroke="#17382e"/><text x="28" y="166" font-size="20" font-weight="700">q = +2 C</text><circle cx="130" cy="220" r="8" fill="#17382e"/><path d="M140 220H260" stroke="#245fbe" stroke-width="3" marker-end="url(#blue)"/><text x="278" y="227" font-size="20">v</text><path d="M130 231V305" stroke="#b7682c" stroke-width="3" marker-end="url(#rust)"/><text x="150" y="303" font-size="19">Fᵧ = −24 N</text><text x="28" y="363" font-size="20" font-weight="700">q = −2 C</text><circle cx="130" cy="460" r="8" fill="#17382e"/><path d="M140 460H260" stroke="#245fbe" stroke-width="3" marker-end="url(#blue)"/><text x="278" y="467" font-size="20">v</text><path d="M130 449V385" stroke="#b7682c" stroke-width="3" marker-end="url(#rust)"/><text x="150" y="403" font-size="19">Fᵧ = +24 N</text><path d="M28 510H492" stroke="#17382e"/><text x="28" y="546" font-size="17">Primeiro v × B; depois o sinal de q.</text><text x="28" y="578" font-size="17">Força e velocidade são perpendiculares.</text><text x="28" y="610" font-size="16">Setas de orientação; comprimentos sem escala.</text><text x="28" y="638" font-size="14">Valores didáticos; nenhuma partícula real medida.</text></g></svg>