<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400"><title>Nomes e objetos após o avanço</title><desc>p e r indicam o mesmo objeto com posição sete. q indica outra instância de posição zero.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#205bc1"/></marker></defs><rect width="420" height="400" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="37" font-size="20" font-weight="700">Três nomes, dois objetos</text><text x="24" y="68" font-size="14">Depois de r=p e p.avancar(3)</text><text x="36" y="119" font-size="22">p</text><text x="36" y="187" font-size="22">r</text><path d="M61 113H185M61 181L185 143" stroke="#205bc1" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="200" y="93" width="192" height="96" rx="8" fill="#dce8e1"/><text x="217" y="122" font-size="16">Partícula A</text><text x="217" y="151" font-size="17">x=7 m; v=2 m/s</text><text x="36" y="270" font-size="22">q</text><path d="M61 263H185" stroke="#205bc1" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="226" width="192" height="96" rx="8" fill="#e8e0ce"/><text x="217" y="255" font-size="16">Partícula B</text><text x="217" y="284" font-size="17">x=0 m; v=−1 m/s</text><text x="24" y="361" font-size="15">As setas são referências, não movimentos.</text></g></svg>
