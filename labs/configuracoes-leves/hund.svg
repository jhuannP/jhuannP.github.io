<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Contar quatro elétrons não decide o diagrama</title><desc id="desc">No subnível 2p com quatro elétrons, o padrão de Hund tem um par de spins opostos e dois elétrons paralelos em orbitais diferentes. Dois pares e um orbital vazio respeitam Pauli mas não o padrão de Hund. Dois spins iguais no mesmo orbital violam Pauli.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="26" y="41" font-size="23">Mesma contagem, outro arranjo</text><text x="26" y="74" font-size="16">Quatro elétrons no subnível 2p</text>
<text x="26" y="124" font-size="17">Padrão de Hund</text><g fill="none" stroke="#386b9b" stroke-width="2"><rect x="55" y="143" width="80" height="55"/><rect x="180" y="143" width="80" height="55"/><rect x="305" y="143" width="80" height="55"/></g><g font-size="29"><text x="76" y="181">↑↓</text><text x="211" y="181">↑</text><text x="336" y="181">↑</text></g>
<text x="26" y="255" font-size="17">Pauli permite; não é o padrão de Hund</text><g fill="none" stroke="#386b9b" stroke-width="2"><rect x="55" y="274" width="80" height="55"/><rect x="180" y="274" width="80" height="55"/><rect x="305" y="274" width="80" height="55"/></g><g font-size="29"><text x="76" y="312">↑↓</text><text x="201" y="312">↑↓</text></g>
<text x="26" y="386" font-size="17">Dois ↑ no mesmo orbital: Pauli proíbe</text><g fill="none" stroke="#386b9b" stroke-width="2"><rect x="55" y="405" width="80" height="55"/><rect x="180" y="405" width="80" height="55"/><rect x="305" y="405" width="80" height="55"/></g><g font-size="29"><text x="76" y="443">↑↑</text><text x="211" y="443">↑</text><text x="336" y="443">↓</text></g><text x="26" y="510" font-size="14">Caixas: orbitais; setas: estados de spin.</text><text x="26" y="536" font-size="14">Diagramas esquemáticos, não trajetórias eletrônicas.</text></g></svg>