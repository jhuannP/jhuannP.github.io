<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" role="img" aria-labelledby="title desc"><title id="title">Converter não basta</title><desc id="desc">Exemplo de registro position_m=nan: leitura de CSV e conversão para float sucedem, mas validação de finitude rejeita. O programa não calcula um resultado parcial.</desc><rect width="520" height="560" fill="#faf9f5"/><g fill="#23372f" font-family="Arial,sans-serif"><text x="24" y="36" font-size="25">Converter não significa validar</text><text x="24" y="70" font-size="19">Registro sintético: time_s=1, position_m=nan</text><text x="24" y="122" font-size="23">1. Interpretar CSV</text><text x="24" y="156" font-size="19">Dois campos encontrados</text><path d="M24 184H490" stroke="#d4ded6"/><text x="24" y="230" font-size="23">2. Converter o número</text><text x="24" y="264" font-size="19">float("nan") é aceito pelo conversor</text><path d="M24 292H490" stroke="#d4ded6"/><text x="24" y="338" font-size="23">3. Conferir finitude</text><text x="24" y="372" font-size="19">isfinite retorna False: rejeitar</text><path d="M24 400H490" stroke="#d4ded6"/><text x="24" y="446" font-size="23">4. Apresentar a falha</text><text x="24" y="480" font-size="19">Sem calcular média ou ajuste parcial</text></g></svg>