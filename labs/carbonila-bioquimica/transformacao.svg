<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490"><title>Carbonila reduzida sem perder carbono</title><desc>C2 com dupla ao oxigênio passa a ligação com OH e H. NOX cai de mais dois a zero, mantendo três carbonos e três oxigênios.</desc><rect width="420" height="490" rx="16" fill="#f4f2ed"/><g fill="#203332" font-family="system-ui,sans-serif"><text x="24" y="38" font-size="21" font-weight="700">A mudança está em C₂</text><text x="24" y="79" font-size="16">Piruvato · C₃H₃O₃⁻</text><text x="24" y="126" font-size="23">CH₃ — C(=O) — COO⁻</text><text x="37" y="154" font-size="14">C₃</text><text x="142" y="154" font-size="14" fill="#205bc1">C₂ · NOX +2</text><text x="295" y="154" font-size="14">C₁</text><path d="M210 181V231M203 223L210 231L217 223" stroke="#205bc1" stroke-width="3" fill="none"/><text x="24" y="211" font-size="14">NADH → NAD⁺</text><text x="24" y="263" font-size="14">Esquema líquido: entra equivalente redutor</text><text x="24" y="304" font-size="16">Lactato · C₃H₅O₃⁻</text><text x="24" y="350" font-size="23">CH₃ — CH(OH) — COO⁻</text><text x="37" y="378" font-size="14">C₃</text><text x="142" y="378" font-size="14" fill="#205bc1">C₂ · NOX 0</text><text x="315" y="378" font-size="14">C₁</text><path d="M24 406H396" stroke="#bdc7bf"/><text x="24" y="436" font-size="16">C e O conservados; C₂ ganha H.</text><text x="24" y="465" font-size="13">Sem geometria, cunhas ou etapas temporais.</text></g></svg>