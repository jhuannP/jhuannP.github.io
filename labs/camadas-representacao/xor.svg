<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="t d"><title id="t">XOR nos quatro vértices</title><desc id="d">Dois vértices de score negativo na diagonal x1 igual x2. Os outros dois têm score positivo. Duas retas x1 menos x2 igual mais ou menos meio delimitam a faixa de score negativo da construção ReLU.</desc><rect width="600" height="540" fill="#faf9f4"/><g font-family="Arial,sans-serif" fill="#292929"><text x="24" y="32" font-size="21">Uma representação separa os quatro rótulos</text><text x="24" y="59" font-size="15">z = 2 |x₁ − x₂| − 1 · decisão positiva quando z &gt; 0</text><g transform="translate(0 40)"><path d="M100 370H250L400 220V70H250L100 220Z" fill="#ededf4"/><path d="M100 220L250 70 M250 370L400 220" stroke="#777" stroke-width="2" stroke-dasharray="7 5"/><path d="M100 70V370H430" fill="none" stroke="#777" stroke-width="2"/><path d="M100 70H400V370" fill="none" stroke="#bbb"/><text x="440" y="377" font-size="18">x₁</text><text x="68" y="65" font-size="18">x₂</text><g text-anchor="middle" font-size="17"><circle cx="100" cy="370" r="9" fill="#faf9f4" stroke="#292929" stroke-width="3"/><circle cx="400" cy="70" r="9" fill="#faf9f4" stroke="#292929" stroke-width="3"/><circle cx="100" cy="70" r="9" fill="#4f46a5"/><circle cx="400" cy="370" r="9" fill="#4f46a5"/><text x="100" y="398">(0,0): −1</text><text x="400" y="45">(1,1): −1</text><text x="166" y="98">(0,1): +1</text><text x="400" y="398">(1,0): +1</text></g><text x="270" y="275" font-size="16">z ≤ 0</text></g><path d="M24 465H576" stroke="#bbb"/><text x="24" y="491" font-size="15">Círculo cheio: classe 1 · vazio: classe 0 · traços: z = 0.</text><text x="24" y="516" font-size="14">Só os quatro vértices têm rótulos fornecidos; fundo é previsão.</text></g></svg>