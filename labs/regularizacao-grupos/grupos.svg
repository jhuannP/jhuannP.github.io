<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="t desc"><title id="t">Penalidade e atualização são escolhas separadas</title><desc id="desc">W e v recebem termo direto lambda vezes peso; b e c não recebem termo direto. Com diagonal P, a atualização acoplada escala também esse termo; a desacoplada deixa o decaimento fora da escala.</desc><rect width="760" height="450" rx="18" fill="#f5f4ed"/><g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="42" font-size="25" font-weight="bold">Quais parâmetros? Qual atualização?</text><text x="28" y="73" font-size="16">Convenção própria da rede didática • não é padrão universal</text><rect x="28" y="103" width="340" height="112" rx="12" fill="#e1ece6"/><rect x="390" y="103" width="342" height="112" rx="12" fill="#ede4d5"/><g font-size="23" font-weight="bold"><text x="48" y="138">W e v</text><text x="410" y="138">b e c</text></g><g font-size="18"><text x="48" y="170">Pesos: recebem penalidade</text><text x="48" y="197">Termo direto: λ × peso</text><text x="410" y="170">Biases: excluídos da soma</text><text x="410" y="197">Termo direto: zero</text></g><text x="28" y="249" font-size="17">Com g dos dados e P diagonal positivo fixo, compare:</text><rect x="28" y="269" width="340" height="100" rx="12" fill="#e1ece6"/><rect x="390" y="269" width="342" height="100" rx="12" fill="#ede4d5"/><g font-size="19" font-weight="bold"><text x="48" y="301">L2 acoplada ao gradiente</text><text x="410" y="301">Decaimento separado</text></g><g font-size="22"><text x="48" y="343">w − η P (g + λw)</text><text x="410" y="343">w − η P g − ηλw</text></g><text x="28" y="403" font-size="16">Equivalem para SGD simples, P = identidade, nesta convenção.</text><text x="28" y="430" font-size="16">Não equivalem em geral. O desenho não implementa estado de Adam.</text></g></svg>