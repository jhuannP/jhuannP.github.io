<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="t d"><title id="t">Forma da camada afim</title><desc id="d">X contém duas amostras de três atributos; W contém duas unidades de três pesos. X vezes W transposta mais bias de dois valores dá duas amostras de duas saídas.</desc><rect width="440" height="460" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Os eixos dizem o que se combina</text><text x="24" y="82" font-size="20">X: 2 × 3</text><text x="200" y="82" font-size="16">amostras × atributos</text><text x="24" y="120" font-size="16">[1, 0, 2]    [0, 1, −1]</text><path d="M24 146 H416" stroke="#ccd3e6"/><text x="24" y="186" font-size="20">W: 2 × 3</text><text x="200" y="186" font-size="16">unidades × atributos</text><text x="24" y="224" font-size="16">[1, 2, 0]    [−1, 1, 3]</text><text x="24" y="261" font-size="16">b = [1, −2], aplicado em cada amostra</text><path d="M24 285 H416" stroke="#ccd3e6"/><text x="24" y="324" font-size="20" fill="#294dbc">Z = XWᵀ + b: 2 × 2</text><text x="24" y="364" font-size="19">[2, 3]    [3, −4]</text><text x="24" y="405" font-size="15">4 saídas · 8 parâmetros compartilhados</text><text x="24" y="441" font-size="12">Figura original · operações racionais, sem ativação</text></g></svg>