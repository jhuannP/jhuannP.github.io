<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="t d"><title id="t">Erro do intercepto depende do passo</title><desc id="d">Erro inicial do intercepto menos um. Com passo zero vírgula um o erro decai; com passo um alterna entre menos um e mais um; com passo um vírgula um oscila crescendo em módulo. O horizonte mostrado tem seis iterações.</desc><rect width="440" height="440" fill="#f8f7f1"/><g font-family="sans-serif" fill="#27374b"><text x="20" y="32" font-size="20" font-weight="bold">Erro do intercepto: bₖ−1</text><text x="20" y="58" font-size="14">Mesmo início b₀=0 · dados centrados da aula</text><path d="M50 100 V327 H403 M50 210 H403" fill="none" stroke="#aab4c0"/><text x="30" y="109" font-size="13">3</text><text x="30" y="214" font-size="13">0</text><text x="23" y="321" font-size="13">−3</text><text x="150" y="352" font-size="14">Iterações (0 a 6)</text><polyline points="50.00,245.00 107.00,238.00 164.00,232.40 221.00,227.92 278.00,224.34 335.00,221.47 392.00,219.18" fill="none" stroke="#285eaa" stroke-width="2"/><circle cx="50.00" cy="245.00" r="3" fill="#285eaa"/><circle cx="107.00" cy="238.00" r="3" fill="#285eaa"/><circle cx="164.00" cy="232.40" r="3" fill="#285eaa"/><circle cx="221.00" cy="227.92" r="3" fill="#285eaa"/><circle cx="278.00" cy="224.34" r="3" fill="#285eaa"/><circle cx="335.00" cy="221.47" r="3" fill="#285eaa"/><circle cx="392.00" cy="219.18" r="3" fill="#285eaa"/><text x="20" y="382" font-size="15" fill="#285eaa">η=0,1</text><polyline points="50.00,245.00 107.00,175.00 164.00,245.00 221.00,175.00 278.00,245.00 335.00,175.00 392.00,245.00" fill="none" stroke="#886f39" stroke-width="2" stroke-dasharray="6 4"/><circle cx="50.00" cy="245.00" r="3" fill="#886f39"/><circle cx="107.00" cy="175.00" r="3" fill="#886f39"/><circle cx="164.00" cy="245.00" r="3" fill="#886f39"/><circle cx="221.00" cy="175.00" r="3" fill="#886f39"/><circle cx="278.00" cy="245.00" r="3" fill="#886f39"/><circle cx="335.00" cy="175.00" r="3" fill="#886f39"/><circle cx="392.00" cy="245.00" r="3" fill="#886f39"/><text x="160" y="382" font-size="15" fill="#886f39">η=1</text><polyline points="50.00,245.00 107.00,168.00 164.00,260.40 221.00,149.52 278.00,282.58 335.00,122.91 392.00,314.51" fill="none" stroke="#a74f38" stroke-width="2"/><circle cx="50.00" cy="245.00" r="3" fill="#a74f38"/><circle cx="107.00" cy="168.00" r="3" fill="#a74f38"/><circle cx="164.00" cy="260.40" r="3" fill="#a74f38"/><circle cx="221.00" cy="149.52" r="3" fill="#a74f38"/><circle cx="278.00" cy="282.58" r="3" fill="#a74f38"/><circle cx="335.00" cy="122.91" r="3" fill="#a74f38"/><circle cx="392.00" cy="314.51" r="3" fill="#a74f38"/><text x="300" y="382" font-size="15" fill="#a74f38">η=1,1</text><text x="20" y="414" font-size="13">O painel da aula mostra log₁₀ MSE, outra grandeza.</text></g></svg>