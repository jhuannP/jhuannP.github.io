<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450" role="img" aria-labelledby="t d"><title id="t">Probabilidade do grupo e de cada microestado</title><desc id="d">Com q igual a um terço, o grupo fundamental tem um estado de probabilidade um meio. O excitado tem três estados, cada qual de probabilidade um sexto. A soma em cada grupo é um meio.</desc><rect width="440" height="450" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Dois grupos iguais, estados distintos</text><text x="24" y="67" font-size="15">q = exp(−βε) = 1/3 · multiplicidades 1 e 3</text><text x="24" y="110" font-size="18" font-weight="bold">Energia 0: probabilidade total 1/2</text><rect x="25" y="132" width="116" height="62" rx="3" fill="#e0e7ff" stroke="#294dbc"/><text x="66" y="171" font-size="23">1/2</text><text x="164" y="167" font-size="15">um microestado</text><path d="M24 220 H416" stroke="#ccd3e6"/><text x="24" y="258" font-size="18" font-weight="bold">Energia ε: probabilidade total 1/2</text><rect x="25" y="280" width="116" height="62" rx="3" fill="#e0e7ff" stroke="#294dbc"/><text x="65" y="319" font-size="23">1/6</text><rect x="162" y="280" width="116" height="62" rx="3" fill="#e0e7ff" stroke="#294dbc"/><text x="202" y="319" font-size="23">1/6</text><rect x="299" y="280" width="116" height="62" rx="3" fill="#e0e7ff" stroke="#294dbc"/><text x="339" y="319" font-size="23">1/6</text><text x="24" y="378" font-size="15">1/6 + 1/6 + 1/6 = 1/2</text><text x="24" y="409" font-size="14">Cada caixa é um microestado, não um grupo.</text><text x="24" y="437" font-size="12">Figura original · distribuição canônica sintética finita</text></g></svg>