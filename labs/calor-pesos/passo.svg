<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d"><title id="t">Um passo estável e um diagnóstico de pesos negativos</title><desc id="d">Perfil inicial0,1,0,1,0. r=1/4 produz0,1/2,1/2,1/2,0. Diagnóstico r=3/5 produz0,−1/5,6/5,−1/5,0,fora da faixa inicial.</desc><rect width="680" height="420" fill="#f7f5ed"/><g font-family="Arial,sans-serif" fill="#1f292c"><text x="30" y="36" font-size="24">Um passo pode criar extremos artificiais</text><text x="30" y="72" font-size="18">M = 4; bordas zero; perfil sintético</text><path d="M70 100V345 M60 300H630" stroke="#7f8b84" fill="none"/><polyline points="70,300 205,140 340,300 475,140 610,300" fill="none" stroke="#88938c" stroke-width="2" stroke-dasharray="6 5"/><polyline points="70,300 205,220 340,220 475,220 610,300" fill="none" stroke="#304bcb" stroke-width="4"/><polyline points="70,300 205,332 340,108 475,332 610,300" fill="none" stroke="#ac4837" stroke-width="3"/><text x="28" y="145" font-size="17">1</text><text x="28" y="306" font-size="17">0</text><text x="70" y="380" font-size="18">0</text><text x="600" y="380" font-size="18">L</text><text x="390" y="100" font-size="18" fill="#88938c">Inicial</text><text x="390" y="127" font-size="18" fill="#304bcb">r = 1/4: média</text><text x="390" y="154" font-size="18" fill="#ac4837">r = 3/5: diagnóstico</text><text x="30" y="411" font-size="16">Linhas ligam pontos da malha; não são solução contínua reconstruída.</text></g></svg>