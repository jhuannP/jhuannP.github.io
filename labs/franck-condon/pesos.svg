<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440" role="img" aria-labelledby="t d"><title id="t">Pesos de sobreposição</title><desc id="d">S um e meio, cinco linhas sintéticas de 2,00 a 2,40 eV; máximo em 2,10 eV. Não são alturas experimentais.</desc><rect width="420" height="440" fill="#f7f6ef"/><g font-family="Arial,sans-serif" fill="#252b25"><text x="24" y="32" font-size="21">Uma transição, várias linhas</text><text x="24" y="58" font-size="15">S = 1,5 · estado inicial v = 0</text><text x="24" y="90" font-size="14">Fator F₀ₙ (adimensional)</text><path d="M48 120V310H390" fill="none" stroke="#777e73"/><path d="M75 310V209.59" stroke="#3e4ca6" stroke-width="4"/><circle cx="75" cy="209.59" r="4" fill="#3e4ca6"/><text x="75" y="194.59" text-anchor="middle" font-size="13">0.223</text><text x="75" y="333" text-anchor="middle" font-size="14">2.00</text><path d="M145 310V159.39" stroke="#3e4ca6" stroke-width="4"/><circle cx="145" cy="159.39" r="4" fill="#3e4ca6"/><text x="145" y="144.39" text-anchor="middle" font-size="13">0.335</text><text x="145" y="333" text-anchor="middle" font-size="14">2.10</text><path d="M215 310V197.04" stroke="#3e4ca6" stroke-width="4"/><circle cx="215" cy="197.04" r="4" fill="#3e4ca6"/><text x="215" y="182.04" text-anchor="middle" font-size="13">0.251</text><text x="215" y="333" text-anchor="middle" font-size="14">2.20</text><path d="M285 310V253.52" stroke="#3e4ca6" stroke-width="4"/><circle cx="285" cy="253.52" r="4" fill="#3e4ca6"/><text x="285" y="238.52" text-anchor="middle" font-size="13">0.126</text><text x="285" y="333" text-anchor="middle" font-size="14">2.30</text><path d="M355 310V288.82" stroke="#3e4ca6" stroke-width="4"/><circle cx="355" cy="288.82" r="4" fill="#3e4ca6"/><text x="355" y="273.82" text-anchor="middle" font-size="13">0.047</text><text x="355" y="333" text-anchor="middle" font-size="14">2.40</text><text x="390" y="359" text-anchor="end" font-size="14">Energia do fóton / eV</text><text x="24" y="393" font-size="16">Máximo: 2,10 eV · média: 2,15 eV</text><text x="24" y="421" font-size="14">Recorte n = 0…4; peso omitido ≈ 0,018576.</text></g></svg>