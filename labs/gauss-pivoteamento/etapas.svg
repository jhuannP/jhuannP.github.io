<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img" aria-labelledby="title desc"><title id="title">Eliminação com o lado direito</title><desc id="desc">Três matrizes aumentadas: inicial com linhas1,2,5 e3,5,13; troca para3,5,13 e1,2,5; eliminação resulta3,5,13 e0,1/3,2/3. Solução y2 e x1.</desc><rect width="520" height="600" fill="#faf9f5"/><g fill="#243831" font-family="Arial,sans-serif"><text x="24" y="38" font-size="25">A mesma operação vale para b</text><text x="24" y="73" font-size="19">Matriz aumentada: coeficientes | lado direito</text><text x="24" y="116" font-size="21">1. Sistema original</text><text x="120" y="152" font-family="monospace" font-size="26">1</text><text x="220" y="152" font-family="monospace" font-size="26">2</text><text x="363" y="152" font-family="monospace" font-size="26">5</text><text x="120" y="188" font-family="monospace" font-size="26">3</text><text x="220" y="188" font-family="monospace" font-size="26">5</text><text x="363" y="188" font-family="monospace" font-size="26">13</text><path d="M325 129V197" stroke="#687b71"/><path d="M24 218H490" stroke="#d4ddd5"/><text x="24" y="258" font-size="21">2. Trocar linhas</text><text x="120" y="294" font-family="monospace" font-size="26">3</text><text x="220" y="294" font-family="monospace" font-size="26">5</text><text x="363" y="294" font-family="monospace" font-size="26">13</text><text x="120" y="330" font-family="monospace" font-size="26">1</text><text x="220" y="330" font-family="monospace" font-size="26">2</text><text x="363" y="330" font-family="monospace" font-size="26">5</text><path d="M325 271V339" stroke="#687b71"/><path d="M24 360H490" stroke="#d4ddd5"/><text x="24" y="400" font-size="21">3. L₂ ← L₂ − (1/3)L₁</text><text x="120" y="436" font-family="monospace" font-size="26">3</text><text x="220" y="436" font-family="monospace" font-size="26">5</text><text x="363" y="436" font-family="monospace" font-size="26">13</text><text x="120" y="472" font-family="monospace" font-size="26">0</text><text x="220" y="472" font-family="monospace" font-size="26">1/3</text><text x="363" y="472" font-family="monospace" font-size="26">2/3</text><path d="M325 413V481" stroke="#687b71"/><text x="24" y="565" font-size="23">Retroativa: y = 2 → x = 1</text></g></svg>