<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590"><title>Média finita e atualização determinística se separam</title><desc>Com quatro cópias haploides, vantagem relativa s um e mutação um quarto, frequência inicial um quarto. O mapa determinístico cresce para perto de meio; a média da lei finita sobe até a segunda geração e depois cai no trecho mostrado até zero vírgula duzentos na geração oito. A probabilidade de perda acumulada até a geração oito é aproximadamente zero vírgula seiscentos e quarenta e nove. A prova de perda eventual está no texto, não decorre desta janela de oito gerações.</desc><rect width="760" height="590" fill="#f7f3e9"/><g font-family="system-ui" fill="#243c38"><text x="30" y="36" font-size="23" font-weight="bold">Uma média não substitui a distribuição</text><text x="30" y="65" font-size="16">M = 4 cópias haploides · s = 1 · μ = 1/4 · P₀ = 1/4</text><text x="75" y="105" font-size="15">Frequência de A</text><line x1="75" y1="370.0" x2="683" y2="370.0" stroke="#d1d8cc"/><text x="32" y="375.0" font-size="14">0</text><line x1="75" y1="257.5" x2="683" y2="257.5" stroke="#d1d8cc"/><text x="32" y="262.5" font-size="14">0,25</text><line x1="75" y1="145.0" x2="683" y2="145.0" stroke="#d1d8cc"/><text x="32" y="150.0" font-size="14">0,50</text><text x="71" y="398" font-size="14">0</text><text x="223" y="398" font-size="14">2</text><text x="375" y="398" font-size="14">4</text><text x="527" y="398" font-size="14">6</text><text x="679" y="398" font-size="14">8</text><polyline points="75.000,257.500 151.000,235.000 227.000,214.231 303.000,196.429 379.000,182.113 455.000,171.182 531.000,163.159 607.000,157.441 683.000,153.449" fill="none" stroke="#176c61" stroke-width="3"/><circle cx="75" cy="257.500" r="4" fill="#176c61"/><circle cx="151" cy="235.000" r="4" fill="#176c61"/><circle cx="227" cy="214.231" r="4" fill="#176c61"/><circle cx="303" cy="196.429" r="4" fill="#176c61"/><circle cx="379" cy="182.113" r="4" fill="#176c61"/><circle cx="455" cy="171.182" r="4" fill="#176c61"/><circle cx="531" cy="163.159" r="4" fill="#176c61"/><circle cx="607" cy="157.441" r="4" fill="#176c61"/><circle cx="683" cy="153.449" r="4" fill="#176c61"/><polyline points="75.000,257.500 151.000,235.000 227.000,230.295 303.000,235.001 379.000,243.448 455.000,252.976 531.000,262.461 607.000,271.463 683.000,279.832" fill="none" stroke="#b25d38" stroke-width="3"/><circle cx="75" cy="257.500" r="4" fill="#b25d38"/><circle cx="151" cy="235.000" r="4" fill="#b25d38"/><circle cx="227" cy="230.295" r="4" fill="#b25d38"/><circle cx="303" cy="235.001" r="4" fill="#b25d38"/><circle cx="379" cy="243.448" r="4" fill="#b25d38"/><circle cx="455" cy="252.976" r="4" fill="#b25d38"/><circle cx="531" cy="262.461" r="4" fill="#b25d38"/><circle cx="607" cy="271.463" r="4" fill="#b25d38"/><circle cx="683" cy="279.832" r="4" fill="#b25d38"/><text x="590" y="422" font-size="15">Geração t</text><text x="75" y="455" font-size="16" fill="#176c61">● Mapa determinístico: pₜ₊₁ = F(pₜ)</text><text x="75" y="484" font-size="16" fill="#b25d38">● Média da lei finita: E[Pₜ]</text><text x="30" y="526" font-size="16">t = 2: E[P₂] = 0,310455; F(E[P₁]) ≈ 0,346154</text><text x="30" y="555" font-size="16">Perda acumulada até t = 8: ≈ 0,648754 · sem sorteios</text><text x="30" y="580" font-size="13">Curvas ligam gerações discretas; figura não prova, sozinha, o limite no tempo.</text></g></svg>