<svg xmlns="http://www.w3.org/2000/svg" width="660" height="370" viewBox="0 0 660 370" role="img" aria-labelledby="title desc"><title id="title">Três saídas verificáveis de uma CLI</title><desc id="desc">Execução válida: código zero,resultado JSON no stdout,stderr vazio. Ajuda: código zero,texto de ajuda no stdout,stderr vazio. Entrada inválida: código dois,stdout vazio,diagnóstico no stderr.</desc><rect width="660" height="370" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="28" y="42" font-size="25" font-weight="bold">O resultado tem um canal.</text><g font-size="17"><text x="28" y="106">Pedido</text><text x="220" y="106">Código</text><text x="335" y="106">stdout</text><text x="510" y="106">stderr</text></g><path d="M28 125H632M28 190H632M28 255H632M28 320H632" stroke="#b5bbb1"/><g font-size="21"><text x="28" y="168">Válido</text><text x="240" y="168">0</text><text x="335" y="168">JSON</text><text x="510" y="168">vazio</text><text x="28" y="233">--help</text><text x="240" y="233">0</text><text x="335" y="233">ajuda</text><text x="510" y="233">vazio</text><text x="28" y="298">Inválido</text><text x="240" y="298">2</text><text x="335" y="298">vazio</text><text x="510" y="298">erro</text></g><text x="28" y="350" font-size="15">Contrato deste exemplo: sem arquivos, rede ou instalação.</text></g></svg>