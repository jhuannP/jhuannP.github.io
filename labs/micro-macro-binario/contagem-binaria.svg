<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img" aria-labelledby="title desc"><title id="title">Uma configuração não é um grupo de configurações</title><desc id="desc">Para oito sítios binários equiprováveis, os grupos de zero a oito excitações têm multiplicidades 1, 8, 28, 56, 70, 56, 28, 8 e 1. O grupo central tem 70 de 256 estados. A faixa de três a cinco excitações tem 182 de 256.</desc><rect width="440" height="390" fill="#f4f3eb"/><g font-family="Arial,sans-serif" font-size="16" fill="#20221e"><text x="22" y="29" font-size="20" font-weight="bold">Oito sítios, 256 configurações</text><text x="22" y="55">Hipótese: cada configuração tem peso 1/256.</text><text x="22" y="85">m</text><text x="60" y="85">Multiplicidade</text><text x="248" y="85">Ω</text><text x="312" y="85">P(M=m)</text><text x="22" y="113">0</text><rect x="60" y="99" width="2.4" height="18" fill="#7c8574"/><text x="248" y="113">1</text><text x="312" y="113">1/256</text><text x="22" y="138">1</text><rect x="60" y="124" width="19.2" height="18" fill="#7c8574"/><text x="248" y="138">8</text><text x="312" y="138">8/256</text><text x="22" y="163">2</text><rect x="60" y="149" width="67.2" height="18" fill="#7c8574"/><text x="248" y="163">28</text><text x="312" y="163">28/256</text><text x="22" y="188">3</text><rect x="60" y="174" width="134.4" height="18" fill="#7c8574"/><text x="248" y="188">56</text><text x="312" y="188">56/256</text><text x="22" y="213">4</text><rect x="60" y="199" width="168.0" height="18" fill="#2348db"/><text x="248" y="213">70</text><text x="312" y="213">70/256</text><text x="22" y="238">5</text><rect x="60" y="224" width="134.4" height="18" fill="#7c8574"/><text x="248" y="238">56</text><text x="312" y="238">56/256</text><text x="22" y="263">6</text><rect x="60" y="249" width="67.2" height="18" fill="#7c8574"/><text x="248" y="263">28</text><text x="312" y="263">28/256</text><text x="22" y="288">7</text><rect x="60" y="274" width="19.2" height="18" fill="#7c8574"/><text x="248" y="288">8</text><text x="312" y="288">8/256</text><text x="22" y="313">8</text><rect x="60" y="299" width="2.4" height="18" fill="#7c8574"/><text x="248" y="313">1</text><text x="312" y="313">1/256</text><text x="22" y="350">Centro: 70/256. Faixa 3 ≤ M ≤ 5: 182/256.</text><text x="22" y="376">Mais provável não significa probabilidade 1.</text></g></svg>