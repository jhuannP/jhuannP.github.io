<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="t d"><title id="t">Um vetor e suas coordenadas numa base oblíqua</title><desc id="d">A base tem u um zero e v um um. O vetor três dois é u mais duas vezes v, com coordenadas um dois na base B. O desenho soma u e dois v pelo paralelogramo.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#285eaa"/></marker></defs><rect width="440" height="440" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384b"><text x="20" y="32" font-size="20" font-weight="bold">Vetor e coordenadas são distintos</text><text x="20" y="58" font-size="14">Base B=(u,v) com u=(1,0),v=(1,1)</text><path d="M50 95 V325 M25 300 H390" fill="none" stroke="#b2bbc6"/><path d="M50 300 L130 300 L290 140 L210 140 Z" fill="#e8edf5" stroke="#8196b2" stroke-dasharray="5 4"/><path d="M50 300 L290 140" fill="none" stroke="#285eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M50 300 L130 300 M50 300 L210 140" fill="none" stroke="#7694bd" stroke-width="2"/><circle cx="50" cy="300" r="4" fill="#28384b"/><text x="36" y="322" font-size="14">0</text><text x="110" y="324" font-size="16">u</text><text x="110" y="206" font-size="16">2v</text><text x="281" y="119" font-size="16">(3,2)</text><text x="300" y="175" font-size="15">u+2v</text><text x="20" y="365" font-size="17" font-weight="bold">Coordenadas em B: (1,2)</text><text x="20" y="395" font-size="15">Coordenadas canônicas: (3,2)</text><text x="20" y="423" font-size="13">Base oblíqua; os comprimentos não são coeficientes.</text></g></svg>