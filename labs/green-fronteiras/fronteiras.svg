<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">Uma região, duas fronteiras</title><desc id="desc">A coroa circular exclui a origem. A borda externa é anti-horária com integral dois pi, e a borda interna horária tem integral menos dois pi para G. A soma é zero.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#214f94"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#182e4d"><text x="28" y="38" font-size="25" font-weight="bold">Uma região, duas fronteiras</text><text x="28" y="71" font-size="20">Campo G: rotacional zero na coroa</text><text x="28" y="105" font-size="21">Externa anti-horária: +2π</text><circle cx="280" cy="228" r="108" fill="#dfe8f5" stroke="#214f94" stroke-width="2"/><circle cx="280" cy="228" r="48" fill="#f4f6fa" stroke="#214f94" stroke-width="2"/><path d="M388 228A108 108 0 0 0 280 120" stroke="#214f94" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M280 180A48 48 0 0 1 328 228" stroke="#214f94" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="280" y="234" text-anchor="middle" font-size="19">0 fora</text><text x="28" y="371" font-size="21">Interna horária: −2π</text><text x="28" y="407" font-size="21" font-weight="bold">Fronteira inteira: 2π − 2π = 0</text></g></svg>