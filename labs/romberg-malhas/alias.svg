<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Uma tabela estável pode não ver as oscilações</title><desc id="desc">Função cosseno de dezesseis pi x,com oito ciclos em zero a um. Nove nós da malha de oito intervalos coincidem com máximos iguais a um. Trapézios nas malhas um,dois,quatro e oito dão um,e toda tabela de Romberg correspondente também dá um. A integral analítica é zero. Na malha dezesseis os valores alternam e o trapézio dá zero;extrapolações ainda misturam resultados anteriores.</desc>
<rect width="760" height="560" rx="18" fill="#f4f0e5"/>
<g font-family="Arial,sans-serif" fill="#203b39">
<text x="32" y="42" font-size="24" font-weight="bold">Estável na tabela. Errado na integral.</text>
<text x="32" y="76" font-size="18">f(x) = cos(16πx) · integral em [0, 1] = 0</text>
