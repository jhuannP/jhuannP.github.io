<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="t d"><title id="t">Guarda antes da saída na M8</title><desc id="d">Sete instruções. LDA14 em0 lê contador; JZ6 em1 desvia para HALT se zero. Senão OUT,SUB15,STA14,JMP0 emitem e decrementam. n3 dá21 instruções e saída3,2,1;n0 dá3 e saída vazia.</desc><rect width="760" height="540" fill="#f3f1e5"/><g font-family="Arial,sans-serif" fill="#263b38"><text x="36" y="42" font-size="24" font-weight="bold">O teste protege o corpo do laço.</text><text x="36" y="75" font-size="17">Programa original M8 · M[14] = n, M[15] = 1 · sete palavras</text><rect x="36" y="106" width="320" height="270" rx="10" fill="#dbe4dc"/><g font-size="19"><text x="58" y="143">0 · LDA 14</text><text x="58" y="180">1 · JZ 6</text><text x="58" y="217">2 · OUT</text><text x="58" y="254">3 · SUB 15</text><text x="58" y="291">4 · STA 14</text><text x="58" y="328">5 · JMP 0</text><text x="424" y="180" font-weight="bold">ACC = 0 → 6 · HALT</text><text x="424" y="238">ACC ≠ 0: emite n atual,</text><text x="424" y="269">decrementa e guarda.</text><text x="424" y="328">Volta à leitura e ao teste.</text></g><path d="M280 174H405" stroke="#38635a" stroke-width="3"/><text x="36" y="423" font-size="22" font-weight="bold">Custo: 6n + 3 instruções, incluindo HALT.</text><text x="36" y="463" font-size="18">n = 0 → saída [] · 3 instruções</text><text x="36" y="496" font-size="18">n = 3 → saída [3, 2, 1] · 21 instruções</text><text x="424" y="496" font-size="16">Não é temporização elétrica.</text></g></svg>