<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">Cálculo separado dos efeitos externos</title><desc id="d">A camada de arquivos lê texto. Funções recebem texto, validam os pares em SI e calculam energias 24, 400 e 0 joules. Só depois a camada externa imprime ou cria um arquivo novo.</desc><rect width="440" height="420" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="22" y="32" font-size="20" font-weight="bold">O cálculo não escolhe um arquivo.</text><text x="22" y="71" font-size="16">1. Camada externa: ler texto de entrada</text><path d="M42 84V108 M37 101L42 108L47 101" stroke="#777b70" fill="none"/><text x="22" y="140" font-size="16" fill="#2448bc">2. Funções sem leitura ou escrita</text><text x="42" y="173" font-size="16">texto → pares em SI → energias</text><text x="42" y="207" font-size="16">(3, −4) → 24 J</text><text x="42" y="236" font-size="16">(2, 20) → 400 J</text><text x="42" y="265" font-size="16">(0, 10) → 0 J</text><text x="42" y="299" font-size="16">Resultado novo; entrada preservada.</text><path d="M42 310V334 M37 327L42 334L47 327" stroke="#777b70" fill="none"/><text x="22" y="365" font-size="16">3. Camada externa: imprimir ou salvar</text><text x="22" y="395" font-size="16">Saída só é aberta após validar o lote.</text></g></svg>