<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 480" role="img" aria-labelledby="title desc"><title id="title">Balanço com recipiente</title><desc id="desc">Temperatura final trinta e cinco graus Celsius. Corpo um: capacidade um quilojoule por kelvin, de oitenta para trinta e cinco graus, transferência menos quarenta e cinco quilojoules. Corpo dois: capacidade dois, de vinte para trinta e cinco graus, mais trinta quilojoules. Recipiente: capacidade um, de vinte para trinta e cinco graus, mais quinze quilojoules. Soma zero.</desc><rect width="430" height="480" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="35" font-size="24" font-weight="bold">Temperatura final: 35 °C</text><text x="22" y="66" font-size="18">Sistema inclui os três participantes</text><path d="M22 85H408" stroke="#aab7ae"/><text x="22" y="110" font-size="20" font-weight="bold">Corpo 1 · C₁=1 kJ/K</text><text x="22" y="141" font-size="20">80 °C → 35 °C</text><text x="22" y="172" font-size="23">Q₁ = −45 kJ</text><path d="M22 195H408" stroke="#aab7ae"/><text x="22" y="220" font-size="20" font-weight="bold">Corpo 2 · C₂=2 kJ/K</text><text x="22" y="251" font-size="20">20 °C → 35 °C</text><text x="22" y="282" font-size="23">Q₂ = +30 kJ</text><path d="M22 305H408" stroke="#aab7ae"/><text x="22" y="330" font-size="20" font-weight="bold">Recipiente · Cᵣ=1 kJ/K</text><text x="22" y="361" font-size="20">20 °C → 35 °C</text><text x="22" y="392" font-size="23">Qᵣ = +15 kJ</text><path d="M22 418H408" stroke="#aab7ae"/><text x="22" y="455" font-size="22" font-weight="bold">−45 + 30 + 15 = 0 kJ</text></g></svg>