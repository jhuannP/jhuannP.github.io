<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="t desc"><title id="t">Material e geometria têm papéis diferentes</title><desc id="desc">Dois trechos tracionados em série, cada um de um metro, módulo prescrito40GPa e áreas2 e4 milímetros quadrados, sob120N. Alongamentos1,5 e0,75 milímetros somam2,25 milímetros. Os mesmos trechos em paralelo têm alongamento comum0,5 milímetro e forças40 e80N.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#386b70"/></marker></defs><rect width="760" height="460" rx="18" fill="#f5f4ed"/><g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="40" font-size="24" font-weight="bold">Material e geometria têm papéis diferentes.</text><text x="28" y="73" font-size="17">Série: mesma força F; os alongamentos se somam.</text><rect x="130" y="130" width="250" height="40" fill="#cddfd4" stroke="#386b70" stroke-width="2"/><rect x="380" y="115" width="250" height="70" fill="#e5d9bd" stroke="#876b42" stroke-width="2"/><g stroke="#386b70" stroke-width="2.5" marker-end="url(#a)"><path d="M125 150H50"/><path d="M635 150H710"/></g><g font-size="17" text-anchor="middle"><text x="80" y="130">120 N</text><text x="676" y="130">120 N</text><text x="255" y="118">L₁ = 1 m, A₁ = 2 mm²</text><text x="505" y="103">L₂ = 1 m, A₂ = 4 mm²</text><text x="255" y="209">δ₁ = 1,5 mm</text><text x="505" y="209">δ₂ = 0,75 mm</text></g><rect x="28" y="251" width="340" height="122" rx="12" fill="#e1ece6"/><rect x="390" y="251" width="342" height="122" rx="12" fill="#ede4d5"/><g font-size="19" font-weight="bold"><text x="48" y="282">Série, F total = 120 N</text><text x="410" y="282">Paralelo, F total = 120 N</text></g><g font-size="18"><text x="48" y="315">δ total = 2,25 mm</text><text x="48" y="347">k = 160000/3 N/m</text><text x="410" y="315">δ comum = 0,5 mm</text><text x="410" y="347">F₁ = 40 N, F₂ = 80 N</text></g><text x="28" y="409" font-size="16">E = 40 GPa prescrito em ambos • pequenas deformações • sem peso próprio</text><text x="28" y="437" font-size="16">Desenho original fora de escala; parâmetros sem material real identificado.</text></g></svg>