<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="t d"><title id="t">Um peptídeo, duas origens possíveis</title><desc id="d">GHIK pode vir de A ou B. Existem duas coberturas de uma entrada, sem probabilidade atribuída.</desc><rect width="420" height="420" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="38" font-size="22">A observação é compartilhada</text><text x="24" y="78" font-size="18">Banco fictício · sem escores</text><path d="M144 167L305 139M144 177L305 231" stroke="#285e88" stroke-width="3"/><text x="35" y="179" font-size="28">GHIK</text><text x="322" y="145" font-size="28">A</text><text x="322" y="240" font-size="28">B</text><path d="M24 278H396" stroke="#bcc4c9"/><text x="24" y="320" font-size="22">Menor tamanho: {A} ou {B}</text><text x="24" y="363" font-size="18">Não determina a composição real.</text><text x="24" y="397" font-size="17">Compatibilidade não é probabilidade.</text></g></svg>