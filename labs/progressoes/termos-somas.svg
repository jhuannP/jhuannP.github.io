<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460"><title>Termo e soma são perguntas diferentes</title><desc>PA e PG começam em quatro. No quinto índice os termos são dezesseis e oitenta e um quartos; somas são cinquenta e duzentos e onze quartos.</desc><rect width="420" height="460" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="36" font-size="20" font-weight="700">Mesmo início, regras diferentes</text><text x="24" y="68" font-size="14">PA: somar 3 · PG: multiplicar por 3/2</text><rect x="24" y="88" width="372" height="40" fill="#dce8e1"/><g font-size="17"><text x="43" y="115">n</text><text x="155" y="115">PA</text><text x="280" y="115">PG</text><text x="43" y="159">1</text><text x="155" y="159">4</text><text x="280" y="159">4</text><text x="43" y="200">2</text><text x="155" y="200">7</text><text x="280" y="200">6</text><text x="43" y="241">3</text><text x="155" y="241">10</text><text x="280" y="241">9</text><text x="43" y="282">4</text><text x="155" y="282">13</text><text x="280" y="282">27/2</text><text x="43" y="323">5</text><text x="155" y="323">16</text><text x="280" y="323">81/4</text></g><path d="M24 340H396" stroke="#bdc7bf"/><rect x="24" y="355" width="372" height="46" rx="6" fill="#e8e0ce"/><text x="40" y="384" font-size="16">S₅</text><text x="155" y="384" font-size="17">50</text><text x="280" y="384" font-size="17">211/4</text><text x="24" y="437" font-size="14">Até o quinto termo: quatro transições.</text></g></svg>
