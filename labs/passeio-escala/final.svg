<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img" aria-labelledby="t d"><title id="t">Distribuição após quatro passos</title><desc id="d">Com passos de meio, os pontos finais−2,−1,0,1,2 têm pesos1,4,6,4,1 entre16 caminhos. Probabilidade em zero é3/8; média0 e variância1.</desc><rect width="440" height="430" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Mesma variância não é a mesma lei</text><text x="24" y="67" font-size="15">4 passos · h = 1/4 · saltos ±1/2</text><text x="24" y="98" font-size="14">Probabilidade de cada posição final</text><path d="M38 280 H410" stroke="#64748b"/><rect x="39" y="258" width="32" height="22" fill="#294dbc"/><text x="35" y="246" font-size="15">1/16</text><text x="48" y="307" font-size="17">-2</text><rect x="115" y="192" width="32" height="88" fill="#294dbc"/><text x="111" y="180" font-size="15">4/16</text><text x="124" y="307" font-size="17">-1</text><rect x="191" y="148" width="32" height="132" fill="#294dbc"/><text x="187" y="136" font-size="15">6/16</text><text x="200" y="307" font-size="17">0</text><rect x="267" y="192" width="32" height="88" fill="#294dbc"/><text x="263" y="180" font-size="15">4/16</text><text x="276" y="307" font-size="17">1</text><rect x="343" y="258" width="32" height="22" fill="#294dbc"/><text x="339" y="246" font-size="15">1/16</text><text x="352" y="307" font-size="17">2</text><text x="24" y="340" font-size="14">posição final (não tempo)</text><text x="24" y="374" font-size="16">P(X = 0) = 3/8 · média 0 · variância 1</text><text x="24" y="410" font-size="12">Figura original · contagem exata dos 16 caminhos</text></g></svg>