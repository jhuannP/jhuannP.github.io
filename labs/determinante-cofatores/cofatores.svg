<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="title desc"><title id="title">Expandir uma linha conserva os sinais</title><desc id="desc">Matriz linhas dois um zero, zero três um, um zero dois. Menores da primeira linha seis, menos um e menos três. Cofatores seis, um e menos três. Produtos doze, um e zero, somando treze.</desc><rect width="660" height="420" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="28" y="40" font-size="24" font-weight="bold">Menor, cofator, contribuição.</text><text x="28" y="74" font-size="17">A = [2 1 0; 0 3 1; 1 0 2] · primeira linha</text><g font-size="18"><text x="28" y="132">Coluna j</text><text x="200" y="132">1</text><text x="360" y="132">2</text><text x="520" y="132">3</text></g><path d="M28 148H630M28 210H630M28 272H630M28 334H630" stroke="#b5bbb1"/><g font-size="22"><text x="28" y="187">Menor M₁ⱼ</text><text x="200" y="187">6</text><text x="360" y="187">−1</text><text x="520" y="187">−3</text><text x="28" y="249">Cofator C₁ⱼ</text><text x="200" y="249">6</text><text x="360" y="249">+1</text><text x="520" y="249">−3</text><text x="28" y="311">a₁ⱼ C₁ⱼ</text><text x="200" y="311">12</text><text x="360" y="311">+1</text><text x="520" y="311">0</text></g><text x="28" y="377" font-size="24">det(A) = 12 + 1 + 0 = 13</text><text x="28" y="405" font-size="14">Exemplo original exato. O zero da entrada elimina a terceira contribuição.</text></g></svg>