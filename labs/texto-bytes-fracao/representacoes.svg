<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Parece igual. A representação difere.</title><desc id="d">É precomposto tem um ponto de código e dois bytes C3 A9. E seguido do acento U0301 tem dois pontos e três bytes 65 CC 81.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="40" font-size="24" font-weight="bold">Pontos de código ou bytes?</text><text x="24" y="80" font-size="19">Duas formas canonicamente equivalentes</text><path d="M24 106h512 M24 251h512" stroke="#a7b4c8" fill="none"/><text x="24" y="145" font-size="23" font-weight="bold">é: U+00E9</text><text x="24" y="188" font-size="22">1 ponto de código • 2 bytes UTF-8</text><text x="24" y="227" font-size="25" fill="#2154a0">C3 A9</text><text x="24" y="290" font-size="23" font-weight="bold">e + U+0301</text><text x="24" y="333" font-size="22">2 pontos de código • 3 bytes UTF-8</text><text x="24" y="372" font-size="25" fill="#2154a0">65 CC 81</text><text x="24" y="418" font-size="17">Hexadecimal por byte. A aparência não fixa o tamanho.</text></g></svg>