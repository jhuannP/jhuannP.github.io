<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" role="img" aria-labelledby="title desc"><title id="title">KMP conserva a borda para encontrar sobreposições</title><desc id="desc">Texto ababababa, com padrão ababa alinhado nos inícios0,2 e4. Tabela de prefixos do padrão0,0,1,2,3; após o acerto, a borda aba tem comprimento3.</desc><rect width="620" height="470" fill="#faf8f1"/><g fill="#252825" font-family="Arial,sans-serif"><text x="25" y="32" font-size="20">Um acerto pode se sobrepor ao próximo</text><text x="25" y="59" font-size="14">Busca literal · índices começam em zero</text><g font-family="monospace" font-size="22"><text x="130" y="115" fill="#252825">0</text><text x="178" y="115" fill="#252825">1</text><text x="226" y="115" fill="#252825">2</text><text x="274" y="115" fill="#252825">3</text><text x="322" y="115" fill="#252825">4</text><text x="370" y="115" fill="#252825">5</text><text x="418" y="115" fill="#252825">6</text><text x="466" y="115" fill="#252825">7</text><text x="514" y="115" fill="#252825">8</text><text x="130" y="150" fill="#252825">a</text><text x="178" y="150" fill="#252825">b</text><text x="226" y="150" fill="#252825">a</text><text x="274" y="150" fill="#252825">b</text><text x="322" y="150" fill="#252825">a</text><text x="370" y="150" fill="#252825">b</text><text x="418" y="150" fill="#252825">a</text><text x="466" y="150" fill="#252825">b</text><text x="514" y="150" fill="#252825">a</text><text x="130" y="202" fill="#4545b4">a</text><text x="178" y="202" fill="#4545b4">b</text><text x="226" y="202" fill="#4545b4">a</text><text x="274" y="202" fill="#4545b4">b</text><text x="322" y="202" fill="#4545b4">a</text><text x="226" y="248" fill="#4545b4">a</text><text x="274" y="248" fill="#4545b4">b</text><text x="322" y="248" fill="#4545b4">a</text><text x="370" y="248" fill="#4545b4">b</text><text x="418" y="248" fill="#4545b4">a</text><text x="322" y="294" fill="#4545b4">a</text><text x="370" y="294" fill="#4545b4">b</text><text x="418" y="294" fill="#4545b4">a</text><text x="466" y="294" fill="#4545b4">b</text><text x="514" y="294" fill="#4545b4">a</text></g><g font-size="14"><text x="25" y="150">texto</text><text x="25" y="202">início 0</text><text x="25" y="248">início 2</text><text x="25" y="294">início 4</text></g><path d="M25 320H590" stroke="#ccc"/><text x="25" y="350" font-size="17">π do padrão: 0, 0, 1, 2, 3</text><text x="25" y="383" font-size="16">Após cada acerto: j volta a 3, conservando “aba”.</text><text x="25" y="420" font-size="14">Texto é percorrido uma vez; falhas recuam no padrão.</text><text x="25" y="449" font-size="14">Não é busca por palavras, grafemas ou semelhança.</text></g></svg>