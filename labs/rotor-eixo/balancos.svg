<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Três balanços do rotor ideal</title><desc id="desc">I8kgm²,torque4Nm por2s,velocidade angular1para2rad/s,ângulo3rad. Momento axial8para16,impulso8. Energia4para16J,trabalho12J. Potência4para8W.</desc><rect width="760" height="480" fill="#f5f3e8"/><g font-family="sans-serif" fill="#293e36"><text x="32" y="40" font-size="24" font-weight="bold">Mesmo rotor, três conferências.</text><text x="32" y="78" font-size="18">I = 8 kg·m² · τ = 4 N·m · duração = 2 s</text><rect x="35" y="112" width="690" height="90" rx="8" fill="#dce8e0"/><text x="57" y="148" font-size="23">Movimento: ω de 1 para 2 rad/s</text><text x="57" y="181" font-size="20">α = 1/2 rad/s² · Δθ = 3 rad</text><rect x="35" y="216" width="690" height="90" rx="8" fill="#e7dfd0"/><text x="57" y="252" font-size="23">Momento axial: Lz de 8 para 16 kg·m²/s</text><text x="57" y="285" font-size="20">Impulso = τt = 8 N·m·s = ΔLz</text><rect x="35" y="320" width="690" height="90" rx="8" fill="#dce8e0"/><text x="57" y="356" font-size="23">Energia: K de 4 para 16 J</text><text x="57" y="389" font-size="20">Trabalho = τΔθ = 12 J = ΔK</text><text x="32" y="446" font-size="18">Potência muda de 4 para 8 W, apesar do torque constante.</text><text x="32" y="474" font-size="16">Cenário hipotético · eixo fixo · I constante · sem dados experimentais</text></g></svg>