<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530"><title>Contagem e vizinhança em células cúbicas</title><desc>Três esquemas de centros, SC com oito vértices, BCC com um centro adicional e FCC com seis centros de face adicionais. Átomos por célula: um, dois e quatro. Coordenações: seis, oito e doze. Pontos sem escala de raio atômico.</desc><rect width="760" height="530" fill="#f7f3e9"/><g font-family="system-ui" fill="#243c38"><text x="30" y="38" font-size="23" font-weight="bold">Contar o que pertence à célula</text><text x="30" y="66" font-size="15">Centros esquemáticos · um elemento · ocupação completa</text><line x1="60.0" y1="275.0" x2="160.0" y2="275.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="60.0" y1="275.0" x2="108.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="60.0" y1="275.0" x2="60.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="60.0" y1="165.0" x2="160.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="60.0" y1="165.0" x2="108.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="108.0" y1="230.0" x2="208.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="108.0" y1="230.0" x2="108.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="108.0" y1="120.0" x2="208.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="160.0" y1="275.0" x2="208.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="160.0" y1="275.0" x2="160.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="160.0" y1="165.0" x2="208.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="208.0" y1="230.0" x2="208.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><circle cx="60.0" cy="275.0" r="4" fill="#243c38"/><circle cx="60.0" cy="165.0" r="4" fill="#243c38"/><circle cx="108.0" cy="230.0" r="4" fill="#243c38"/><circle cx="108.0" cy="120.0" r="4" fill="#243c38"/><circle cx="160.0" cy="275.0" r="4" fill="#243c38"/><circle cx="160.0" cy="165.0" r="4" fill="#243c38"/><circle cx="208.0" cy="230.0" r="4" fill="#243c38"/><circle cx="208.0" cy="120.0" r="4" fill="#243c38"/><text x="60" y="108" font-size="21" font-weight="bold">SC</text><text x="50" y="325" font-size="15">8 × 1/8 = 1 átomo</text><text x="50" y="357" font-size="15">z = 6 · φ ≈ 0,524</text><text x="50" y="389" font-size="15">a = 2r</text><line x1="305.0" y1="275.0" x2="405.0" y2="275.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="305.0" y1="275.0" x2="353.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="305.0" y1="275.0" x2="305.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="305.0" y1="165.0" x2="405.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="305.0" y1="165.0" x2="353.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="353.0" y1="230.0" x2="453.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="353.0" y1="230.0" x2="353.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="353.0" y1="120.0" x2="453.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="405.0" y1="275.0" x2="453.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="405.0" y1="275.0" x2="405.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="405.0" y1="165.0" x2="453.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="453.0" y1="230.0" x2="453.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><circle cx="305.0" cy="275.0" r="4" fill="#243c38"/><circle cx="305.0" cy="165.0" r="4" fill="#243c38"/><circle cx="353.0" cy="230.0" r="4" fill="#243c38"/><circle cx="353.0" cy="120.0" r="4" fill="#243c38"/><circle cx="405.0" cy="275.0" r="4" fill="#243c38"/><circle cx="405.0" cy="165.0" r="4" fill="#243c38"/><circle cx="453.0" cy="230.0" r="4" fill="#243c38"/><circle cx="453.0" cy="120.0" r="4" fill="#243c38"/><circle cx="379.0" cy="197.5" r="5.5" fill="#b25d38"/><text x="305" y="108" font-size="21" font-weight="bold">BCC</text><text x="295" y="325" font-size="15">8 × 1/8 + 1 = 2</text><text x="295" y="357" font-size="15">z = 8 · φ ≈ 0,680</text><text x="295" y="389" font-size="15">√3 a = 4r</text><line x1="550.0" y1="275.0" x2="650.0" y2="275.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="550.0" y1="275.0" x2="598.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="550.0" y1="275.0" x2="550.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="550.0" y1="165.0" x2="650.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="550.0" y1="165.0" x2="598.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="598.0" y1="230.0" x2="698.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="598.0" y1="230.0" x2="598.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="598.0" y1="120.0" x2="698.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="650.0" y1="275.0" x2="698.0" y2="230.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="650.0" y1="275.0" x2="650.0" y2="165.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="650.0" y1="165.0" x2="698.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><line x1="698.0" y1="230.0" x2="698.0" y2="120.0" stroke="#8d9b94" stroke-width="1.5"/><circle cx="550.0" cy="275.0" r="4" fill="#243c38"/><circle cx="550.0" cy="165.0" r="4" fill="#243c38"/><circle cx="598.0" cy="230.0" r="4" fill="#243c38"/><circle cx="598.0" cy="120.0" r="4" fill="#243c38"/><circle cx="650.0" cy="275.0" r="4" fill="#243c38"/><circle cx="650.0" cy="165.0" r="4" fill="#243c38"/><circle cx="698.0" cy="230.0" r="4" fill="#243c38"/><circle cx="698.0" cy="120.0" r="4" fill="#243c38"/><circle cx="574.0" cy="197.5" r="5.5" fill="#b25d38"/><circle cx="674.0" cy="197.5" r="5.5" fill="#b25d38"/><circle cx="600.0" cy="220.0" r="5.5" fill="#b25d38"/><circle cx="648.0" cy="175.0" r="5.5" fill="#b25d38"/><circle cx="624.0" cy="252.5" r="5.5" fill="#b25d38"/><circle cx="624.0" cy="142.5" r="5.5" fill="#b25d38"/><text x="550" y="108" font-size="21" font-weight="bold">FCC</text><text x="540" y="325" font-size="15">8 × 1/8 + 6 × 1/2 = 4</text><text x="540" y="357" font-size="15">z = 12 · φ ≈ 0,740</text><text x="540" y="389" font-size="15">√2 a = 4r</text><text x="30" y="450" font-size="16">Pontos de fronteira são compartilhados, não átomos partidos.</text><text x="30" y="480" font-size="15">z conta vizinhos no cristal inteiro; não pontos desenhados no cubo.</text><text x="30" y="507" font-size="14">φ: fração geométrica de esferas em contato · não prevê estabilidade ou condução.</text></g></svg>