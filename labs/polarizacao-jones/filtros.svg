<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d"><title id="t">Filtros cruzados e eixo intermediário</title><desc id="d">Entrada linear x de intensidade1. Filtros0 e90graus transmitem0;inserindo45graus entreeles,a intensidade passa por1,1/2 e1/4. Cada filtro continua passivo.</desc><rect width="680" height="420" fill="#f7f5ed"/><g fill="#1e292c" font-family="Arial,sans-serif"><text x="30" y="38" font-size="24">O filtro também muda a luz transmitida</text><text x="30" y="73" font-size="18">Entrada linear x; intensidade inicial normalizada em 1</text><path d="M45 151H630 M45 280H630" stroke="#a4aea6" stroke-width="2"/><g stroke="#304bcb" stroke-width="5"><path d="M170 151H220 M450 126V176 M140 280H190 M310 305L360 255 M500 255V305"/></g><text x="170" y="112" font-size="20">0°</text><text x="450" y="112" font-size="20">90°</text><text x="280" y="140" font-size="21">I = 1</text><text x="555" y="140" font-size="21">I = 0</text><text x="135" y="241" font-size="20">0°</text><text x="310" y="241" font-size="20">45°</text><text x="490" y="241" font-size="20">90°</text><text x="205" y="270" font-size="20">1</text><text x="385" y="270" font-size="20">1/2</text><text x="555" y="270" font-size="20">1/4</text><text x="30" y="355" font-size="19">Cada etapa reduz ou conserva a intensidade que recebe.</text><text x="30" y="392" font-size="17">Entrada não polarizada: sequência de três eixos transmite 1/8.</text></g></svg>