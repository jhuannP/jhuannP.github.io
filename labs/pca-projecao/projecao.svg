<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">PCA de quatro pontos centrados e reconstrução em uma direção</title><desc id="desc">Dados originais têm média dez, vinte. Centrados, os pontos são dois dois, menos dois menos dois, um menos um e menos um um. O eixo principal é a diagonal crescente. Os dois pontos fora dela projetam-se na origem; a perda média quadrática é um, com oitenta por cento da variância retida.</desc><rect width="440" height="620" fill="#f6f8ff"/><g font-family="sans-serif" fill="#172545"><text x="24" y="34" font-size="19" font-weight="bold">Reter variação custa informação</text><text x="24" y="64" font-size="15">Coordenadas centradas · média=(10,20)</text><text x="24" y="92" font-size="15">Dados sintéticos adimensionais, mesma escala.</text><path d="M60 255 H380 M220 100 V410" stroke="#a7b1c7" fill="none"/><path d="M100 375 L340 135" stroke="#254fc5" stroke-width="3"/><text x="345" y="137" font-size="14">PC1</text><text x="385" y="258" font-size="14">x−10</text><text x="225" y="117" font-size="14">y−20</text><path d="M265 300 L220 255 M175 210 L220 255" stroke="#a3431d" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="310" cy="165" r="6" fill="#254fc5"/><circle cx="130" cy="345" r="6" fill="#254fc5"/><circle cx="265" cy="300" r="6" fill="#254fc5"/><circle cx="175" cy="210" r="6" fill="#254fc5"/><circle cx="220" cy="255" r="7" fill="#f6f8ff" stroke="#a3431d" stroke-width="3"/><text x="24" y="445" font-size="15">Resíduos perpendiculares ao eixo retido.</text><text x="24" y="478" font-size="16">Autovalores: 4 e1 · total=5</text><text x="24" y="512" font-size="16">Variância retida: 4/5=80%</text><text x="24" y="546" font-size="16">Erro médio quadrático de reconstrução: 1</text><text x="24" y="582" font-size="14">O sinal do eixo é arbitrário; a projeção é a mesma.</text><text x="24" y="608" font-size="13">Sem rótulos, causa ou desempenho futuro inferidos.</text></g></svg>