<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" role="img" aria-labelledby="t d"><title id="t">Mesma energia, entropias diferentes</title><desc id="d">Três microestados com energias zero, epsilon e epsilon. No equilíbrio as probabilidades são meio, um quarto, um quarto; na candidata meio, meio, zero. Ambas têm U igual epsilon sobre dois, mas a candidata tem excesso beta delta F igual meio ln dois.</desc><rect width="620" height="470" fill="#faf9f4"/><g font-family="Arial,sans-serif" fill="#272727"><text x="24" y="34" font-size="21">Mesma energia, entropias diferentes</text><text x="24" y="60" font-size="14">β ε = ln 2 · três microestados · θ = kB T</text><text x="24" y="100" font-size="17">Equilíbrio p*</text><text x="337" y="100" font-size="17">Candidata q</text><g stroke="#888" stroke-width="1"><path d="M25 253H287 M337 253H599"/></g><g fill="#4f46a5"><rect x="47" y="133" width="49" height="120"/><rect x="129" y="193" width="49" height="60"/><rect x="211" y="193" width="49" height="60"/></g><g fill="#777"><rect x="359" y="133" width="49" height="120"/><rect x="441" y="133" width="49" height="120"/></g><g font-size="16" text-anchor="middle"><text x="71" y="124">1/2</text><text x="153" y="184">1/4</text><text x="235" y="184">1/4</text><text x="383" y="124">1/2</text><text x="465" y="124">1/2</text><text x="547" y="244">0</text><text x="71" y="280">E = 0</text><text x="153" y="280">E = ε</text><text x="235" y="280">E = ε</text><text x="383" y="280">E = 0</text><text x="465" y="280">E = ε</text><text x="547" y="280">E = ε</text></g><g font-size="17"><text x="25" y="322">U = ε/2</text><text x="337" y="322">U = ε/2</text><text x="25" y="352">H = (3/2) ln 2</text><text x="337" y="352">H = ln 2</text><text x="25" y="382">β F* = −ln 2</text><text x="337" y="382">β F[q] = −(1/2) ln 2</text></g><path d="M24 407H596" stroke="#bbb"/><text x="24" y="437" font-size="17">Excesso: β (F[q] − F*) = (1/2) ln 2 &gt; 0</text><text x="24" y="459" font-size="13">Alturas representam probabilidades, não energias ou medidas temporais.</text></g></svg>