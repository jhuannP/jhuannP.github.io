<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="t d"><title id="t">O raio muda os resíduos interiores</title><desc id="d">Dois círculos centrados em zero, raios um e três. O polo zero tem resíduo menos um meio e está dentro de ambos. O polo dois tem resíduo cinco meios e está apenas no círculo maior. Orientação anti-horária.</desc><rect width="440" height="460" fill="#f8f7f1"/><g font-family="sans-serif" fill="#26364c"><text x="20" y="34" font-size="20" font-weight="bold">Quais polos estão dentro?</text><text x="20" y="61" font-size="16">f(z)=(2z+1)/[z(z−2)]</text><path d="M35 220 H405 M200 70 V365" stroke="#c0c6ce"/><circle cx="200" cy="220" r="135" fill="none" stroke="#8096b5" stroke-width="3" stroke-dasharray="7 5"/><circle cx="200" cy="220" r="45" fill="none" stroke="#285eaa" stroke-width="3"/><path d="M236 193 L230 187 M230 187 L230 196 M230 187 L239 188" fill="none" stroke="#285eaa" stroke-width="3"/><path d="M300 130 L293 121 M293 121 L294 132 M293 121 L304 122" fill="none" stroke="#8096b5" stroke-width="3"/><g fill="#a85635"><circle cx="200" cy="220" r="5"/><circle cx="290" cy="220" r="5"/></g><text x="185" y="245" font-size="15">0</text><text x="285" y="245" font-size="15">2</text><text x="140" y="171" font-size="15" fill="#285eaa">R=1</text><text x="305" y="128" font-size="15">R=3</text><text x="20" y="385" font-size="16">R=1: resíduo −1/2 → integral −πi</text><text x="20" y="414" font-size="16">R=3: soma 2 → integral 4πi</text><text x="20" y="443" font-size="13">Os dois percursos têm orientação anti-horária.</text></g></svg>