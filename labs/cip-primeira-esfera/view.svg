<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" role="img" aria-labelledby="title desc"><title id="title">Prioridades com o grupo4 apontando para longe</title><desc id="desc">Projeção ao olhar de mais z para a origem. Br de prioridade1 acima, Cl de prioridade2 abaixo à direita e F de prioridade3 abaixo à esquerda. H de prioridade4 fica atrás do centro e sua projeção coincide com ele. Ordem1,2,3 horária: R nesta geometria.</desc><rect width="620" height="480" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#252825"><text x="26" y="31" font-size="20">Coloque a prioridade 4 para longe</text><text x="26" y="60" font-size="14">Vista de +z · x para direita · y para cima</text><g stroke="#777" stroke-width="2"><path d="M300 210L300 105M300 210L440 285M300 210L160 285"/></g><circle cx="300" cy="210" r="7" fill="#4545b4"/><g font-size="20"><text x="253" y="94">Br · 1</text><text x="443" y="307">Cl · 2</text><text x="93" y="307">F · 3</text></g><path d="M340 116Q435 145 440 243M422 231L440 243L448 224" fill="none" stroke="#4545b4" stroke-width="3"/><text x="462" y="183" font-size="16" fill="#4545b4">horário</text><text x="320" y="209" font-size="14">H · 4 atrás</text><text x="320" y="232" font-size="13">projeção no centro</text><path d="M26 340H594" stroke="#ccc"/><text x="26" y="371" font-size="17">35 &gt; 17 &gt; 9 &gt; 1 → prioridades Br, Cl, F, H.</text><text x="26" y="404" font-size="17">Nesta vista: R. No espelho: S.</text><text x="26" y="439" font-size="14">Esquema projetado, não fórmula plana de ligações.</text><text x="26" y="464" font-size="14">R/S não informa o sinal da rotação óptica.</text></g></svg>