<svg xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410" role="img" aria-labelledby="t d"><title id="t">Refinar muda o diagnóstico</title><desc id="d">Para Euler no mesmo problema, três malhas grosseiras sugerem ordem1,91; três finas sugerem1,03. O limite é primeira ordem.</desc><rect width="420" height="410" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="38" font-size="22">Mesmo PVI · mesmo T = 1</text><text x="24" y="78" font-size="18">y′ = −y · y(0) = 1 · Euler</text><path d="M24 105H396" stroke="#bfc6cb"/><text x="24" y="145" font-size="19">N = 1, 2, 4</text><text x="24" y="187" font-size="28">p observado ≈ 1,91</text><path d="M24 214H396" stroke="#bfc6cb"/><text x="24" y="253" font-size="19">N = 16, 32, 64</text><text x="24" y="295" font-size="28" fill="#285e88">p observado ≈ 1,03</text><text x="24" y="354" font-size="19">Ordem assintótica: 1</text><text x="24" y="388" font-size="17">Uma tripla grosseira pode enganar.</text></g></svg>