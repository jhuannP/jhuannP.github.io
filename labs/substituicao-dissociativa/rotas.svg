<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Nem toda dissociação vira produto</title><desc id="d">A taxa a forma um intermediário a partir do complexo inicial. Dele, b retorna ao inicial e c segue ao produto. Com b dois e c três por segundo, a fração de captura é três quintos.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2154a0"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="40" font-size="25" font-weight="bold">Sair, recapturar ou substituir?</text><text x="24" y="80" font-size="19">X e Y livres mantidos constantes</text><text x="42" y="184" font-size="28">Cₓ</text><text x="270" y="184" font-size="28">I</text><text x="476" y="184" font-size="28">Cᵧ</text><path d="M94 155H248" stroke="#2154a0" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M248 208H94" stroke="#2154a0" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M307 174H455" stroke="#2154a0" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="166" y="141" font-size="22">a</text><text x="166" y="238" font-size="22">b</text><text x="375" y="158" font-size="22">c</text><path d="M24 269h512" stroke="#a7b4c8" fill="none"/><text x="24" y="307" font-size="22">Captura: c/(b+c) = 3/5</text><text x="24" y="352" font-size="22">k efetivo = a × 3/5 = 0,012 s⁻¹</text><text x="24" y="395" font-size="18">Exemplo sintético: a=0,02; b=2; c=3 s⁻¹.</text><text x="24" y="423" font-size="16">O esquema não é prova de um mecanismo real.</text></g></svg>