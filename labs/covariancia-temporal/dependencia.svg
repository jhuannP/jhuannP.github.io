<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" role="img" aria-labelledby="t d"><title id="t">Covariância zero não exclui dependência</title><desc id="d">Três resultados equiprováveis: menos um e um, zero e zero, um e um. Y é o quadrado de X. A covariância é zero por simetria, mas saber Y igual a zero determina X igual a zero.</desc><rect width="440" height="370" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="22" y="32" font-size="20" font-weight="bold">Covariância zero. Relação exata.</text><text x="22" y="61" font-size="16">Cada ponto tem probabilidade 1/3.</text><path d="M60 270H385 M220 292V89" stroke="#777b70" fill="none"/><text x="391" y="275" font-size="17">X</text><text x="227" y="92" font-size="17">Y</text><g fill="#2448bc"><circle cx="110" cy="130" r="7"/><circle cx="220" cy="270" r="7"/><circle cx="330" cy="130" r="7"/></g><g font-size="16"><text x="74" y="113">(−1, 1)</text><text x="297" y="113">(1, 1)</text><text x="238" y="261">(0, 0)</text><text x="22" y="320">Y = X². Saber Y = 0 revela X = 0.</text><text x="22" y="350">Sem dados experimentais ou ruído medido.</text></g></g></svg>