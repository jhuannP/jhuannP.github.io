<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img" aria-labelledby="title desc"><title id="title">Mesmo F, estados diferentes</title><desc id="desc">Bloco em repouso: F6N direita e atrito6N esquerda. Bloco deslizando à esquerda: F6N e atrito6N ambas direita. Em ambos, normal20N acima e peso20N abaixo. Acelerações0 e6m/s².</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#246555"/></marker></defs><rect width="520" height="600" fill="#faf9f5"/><g fill="#23372f" font-family="Arial,sans-serif"><text x="24" y="35" font-size="25">O estado inicial muda a resposta</text><text x="24" y="85" font-size="22">Em repouso: a = 0</text><rect x="222" y="167" width="76" height="52" fill="#d3dfd7"/><path d="M70 221H455" stroke="#7f8c84"/><g stroke="#246555" stroke-width="2.5" marker-end="url(#arrow)"><path d="M260 167V117"/><path d="M260 219V278"/><path d="M298 187H420"/><path d="M222 197H100"/></g><g font-size="19"><text x="276" y="130">N=20N</text><text x="277" y="269">mg=20N</text><text x="355" y="173">F=6N</text><text x="78" y="183">f=−6N</text></g><text x="24" y="345" font-size="22">Deslizando à esquerda: a = +6 m/s²</text><rect x="222" y="427" width="76" height="52" fill="#d3dfd7"/><path d="M70 481H455" stroke="#7f8c84"/><g stroke="#246555" stroke-width="2.5" marker-end="url(#arrow)"><path d="M260 427V377"/><path d="M260 479V538"/><path d="M298 447H420"/><path d="M298 468H420"/></g><g font-size="19"><text x="276" y="390">N=20N</text><text x="277" y="529">mg=20N</text><text x="355" y="433">F=6N</text><text x="352" y="496">f=+6N</text><text x="67" y="555">← v_rel&lt;0 (movimento)</text></g></g></svg>