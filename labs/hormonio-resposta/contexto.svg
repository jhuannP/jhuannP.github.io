<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t desc"><title id="t">Mesmo sinal, respostas diferentes</title><desc id="desc">Modelo original com concentração livre h2 e Kd2: ocupação1/2. EstadoA com alfa4 e beta1 dá fração de resposta2/3. EstadoB com alfa1 e beta4 dá1/9. Valores prescritos, não medições de hormônios.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#386b70"/></marker></defs><rect width="760" height="440" rx="18" fill="#f5f4ed"/><g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="40" font-size="25" font-weight="bold">Mesmo sinal. Respostas diferentes.</text><text x="28" y="70" font-size="16">Modelo reduzido original • constantes e condições prescritas</text><rect x="28" y="100" width="190" height="94" rx="12" fill="#e1ece6"/><rect x="284" y="100" width="208" height="94" rx="12" fill="#e1ece6"/><rect x="550" y="100" width="182" height="94" rx="12" fill="#ede4d5"/><g font-size="18"><text x="48" y="132">Concentração livre</text><text x="48" y="164" font-weight="bold">h = 2, Kd = 2</text><text x="304" y="132">Fração ocupada</text><text x="304" y="164" font-weight="bold">u = 1/2</text><text x="570" y="132">Resposta x</text><text x="570" y="164">depende de α, β</text></g><g stroke="#386b70" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M224 147H277"/><path d="M498 147H543"/><path d="M388 200V220H198V244"/><path d="M388 220H560V244"/></g><rect x="28" y="250" width="340" height="112" rx="12" fill="#e1ece6"/><rect x="390" y="250" width="342" height="112" rx="12" fill="#ede4d5"/><g font-size="19"><text x="48" y="280" font-weight="bold">Estado A</text><text x="410" y="280" font-weight="bold">Estado B</text><text x="48" y="312">α = 4, β = 1 → x∞ = 2/3</text><text x="410" y="312">α = 1, β = 4 → x∞ = 1/9</text><text x="48" y="341">Mesma ocupação u = 1/2</text><text x="410" y="341">Mesma ocupação u = 1/2</text></g><text x="28" y="399" font-size="16">α e β: taxas por unidade de tempo arbitrária, não ajustadas.</text><text x="28" y="427" font-size="16">x é fração de um alvo abstrato; não é glicemia ou efeito clínico.</text></g></svg>