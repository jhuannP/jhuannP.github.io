<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-labelledby="t desc"><title id="t">Partição da carga no exemplo de deposição</title><desc id="desc">Dos1930 coulombs totais,1544 são atribuídos à produção de cobre e386 a outros processos pelo modelo. A carga não desaparece. Eficiência de corrente80%.</desc><rect width="620" height="360" fill="#faf8f0"/><g font-family="sans-serif" fill="#203044"><text x="32" y="36" font-size="22" font-weight="bold">A carga se distribui entre processos</text><text x="32" y="68" font-size="17">Exemplo sintético · Q = 1930 C · η = 0,80</text><rect x="40" y="108" width="432" height="60" fill="#304ac2"/><rect x="472" y="108" width="108" height="60" fill="#d9b34a"/><text x="190" y="145" fill="white" font-size="20">1544 C · 80%</text><text x="485" y="145" font-size="18">20%</text><path d="M180 180V206 M526 180V206" stroke="#203044" stroke-width="2"/><text x="40" y="235" font-size="18">Cu²⁺ + 2e⁻ → Cu</text><text x="40" y="263" font-size="17">0,008 mol · 0,508 g</text><text x="400" y="235" font-size="18">Outros: 386 C</text><text x="400" y="263" font-size="16">Produtos não inferidos</text><text x="32" y="310" font-size="16">F adotado: 96500 C/mol de elétrons; M(Cu): 63,5 g/mol.</text><text x="32" y="338" font-size="16">η é dado prescrito; não é eficiência energética.</text></g></svg>