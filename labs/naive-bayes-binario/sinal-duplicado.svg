<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="title desc"><title id="title">Um sinal, duas colunas</title><desc id="desc">Classe 0: quatro linhas 11 e uma 00. Classe 1: uma linha 11 e quatro 00. Posterior da classe 0 ao observar 11: conjunta empírica quatro quintos, Naive Bayes sem suavizar dezesseis dezessete avos, com alpha um vinte e cinco vinte e nove avos.</desc><rect width="420" height="500" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="35" font-size="23" font-weight="bold">Um sinal, duas colunas</text><text x="22" y="65" font-size="19">Em cada linha: X₂ = X₁</text><text x="22" y="108" font-size="20" font-weight="bold">Classe 0</text><text x="22" y="139" font-size="21">4 × (1,1) + 1 × (0,0)</text><text x="22" y="192" font-size="20" font-weight="bold">Classe 1</text><text x="22" y="223" font-size="21">1 × (1,1) + 4 × (0,0)</text><path d="M22 253H398" stroke="#aab7ae"/><text x="22" y="287" font-size="20" font-weight="bold">Observação: (1,1)</text><text x="22" y="318" font-size="18">Posterior da classe 0</text><text x="22" y="356" font-size="21">Conjunta empírica: 4/5</text><text x="22" y="398" font-size="21">Naive Bayes, α=0: 16/17</text><text x="22" y="440" font-size="21">Naive Bayes, α=1: 25/29</text></g></svg>