<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="t d"><title id="t">Três categorias primárias e cinco secundárias</title><desc id="d">Correspondências regionais selecionadas do encéfalo em desenvolvimento e exemplos adultos. Setas não representam circuitos ou linhagem celular medida.</desc><rect width="760" height="560" fill="#f0eee5"/><g font-family="sans-serif" fill="#263a38"><text x="28" y="37" font-size="25" font-weight="bold">Origem regional. Uma pergunta definida.</text><text x="28" y="85" font-size="18" font-weight="bold">Primária</text><text x="285" y="85" font-size="18" font-weight="bold">Secundária</text><text x="520" y="85" font-size="18" font-weight="bold">Exemplos adultos</text><g stroke="#81978b" fill="none"><path d="M193 180H225V140H270 M225 180V220H270 M193 300H270 M193 420H225V380H270 M225 420V460H270 M447 140H500 M447 220H500 M447 300H500 M447 380H500 M447 460H500"/></g><g font-size="20"><text x="28" y="186">Prosencéfalo</text><text x="28" y="306">Mesencéfalo</text><text x="28" y="426">Rombencéfalo</text><text x="285" y="146">Telencéfalo</text><text x="285" y="226">Diencéfalo</text><text x="285" y="306">Mesencéfalo</text><text x="285" y="386">Metencéfalo</text><text x="285" y="466">Mielencéfalo</text></g><g font-size="18"><text x="520" y="136">Córtex cerebral</text><text x="520" y="161">Bulbo olfatório</text><text x="520" y="216">Tálamo</text><text x="520" y="241">Hipotálamo</text><text x="520" y="296">Teto</text><text x="520" y="321">Tegmento</text><text x="520" y="376">Ponte</text><text x="520" y="401">Cerebelo</text><text x="520" y="466">Bulbo raquidiano</text></g><text x="28" y="535" font-size="17">Recorte esquemático; não mostra todos os derivados, cavidades ou conexões.</text></g></svg>