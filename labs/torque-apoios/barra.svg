<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440"><title>Forças numa barra com dois apoios</title><desc>Barra entre zero e três metros, carga cento e vinte newtons a um metro, peso próprio sessenta newtons no centro. Reações verticais nos apoios.</desc><defs><marker id="up" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#205bc1"/></marker><marker id="down" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9d4a34"/></marker></defs><rect width="420" height="440" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="36" font-size="20" font-weight="700">Desenhe as forças da barra</text><text x="24" y="68" font-size="14">Cargas verticais; barra uniforme; L = 3 m</text><path d="M60 210H360" stroke="#203332" stroke-width="9"/><path d="M60 210V125" stroke="#205bc1" stroke-width="3" marker-end="url(#up)"/><path d="M360 210V125" stroke="#205bc1" stroke-width="3" marker-end="url(#up)"/><text x="43" y="107" font-size="18" fill="#205bc1">R_A</text><text x="340" y="107" font-size="18" fill="#205bc1">R_B</text><path d="M160 210V300" stroke="#9d4a34" stroke-width="3" marker-end="url(#down)"/><path d="M210 210V255" stroke="#9d4a34" stroke-width="3" marker-end="url(#down)"/><text x="101" y="328" font-size="17" fill="#9d4a34">120 N</text><text x="225" y="278" font-size="17" fill="#9d4a34">60 N</text><text x="43" y="242" font-size="14">0</text><text x="344" y="242" font-size="14">3 m</text><path d="M60 350H160M60 344V356M160 344V356" stroke="#536b64"/><text x="90" y="374" font-size="15">1 m</text><path d="M60 395H210M60 389V401M210 389V401" stroke="#536b64"/><text x="106" y="421" font-size="15">1,5 m</text></g></svg>
