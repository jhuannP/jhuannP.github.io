<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Mesma parábola, derivadas diferentes</title><desc id="desc">Parábola y igual a x ao quadrado dividido por quatro,com círculo osculador de raio dois e centro zero,dois no vértice. Escalas iguais em x e y. No parâmetro u,derivada dois,zero e segunda derivada zero,dois. Com u igual a dois s mais s ao quadrado,no zero,derivada quatro,zero e segunda derivada quatro,oito. Curvatura meio nas duas descrições. Vetores de derivadas são descritos em caixas,não desenhados na escala geométrica.</desc>
<rect width="760" height="620" rx="18" fill="#f4f0e5"/>
<g font-family="Arial,sans-serif" fill="#203b39">
<text x="32" y="42" font-size="24" font-weight="bold">O caminho curva. O parâmetro muda o ritmo.</text>
<text x="32" y="73" font-size="17">γ(u) = (2u, u²) · q(s) = γ(2s + s²), perto de s = 0</text>
<rect x="26" y="92" width="343" height="118" rx="12" fill="#e4e9e1"/><rect x="391" y="92" width="343" height="118" rx="12" fill="#e4e9e1"/>
<text x="44" y="122" font-size="19" font-weight="bold">Parâmetro u, no zero</text><text x="44" y="152" font-size="18">γ′ = (2, 0) · γ″ = (0, 2)</text><text x="44" y="183" font-size="18">κ = 4 / 8 = 1/2</text>
<text x="409" y="122" font-size="19" font-weight="bold">Parâmetro s, no zero</text><text x="409" y="152" font-size="18">q′ = (4, 0) · q″ = (4, 8)</text><text x="409" y="183" font-size="18">κ = 32 / 64 = 1/2</text>
