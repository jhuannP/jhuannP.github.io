<svg xmlns="http://www.w3.org/2000/svg" width="620" height="490" viewBox="0 0 620 490" role="img" aria-labelledby="title desc"><title id="title">Setor de120 graus: arco,área e perímetro</title><desc id="desc">Disco de raio6centímetros com setor de120graus destacado. O arco tem comprimento4pi centímetros,a área12pi centímetros quadrados e o perímetro inclui dois raios:12+4pi centímetros.</desc><rect width="620" height="490" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#252825"><text x="26" y="32" font-size="20">O que a pergunta quer medir?</text><text x="26" y="60" font-size="14">Raio 6 cm · ângulo central 120° = 2π/3 rad</text><circle cx="300" cy="225" r="130" fill="none" stroke="#aaa" stroke-width="2"/><path d="M300 225L430 225A130 130 0 0 0 235 112.42Z" fill="#e6e4f6" stroke="#4545b4" stroke-width="2"/><path d="M430 225A130 130 0 0 0 235 112.42" fill="none" stroke="#4545b4" stroke-width="5"/><path d="M334 225A34 34 0 0 0 283 195.56" fill="none" stroke="#555"/><circle cx="300" cy="225" r="3"/><text x="311" y="200" font-size="14">120°</text><text x="350" y="247" font-size="15">6 cm</text><text x="173" y="174" font-size="15">6 cm</text><text x="417" y="119" font-size="16" fill="#4545b4">arco: 4π cm</text><text x="290" y="162" font-size="15">área: 12π cm²</text><path d="M26 380H594" stroke="#ccc"/><text x="26" y="411" font-size="17">Perímetro do setor = dois raios + arco</text><text x="26" y="443" font-size="17">P = 12 + 4π cm</text><text x="26" y="475" font-size="14">A borda cinza restante não pertence ao setor destacado.</text></g></svg>