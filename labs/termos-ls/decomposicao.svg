<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t d"><title id="t">Dimensões dos termos de d²</title><desc id="d">Quarenta e cinco estados se decompõem em trinta estados tripletos e quinze singletos: triplo F21, triplo P9, singleto G9, singleto D5 e singleto S1. Não é diagrama de energias.</desc><rect width="720" height="460" fill="#f8fafc"/><g font-family="sans-serif" fill="#173041"><text x="30" y="38" font-size="24">d² · 45 estados de base</text><text x="30" y="70" font-size="17">Pauli → projeções → termos LS</text><path d="M360 90V110H190V130M360 110H530V130" fill="none" stroke="#64748b" stroke-width="2"/><text x="190" y="158" text-anchor="middle" font-size="22">Tripletos · S = 1</text><text x="530" y="158" text-anchor="middle" font-size="22">Singletos · S = 0</text><g fill="#e1edf0" stroke="#155e75"><rect x="70" y="185" width="240" height="110" rx="3"/><rect x="410" y="185" width="240" height="150" rx="3"/></g><g text-anchor="middle" font-size="22"><text x="190" y="220">³F → 7 × 3 = 21</text><text x="190" y="260">³P → 3 × 3 = 9</text><text x="530" y="220">¹G → 9 × 1 = 9</text><text x="530" y="260">¹D → 5 × 1 = 5</text><text x="530" y="300">¹S → 1 × 1 = 1</text><text x="190" y="370">30 estados</text><text x="530" y="370">15 estados</text></g><text x="30" y="426" font-size="17">Contagem de dimensões. Posições e caixas sem escala energética.</text></g></svg>