<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 530" width="440" height="530" role="img" aria-labelledby="t desc"><title id="t">Observação com ruído: o suporte limita a posterior</title><desc id="desc">No plano x horizontal e z vertical, o paralelogramo entre z=x e z=x+1, com x entre zero e um. O corte z meio admite x entre zero e meio; o corte z um e meio admite x entre meio e um.</desc><rect width="440" height="530" fill="#faf8f1"/><g font-family="sans-serif" fill="#152e38"><text x="28" y="35" font-size="20">Z = X + E, com 0 ≤ X,E ≤ 1</text><text x="28" y="62" font-size="14">Independentes e uniformes · exemplo sintético</text><path d="M80 410 L330 285 L330 160 L80 285 Z" fill="#d8e6e2" stroke="#365e62" stroke-width="2"/><path d="M65 410 H370 M80 425 V120" fill="none" stroke="#152e38" stroke-width="2"/><text x="378" y="417">x</text><text x="65" y="110">z</text><g font-size="14"><text x="60" y="432">0</text><text x="322" y="432">1</text><text x="53" y="290">1</text><text x="53" y="165">2</text></g><path d="M80 347.5 H205" stroke="#00686b" stroke-width="6"/><path d="M205 222.5 H330" stroke="#934822" stroke-width="6" stroke-dasharray="10 5"/><text x="90" y="337" font-size="15">z = 1/2</text><text x="208" y="208" font-size="15">z = 3/2</text><text x="28" y="464" font-size="16" fill="#00686b">Corte baixo: X ∈ [0, 1/2]</text><text x="28" y="491" font-size="16" fill="#934822">Corte alto: X ∈ [1/2, 1]</text><text x="28" y="516" font-size="13">Linhas indicam suporte; não têm massa positiva.</text></g></svg>