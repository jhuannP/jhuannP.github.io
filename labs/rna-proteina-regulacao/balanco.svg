<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" width="440" height="540" role="img" aria-labelledby="t desc"><title id="t">RNA e proteína: produção e perda são controles diferentes</title><desc id="desc">Produção alfa alimenta RNA M; perda delta reduz RNA. RNA orienta produção beta M de proteína P sem ser consumido pela tradução. Perda gama reduz proteína. A proteína estacionária depende de quatro parâmetros.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#24575b" stroke-width="1.5"/></marker></defs><rect width="440" height="540" fill="#faf8f1"/><g font-family="sans-serif" fill="#18343c"><text x="26" y="36" font-size="21">RNA ≠ produção de proteína</text><text x="26" y="65" font-size="14">Balanço médio · exemplo sintético</text><rect x="82" y="145" width="195" height="60" rx="5" fill="#d8e8e3"/><text x="127" y="181" font-size="21">RNA M</text><path d="M180 90 V137" fill="none" stroke="#24575b" stroke-width="2.5" marker-end="url(#a)"/><path d="M285 175 H374" fill="none" stroke="#24575b" stroke-width="2.5" marker-end="url(#a)"/><path d="M180 214 V308" fill="none" stroke="#24575b" stroke-width="2.5" marker-end="url(#a)"/><path d="M285 347 H374" fill="none" stroke="#24575b" stroke-width="2.5" marker-end="url(#a)"/><text x="195" y="119" font-size="16">produção α</text><text x="294" y="158" font-size="15">perda δM</text><text x="197" y="261" font-size="16">produção βM</text><rect x="82" y="316" width="195" height="62" rx="5" fill="#e4e0d3"/><text x="115" y="353" font-size="21">Proteína P</text><text x="291" y="330" font-size="15">perda γP</text><text x="26" y="423" font-size="18">M* = α/δ</text><text x="26" y="458" font-size="18">P* = βM*/γ</text><text x="26" y="497" font-size="15">Mesmos M* e P*: diferentes taxas possíveis.</text><text x="26" y="522" font-size="13">A figura não representa um mecanismo de RISC.</text></g></svg>