<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc"><title id="title">Oito partículas, nove macroestados</title><desc id="desc">Barras do número de configurações para K de zero a oito: um, oito, vinte e oito, cinquenta e seis, setenta, cinquenta e seis, vinte e oito, oito, um. Cada número dividido por256 é a probabilidade. K igual quatro é o macroestado mais provável, com70 de256 configurações.</desc><rect width="680" height="430" rx="18" fill="#f5f1e8"/><g font-family="Arial,sans-serif" fill="#183f38"><text x="28" y="35" font-size="22" font-weight="bold">Macroestados não têm pesos iguais</text><text x="28" y="69" font-size="17">N = 8 · alturas e rótulos: W(k) · probabilidade = W(k)/256</text><line x1="50" y1="315" x2="625" y2="315" stroke="#7c8276"/><rect x="63" y="312.143" width="35" height="2.857" rx="3" fill="#83a495"/><text x="80.5" y="303.143" text-anchor="middle" font-size="15">1</text><text x="80.5" y="341" text-anchor="middle" font-size="16">0</text><rect x="125" y="292.143" width="35" height="22.857" rx="3" fill="#83a495"/><text x="142.5" y="283.143" text-anchor="middle" font-size="15">8</text><text x="142.5" y="341" text-anchor="middle" font-size="16">1</text><rect x="187" y="235.000" width="35" height="80.000" rx="3" fill="#83a495"/><text x="204.5" y="226.000" text-anchor="middle" font-size="15">28</text><text x="204.5" y="341" text-anchor="middle" font-size="16">2</text><rect x="249" y="155.000" width="35" height="160.000" rx="3" fill="#83a495"/><text x="266.5" y="146.000" text-anchor="middle" font-size="15">56</text><text x="266.5" y="341" text-anchor="middle" font-size="16">3</text><rect x="311" y="115.000" width="35" height="200.000" rx="3" fill="#176454"/><text x="328.5" y="106.000" text-anchor="middle" font-size="15">70</text><text x="328.5" y="341" text-anchor="middle" font-size="16">4</text><rect x="373" y="155.000" width="35" height="160.000" rx="3" fill="#83a495"/><text x="390.5" y="146.000" text-anchor="middle" font-size="15">56</text><text x="390.5" y="341" text-anchor="middle" font-size="16">5</text><rect x="435" y="235.000" width="35" height="80.000" rx="3" fill="#83a495"/><text x="452.5" y="226.000" text-anchor="middle" font-size="15">28</text><text x="452.5" y="341" text-anchor="middle" font-size="16">6</text><rect x="497" y="292.143" width="35" height="22.857" rx="3" fill="#83a495"/><text x="514.5" y="283.143" text-anchor="middle" font-size="15">8</text><text x="514.5" y="341" text-anchor="middle" font-size="16">7</text><rect x="559" y="312.143" width="35" height="2.857" rx="3" fill="#83a495"/><text x="576.5" y="303.143" text-anchor="middle" font-size="15">1</text><text x="576.5" y="341" text-anchor="middle" font-size="16">8</text><text x="234" y="375" font-size="17">K = partículas à esquerda</text><text x="28" y="411" font-size="15">Figura original · retrato estatístico idealizado, sem previsão de tempo</text></g></svg>