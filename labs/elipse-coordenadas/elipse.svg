<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img" aria-labelledby="title desc"><title id="title">Uma elipse em duas coordenadas</title><desc id="desc">Elipse centrada em um, menos dois, com eixo maior na direção três quintos, quatro quintos. Semieixos três e dois. Os eixos originais x e y são cinza; os eixos locais u e v são tracejados. A curva não muda ao trocar as coordenadas. A mesma escala por unidade nos dois eixos preserva a geometria.</desc><rect width="520" height="600" fill="#f7f4eb"/>
