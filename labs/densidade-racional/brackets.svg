<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-labelledby="t desc"><title id="t">Certificados racionais para a raiz de dois</title><desc id="desc">Três linhas mostram limites inferiores e superiores positivos. Seus quadrados ficam abaixo e acima de dois. Posições são esquemáticas e cada linha tem uma escala própria.</desc><rect width="620" height="400" fill="#faf8f0"/><g font-family="sans-serif" fill="#192c3e"><text x="32" y="36" font-size="22" font-weight="bold">Enquadrar por quadrados exatos</text><text x="32" y="65" font-size="15">Valores adimensionais · escalas próprias, esquemáticas</text><g stroke="#87909a" stroke-width="2"><path d="M150 128H550 M150 218H550 M150 308H550"/></g><g fill="#304ac2"><circle cx="210" cy="128" r="6"/><circle cx="490" cy="128" r="6"/><circle cx="210" cy="218" r="6"/><circle cx="490" cy="218" r="6"/><circle cx="210" cy="308" r="6"/><circle cx="490" cy="308" r="6"/></g><g font-size="18"><text x="32" y="134">k = 1</text><text x="175" y="111">1,4</text><text x="465" y="111">1,5</text><text x="300" y="159">1,96 &lt; 2 &lt; 2,25</text><text x="32" y="224">k = 2</text><text x="175" y="201">1,41</text><text x="465" y="201">1,42</text><text x="275" y="249">1,9881 &lt; 2 &lt; 2,0164</text><text x="32" y="314">k = 3</text><text x="175" y="291">1,414</text><text x="465" y="291">1,415</text><text x="260" y="339">1,999396 &lt; 2 &lt; 2,002225</text></g><text x="32" y="380" font-size="15">Larguras: 1/10, 1/100 e 1/1000. Nenhum limite é √2.</text></g></svg>