<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc">
<title id="title">Suporte triangular e cortes condicionais</title><desc id="desc">Região zero a um com y menor ou igual a x. O corte em x igual a meio só permite y até meio. O corte em y igual a meio só permite x a partir de meio. Nenhum corte preenche todo o intervalo unitário.</desc>
<rect width="440" height="560" fill="#f6f8ff"/><g font-family="sans-serif" fill="#172545">
<text x="24" y="33" font-size="19" font-weight="bold">A condição também muda o suporte</text>
<text x="24" y="61" font-size="15">Modelo: f(x,y)=3x em 0 ≤ y ≤ x ≤ 1</text>
<path d="M70 320 L340 320 L340 100 Z" fill="#dbe5fc" stroke="#254fc5" stroke-width="2"/>
<path d="M55 320 H360 M70 335 V85" stroke="#172545" fill="none" stroke-width="2"/>
<text x="359" y="341" font-size="16">x</text><text x="49" y="91" font-size="16">y</text>
<text x="54" y="342" font-size="14">0</text><text x="333" y="342" font-size="14">1</text><text x="48" y="105" font-size="14">1</text>
<path d="M205 320 V210" stroke="#254fc5" stroke-width="5"/>
<path d="M205 210 H340" stroke="#a3431d" stroke-width="5" stroke-dasharray="10 5"/>
<text x="237" y="278" font-size="17">y ≤ x</text><text x="98" y="155" font-size="15">massa zero</text>
<text x="24" y="389" font-size="16" fill="#254fc5">Traço vertical: X=1/2</text>
<text x="24" y="415" font-size="15">Y só pode estar entre 0 e 1/2.</text>
<text x="24" y="441" font-size="15">Densidade condicional: 2 nesse segmento.</text>
<text x="24" y="482" font-size="16" fill="#a3431d">Tracejado horizontal: Y=1/2</text>
<text x="24" y="508" font-size="15">X só pode estar entre 1/2 e 1.</text>
<text x="24" y="534" font-size="15">Densidade condicional: 8x/3 no segmento.</text>
</g></svg>