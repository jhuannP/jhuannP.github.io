<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc"><title id="title">Dois positivos sob três mecanismos</title><desc id="desc">A probabilidade inicial de H é um meio. Um positivo dá três quartos. Dois positivos dão nove décimos com independência condicional, três quartos com cópia e vinte e um vinte e seis avos na mistura dos mecanismos. As marginais de cada relato são iguais nos três modelos.</desc><rect width="480" height="600" fill="#faf8f2"/><g font-family="system-ui,sans-serif" fill="#17382e"><text x="28" y="42" font-size="23" font-weight="700">Dois relatos: qual mecanismo?</text><text x="28" y="76" font-size="17">P(H) = 1/2 · após um positivo: 3/4</text><path d="M28 98H452" stroke="#17382e"/><g font-size="19"><text x="28" y="138" font-weight="700">Novas observações</text><text x="28" y="168" font-size="16">Independentes dado H e dado Hᶜ</text><text x="28" y="204">P(H | +,+) = 9/10</text><text x="28" y="270" font-weight="700">Cópia da primeira observação</text><text x="28" y="300" font-size="16">O segundo relato não adiciona informação</text><text x="28" y="336">P(H | +,+) = 3/4</text><text x="28" y="402" font-weight="700">Mistura dos dois mecanismos</text><text x="28" y="432" font-size="16">Metade independente, metade cópia</text><text x="28" y="468">P(H | +,+) = 21/26</text></g><path d="M28 496H452" stroke="#17382e"/><text x="28" y="530" font-size="16">Mesmas taxas de cada relato isolado.</text><text x="28" y="556" font-size="16">Conjuntas diferentes, respostas diferentes.</text><text x="28" y="582" font-size="14">Modelo sintético · nenhuma calibração empírica</text></g></svg>