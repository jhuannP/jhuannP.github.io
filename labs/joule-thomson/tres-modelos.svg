<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Três modelos, três sinais de variação térmica</title><desc id="desc">Em cada modelo a pressão reduzida cai de1/10 a1/20 e a entalpia permanece constante. Parâmetro d−1 dá temperatura59/60;d0 dá1;d+1 dá61/60.</desc>
<rect width="720" height="480" rx="22" fill="#f3eee2"/>
<g font-family="sans-serif" fill="#173d39">
<text x="26" y="40" font-size="26" font-weight="700">A pressão cai. E a temperatura?</text>
<text x="26" y="78" font-size="20">τ₁=1 • π₁=1/10 → π₂=1/20 • c=3</text>
<rect x="22" y="112" width="216" height="245" rx="14" fill="#e0e7da" stroke="#176c63"/>
<text x="40" y="151" font-size="26" font-weight="700">d = −1</text>
<text x="40" y="200" font-size="24">τ₂ = 59/60</text>
<text x="40" y="247" font-size="22">inclinação +1/3</text>
<text x="40" y="298" font-size="25" font-weight="700">resfria</text>
<rect x="258" y="112" width="216" height="245" rx="14" fill="#e0e7da" stroke="#176c63"/>
<text x="276" y="151" font-size="26" font-weight="700">d = 0</text>
<text x="276" y="200" font-size="24">τ₂ = 1</text>
<text x="276" y="247" font-size="22">inclinação 0</text>
<text x="276" y="298" font-size="25" font-weight="700">mantém τ</text>
<rect x="494" y="112" width="216" height="245" rx="14" fill="#e0e7da" stroke="#176c63"/>
<text x="512" y="151" font-size="26" font-weight="700">d = +1</text>
<text x="512" y="200" font-size="24">τ₂ = 61/60</text>
<text x="512" y="247" font-size="22">inclinação −1/3</text>
<text x="512" y="298" font-size="25" font-weight="700">aquece</text>
<text x="26" y="397" font-size="21">h₂=h₁ em cada modelo • σ₂&gt;σ₁ nos três casos</text>
<text x="26" y="435" font-size="18">Três modelos prescritos, não três medições de gases.</text>
<text x="26" y="464" font-size="18">Grandezas reduzidas: τ não é kelvin; π não é bar.</text>
</g></svg>