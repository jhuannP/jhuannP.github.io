<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="title desc">
<title id="title">As mesmas moedas, três informações</title>
<desc id="desc">A: primeiro dígito um. B: segundo dígito um. Sem restrição, quatro resultados têm massa um quarto; conjunta um quarto igual ao produto. Sabendo igualdade, restam zero zero e um um com massa um meio: conjunta um meio, produto um quarto. Sabendo diferença, restam zero um e um zero com massa um meio: conjunta zero, produto um quarto. As marginais de A e B permanecem um meio em todos os casos.</desc>
<rect width="420" height="610" fill="#faf8f2"/>
<g font-family="Arial,sans-serif" fill="#20372e">
<text x="22" y="32" font-size="21" font-weight="bold">A mesma distribuição, filtrada</text>
<text x="22" y="59" font-size="17">A: 1º dígito = 1 · B: 2º dígito = 1</text>
<path d="M22 82H398" stroke="#aab7ae"/><text x="22" y="111" font-size="20" font-weight="bold">Sem restrição</text><rect x="22" y="126" width="80" height="38" rx="5" fill="#e1ece4"/><text x="62" y="152" text-anchor="middle" font-size="23">00</text><rect x="118" y="126" width="80" height="38" rx="5" fill="#e1ece4"/><text x="158" y="152" text-anchor="middle" font-size="23">01</text><rect x="214" y="126" width="80" height="38" rx="5" fill="#e1ece4"/><text x="254" y="152" text-anchor="middle" font-size="23">10</text><rect x="310" y="126" width="80" height="38" rx="5" fill="#e1ece4"/><text x="350" y="152" text-anchor="middle" font-size="23">11</text><text x="22" y="190" font-size="18">1/4 por resultado</text><text x="22" y="219" font-size="18">Conjunta 1/4 = produto 1/4</text><path d="M22 251H398" stroke="#aab7ae"/><text x="22" y="280" font-size="20" font-weight="bold">C: dígitos iguais</text><rect x="22" y="295" width="80" height="38" rx="5" fill="#e1ece4"/><text x="62" y="321" text-anchor="middle" font-size="23">00</text><rect x="118" y="295" width="80" height="38" rx="5" fill="#e1ece4"/><text x="158" y="321" text-anchor="middle" font-size="23">11</text><text x="22" y="359" font-size="18">1/2 por resultado</text><text x="22" y="388" font-size="18">Conjunta 1/2 ≠ produto 1/4</text><path d="M22 420H398" stroke="#aab7ae"/><text x="22" y="449" font-size="20" font-weight="bold">D: dígitos diferentes</text><rect x="22" y="464" width="80" height="38" rx="5" fill="#e1ece4"/><text x="62" y="490" text-anchor="middle" font-size="23">01</text><rect x="118" y="464" width="80" height="38" rx="5" fill="#e1ece4"/><text x="158" y="490" text-anchor="middle" font-size="23">10</text><text x="22" y="528" font-size="18">1/2 por resultado</text><text x="22" y="557" font-size="18">Conjunta 0 ≠ produto 1/4</text></g></svg>