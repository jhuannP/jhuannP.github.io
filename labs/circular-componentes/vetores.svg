<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Velocidade tangente, aceleração para o centro</title><desc id="desc">No ponto direito de um círculo de raio dois metros, com giro anti-horário de dois radianos por segundo, a posição é dois, zero metros, velocidade zero, quatro metros por segundo, e aceleração menos oito, zero metros por segundo ao quadrado. As setas têm escalas próprias e não permitem comparar seus comprimentos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="26" y="42" font-size="24">A direção também varia.</text><text x="26" y="76" font-size="17">R = 2 m • ω = 2 rad/s • θ = 0</text><circle cx="190" cy="270" r="115" fill="none" stroke="#386b9b" stroke-width="3"/><circle cx="190" cy="270" r="4"/><circle cx="305" cy="270" r="6"/><path d="M305 270V140 M305 270H202" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M190 270H305" stroke="#6e7784" stroke-dasharray="3 4"/><text x="318" y="163" font-size="20">v</text><text x="244" y="248" font-size="20">a</text><text x="138" y="296" font-size="15">centro</text><text x="26" y="425" font-size="18">v = (0, 4) m/s</text><text x="26" y="461" font-size="18">a = (−8, 0) m/s²</text><text x="26" y="510" font-size="14">Setas de grandezas diferentes: escalas próprias.</text><text x="26" y="536" font-size="14">O círculo representa a trajetória, não uma força.</text></g></svg>