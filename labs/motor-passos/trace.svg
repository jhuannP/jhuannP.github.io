<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" role="img" aria-labelledby="t d"><title id="t">Deslocamento e caminho não são iguais</title><desc id="d">Trajetória artificial com passos+5,+5,−5,+5nm nas origens temporais0,2;0,4;0,5;0,9segundo,seguida de desligamento1,2segundo. Posição final10nm,caminho20nm,quatro passos.</desc><rect width="620" height="470" fill="#faf9f4"/><g font-family="Arial,sans-serif" fill="#292929"><text x="22" y="32" font-size="21">Deslocamento e caminho não são iguais</text><text x="22" y="59" font-size="15">Trajetória fornecida · d = 5 nm · sem sorteio ou experimento</text><path d="M75 105V310H565" stroke="#888" fill="none"/><path d="M75 310H550" stroke="#ddd"/><text x="57" y="315" text-anchor="end" font-size="16">0</text><path d="M75 220H550" stroke="#ddd"/><text x="57" y="225" text-anchor="end" font-size="16">5</text><path d="M75 130H550" stroke="#ddd"/><text x="57" y="135" text-anchor="end" font-size="16">10</text><polyline points="75,310 150,310 150,220 225,220 225,130 262.5,130 262.5,220 412.5,220 412.5,130 525,130" fill="none" stroke="#4f46a5" stroke-width="3"/><text x="75" y="337" text-anchor="middle" font-size="15">0</text><text x="225.0" y="337" text-anchor="middle" font-size="15">0,4</text><text x="375.0" y="337" text-anchor="middle" font-size="15">0,8</text><text x="525.0" y="337" text-anchor="middle" font-size="15">1,2</text><path d="M519 124L531 136 M519 136L531 124" stroke="#292929" stroke-width="3"/><text x="354" y="109" font-size="15">desliga em 1,2 s</text><text x="22" y="102" font-size="16">x(nm)</text><text x="563" y="337" font-size="16">t(s)</text><path d="M22 364H598" stroke="#bbb"/><text x="22" y="393" font-size="17">Posição final − inicial = 10 nm</text><text x="22" y="422" font-size="17">Caminho = 4 × 5 = 20 nm</text><text x="22" y="453" font-size="14">Uma trajetória não é a média de muitas corridas até desligar.</text></g></svg>