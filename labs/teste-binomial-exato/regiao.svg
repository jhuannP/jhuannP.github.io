<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470"><title>Região de rejeição de um teste binomial</title><desc>Sob p0 um meio e seis ensaios, as massas em zero até seis são um,seis,quinze,vinte,quinze,seis,um divididas por64. Somente seis rejeita ao nível nominal cinco por cento.</desc><rect width="440" height="470" fill="#f7f6ee"/><g font-family="sans-serif" fill="#252a22"><text x="24" y="33" font-size="20" font-weight="bold">Uma regra para todos os resultados</text><text x="24" y="62" font-size="15">H₀: p = 1/2 · n = 6 · α = 0,05</text><text x="24" y="99" font-size="14">Probabilidade sob H₀</text><rect x="52" y="320.625" width="28" height="9.375" fill="#959e8b"/><text x="66" y="308.625" text-anchor="middle" font-size="13">1/64</text><text x="66" y="354" text-anchor="middle" font-size="15">0</text><rect x="99" y="273.75" width="28" height="56.25" fill="#959e8b"/><text x="113" y="261.75" text-anchor="middle" font-size="13">6/64</text><text x="113" y="354" text-anchor="middle" font-size="15">1</text><rect x="146" y="189.375" width="28" height="140.625" fill="#959e8b"/><text x="160" y="177.375" text-anchor="middle" font-size="13">15/64</text><text x="160" y="354" text-anchor="middle" font-size="15">2</text><rect x="193" y="142.5" width="28" height="187.5" fill="#959e8b"/><text x="207" y="130.5" text-anchor="middle" font-size="13">20/64</text><text x="207" y="354" text-anchor="middle" font-size="15">3</text><rect x="240" y="189.375" width="28" height="140.625" fill="#959e8b"/><text x="254" y="177.375" text-anchor="middle" font-size="13">15/64</text><text x="254" y="354" text-anchor="middle" font-size="15">4</text><rect x="287" y="273.75" width="28" height="56.25" fill="#959e8b"/><text x="301" y="261.75" text-anchor="middle" font-size="13">6/64</text><text x="301" y="354" text-anchor="middle" font-size="15">5</text><rect x="334" y="320.625" width="28" height="9.375" fill="#2453b6"/><text x="348" y="308.625" text-anchor="middle" font-size="13">1/64</text><text x="348" y="354" text-anchor="middle" font-size="15">6</text><path d="M44 330H374" stroke="#777d70"/><text x="220" y="384" text-anchor="middle" font-size="14">S: número de sucessos</text><text x="24" y="418" font-size="15" fill="#2453b6">Rejeita só em S=6: tamanho = 1/64</text><text x="24" y="450" font-size="14">Em S=5, valor-p = 7/64 &gt; 0,05</text></g></svg>