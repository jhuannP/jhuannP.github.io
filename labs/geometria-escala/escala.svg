<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">Uma escala, efeitos diferentes</title><desc id="d">Um retângulo de 2 por 3 contém seis quadrados unitários. Ao dobrar os dois lados, o retângulo de 4 por 6 contém 24 quadrados. Para uma caixa com três dimensões dobradas, o volume passa de 24 para 192 unidades cúbicas.</desc><rect width="440" height="420" fill="#f2f1e7"/><g font-family="sans-serif" fill="#262722"><text x="24" y="32" font-size="19" font-weight="bold">Uma escala, efeitos diferentes.</text><text x="24" y="63" font-size="15">Cada quadrado mede 1 unidade².</text><rect x="30" y="105" width="60" height="90" fill="#2348db" fill-opacity=".08" stroke="#2348db" stroke-width="2"/><path d="M60 105v90" stroke="#2348db"/><path d="M30 135h60" stroke="#2348db"/><path d="M30 165h60" stroke="#2348db"/><rect x="220" y="105" width="120" height="180" fill="#2348db" fill-opacity=".08" stroke="#2348db" stroke-width="2"/><path d="M250 105v180" stroke="#2348db"/><path d="M280 105v180" stroke="#2348db"/><path d="M310 105v180" stroke="#2348db"/><path d="M220 135h120" stroke="#2348db"/><path d="M220 165h120" stroke="#2348db"/><path d="M220 195h120" stroke="#2348db"/><path d="M220 225h120" stroke="#2348db"/><path d="M220 255h120" stroke="#2348db"/><text x="24" y="225" font-size="16">2×3: 6 quadrados</text><text x="215" y="315" font-size="16">4×6: 24 quadrados</text><text x="24" y="349" font-size="16">Lados ×2 → área ×4.</text><text x="24" y="378" font-size="15">Na caixa: 2×3×4 → 4×6×8</text><text x="24" y="404" font-size="15">Volume: 24 → 192 unidades³ (×8).</text></g></svg>