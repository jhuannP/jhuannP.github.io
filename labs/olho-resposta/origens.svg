<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Duas origens. Tecidos que interagem.</title><desc id="desc">Rota neuroectodérmica associada à retina e rota do ectoderma superficial associada ao cristalino. Seta tracejada indica sinalização entre tecidos, não conversão de origem.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#386b70"/></marker></defs>
<rect width="760" height="460" rx="18" fill="#f5f4ed"/>
<g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="42" font-size="25" font-weight="bold">Duas origens. Tecidos que interagem.</text><text x="28" y="72" font-size="16">Recorte de desenvolvimento • não é um mapa completo do olho</text>
<g fill="#e1ece6" stroke="#386b70" stroke-width="1.5"><rect x="28" y="110" width="205" height="86" rx="10"/><rect x="280" y="110" width="220" height="86" rx="10"/><rect x="550" y="110" width="180" height="86" rx="10"/></g>
<g fill="#ede4d5" stroke="#876b42" stroke-width="1.5"><rect x="28" y="275" width="205" height="86" rx="10"/><rect x="280" y="275" width="220" height="86" rx="10"/><rect x="550" y="275" width="180" height="86" rx="10"/></g>
<g text-anchor="middle" font-size="18"><text x="130" y="147">Neuroectoderma</text><text x="130" y="172">encefálico</text><text x="390" y="147">Vesícula / cálice</text><text x="390" y="172">óptico</text><text x="640" y="160" font-weight="bold">Retina</text><text x="130" y="312">Ectoderma</text><text x="130" y="337">superficial</text><text x="390" y="312">Placódio / vesícula</text><text x="390" y="337">do cristalino</text><text x="640" y="325" font-weight="bold">Cristalino</text></g>
<g stroke="#386b70" stroke-width="2.4" marker-end="url(#arrow)"><path d="M238 153H273"/><path d="M505 153H543"/><path d="M238 318H273"/><path d="M505 318H543"/><path d="M390 202V267" stroke-dasharray="6 5"/></g>
<text x="407" y="239" font-size="15">interação</text>
<path d="M30 398H80" stroke="#386b70" stroke-width="2.4"/><text x="94" y="403" font-size="16">Contínua: sequência de origem selecionada</text><path d="M30 430H80" stroke="#386b70" stroke-width="2.4" stroke-dasharray="6 5"/><text x="94" y="435" font-size="16">Tracejada: sinalização; não transformação de linhagem</text></g></svg>