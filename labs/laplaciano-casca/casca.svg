<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610"><desc>Corte de casca esférica com raios um e dois, fronteiras de valores zero e um e normais opostas na borda interna e externa.</desc><rect width="600" height="610" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">Uma casca, duas fronteiras</text><text x="30" y="73" font-size="17">Coordenada radial adimensional · 3D</text><circle cx="300" cy="290" r="175" fill="#e0e4f3" stroke="#434ac3" stroke-width="2"/><circle cx="300" cy="290" r="87.5" fill="#f5f4ec" stroke="#434ac3" stroke-width="2"/><circle cx="300" cy="290" r="3"/><path d="M300 290h175 M388 290h-40 M475 290h40" fill="none" stroke="#242927" stroke-width="2"/><path d="m348 290 10 -5v10z M515 290l-10 -5v10z"/><text x="306" y="277" font-size="17">r=1</text><text x="414" y="277" font-size="17">r=2</text><text x="252" y="224" font-size="18">f=0</text><text x="262" y="132" font-size="18">f=1</text><text x="320" y="326" font-size="16">n=−eᵣ</text><text x="465" y="326" font-size="16">n=+eᵣ</text><text x="30" y="513" font-size="21">f(r)=2−2/r · r²f′=2</text><text x="30" y="548" font-size="17">Fluxo externo: +8π · interno: −8π</text><text x="30" y="580" font-size="16">Fonte zero na casca; origem fora do domínio.</text></g></svg>