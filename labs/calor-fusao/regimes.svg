<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="t d"><title id="t">Temperatura final e regime de fusão</title><desc id="d">Para cem gramas de gelo a zero graus e duzentos gramas de água, desprezando o recipiente, a temperatura final permanece zero até a água inicial atingir quarenta graus. Acima disso todo o gelo funde e a temperatura final sobe. Com água a sessenta graus, a final é quarenta sobre três graus.</desc><rect width="440" height="430" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="20" y="29" font-size="20" font-weight="bold">Primeiro a fase. Depois a temperatura.</text><text x="20" y="58" font-size="16">Gelo: 0,10 kg a 0°C; água: 0,20 kg.</text><text x="20" y="85" font-size="16">Recipiente desprezado neste gráfico.</text><text x="20" y="111" font-size="15">T final (°C)</text><path d="M80 120V300H403" stroke="#777b70" fill="none"/><path d="M235 300V116" stroke="#777b70" stroke-dasharray="5 5"/><path d="M80 300H235L390 140" stroke="#2448bc" stroke-width="4" fill="none"/><g font-size="15"><text x="54" y="305">0</text><text x="49" y="245">10</text><text x="49" y="185">20</text><text x="49" y="125">30</text><text x="73" y="326">0</text><text x="148" y="326">20</text><text x="225" y="326">40</text><text x="303" y="326">60</text><text x="379" y="326">80</text><text x="80" y="355">T inicial da água (°C)</text><text x="20" y="391">Até 40°C: T final = 0°C.</text><text x="20" y="417">Depois: todo gelo fundido, água aquece.</text></g></g></svg>