<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="t d"><title id="t">Do sangue ao tecido</title><desc id="d">Cinco etapas relacionadas: rolamento, ativação, adesão firme, travessia e migração. Moléculas e eventos diferentes; nem toda célula completa a sequência.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285e58"/></marker></defs><rect width="420" height="500" fill="#f6f3e9"/><g font-family="system-ui,sans-serif" fill="#183c36"><text x="22" y="33" font-size="22" font-weight="700">Do sangue ao tecido</text><text x="22" y="63" font-size="14">Etapas relacionadas, sem escala de tempo</text><rect x="22" y="86" width="376" height="60" rx="4" fill="#dce8df"/><text x="38" y="110" font-size="17" font-weight="650">1. Rolamento</text><text x="38" y="133" font-size="14">Contatos transitórios · selectinas</text><path d="M210 148V161" stroke="#285e58" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="164" width="376" height="60" rx="4" fill="#dce8df"/><text x="38" y="188" font-size="17" font-weight="650">2. Ativação</text><text x="38" y="211" font-size="14">Sinalização local · quimiocinas</text><path d="M210 226V239" stroke="#285e58" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="242" width="376" height="60" rx="4" fill="#dce8df"/><text x="38" y="266" font-size="17" font-weight="650">3. Adesão firme</text><text x="38" y="289" font-size="14">Integrinas ativadas e seus ligantes</text><path d="M210 304V317" stroke="#285e58" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="320" width="376" height="60" rx="4" fill="#dce8df"/><text x="38" y="344" font-size="17" font-weight="650">4. Travessia vascular</text><text x="38" y="367" font-size="14">Barreira endotelial e membrana basal</text><path d="M210 382V395" stroke="#285e58" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="398" width="376" height="60" rx="4" fill="#dce8df"/><text x="38" y="422" font-size="17" font-weight="650">5. Migração no tecido</text><text x="38" y="445" font-size="14">Pistas químicas e matriz extracelular</text><text x="22" y="487" font-size="12">Observar uma etapa não comprova as seguintes.</text></g></svg>