<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">A informação muda a posterior</title><desc id="d">No modelo sintético, a classe lenta tem posterior quatro quintos se T supera dois dias, quatro sétimos se T está entre um e dois dias e dois terços na versão de densidade em t igual a dois dias.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="28" y="42" font-size="25" font-weight="bold">Qual foi o registro?</text><text x="28" y="76" font-size="18">Posterior da classe lenta • tempos em dias</text><path d="M28 100h504 M28 202h504 M28 304h504" stroke="#a7b4c8" fill="none"/><text x="28" y="139" font-size="22">Ainda não ocorreu: T &gt; 2</text><text x="28" y="178" font-size="27" fill="#2154a0">4/5</text><text x="28" y="241" font-size="22">Ocorreu no intervalo: 1 &lt; T ≤ 2</text><text x="28" y="280" font-size="27" fill="#2154a0">4/7</text><text x="28" y="343" font-size="22">Versão por densidade em t = 2</text><text x="28" y="382" font-size="27" fill="#2154a0">2/3</text><text x="28" y="415" font-size="17">Não dividir por P(T = 2): ela é zero.</text></g></svg>