<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">Esperar também informa</title><desc id="desc">As classes lenta e rápida têm peso inicial meio. As probabilidades de sobreviver um dia são meio e um quarto. As contribuições um quarto e um oitavo somam três oitavos; depois de normalizar, os pesos são dois terços e um terço.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="28" y="40" font-size="25" font-weight="bold">Um dia sem ocorrência</text><text x="28" y="71" font-size="19">A classe permanece fixa; a informação muda.</text><text x="30" y="125" font-size="21" font-weight="bold">Classe lenta</text><text x="315" y="125" font-size="21" font-weight="bold">Classe rápida</text><text x="30" y="162" font-size="20">Inicial: 1/2</text><text x="315" y="162" font-size="20">Inicial: 1/2</text><text x="30" y="202" font-size="19">P(T &gt; 1 | L) = 1/2</text><text x="315" y="202" font-size="19">P(T &gt; 1 | R) = 1/4</text><path d="M115 218v30m0 0l-6 -8m6 8l6 -8M400 218v30m0 0l-6 -8m6 8l6 -8" stroke="#355f9c" stroke-width="2" fill="none"/><text x="30" y="278" font-size="21">Massa: 1/4</text><text x="315" y="278" font-size="21">Massa: 1/8</text><path d="M28 301h504" stroke="#a7b4c8"/><text x="28" y="333" font-size="20">Dividir pela evidência 1/4 + 1/8 = 3/8</text><text x="30" y="382" font-size="28" fill="#2154a0">Posterior: 2/3</text><text x="315" y="382" font-size="28" fill="#2154a0">Posterior: 1/3</text><text x="28" y="415" font-size="17">Tempos em dias • parâmetros hipotéticos</text></g></svg>