<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
<title id="title">Construção de de Casteljau no parâmetro um meio</title>
<desc id="desc">Controles 0,0; 1,2; 2,2; 3,0. As três interpolações iniciais formam Q0, Q1, Q2; depois R0 e R1; ao final B é 1,5 por 1,5. A curva fica no fecho convexo e não passa pelos controles internos.</desc>
<rect width="760" height="480" fill="#f7f7f0"/>
<g font-family="Arial,sans-serif" fill="#233638">
<text x="28" y="36" font-size="23" font-weight="bold">Uma curva, três níveis de interpolação.</text>
<text x="28" y="65" font-size="17">Mesmo exemplo da aula. O parâmetro é geométrico; t = 1/2.</text>
<path d="M70 330L180 110L290 110L400 330Z" fill="#e2e9df"/>
<path d="M70 330L180 110L290 110L400 330" stroke="#87948a" fill="none" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M70 330C180 110 290 110 400 330" stroke="#397787" fill="none" stroke-width="4"/>
<path d="M125 220L235 110L345 220" stroke="#a4572b" fill="none" stroke-width="2.5"/>
<path d="M180 165L290 165" stroke="#347268" fill="none" stroke-width="3"/>
<g fill="#233638"><circle cx="70" cy="330" r="5"/><circle cx="180" cy="110" r="5"/><circle cx="290" cy="110" r="5"/><circle cx="400" cy="330" r="5"/></g>
<g fill="#a4572b"><circle cx="125" cy="220" r="5"/><circle cx="235" cy="110" r="5"/><circle cx="345" cy="220" r="5"/></g>
<g fill="#347268"><circle cx="180" cy="165" r="5"/><circle cx="290" cy="165" r="5"/></g>
<circle cx="235" cy="165" r="7" fill="#233638" stroke="#f7f7f0" stroke-width="2"/>
<text x="54" y="354" font-size="17">P₀</text><text x="162" y="95" font-size="17">P₁</text><text x="290" y="95" font-size="17">P₂</text><text x="400" y="354" font-size="17">P₃</text>
<text x="100" y="240" font-size="16">Q₀</text><text x="230" y="95" font-size="16">Q₁</text><text x="347" y="240" font-size="16">Q₂</text><text x="161" y="157" font-size="16">R₀</text><text x="295" y="157" font-size="16">R₁</text><text x="231" y="188" font-size="16">B</text>
<text x="470" y="119" font-size="18" font-weight="bold">Etapas em t = 1/2</text>
<g fill="#a4572b" font-size="17"><text x="470" y="155">Q₀ = (1/2, 1)</text><text x="470" y="183">Q₁ = (3/2, 2)</text><text x="470" y="211">Q₂ = (5/2, 1)</text></g>
<g fill="#347268" font-size="17"><text x="470" y="255">R₀ = (1, 3/2)</text><text x="470" y="283">R₁ = (2, 3/2)</text></g>
<rect x="458" y="307" width="266" height="57" rx="6" fill="#e2e9df"/><text x="472" y="342" font-size="20" font-weight="bold">B = (3/2, 3/2)</text>
<text x="28" y="418" font-size="19" font-weight="bold">Subdividir em 1/2 preserva o desenho da curva.</text>
<text x="28" y="451" font-size="17">Cada metade ganha controles próprios e um parâmetro local em [0,1].</text>
</g></svg>