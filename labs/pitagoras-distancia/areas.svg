<svg xmlns="http://www.w3.org/2000/svg" width="440" height="490" viewBox="0 0 440 490" role="img" aria-labelledby="t d"><title id="t">Demonstração por áreas com quatro triângulos</title><desc id="d">Um quadrado de lado a+b contém quatro triângulos retângulos congruentes nos cantos e um quadrado central de lado c. A área externa iguala c² mais quatro vezes ab/2, resultando em a²+b²=c².</desc><rect width="440" height="490" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Um quadrado, duas contas de área</text><text x="24" y="67" font-size="15">Lado externo: a + b</text><rect x="70" y="110" width="280" height="280" fill="#fff" stroke="#65758b" stroke-width="2"/><path d="M190 110 L350 230 L230 390 L70 270 Z" fill="#dce4ff" stroke="#294dbc" stroke-width="2"/><text x="121" y="100" font-size="17">a</text><text x="260" y="100" font-size="17">b</text><text x="48" y="197" font-size="17">b</text><text x="48" y="338" font-size="17">a</text><text x="208" y="253" font-size="24" fill="#294dbc">c²</text><text x="277" y="158" font-size="18" fill="#294dbc">c</text><text x="96" y="148" font-size="14">ab/2</text><text x="291" y="132" font-size="14">ab/2</text><text x="291" y="363" font-size="14">ab/2</text><text x="85" y="373" font-size="14">ab/2</text><text x="24" y="433" font-size="17">(a + b)² = c² + 4(ab/2)</text><text x="24" y="466" font-size="13">Montagem original · sem sobreposição das regiões</text></g></svg>