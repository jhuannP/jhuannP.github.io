<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc"><title id="title">Fases diferentes: soma de amplitudes complexas</title><desc id="desc">No plano das amplitudes, os vetores 3+4i e menos 3+4i, cada um de módulo 5, somam 8i de módulo 8. As partes reais cancelam. O sinal com frequência angular 2 é menos 8 seno de 2t em centímetros.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2348db"/></marker></defs><rect width="440" height="400" fill="#f4f3eb"/><g fill="#20221e" font-family="Arial,sans-serif" font-size="17"><text x="22" y="30" font-weight="bold" font-size="21">Somar antes de calcular o módulo</text><text x="22" y="57">Plano das amplitudes, em cm. Mesma ω.</text><path d="M45 310H395 M220 340V78" stroke="#7c8574" stroke-width="1.5"/><text x="374" y="334">Re</text><text x="232" y="86">Im</text><text x="231" y="333">0</text><path d="M295 210L220 110 M145 210L220 110" fill="none" stroke="#7c8574" stroke-dasharray="5 5"/><g stroke="#2348db" stroke-width="2.8" marker-end="url(#arrow)"><path d="M220 310L295 210"/><path d="M220 310L145 210"/><path d="M220 310L220 110"/></g><text x="296" y="198">Z₁=3+4i</text><text x="25" y="198">Z₂=−3+4i</text><text x="238" y="121" fill="#2348db">Ztotal=8i</text><text x="22" y="367">|Z₁|=5, |Z₂|=5, |Ztotal|=8.</text><text x="22" y="392" font-size="16">Com ω=2 rad/s: q(t)=−8 sin(2t) cm.</text></g></svg>