<svg xmlns="http://www.w3.org/2000/svg" width="520" height="610" viewBox="0 0 520 610" role="img" aria-labelledby="title desc">
<title id="title">Oposição à variação do fluxo</title><desc id="desc">Duas espiras fixas vistas de frente com normal saindo da tela. Contorno positivo anti-horário. Se o campo externo saindo cresce, a corrente é horária e seu campo entra. Se o campo saindo diminui, a corrente é anti-horária e seu campo sai. Área dois décimos de metro quadrado, resistência quatro ohms, variação de campo mais ou menos dois teslas por segundo.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#176153"/></marker></defs>
<rect width="520" height="610" fill="#f7f4eb"/>
<g fill="#182e38" font-family="sans-serif" font-size="21"><text x="20" y="35" font-size="25">Mesmo campo, variações opostas</text><text x="20" y="72">A = 0,2 m² · R = 4 Ω · uma espira</text></g>
<g fill="none" stroke="#83928a" stroke-width="2"><circle cx="120" cy="185" r="65"/><circle cx="120" cy="425" r="65"/><path d="M20 310H500" stroke-width="1"/></g>
<g fill="none" stroke="#176153" stroke-width="4" marker-end="url(#arrow)"><path d="M120 120A65 65 0 0 1 120 250"/><path d="M120 360A65 65 0 0 0 120 490"/></g>
<g fill="#182e38" font-family="sans-serif"><text x="100" y="201" font-size="45">⊙</text><text x="100" y="441" font-size="45">⊙</text><text x="30" y="283" font-size="20">Normal saindo</text><text x="30" y="523" font-size="20">Normal saindo</text></g>
<g fill="#182e38" font-family="sans-serif" font-size="21"><text x="235" y="134">B externo saindo cresce</text><text x="235" y="168">dB/dt = +2 T/s</text><text x="235" y="202">ε = −0,4 V</text><text x="235" y="236">I = −0,1 A · horário</text><text x="235" y="270">B induzido entrando</text><text x="235" y="374">B externo saindo diminui</text><text x="235" y="408">dB/dt = −2 T/s</text><text x="235" y="442">ε = +0,4 V</text><text x="235" y="476">I = +0,1 A · anti-horário</text><text x="235" y="510">B induzido saindo</text><text x="20" y="578" font-size="20">Positivo: anti-horário, visto de frente</text></g></svg>
