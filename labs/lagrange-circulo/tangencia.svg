<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc">
<title id="title">Níveis extremos de três x mais quatro y no círculo de raio dois</title>
<desc id="desc">O círculo x quadrado mais y quadrado igual a quatro encontra o nível máximo dez em seis quintos e oito quintos, e o nível mínimo menos dez no ponto oposto. Retas de nível são tangentes ao círculo nesses pontos. A seta indica a direção de aumento do objetivo três x mais quatro y.</desc>
<rect width="440" height="400" rx="16" fill="#f4f3e9"/>
<g font-family="sans-serif" fill="#24352d">
<text x="22" y="31" font-size="18" font-weight="bold">O nível extremo toca a restrição</text>
<path d="M50 200H390 M220 62V335" stroke="#8e9c94" fill="none"/>
<circle cx="220" cy="200" r="90" fill="none" stroke="#2456c2" stroke-width="3"/>
<path d="M194 68L354 188 M86 212L246 332" stroke="#718179" stroke-width="2"/>
<circle cx="274" cy="128" r="6" fill="#2456c2"/>
<circle cx="166" cy="272" r="6" fill="#24352d"/>
<path d="M220 200L250 160 M242 162L250 160L250 169" stroke="#2456c2" stroke-width="2" fill="none"/>
<text x="301" y="105" font-size="15">máximo 10</text>
<text x="299" y="126" font-size="14">(6/5; 8/5)</text>
<text x="26" y="295" font-size="15">mínimo −10</text>
<text x="26" y="316" font-size="14">(−6/5; −8/5)</text>
<text x="380" y="220" font-size="15">x</text><text x="230" y="75" font-size="15">y</text>
<text x="230" y="221" font-size="14">0</text>
<text x="22" y="365" font-size="16">f = 3x + 4y · g = x² + y² − 4 = 0</text>
</g></svg>