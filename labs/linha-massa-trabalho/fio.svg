<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" role="img" aria-labelledby="title desc"><title id="title">O fio tem massa; a orientação define o trabalho</title><desc id="desc">Semicírculo superior de raio dois metros, densidade três vezes um mais x ao quadrado sobre quatro, em quilogramas por metro. Densidade três no topo e seis nos extremos. Centro de massa abaixo do topo, y igual a trinta e dois sobre nove pi metros. Inverter o percurso mantém massa nove pi e inverte trabalho de quatro pi para menos quatro pi.</desc><rect width="440" height="620" fill="#f6f8ff"/><g font-family="sans-serif" fill="#172545"><text x="24" y="34" font-size="19" font-weight="bold">Massa do fio ≠ trabalho do campo</text><text x="24" y="64" font-size="15">R=2 m · λ(x,y)=3[1+(x/2 m)²] kg/m</text><text x="24" y="92" font-size="15">Uma passagem ao longo do semicírculo.</text><text x="154" y="163" font-size="15">λ=3 kg/m</text><path d="M65 325 H380 M220 345 V130" stroke="#a3adc4" fill="none"/><polyline points="350.00,325.00 349.98,322.73 349.92,320.46 349.82,318.20 349.68,315.93 349.51,313.67 349.29,311.41 349.03,309.16 348.73,306.91 348.40,304.66 348.03,302.43 347.61,300.19 347.16,297.97 346.67,295.76 346.14,293.55 345.57,291.35 344.96,289.17 344.32,286.99 343.64,284.83 342.92,282.68 342.16,280.54 341.37,278.41 340.53,276.30 339.67,274.20 338.76,272.12 337.82,270.06 336.84,268.01 335.83,265.98 334.78,263.97 333.70,261.97 332.58,260.00 331.43,258.05 330.25,256.11 329.03,254.20 327.77,252.30 326.49,250.44 325.17,248.59 323.82,246.76 322.44,244.96 321.03,243.19 319.59,241.44 318.11,239.71 316.61,238.01 315.08,236.34 313.51,234.69 311.92,233.08 310.31,231.49 308.66,229.92 306.99,228.39 305.29,226.89 303.56,225.41 301.81,223.97 300.04,222.56 298.24,221.18 296.41,219.83 294.56,218.51 292.70,217.23 290.80,215.97 288.89,214.75 286.95,213.57 285.00,212.42 283.03,211.30 281.03,210.22 279.02,209.17 276.99,208.16 274.94,207.18 272.88,206.24 270.80,205.33 268.70,204.47 266.59,203.63 264.46,