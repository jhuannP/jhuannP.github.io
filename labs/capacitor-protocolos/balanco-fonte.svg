<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="title desc"><title id="title">Bateria e trabalho na mudança de capacitância</title><desc id="desc">Inicial: dois microfarad e três volt, nove microjoules. Capacitância final triplicada. Carga fixa: energia final três, variação menos seis, bateria zero, trabalho externo menos seis microjoules. Tensão fixa: energia final vinte e sete, variação mais dezoito, bateria menos trinta e seis, trabalho externo menos dezoito microjoules.</desc><rect width="440" height="520" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="35" font-size="23" font-weight="bold">Capacitância × 3</text><text x="22" y="68" font-size="19">Inicial: 2 μF · 3 V · U₀=9 μJ</text><path d="M22 93H418" stroke="#aab7ae"/><text x="22" y="120" font-size="22" font-weight="bold">Carga fixa</text><text x="22" y="158" font-size="20">Ucap: 9 → 3 · ΔUcap=−6</text><text x="22" y="196" font-size="21">ΔEbat=0</text><text x="22" y="234" font-size="22" font-weight="bold">Wext=−6</text><path d="M22 273H418" stroke="#aab7ae"/><text x="22" y="300" font-size="22" font-weight="bold">Tensão fixa</text><text x="22" y="338" font-size="20">Ucap: 9 → 27 · ΔUcap=+18</text><text x="22" y="376" font-size="21">ΔEbat=−36</text><text x="22" y="414" font-size="22" font-weight="bold">Wext=−18</text><path d="M22 443H418" stroke="#aab7ae"/><text x="22" y="477" font-size="19">Todos os termos de energia em μJ.</text><text x="22" y="507" font-size="18">Wext &lt; 0: trabalho mecânico retirado.</text></g></svg>