<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="title desc"><title id="title">Estável não significa equilíbrio correto</title><desc id="desc">OU theta1,sigma quadrado2. Variância estacionária exata1. Euler com passos meio,um e três meios tem coeficientes meio,zero e menos meio e variâncias quatro terços,dois e quatro.</desc><rect width="660" height="440" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="28" y="42" font-size="24" font-weight="bold">Estável. Mas com variância a mais.</text><text x="28" y="77" font-size="17">θ=1 · σ²=2 · variância exata de equilíbrio S=1</text><g font-size="17"><text x="28" y="138">Passo h</text><text x="190" y="138">r de Euler</text><text x="365" y="138">V de Euler</text><text x="535" y="138">S exata</text></g><path d="M28 157H632M28 223H632M28 289H632M28 355H632" stroke="#b5bbb1"/><g font-size="24"><text x="28" y="202">1/2</text><text x="220" y="202">1/2</text><text x="405" y="202">4/3</text><text x="565" y="202">1</text><text x="28" y="268">1</text><text x="220" y="268">0</text><text x="405" y="268">2</text><text x="565" y="268">1</text><text x="28" y="334">3/2</text><text x="220" y="334">−1/2</text><text x="405" y="334">4</text><text x="565" y="334">1</text></g><text x="28" y="394" font-size="17">Condição estável: |r| &lt; 1 · aqui r = 1−θh</text><text x="28" y="424" font-size="14">Momentos teóricos próprios, sem trajetórias amostradas ou dados físicos.</text></g></svg>