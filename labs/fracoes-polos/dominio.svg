<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="title desc"><title id="title">Domínio dividido pelos pontos excluídos</title><desc id="desc">Os pontos menos um e zero são excluídos. Restam três intervalos: abaixo de menos um, entre menos um e zero, e acima de zero. Uma primitiva admite constantes distintas em cada componente. O intervalo de um a dois não atravessa polo; de menos um meio a um meio atravessa zero.</desc><rect width="440" height="330" fill="#f4f3eb"/><g font-family="Arial,sans-serif" fill="#20221e" font-size="17"><text x="22" y="30" font-size="21" font-weight="bold">Decompor não apaga o domínio</text><text x="22" y="60">Denominador: x(x+1)². Excluir −1 e 0.</text><text x="22" y="102">(−∞,−1)</text><text x="180" y="102">(−1,0)</text><text x="324" y="102">(0,∞)</text><path d="M25 127H145 M165 127H265 M285 127H415" stroke="#2348db" stroke-width="4"/><g fill="#f4f3eb" stroke="#2348db" stroke-width="2"><circle cx="155" cy="127" r="8"/><circle cx="275" cy="127" r="8"/></g><text x="145" y="158">−1</text><text x="270" y="158">0</text><text x="22" y="195">C₁, C₂ e C₃ podem ser diferentes.</text><path d="M22 218H418" stroke="#d3d7c9"/><text x="22" y="251">[1,2]: nenhum ponto excluído no intervalo.</text><text x="22" y="283">[−1/2,1/2]: contém o ponto excluído 0.</text><text x="22" y="315" font-size="16">Confira o intervalo inteiro antes de integrar.</text></g></svg>