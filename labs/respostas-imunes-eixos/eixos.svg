<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Reconhecimento e efetor são eixos distintos</title><desc id="d">A matriz mostra fagócito como celular inato, complemento como humoral inato, T citotóxico como celular adaptativo e anticorpo secretado como humoral adaptativo. São exemplos que cooperam.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="39" font-size="25" font-weight="bold">Duas perguntas, não uma</text><text x="24" y="77" font-size="19">Como reconhece? Quem executa a ação?</text><path d="M24 140h512 M24 245h512 M165 105v246 M355 105v246" stroke="#a7b4c8" fill="none"/><text x="186" y="126" font-size="22" font-weight="bold">Celular</text><text x="378" y="126" font-size="22" font-weight="bold">Humoral</text><text x="24" y="191" font-size="21" font-weight="bold">Inata</text><text x="182" y="191" font-size="21" fill="#2154a0">Fagócito</text><text x="369" y="191" font-size="21" fill="#2154a0">Complemento</text><text x="24" y="291" font-size="21" font-weight="bold">Adaptativa</text><text x="182" y="291" font-size="21" fill="#2154a0">T citotóxico</text><text x="369" y="281" font-size="21" fill="#2154a0">Anticorpo</text><text x="369" y="312" font-size="21" fill="#2154a0">secretado</text><text x="24" y="384" font-size="20">Um anticorpo pode ajudar um fagócito.</text><text x="24" y="417" font-size="17">Exemplos de referência; as entradas cooperam.</text></g></svg>