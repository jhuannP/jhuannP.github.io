<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">Dois ramos entre os mesmos nós</title><desc id="desc">Banco paralelo entre nós A e B, alimentado por fonte ideal de doze volts. A está em doze volts e B em zero. Ramo um de seis ohms conduz dois amperes de A para B. Ramo dois de três ohms conduz quatro amperes de A para B. Total seis amperes, resistência equivalente dois ohms.</desc><rect width="480" height="560" fill="#f7f4ec"/><g fill="#202b29" font-family="Georgia,serif"><text x="28" y="42" font-size="25">Paralelo é uma conexão de nós</text><text x="28" y="80" font-size="18">Fonte ideal mantém V_AB=12 V</text><text x="28" y="132" font-size="23">A · 12 V</text><text x="28" y="421" font-size="23">B · 0 V</text><g fill="none" stroke="#265e50" stroke-width="3"><path d="M68 151H407 M120 151V218 M120 298V389 M320 151V218 M320 298V389 M68 389H407"/><rect x="100" y="218" width="40" height="80"/><rect x="300" y="218" width="40" height="80"/></g><text x="156" y="248" font-size="21">6 Ω</text><text x="356" y="248" font-size="21">3 Ω</text><text x="92" y="337" font-size="20">↓ 2 A</text><text x="292" y="337" font-size="20">↓ 4 A</text><path d="M28 451H452" stroke="#89938b"/><text x="28" y="489" font-size="22">I_total=2+4=6 A · R_eq=2 Ω</text><text x="28" y="532" font-size="17">Fios ideais · desenho sem escala geométrica</text></g></svg>