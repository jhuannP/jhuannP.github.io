<svg xmlns="http://www.w3.org/2000/svg" width="520" height="370" viewBox="0 0 520 370" role="img" aria-labelledby="title desc">
<title id="title">Quatro estados após o relato vermelho</title><desc id="desc">Cor verdadeira e hipótese continuam incertas. A soma dos pesos é um. Ponderar o inventário restante fornece probabilidade dois quintos para a próxima vermelha.</desc>
<rect width="520" height="370" fill="#f7f4eb"/>
<g fill="#182e38" font-family="sans-serif" font-size="21">
<text x="24" y="36" font-size="25">O relato R não determina a cor</text>
<text x="24" y="76">Estado real</text><text x="216" y="76">Peso dado R</text><text x="378" y="76">Próxima V</text>
<path d="M24 90H496 M24 260H496" stroke="#a5b1ac"/>
<text x="24" y="124">H₁, saiu V</text><text x="246" y="124">4/15</text><text x="408" y="124">0</text>
<text x="24" y="164">H₁, saiu A</text><text x="246" y="164">2/15</text><text x="408" y="164">1/2</text>
<text x="24" y="204">H₂, saiu V</text><text x="246" y="204">8/15</text><text x="408" y="204">1/2</text>
<text x="24" y="244">H₂, saiu A</text><text x="246" y="244">1/15</text><text x="408" y="244">1</text>
<text x="24" y="299" font-size="24" fill="#176153">Previsão = soma de peso × chance = 2/5</text>
<text x="24" y="338" font-size="19">H₁: 1 vermelha/3 · H₂: 2 vermelhas/3 · A: azul</text>
</g></svg>
