<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Duas partições estáveis dos mesmos cinco pontos</title><desc id="d">Primeira partição: 0,2,3 no grupo A e 5,10 no B, centros 5/3 e 15/2, SSE103/6. Segunda: 0,2,3,5 no A e 10 no B, centros 5/2 e 10, SSE13. Grupos também identificados por letras.</desc><rect width="720" height="360" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b3a"><text x="30" y="35" font-size="22">Mesmo conjunto; duas respostas estáveis</text><text x="30" y="70" font-size="17">Início [0,3] → SSE = 103/6 ≈ 17,17</text><text x="30" y="210" font-size="17">Início [0,10] → SSE = 13</text><path d="M60 125H660M60 265H660" stroke="#64748b"/><g font-size="16" text-anchor="middle"><text x="60" y="155">0 · A</text><text x="180" y="155">2 · A</text><text x="240" y="155">3 · A</text><text x="360" y="155">5 · B</text><text x="660" y="155">10 · B</text><text x="60" y="295">0 · A</text><text x="180" y="295">2 · A</text><text x="240" y="295">3 · A</text><text x="360" y="295">5 · A</text><text x="660" y="295">10 · B</text></g><g fill="#155e75" stroke="#155e75"><circle cx="60" cy="125" r="6"/><circle cx="180" cy="125" r="6"/><circle cx="240" cy="125" r="6"/><circle cx="60" cy="265" r="6"/><circle cx="180" cy="265" r="6"/><circle cx="240" cy="265" r="6"/><circle cx="360" cy="265" r="6"/></g><g fill="#9a3412"><circle cx="360" cy="125" r="6"/><circle cx="660" cy="125" r="6"/><circle cx="660" cy="265" r="6"/></g><g fill="none" stroke="#172b3a" stroke-width="2"><path d="M160 105l7 8-7 8-7-8zM510 105l7 8-7 8-7-8zM210 245l7 8-7 8-7-8zM660 245l7 8-7 8-7-8z"/></g><g font-size="15" text-anchor="middle"><text x="160" y="98">c = 5/3</text><text x="510" y="98">c = 15/2</text><text x="210" y="238">c = 5/2</text><text x="660" y="238">c = 10</text></g><text x="30" y="340" font-size="16">● ponto · ◇ centro. Dados artificiais; agrupamento não é classe física.</text></g></svg>