<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" role="img" aria-labelledby="title desc"><title id="title">O nível soma os microestados</title><desc id="desc">Peso de cada estado excitado um terço do fundamental. Com um microestado fundamental e três excitados,as probabilidades individuais são um meio e três vezes um sexto. A população total excitada é um meio,não um quarto.</desc><rect width="660" height="410" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="28" y="42" font-size="25" font-weight="bold">Um nível. Três microestados.</text><text x="28" y="78" font-size="17">g₀=1 · g₁=3 · exp(−Δ/kBT)=1/3 · Z=2</text><g stroke="#728783" stroke-width="3"><path d="M120 159H230M300 159H410M480 159H590M120 297H230"/></g><g font-size="23"><text x="28" y="167">Δ</text><text x="28" y="305">0</text><text x="148" y="200">1/6</text><text x="328" y="200">1/6</text><text x="508" y="200">1/6</text><text x="148" y="336">1/2</text></g><text x="300" y="260" font-size="23">p do nível excitado = 1/2</text><text x="28" y="382" font-size="15">Exemplo ideal próprio. Barras são energias, não trajetórias ou taxas.</text></g></svg>