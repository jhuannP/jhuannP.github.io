<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-labelledby="title desc"><title id="title">Três cristas, duas séries de instantes</title><desc id="desc">Diagrama posição tempo. Fonte avança para a direita a sessenta metros por segundo e observador vem para a esquerda a trinta. Três raios sonoros a trezentos metros por segundo ligam emissões 0, um vinte avos e um décimo segundo a chegadas quatro onze avos, dois quintos e vinte quatro cinquenta cinco avos. Intervalo de chegada dois cinquenta cinco avos segundo.</desc><rect width="720" height="530" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="28" y="38" font-size="24" font-weight="bold">Emitir não é receber.</text><text x="28" y="69" font-size="16">c=300 m/s · fonte +60 m/s · observador −30 m/s</text><text x="28" y="94" font-size="16">Fonte emite 20 cristas/s; observador recebe 27,5 cristas/s</text><path d="M65 125H650M65 125V458" stroke="#84908c" fill="none"/><text x="565" y="117" font-size="15">posição x (m)</text><text x="12" y="481" font-size="15">t (s) ↓</text><path d="M85.0 140.0L211.0 440.0" stroke="#b65d2b" stroke-width="3"/><path d="M589.0 140.0L526.0 440.0" stroke="#20625a" stroke-width="3"/><path d="M85.0 140.0L543.1818181818182 358.1818181818182" stroke="#4b56ba" stroke-width="2"/><circle cx="85.0" cy="140.0" r="4" fill="#b65d2b"/><circle cx="543.1818181818182" cy="358.1818181818182" r="4" fill="#20625a"/><text x="555.1818181818182" y="363.1818181818182" font-size="16">4/11 s</text><path d="M97.6 170.0L538.6 380.0" stroke="#4b56ba" stroke-width="2"/><circle cx="97.6" cy="170.0" r="4" fill="#b65d2b"/><circle cx="538.6" cy="380.0" r="4" fill="#20625a"/><text x="550.6" y="385.0" font-size="16">2/5 s</text><path d="M110.2 200.0L534.0181818181818 401.8181818181818" stroke="#4b56ba" stroke-width="2"/><circle cx="110.2" cy="200.0" r="4" fill="#b65d2b"/><circle cx="534.0181818181818" cy="401.8181818181818" r="4" fill="#20625a"/><text x="546.0181818181818" y="406.8181818181818" font-size="16">24/55 s</text><text x="16" y="145" font-size="14">0 s</text><text x="8" y="175" font-size="14">1/20 s</text><text x="8" y="205" font-size="14">1/10 s</text><text x="76" y="470" font-size="17">Fonte</text><text x="474" y="470" font-size="17">Observador</text><text x="28" y="508" font-size="15">Cenário sintético · linhas azuis: cristas, não partículas do ar.</text></g></svg>