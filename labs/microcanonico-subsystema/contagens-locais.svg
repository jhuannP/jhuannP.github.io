<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" role="img" aria-labelledby="title desc"><title id="title">Estados globais por número de excitações locais</title><desc id="desc">Oito sítios, três excitações totais, subsistema de três sítios. Para zero, uma, duas e três excitações locais, há respectivamente dez, trinta, quinze e um dos cinquenta e seis microestados globais acessíveis. As probabilidades são essas contagens divididas por cinquenta e seis.</desc><rect width="360" height="450" fill="#faf9f2"/><g font-family="Arial,sans-serif" fill="#22271b" text-anchor="middle"><text x="180" y="27" font-size="19" font-weight="bold">Energia total fixa; energia local variável</text><text x="180" y="54" font-size="16">N = 8 · q = 3 · subsistema: a = 3</text><text x="180" y="81" font-size="16">Contagem de microestados globais</text><g stroke="#d0d2c8" stroke-width="1"><path d="M45 350 H330 M45 280 H330 M45 210 H330 M45 140 H330"/></g><g font-size="15" text-anchor="end"><text x="37" y="355">0</text><text x="37" y="285">10</text><text x="37" y="215">20</text><text x="37" y="145">30</text></g><g fill="#55594c"><rect x="59" y="280" width="40" height="70"/><rect x="199" y="245" width="40" height="105"/><rect x="269" y="343" width="40" height="7"/></g><rect x="129" y="140" width="40" height="210" fill="#2447ae"/><g font-size="18"><text x="79" y="269">10</text><text x="149" y="129">30</text><text x="219" y="234">15</text><text x="289" y="332">1</text><text x="79" y="378">0</text><text x="149" y="378">1</text><text x="219" y="378">2</text><text x="289" y="378">3</text></g><text x="180" y="405" font-size="16">X: excitações no subsistema</text><text x="180" y="435" font-size="17">P(X = 1) = 30/56 = 15/28</text></g></svg>