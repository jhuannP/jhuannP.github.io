<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title desc"><title id="title">Três perguntas no priming de uma célula T</title><desc id="desc">Reconhecimento específico pelo TCR do complexo peptídeo MHC; coestimulação exemplificada por CD28 e B7; contexto de citocinas influenciando diferenciação. Reconhecimento, expansão e função efetora são processos distintos. Não é uma porta lógica que prediz destinos celulares.</desc>
<rect width="520" height="520" fill="#f7f4eb"/>
<g fill="#182e38" font-family="sans-serif" font-size="22"><text x="20" y="35" font-size="26">Ativação de T: três perguntas</text><text x="20" y="73" font-size="20">Recorte de uma célula T virgem e sua APC</text></g>
<g stroke="#b4c2b9" stroke-width="1"><path d="M20 94H500 M20 216H500 M20 338H500 M20 460H500"/></g>
<g fill="#182e38" font-family="sans-serif" font-size="22"><text x="20" y="129" fill="#176153">1 · Qual ligante foi reconhecido?</text><text x="40" y="166">TCR ↔ peptídeo:MHC</text><text x="40" y="198" font-size="20">Especificidade; não basta para toda a resposta</text><text x="20" y="251" fill="#176153">2 · Houve coestimulação?</text><text x="40" y="288">Exemplo: CD28 ↔ B7</text><text x="40" y="320" font-size="20">Contribui para sobrevivência e expansão</text><text x="20" y="373" fill="#176153">3 · Qual o contexto de citocinas?</text><text x="40" y="410">Sinais recebidos e estado da célula</text><text x="40" y="442" font-size="20">Influenciam a diferenciação funcional</text><text x="20" y="498" font-size="22">Reconhecer ≠ expandir ≠ exercer função efetora</text></g></svg>
