<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" aria-labelledby="title desc"><title id="title">Uma observação e dois resumos</title><desc id="desc">Dados um, dois, três, quatro, dez têm média quatro e mediana três. Substituir dez por cem aumenta a média para vinte e dois, conservando a mediana três neste caso. A média aumenta noventa dividido por cinco, dezoito.</desc><rect width="520" height="390" fill="#f6f3eb"/><g font-family="sans-serif" fill="#172845"><text x="20" y="40" font-size="28" font-weight="bold">Tempos hipotéticos • minutos</text><g font-size="24"><text x="20" y="96">Dados</text><text x="300" y="96">Média</text><text x="400" y="96">Mediana</text></g><path d="M20 113 H500 M20 232 H500" stroke="#264bb5" stroke-width="2"/><g font-size="25"><text x="20" y="157">1,2,3,4,10</text><text x="320" y="157">4</text><text x="435" y="157">3</text><text x="20" y="210">1,2,3,4,100</text><text x="310" y="210">22</text><text x="435" y="210">3</text></g><text x="20" y="282" font-size="25">Uma observação muda em +90.</text><text x="20" y="326" font-size="26" fill="#264bb5">Média muda em 90/5 = +18.</text><text x="20" y="372" font-size="24">Mediana fica 3 neste exemplo.</text></g></svg>
