<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><title>Três somas na mesma malha</title><desc>Incrementos um meio, menos um quarto e três quartos produzem soma esquerda um dezesseis avos, trapezoidal um meio e direita quinze dezesseis avos. Cada diferença adjacente é sete dezesseis avos. A soma dos quadrados é sete oitavos, não um tempo fixado.</desc><rect width="900" height="500" fill="#f5f3eb"/><g font-family="sans-serif" fill="#252720"><text x="35" y="40" font-size="24">Mesmos incrementos, avaliações diferentes</text><text x="35" y="74" font-size="17">Δw = (1/2, −1/4, 3/4) · w₀ = 0 · valores adimensionais</text><path d="M210,340 H820" stroke="#666"/><g stroke="#d8d6cd"><path d="M210,130 V340 M360,130 V340 M510,130 V340 M660,130 V340 M810,130 V340"/></g><text x="35" y="165" font-size="20">Esquerda</text><rect x="210" y="140" width="37.5" height="34" fill="#245a50"/><text x="265" y="165" font-size="20">1/16</text><text x="35" y="235" font-size="20">Trapezoidal</text><rect x="210" y="210" width="300" height="34" fill="#635485"/><text x="530" y="235" font-size="20">1/2</text><text x="35" y="305" font-size="20">Direita</text><rect x="210" y="280" width="562.5" height="34" fill="#8b552f"/><text x="785" y="305" font-size="20">15/16</text><text x="205" y="365">0</text><text x="345" y="365">1/4</text><text x="495" y="365">1/2</text><text x="645" y="365">3/4</text><text x="805" y="365">1</text><text x="35" y="420" font-size="20">Trapezoidal − esquerda = direita − trapezoidal = 7/16.</text><text x="35" y="462" font-size="18">Identidades de números fornecidos; não é uma trajetória browniana validada.</text></g></svg>