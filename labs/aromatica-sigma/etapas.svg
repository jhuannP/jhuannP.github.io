<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" role="img" aria-labelledby="t d"><title id="t">Perder e recuperar aromaticidade</title><desc id="d">Anel com H recebe E e forma intermediário sigma com H e E no mesmo carbono. Retirar H como próton restaura o anel e mantém E. Um contribuinte por etapa.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285e58"/></marker></defs><rect width="420" height="600" fill="#f6f3e9"/><g font-family="system-ui,sans-serif" fill="#183c36"><text x="22" y="32" font-size="20" font-weight="700">Perder e recuperar aromaticidade</text><text x="22" y="63" font-size="17" font-weight="650">1. Anel inicial</text><polygon points="165.00,120.00 142.50,81.03 97.50,81.03 75.00,120.00 97.50,158.97 142.50,158.97" fill="none" stroke="#285e58" stroke-width="2"/><path d="M157.80 120.00L138.90 87.26" stroke="#285e58" stroke-width="2"/><path d="M101.10 87.26L82.20 120.00" stroke="#285e58" stroke-width="2"/><path d="M101.10 152.74L138.90 152.74" stroke="#285e58" stroke-width="2"/><path d="M165 120H195" stroke="#285e58" stroke-width="2"/><text x="200" y="126" font-size="17">H</text><text x="245" y="125" font-size="15">aromático</text><text x="22" y="243" font-size="17" font-weight="650">2. Complexo sigma</text><polygon points="165.00,300.00 142.50,261.03 97.50,261.03 75.00,300.00 97.50,338.97 142.50,338.97" fill="none" stroke="#285e58" stroke-width="2"/><path d="M101.10 267.26L82.20 300.00" stroke="#285e58" stroke-width="2"/><path d="M101.10 332.74L138.90 332.74" stroke="#285e58" stroke-width="2"/><path d="M165 300L195 279M165 300L195 321" stroke="#285e58" stroke-width="2"/><text x="200" y="281" font-size="17">H</text><text x="200" y="327" font-size="17">E</text><text x="157" y="261" font-size="20">+</text><text x="238" y="293" font-size="15">não aromático</text><text x="238" y="318" font-size="15">carga total +1</text><text x="22" y="423" font-size="17" font-weight="650">3. Produto de substituição</text><polygon points="165.00,480.00 142.50,441.03 97.50,441.03 75.00,480.00 97.50,518.97 142.50,518.97" fill="none" stroke="#285e58" stroke-width="2"/><path d="M157.80 480.00L138.90 447.26" stroke="#285e58" stroke-width="2"/><path d="M101.10 447.26L82.20 480.00" stroke="#285e58" stroke-width="2"/><path d="M101.10 512.74L138.90 512.74" stroke="#285e58" stroke-width="2"/><path d="M165 480H195" stroke="#285e58" stroke-width="2"/><text x="200" y="486" font-size="17">E</text><text x="245" y="485" font-size="15">aromático</text><path d="M120 178V215M120 358V395" stroke="#285e58" stroke-width="2" marker-end="url(#a)"/><text x="147" y="201" font-size="15">ataque a E⁺</text><text x="147" y="381" font-size="15">base retira H⁺</text><text x="22" y="552" font-size="14">C₁ mantém E e perde H na etapa final.</text><text x="22" y="578" font-size="12">Setas verticais: etapas · demais H omitidos · esquema formal</text></g></svg>