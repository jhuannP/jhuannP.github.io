<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" role="img" aria-labelledby="title desc">
<title id="title">Prótons: bombear custa, retornar libera energia</title>
<desc id="desc">O lado P, espaço intermembrana, está acima; a matriz N abaixo. No exemplo sintético, P tem pH sete e potencial zero; N tem pH oito e potencial menos zero vírgula quinze volt. Uma seta sobe de N para P, representando bombeamento que usa energia. Outra desce de P para N, representando retorno favorável que pode ser acoplado à síntese de ATP. Não são fluxos medidos.</desc>
<defs><marker id="up" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#20221e"/></marker><marker id="down" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2348db"/></marker></defs>
<rect width="420" height="500" fill="#f4f3eb"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#20221e">
<text x="210" y="36" font-size="22">Prótons: custo e retorno</text>
<text x="210" y="82" font-size="21">P · espaço intermembrana</text>
<text x="210" y="113" font-size="19">pH = 7; ψ = 0 V</text>
<rect x="25" y="199" width="370" height="30" fill="#d3d7c9"/>
<text x="210" y="220" font-size="17">membrana interna</text>
<path d="M86 302V145" fill="none" stroke="#20221e" stroke-width="3" marker-end="url(#up)"/>
<path d="M334 145V302" fill="none" stroke="#2348db" stroke-width="3" marker-end="url(#down)"/>
<text x="86" y="333" font-size="20">N → P</text><text x="334" y="333" font-size="20" fill="#2348db">P → N</text>
<text x="86" y="358" font-size="16">bombeamento</text><text x="334" y="358" font-size="16" fill="#2348db">retorno</text>
<text x="210" y="398" font-size="21">N · matriz</text>
<text x="210" y="429" font-size="19">pH = 8; ψ = −0,15 V</text>
<text x="210" y="468" fill="#2348db" font-size="20">Δμ(P→N) ≈ −20,216 kJ/mol H⁺</text>
<text x="210" y="492" font-size="14">Exemplo a 300 K; não representa fluxos medidos.</text>
</g></svg>
