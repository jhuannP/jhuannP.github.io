<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">A distância seleciona regiões</title><desc id="d">Para módulo de x menos3 menor ou igual a2,intervalo fechado de1 a5. Para módulo maior que2,duas regiões abertas com x menor que1 ou maior que5.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="40" font-size="25" font-weight="bold">Centro 3 • distância 2</text><text x="24" y="88" font-size="23">|x−3| ≤ 2: dentro, incluindo limites</text><path d="M50 144h460" stroke="#a7b4c8" fill="none"/><path d="M170 144H390" stroke="#2154a0" stroke-width="6" fill="none"/><circle cx="170" cy="144" r="6" fill="#2154a0"/><circle cx="390" cy="144" r="6" fill="#2154a0"/><path d="M280 136v16" stroke="#192e49"/><text x="165" y="181" font-size="22">1</text><text x="275" y="181" font-size="22">3</text><text x="385" y="181" font-size="22">5</text><text x="24" y="242" font-size="23">|x−3| &gt; 2: fora, sem os limites</text><path d="M50 299h460" stroke="#a7b4c8" fill="none"/><path d="M50 299H164 M396 299H510" stroke="#2154a0" stroke-width="6" fill="none"/><circle cx="170" cy="299" r="6" fill="#f4f6fa" stroke="#2154a0" stroke-width="2"/><circle cx="390" cy="299" r="6" fill="#f4f6fa" stroke="#2154a0" stroke-width="2"/><path d="M63 289L50 299L63 309 M497 289L510 299L497 309 M280 291v16" stroke="#2154a0" stroke-width="2" fill="none"/><text x="165" y="338" font-size="22">1</text><text x="275" y="338" font-size="22">3</text><text x="385" y="338" font-size="22">5</text><text x="24" y="385" font-size="21">x &lt; 1 ou x &gt; 5</text><text x="24" y="420" font-size="17">Uma união: basta pertencer a uma das regiões.</text></g></svg>