<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">Corrigir o deslocamento não muda a dispersão</title><desc id="d">Três leituras sintéticas 9,8; 10,0; 10,2 cm têm média 10,0 cm. Subtrair 0,3 cm de cada uma produz 9,5; 9,7; 9,9 cm e média 9,7 cm, preservando o desvio amostral de 0,2 cm.</desc><rect width="440" height="420" fill="#f2f1e7"/><g font-family="sans-serif" fill="#262722"><text x="24" y="30" font-size="18" font-weight="bold">Dispersão igual; média deslocada.</text><text x="24" y="58" font-size="14">Leituras sintéticas, não dados de bancada.</text><text x="24" y="106" font-size="17">Antes: média 10,0 cm</text><text x="24" y="225" font-size="17">Após subtrair b=0,3 cm: média 9,7 cm</text><g stroke="#666" stroke-width="1"><path d="M38 150H398 M38 269H398"/><path d="M38 145V155 M110 145V155 M182 145V155 M254 145V155 M326 145V155 M398 145V155 M38 264V274 M110 264V274 M182 264V274 M254 264V274 M326 264V274 M398 264V274"/></g><g fill="#273fbb"><circle cx="182" cy="150" r="6"/><circle cx="254" cy="150" r="7"/><circle cx="326" cy="150" r="6"/><circle cx="74" cy="269" r="6"/><circle cx="146" cy="269" r="7"/><circle cx="218" cy="269" r="6"/></g><g font-size="14" text-anchor="middle"><text x="182" y="133">9,8</text><text x="254" y="133">10,0</text><text x="326" y="133">10,2</text><text x="74" y="252">9,5</text><text x="146" y="252">9,7</text><text x="218" y="252">9,9</text><text x="38" y="176">9,4</text><text x="254" y="176">10,0</text><text x="398" y="176">10,4</text><text x="38" y="295">9,4</text><text x="254" y="295">10,0</text><text x="398" y="295">10,4</text></g><text x="24" y="341" font-size="15">Os dois eixos têm a mesma escala, em cm.</text><text x="24" y="368" font-size="15">A correção também possui incerteza própria.</text><text x="24" y="395" font-size="14">Os pontos não são intervalos de confiança.</text></g></svg>
