<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420"><title>Escolher uma transformação pela paridade</title><desc>Potências inteiras não negativas de seno e cosseno: reservar um fator de expoente ímpar ou reduzir potências pares.</desc><rect width="420" height="420" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="36" font-size="20" font-weight="700">Observe sinᵐx cosⁿx</text><text x="24" y="65" font-size="14">m, n inteiros não negativos; radianos</text><rect x="24" y="89" width="372" height="76" rx="8" fill="#dce8e1"/><text x="40" y="118" font-size="17" font-weight="700">m ímpar: reserve sin x dx</text><text x="40" y="146" font-size="16">u = cos x; du = −sin x dx</text><rect x="24" y="182" width="372" height="76" rx="8" fill="#e4e7ed"/><text x="40" y="211" font-size="17" font-weight="700">n ímpar: reserve cos x dx</text><text x="40" y="239" font-size="16">u = sin x; du = cos x dx</text><rect x="24" y="275" width="372" height="76" rx="8" fill="#e8e0ce"/><text x="40" y="304" font-size="17" font-weight="700">Ambos pares: reduza potências</text><text x="40" y="332" font-size="16">sin²x = (1 − cos 2x)/2</text><text x="24" y="386" font-size="14">Ambos ímpares? Os dois caminhos servem.</text><text x="24" y="407" font-size="12">Não é regra para toda função trigonométrica.</text></g></svg>
