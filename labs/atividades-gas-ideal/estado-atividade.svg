<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 490" role="img" aria-labelledby="title desc"><title id="title">Inventário e atividade no gás ideal</title><desc id="desc">Reação A para dois B. Pressão total igual à pressão padrão. Fração dissociada um meio. A: meio mol e atividade um terço. B: um mol e atividade dois terços. Total de um mol e meio. Q igual a quatro terços, escolhido igual a K.</desc><rect width="430" height="490" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="36" font-size="24" font-weight="bold">A ⇌ 2 B · gás ideal</text><text x="22" y="70" font-size="20">P/p° = 1 · x = 1/2</text><path d="M22 94H408" stroke="#aab7ae"/><text x="22" y="119" font-size="21" font-weight="bold">Espécie A</text><text x="22" y="154" font-size="22">n_A = 1/2 mol</text><text x="22" y="189" font-size="22">y_A = a_A = 1/3</text><path d="M22 229H408" stroke="#aab7ae"/><text x="22" y="254" font-size="21" font-weight="bold">Espécie B</text><text x="22" y="289" font-size="22">n_B = 1 mol</text><text x="22" y="324" font-size="22">y_B = a_B = 2/3</text><path d="M22 365H408" stroke="#aab7ae"/><text x="22" y="404" font-size="24" font-weight="bold">Q = (2/3)² / (1/3) = 4/3</text><text x="22" y="442" font-size="19">K escolhido: 4/3 · Q = K</text><text x="22" y="473" font-size="18">Atividades e quociente sem unidade.</text></g></svg>