<svg xmlns="http://www.w3.org/2000/svg" width="520" height="480" viewBox="0 0 520 480" role="img" aria-labelledby="title desc"><title id="title">Área não é altura</title><desc id="desc">Modelo de duas janelas retangulares artificiais no eixo de deslocamento químico, que diminui de quatro para zero ppm da esquerda para a direita. A está em três ppm, largura zero vírgula quatro, altura sete vírgula cinco, área três. B está em um ppm, largura zero vírgula oito, altura dois vírgula cinco, área dois. Alturas na razão três para um e áreas três para dois.</desc>
<rect width="520" height="480" fill="#f7f4eb"/>
<g fill="#182e38" font-family="sans-serif" font-size="21"><text x="20" y="34" font-size="26">Área não é altura</text><text x="20" y="68">Janelas artificiais; não são linhas reais de RMN</text><text x="20" y="99" font-size="19">altura (u.a./ppm)</text></g>
<g stroke="#b7c3bb" stroke-width="1" stroke-dasharray="4 4"><path d="M80 120H480 M80 180H480 M80 240H480"/></g>
<path d="M80 110V300H490" fill="none" stroke="#182e38" stroke-width="1.5"/>
<g fill="#cfe0d8" stroke="#176153" stroke-width="2"><rect x="160" y="120" width="40" height="180"/><rect x="340" y="240" width="80" height="60"/></g>
<g fill="#182e38" font-family="sans-serif" font-size="21"><text x="171" y="112">A</text><text x="371" y="232">B</text><text x="36" y="127">7,5</text><text x="52" y="187">5</text><text x="36" y="247">2,5</text><text x="52" y="306">0</text><text x="74" y="329">4</text><text x="174" y="329">3</text><text x="274" y="329">2</text><text x="374" y="329">1</text><text x="474" y="329">0</text><text x="243" y="360">δ (ppm)</text><text x="20" y="395" font-size="20">A: δ = 3 ppm · largura 0,4 · altura 7,5</text><text x="20" y="427" font-size="20">B: δ = 1 ppm · largura 0,8 · altura 2,5</text><text x="20" y="463" font-size="24" fill="#176153">Áreas 3:2 · alturas 3:1</text></g></svg>
