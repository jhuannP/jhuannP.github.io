<svg xmlns="http://www.w3.org/2000/svg" width="620" height="410" viewBox="0 0 620 410" role="img" aria-labelledby="t desc"><title id="t">Mesma média, respostas diferentes no modelo</title><desc id="desc">Três padrões de intensidade têm média1, mas contrastes0,1,5 e menos1,5. As taxas ON e OFF são10e10,25e0,0e25 por segundo. Dados artificiais.</desc><rect width="620" height="410" fill="#faf8f0"/><g font-family="sans-serif" fill="#203044"><text x="28" y="35" font-size="22" font-weight="bold">Distribuição espacial também importa</text><text x="28" y="64" font-size="15">Intensidades relativas · b = 10 s⁻¹ · g = 10 s⁻¹ por unidade</text><text x="28" y="105" font-size="16">Esquerda | centro | direita</text><text x="370" y="105" font-size="16">D</text><text x="442" y="105" font-size="16">ON / OFF (s⁻¹)</text><g stroke="#87909a"><rect x="35" y="125" width="90" height="52" fill="#a6a6a6"/><rect x="125" y="125" width="90" height="52" fill="#a6a6a6"/><rect x="215" y="125" width="90" height="52" fill="#a6a6a6"/><rect x="35" y="211" width="90" height="52" fill="#777"/><rect x="125" y="211" width="90" height="52" fill="#fff"/><rect x="215" y="211" width="90" height="52" fill="#777"/><rect x="35" y="297" width="90" height="52" fill="#ddd"/><rect x="125" y="297" width="90" height="52" fill="#222"/><rect x="215" y="297" width="90" height="52" fill="#ddd"/></g><g font-size="18"><text x="70" y="158">1</text><text x="165" y="158">1</text><text x="255" y="158">1</text><text x="60" y="244" fill="white">0,5</text><text x="165" y="244">2</text><text x="245" y="244" fill="white">0,5</text><text x="60" y="330">1,5</text><text x="165" y="330" fill="white">0</text><text x="245" y="330">1,5</text><text x="370" y="158">0</text><text x="450" y="158">10 / 10</text><text x="365" y="244">1,5</text><text x="450" y="244">25 / 0</text><text x="356" y="330">−1,5</text><text x="450" y="330">0 / 25</text></g><text x="28" y="387" font-size="15">Modelo prescrito; não são registros de neurônios ou percepção.</text></g></svg>