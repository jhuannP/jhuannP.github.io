<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="title desc"><title id="title">Trocar a ordem altera a saída</title><desc id="desc">A dobra a primeira coordenada e B soma a segunda à primeira. Começando em zero um, aplicar B e depois A dá dois um. Aplicar A e depois B dá um um. São as saídas de AB e BA no mesmo vetor, não trajetórias temporais físicas.</desc><rect width="480" height="530" fill="#f7f4ec"/><g font-family="Georgia,serif" fill="#202b29"><text x="28" y="44" font-size="25">Mesmos blocos. Outra ordem.</text><text x="28" y="82" font-size="18">A(x,y)=(2x,y) · B(x,y)=(x+y,y)</text><path d="M28 108H452 M28 290H452 M28 466H452" stroke="#89938b"/><text x="28" y="150" font-size="24" fill="#265e50">AB · primeiro B, depois A</text><text x="28" y="200" font-size="23">(0,1) → B → (1,1)</text><text x="28" y="249" font-size="23">(1,1) → A → (2,1)</text><text x="28" y="332" font-size="24" fill="#265e50">BA · primeiro A, depois B</text><text x="28" y="382" font-size="23">(0,1) → A → (0,1)</text><text x="28" y="431" font-size="23">(0,1) → B → (1,1)</text><text x="28" y="506" font-size="18">Um vetor separa as duas aplicações.</text></g></svg>