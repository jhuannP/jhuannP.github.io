<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc"><title id="title">Intervalos bootstrap exatos e cobertura de coleta</title><desc id="desc">Três Bernoullis com p um quarto. Contagens zero e três dão intervalos pontuais que não contêm p. Contagens um e dois dão intervalo zero a um e somam probabilidade36 sobre64. Cobertura56,25%, nominal95%.</desc><rect width="760" height="540" fill="#f3f1e5"/><g font-family="Arial,sans-serif" fill="#263b38"><text x="38" y="42" font-size="23" font-weight="bold">Exato no bootstrap não significa cobertura de 95%.</text><text x="38" y="74" font-size="17">Modelo próprio: n = 3, p = 1/4 · percentis 2,5% e 97,5%</text><text x="38" y="112" font-size="17">Contagem K</text><text x="553" y="112" font-size="17">Massa na coleta</text><path d="M240 134V397 M314 134V397" stroke="#737d73" stroke-dasharray="6 6"/><text x="229" y="426" font-size="17">0</text><text x="294" y="426" font-size="17">p = 1/4</text><text x="527" y="426" font-size="17">1</text><g font-size="18"><text x="58" y="169">0</text><text x="58" y="241">1</text><text x="58" y="313">2</text><text x="58" y="385">3</text><text x="584" y="169">27/64</text><text x="584" y="241">27/64</text><text x="584" y="313">9/64</text><text x="584" y="385">1/64</text></g><g stroke="#38635a" stroke-width="8" stroke-linecap="round"><path d="M240 235H536 M240 307H536"/></g><g fill="#a65a43"><circle cx="240" cy="163" r="7"/><circle cx="536" cy="379" r="7"/></g><text x="38" y="474" font-size="23" font-weight="bold">Contêm p: 27/64 + 9/64 = 9/16 = 56,25%</text><text x="38" y="508" font-size="16">Intervalos fechados, sem interpolação. Nenhuma coleta ou réplica simulada.</text></g></svg>