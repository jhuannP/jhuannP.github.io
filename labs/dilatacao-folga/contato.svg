<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430" role="img" aria-labelledby="t d"><title id="t">A folga fecha no primeiro contato</title><desc id="d">Esquema fora de escala. Pontas externas fixas,barras1m e0,5m,folga6mm. Aumento40K produz mudanças4mm e2mm e leva ao contato.</desc><rect width="420" height="430" fill="#f7f6ef"/><g font-family="Arial,sans-serif" fill="#242d26"><text x="24" y="33" font-size="21">Até onde a expansão é livre?</text><text x="24" y="59" font-size="14">Esquema fora de escala · pontas externas fixas</text><text x="24" y="100" font-size="17">Estado inicial · folga de 6 mm</text><g stroke="#6a7164" stroke-width="3"><path d="M30 120V175M390 120V175M30 260V315M390 260V315"/></g><rect x="30" y="134" width="160" height="27" fill="#3e4ca6"/><rect x="230" y="134" width="160" height="27" fill="#498064"/><path d="M190 171V186H230V171" fill="none" stroke="#596151"/><text x="210" y="210" text-anchor="middle" font-size="15">1 m à esquerda · 0,5 m à direita</text><text x="24" y="248" font-size="17">ΔT = 40 K · primeiro contato</text><rect x="30" y="274" width="187" height="27" fill="#3e4ca6"/><rect x="217" y="274" width="173" height="27" fill="#498064"/><path d="M217 306V327" stroke="#2b3027"/><text x="24" y="357" font-size="16">Esquerda: +4 mm · direita: +2 mm</text><text x="24" y="390" font-size="15">Depois do contato, é preciso outro modelo.</text><text x="24" y="417" font-size="14">Sem cálculo de forças ou sobreposição física.</text></g></svg>
