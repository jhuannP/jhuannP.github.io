<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610"><desc>Comparação a partir do centro do intervalo de zero a dois com D igual a meio. Browniano e passeios com dois,quatro e oito intervalos têm média um. Variâncias são dois terços,zero,meio e cinco oitavos,respectivamente.</desc><rect width="600" height="610" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">A média concorda; a dispersão não</text><text x="30" y="78" font-size="17">Intervalo [0,2] · x₀=1 · D=1/2</text><text x="30" y="134" font-size="18">Modelo</text><text x="330" y="134" font-size="18">E[τ]</text><text x="440" y="134" font-size="18">Var(τ)</text><path d="M30 151h540M30 221h540M30 291h540M30 361h540M30 431h540" stroke="#bdc0c9"/><g font-size="20"><text x="30" y="196">Browniano</text><text x="348" y="196">1</text><text x="462" y="196">2/3</text><text x="30" y="266">Passeio: m=2</text><text x="348" y="266">1</text><text x="462" y="266">0</text><text x="30" y="336">Passeio: m=4</text><text x="348" y="336">1</text><text x="462" y="336">1/2</text><text x="30" y="406">Passeio: m=8</text><text x="348" y="406">1</text><text x="462" y="406">5/8</text></g><text x="30" y="484" font-size="17">Passo temporal do passeio: Δt=(2/m)²/(2D).</text><text x="30" y="526" font-size="17">Unidades: média em tempo; variância em tempo².</text><text x="30" y="568" font-size="17">Referências analíticas, sem amostra experimental.</text></g></svg>