<svg xmlns="http://www.w3.org/2000/svg" width="480" height="610" viewBox="0 0 480 610" role="img" aria-labelledby="title desc">
<title id="title">A fase relativa muda a probabilidade na metade esquerda</title><desc id="desc">Superposição coerente igual dos modos um e dois de um poço. Tempo adimensional tau igual a E um vezes t dividido por h barra. Em tau zero, probabilidade à esquerda 0,9244; em pi sobre seis, 0,5; em pi sobre três, 0,0756. A normalização total é um e os pesos de energia são um meio em todos os instantes. Barras dividem as probabilidades de esquerda e direita.</desc>
<rect width="480" height="610" fill="#f7f4ec"/><g font-family="Georgia,serif" fill="#202b29">
<text x="28" y="43" font-size="25">Fases mudam. A norma fica.</text><text x="28" y="80" font-size="18">τ=E₁t/ℏ · coeficientes iniciais iguais</text><path d="M28 105H452 M28 482H452" stroke="#89938b"/>
<text x="28" y="147" font-size="21">τ=0 · P(esquerda)≈0,9244</text><rect x="28" y="165" width="369.765" height="32" fill="#265e50"/><rect x="397.765" y="165" width="30.235" height="32" fill="#b6beb5"/>
<text x="28" y="259" font-size="21">τ=π/6 · P(esquerda)=1/2</text><rect x="28" y="277" width="200" height="32" fill="#265e50"/><rect x="228" y="277" width="200" height="32" fill="#b6beb5"/>
<text x="28" y="371" font-size="21">τ=π/3 · P(esquerda)≈0,0756</text><rect x="28" y="389" width="30.235" height="32" fill="#265e50"/><rect x="58.235" y="389" width="369.765" height="32" fill="#b6beb5"/>
<text x="28" y="454" font-size="17">Verde: esquerda · cinza: direita · total=1</text><text x="28" y="523" font-size="20">P(E₁)=P(E₂)=1/2 em todo instante</text><text x="28" y="560" font-size="18">Redistribuição não significa perda de norma.</text><text x="28" y="594" font-size="16">Modelo fechado ideal · não é trajetória da partícula</text></g></svg>