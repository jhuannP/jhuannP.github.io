<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680"><title>Um lote, dois pontos de entrada</title><desc>Quatro unidades de glicose um fosfato viram glicose seis fosfato sem gasto líquido de ATP nessa conversão. Uma glicose livre consome um ATP na hexocinase. As cinco unidades consomem cinco ATP na etapa PFK e geram vinte ATP brutos até dez lactatos, com saldo quatorze. Não inclui custo de sintetizar glicogênio.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b6558"/></marker></defs><rect width="640" height="680" fill="#f5f3eb"/><g font-family="sans-serif" fill="#252720"><text x="30" y="42" font-size="25">Produtos liberados: acompanhar o ATP</text><text x="30" y="76" font-size="17">Lote escolhido · glicólise clássica até lactato</text><text x="60" y="140" font-size="23">4 G1P</text><text x="390" y="140" font-size="23">1 glicose</text><path d="M120,160 V220 M450,160 V220" stroke="#4b6558" stroke-width="2" marker-end="url(#a)"/><text x="145" y="195" font-size="17">mutase</text><text x="470" y="188" font-size="17">hexocinase</text><text x="470" y="211" font-size="17">−1 ATP</text><text x="60" y="255" font-size="23">4 G6P</text><text x="390" y="255" font-size="23">1 G6P</text><path d="M120,275 V310 H320 V350 M450,275 V310 H320" stroke="#4b6558" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="155" y="390" font-size="23">5 unidades de seis carbonos</text><text x="180" y="429" font-size="20">PFK: gasto de 5 ATP</text><path d="M320,446 V489" stroke="#4b6558" stroke-width="2" marker-end="url(#a)"/><text x="135" y="525" font-size="23">10 lactatos · 20 ATP brutos</text><text x="140" y="580" font-size="26" fill="#514696">Saldo: 20 − 5 − 1 = 14 ATP</text><text x="30" y="640" font-size="17">Sem contabilizar armazenamento, transporte ou respiração.</text></g></svg>