<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" role="img" aria-labelledby="t d">
<title id="t">Quatro portas, três níveis</title><desc id="d">A e B alimentam OR e AND; AND alimenta NOT; OR e NOT alimentam AND final. As setas indicam dependência, não tempo.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#54554e"/></marker></defs>
<rect width="420" height="500" fill="#f7f6ef"/>
<g font-family="Arial,sans-serif" fill="#222824">
<text x="24" y="32" font-size="21">Quatro portas, três níveis</text>
<text x="24" y="57" font-size="14">Setas mostram dependências lógicas.</text>
<g stroke="#54554e" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M125 106L100 159"/><path d="M125 106L295 159"/><path d="M295 106L125 159"/><path d="M295 106L310 159"/><path d="M300 211L300 262"/><path d="M110 211L110 366L244 366"/><path d="M300 310L300 342"/></g>
<g fill="#edece3" stroke="#797d70"><rect x="90" y="80" width="70" height="30" rx="4"/><rect x="260" y="80" width="70" height="30" rx="4"/><rect x="55" y="161" width="110" height="50" rx="4"/><rect x="245" y="161" width="110" height="50" rx="4"/><rect x="245" y="262" width="110" height="48" rx="4"/><rect x="245" y="342" width="110" height="48" rx="4"/></g>
<g text-anchor="middle" font-size="18"><text x="125" y="101">A</text><text x="295" y="101">B</text><text x="110" y="192">u · OR</text><text x="300" y="192">v · AND</text><text x="300" y="292">w · NOT</text><text x="300" y="373">z · AND</text></g>
<g font-size="14" fill="#545b53"><text x="24" y="143">Nível 1</text><text x="24" y="288">Nível 2</text><text x="24" y="346">Nível 3</text></g>
<text x="24" y="436" font-size="18" fill="#3445a3">z = (A OR B) AND NOT(A AND B)</text>
<text x="24" y="467" font-size="14">Nível não é nanossegundo nem ciclo de clock.</text>
</g></svg>
