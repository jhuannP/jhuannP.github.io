<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img" aria-labelledby="t d"><title id="t">A passagem por zero preserva o ângulo</title><desc id="d">Uma reta angular local mostra vinte e três, vinte e três e meia, zero e meia hora. TSL é zero e ascensão reta vinte e três e meia horas. A diferença bruta menos vinte e três e meia é equivalente a mais meia hora após adicionar uma volta de vinte e quatro horas.</desc><rect width="440" height="390" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="20" y="30" font-size="20" font-weight="bold">Passar por 0h não muda o céu.</text><text x="20" y="61" font-size="16">Uma volta angular: 24h = 360°.</text><text x="104" y="126" font-size="17">α=23,5h</text><text x="219" y="126" font-size="17">TSL=0h</text><path d="M50 190H380 M50 184V196 M150 184V196 M250 184V196 M350 184V196" stroke="#777b70" fill="none"/><path d="M150 160H250 M242 154L250 160L242 166" stroke="#2448bc" stroke-width="3" fill="none"/><g font-size="16"><text x="169" y="150" fill="#2448bc">+0,5h</text><text x="35" y="224">23h</text><text x="125" y="224">23,5h</text><text x="238" y="224">0h</text><text x="330" y="224">0,5h</text><text x="20" y="275">Diferença bruta: 0h − 23,5h = −23,5h.</text><text x="20" y="307">Somar 24h dá H=+0,5h = +7,5°.</text><text x="20" y="345">Ramo escolhido para H: [−12h,+12h).</text><text x="20" y="376">Reta angular local; não é hora civil.</text></g></g></svg>