<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d"><title id="t">A projeção muda com o produto interno</title><desc id="d">Na reta y=x,o vetor b=(2,0)projeta em(1,1)no produto usual e em(0,4;0,4)na métrica diag(1,4). O segmento do resíduo ponderado não é perpendicular usual à reta.</desc><rect width="680" height="420" fill="#f7f5ed"/><g font-family="Arial,sans-serif" fill="#1e292c"><text x="30" y="37" font-size="25">Mesma reta, duas noções de distância</text><text x="30" y="71" font-size="18">G = diag(1,4) dá mais peso ao erro na segunda coordenada.</text><path d="M80 105V340H380 M80 340L330 90" fill="none" stroke="#8a9690" stroke-width="2"/><path d="M280 340L180 240" stroke="#998470" stroke-width="3" stroke-dasharray="7 5"/><path d="M280 340L120 300" stroke="#304bcb" stroke-width="4"/><circle cx="280" cy="340" r="6" fill="#1e292c"/><circle cx="180" cy="240" r="6" fill="#998470"/><circle cx="120" cy="300" r="6" fill="#304bcb"/><text x="275" y="372" font-size="19">b = (2,0)</text><text x="350" y="112" font-size="18">reta: y = x</text><text x="350" y="165" font-size="20" fill="#998470">Usual: (1,1)</text><text x="350" y="202" font-size="20" fill="#304bcb">Em G: (0,4; 0,4)</text><text x="350" y="251" font-size="18">rᵀG u = 0</text><text x="350" y="281" font-size="18">r · u = 6/5 ≠ 0</text><text x="30" y="403" font-size="16">Desenho em coordenadas usuais; ângulo visual não mede ortogonalidade em G.</text></g></svg>