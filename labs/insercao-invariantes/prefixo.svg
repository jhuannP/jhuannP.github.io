<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Um prefixo ordenado cresce a cada inserção</title><desc id="desc">Lista inicial quatro, um, três, dois. Após inserir um, temos um, quatro, três, dois. Após inserir três, um, três, quatro, dois. Após inserir dois, um, dois, três, quatro. Prefixos de comprimentos dois, três e quatro são destacados com linha; há respectivamente um, um e dois deslocamentos.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="28" y="43" font-size="24">Organizar sem perder itens</text><text x="28" y="76" font-size="16">Lista original: [4, 1, 3, 2]</text>
<text x="28" y="132" font-size="17">Inserir 1 • 1 deslocamento</text><text x="50" y="177" font-size="29">1</text><text x="144" y="177" font-size="29">4</text><text x="238" y="177" font-size="29">3</text><text x="332" y="177" font-size="29">2</text><path d="M42 194H180" stroke="#386b9b" stroke-width="5"/>
<text x="28" y="259" font-size="17">Inserir 3 • 1 deslocamento</text><text x="50" y="304" font-size="29">1</text><text x="144" y="304" font-size="29">3</text><text x="238" y="304" font-size="29">4</text><text x="332" y="304" font-size="29">2</text><path d="M42 321H274" stroke="#386b9b" stroke-width="5"/>
<text x="28" y="386" font-size="17">Inserir 2 • 2 deslocamentos</text><text x="50" y="431" font-size="29">1</text><text x="144" y="431" font-size="29">2</text><text x="238" y="431" font-size="29">3</text><text x="332" y="431" font-size="29">4</text><path d="M42 448H368" stroke="#386b9b" stroke-width="5"/>
<text x="28" y="505" font-size="15">Linha azul: prefixo já ordenado.</text><text x="28" y="536" font-size="15">Total: 4 deslocamentos • 6 comparações.</text></g></svg>