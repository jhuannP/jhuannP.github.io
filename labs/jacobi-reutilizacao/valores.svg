<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">Qual x₁ entra na segunda conta?</title><desc id="desc">Primeiro passo do sistema 4x um mais x dois igual um, x um mais 3x dois igual dois. De zero, os dois métodos calculam x um novo igual um quarto. Jacobi usa o x um antigo zero e Gauss–Seidel usa o novo um quarto para calcular x dois.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="38" font-size="25" font-weight="bold">Qual x₁ entra na segunda conta?</text><text x="24" y="76" font-size="20">4x₁ + x₂ = 1; x₁ + 3x₂ = 2</text><text x="24" y="110" font-size="20">Início comum: (0,0)</text><path d="M24 132h512" stroke="#aab7c9"/><text x="28" y="172" font-size="24" font-weight="bold">Jacobi</text><text x="315" y="172" font-size="24" font-weight="bold">Gauss–Seidel</text><text x="28" y="215" font-size="20">x₁ novo = 1/4</text><text x="315" y="215" font-size="20">x₁ novo = 1/4</text><text x="28" y="264" font-size="21" fill="#2154a0">Usa x₁ antigo = 0</text><text x="315" y="264" font-size="21" fill="#2154a0">Usa x₁ novo = 1/4</text><path d="M128 278v28m0 0l-6 -8m6 8l6 -8M415 278v28m0 0l-6 -8m6 8l6 -8" stroke="#2154a0" stroke-width="2" fill="none"/><text x="28" y="342" font-size="22">x₂ = (2−0)/3</text><text x="315" y="342" font-size="22">x₂ = (2−1/4)/3</text><text x="28" y="386" font-size="28" font-weight="bold">x₂ = 2/3</text><text x="315" y="386" font-size="28" font-weight="bold">x₂ = 7/12</text><text x="24" y="421" font-size="17">A ordem e a informação usada fazem parte do método.</text></g></svg>