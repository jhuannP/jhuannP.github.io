<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Carbono e NADPH por fases</title><desc id="desc">Três glicose seis fosfato somam dezoito carbonos. A fase oxidativa gera três pentoses de cinco carbonos, três CO2 e seis NADPH. O rearranjo das três pentoses dá duas frutose seis fosfato e um gliceraldeído três fosfato, mantendo quinze carbonos orgânicos. O rearranjo não gera NADPH adicional.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="26" y="42" font-size="24">Duas fases, contas distintas</text><text x="26" y="82" font-size="18">3 G6P • 18 carbonos do substrato</text><path d="M55 102V154M48 145L55 154L62 145" stroke="#386b9b" stroke-width="3" fill="none"/><text x="79" y="121" font-size="16">Fase oxidativa</text><text x="79" y="150" font-size="16">Consome 6 NADP⁺ → forma 6 NADPH</text>
<text x="26" y="200" font-size="20">3 pentoses (15 C) + 3 CO₂ (3 C)</text><path d="M55 221V287M48 278L55 287L62 278" stroke="#386b9b" stroke-width="3" fill="none"/><text x="79" y="245" font-size="16">Rearranjo não oxidativo</text><text x="79" y="275" font-size="16">Sem NADPH adicional neste bloco</text>
<text x="26" y="334" font-size="21">2 F6P (12 C) + 1 GAP (3 C)</text><text x="26" y="381" font-size="18">Carbono final: 12 + 3 + 3 = 18</text><text x="26" y="428" font-size="18">NADPH final formado: 6</text><text x="26" y="493" font-size="14">Balanço reduzido de esqueletos e cofator.</text><text x="26" y="519" font-size="14">Não é equação molecular completa ou cinética.</text><text x="26" y="545" font-size="14">Fluxos propostos, não dados experimentais.</text></g></svg>