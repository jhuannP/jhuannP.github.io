<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"><title>Duas funções, duas combinações</title><desc>Níveis esquemáticos do modelo com alfa menos um, beta menos dois quintos e sobreposição um quinto. Estado simétrico tem energia menos sete sextos e antissimétrico menos três quartos. Não são energias de moléculas reais.</desc><rect width="600" height="600" fill="#f6f5ed"/><g font-family="Arial,sans-serif" fill="#202722"><text x="35" y="42" font-size="23">Simetria não dispensa normalização</text><text x="35" y="80" font-size="18">α = −1, β = −2/5, s = 1/5 · unidade de energia</text><path d="M70 400V145M64 157L70 145L76 157" fill="none" stroke="#707a71"/><text x="35" y="130" font-size="19">E</text><path d="M110 290H205M395 290H490" stroke="#707a71" stroke-width="3"/><path d="M245 380H355M245 155H355" stroke="#4843bb" stroke-width="4"/><path d="M205 290L245 380M355 380L395 290M205 290L245 155M355 155L395 290" stroke="#a2a79e" stroke-dasharray="5 5" fill="none"/><g font-size="18"><text x="115" y="320">φA: −1</text><text x="400" y="320">φB: −1</text><text x="245" y="130">ψ−: −3/4</text><text x="245" y="415">ψ+: −7/6</text><text x="35" y="466">ψ+ = (φA + φB) / √(12/5)</text><text x="35" y="505">ψ− = (φA − φB) / √(8/5)</text><text x="35" y="553">Modelo algébrico; não é uma curva de dissociação.</text></g></g></svg>