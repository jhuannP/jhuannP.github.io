<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440" role="img" aria-labelledby="title desc">
<title id="title">Centro de massa e energia relativa</title><desc id="desc">Um quilograma em zero e três quilogramas em quatro metros: centro de massa em três metros. Energia cinética oito joules, dois coletivos mais seis relativos.</desc>
<rect width="420" height="440" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="36" font-size="22">Uma posição do conjunto</text><path d="M55 153H365" stroke="#647381" stroke-width="2"/><circle cx="65" cy="153" r="13" fill="#285e88"/><circle cx="345" cy="153" r="22" fill="#285e88"/><path d="M275 125V179M263 153H287" stroke="#242c35" stroke-width="3"/><g font-size="18"><text x="40" y="105">1 kg</text><text x="315" y="105">3 kg</text><text x="47" y="204">0 m</text><text x="257" y="204">3 m</text><text x="327" y="204">4 m</text><text x="252" y="240">CM</text><text x="24" y="280">v₁ = 4 m/s · v₂ = 0 m/s</text><text x="24" y="312">V = 1 m/s · P = 4 kg m/s</text></g><path d="M24 337H396" stroke="#b9c0c4"/><text x="24" y="376" font-size="26">8 J = 2 J + 6 J</text><text x="24" y="412" font-size="18">total = coletivo + relativo</text></g></svg>