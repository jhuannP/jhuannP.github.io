<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 470" role="img" aria-labelledby="title desc"><title id="title">Grafo dirigido e caminho mínimo</title><desc id="desc">A para B custo quatro, A para C um, A para D dez, C para B dois, C para D cinco, B para D um. E isolado. Caminho mínimo A C B D, custo quatro, destacado em azul contínuo. Outras arestas são tracejadas.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2454c7"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5a665e"/></marker></defs><rect width="430" height="470" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="33" font-size="22" font-weight="bold">Direções e custos do grafo</text><g fill="none" stroke="#5a665e" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#gray)"><path d="M60 170C60 65 350 65 350 170"/><path d="M75 205L162 267"/><path d="M197 127L333 180"/></g><g fill="none" stroke="#2454c7" stroke-width="3" marker-end="url(#blue)"><path d="M76 180L163 130"/><path d="M180 140L180 260"/><path d="M198 270L333 200"/></g><text x="205" y="85" font-size="22">10</text><text x="95" y="252" font-size="22">4</text><text x="280" y="140" font-size="22">5</text><text x="105" y="143" font-size="22">1</text><text x="196" y="207" font-size="22">2</text><text x="273" y="258" font-size="22">1</text><circle cx="60" cy="190" r="21" fill="#faf8f2" stroke="#20372e" stroke-width="2"/><text x="60" y="197" text-anchor="middle" font-size="22" font-weight="bold">A</text><circle cx="180" cy="120" r="21" fill="#faf8f2" stroke="#20372e" stroke-width="2"/><text x="180" y="127" text-anchor="middle" font-size="22" font-weight="bold">C</text><circle cx="180" cy="280" r="21" fill="#faf8f2" stroke="#20372e" stroke-width="2"/><text x="180" y="287" text-anchor="middle" font-size="22" font-weight="bold">B</text><circle cx="350" cy="190" r="21" fill="#faf8f2" stroke="#20372e" stroke-width="2"/><text x="350" y="197" text-anchor="middle" font-size="22" font-weight="bold">D</text><circle cx="60" cy="385" r="21" fill="#faf8f2" stroke="#20372e" stroke-width="2"/><text x="60" y="392" text-anchor="middle" font-size="22" font-weight="bold">E</text><text x="93" y="391" font-size="17">sem caminho a partir de A</text><text x="22" y="447" font-size="21" font-weight="bold">Contínuo: A → C → B → D · custo 4</text></g></svg>