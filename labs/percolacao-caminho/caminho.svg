<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600"><title>Um caminho certificado por predecessores</title><desc>Grade três por três, abertos em zero zero, um zero, um um, dois um e dois dois. Caminho mínimo de três arestas passa pelos quatro primeiros sítios, com distâncias zero um dois três. O sítio aberto dois dois não precisa integrar o caminho escolhido.</desc><rect width="520" height="600" fill="#f5f3eb"/><g font-family="sans-serif" fill="#252720"><text x="25" y="38" font-size="23">Travessia: quatro sítios, três passos</text><text x="25" y="72" font-size="16">Vizinhos ortogonais · índices a partir de zero</text><text x="32" y="112" font-size="18">coluna</text><text x="164" y="112" font-size="18">0</text><text x="264" y="112" font-size="18">1</text><text x="364" y="112" font-size="18">2</text><text x="32" y="180" font-size="18">linha 0</text><rect x="130" y="130" width="80" height="80" fill="#d5e2d8" stroke="#555"/><rect x="230" y="130" width="80" height="80" fill="#666b66" stroke="#555"/><rect x="330" y="130" width="80" height="80" fill="#666b66" stroke="#555"/><text x="32" y="280" font-size="18">linha 1</text><rect x="130" y="230" width="80" height="80" fill="#d5e2d8" stroke="#555"/><rect x="230" y="230" width="80" height="80" fill="#d5e2d8" stroke="#555"/><rect x="330" y="230" width="80" height="80" fill="#666b66" stroke="#555"/><text x="32" y="380" font-size="18">linha 2</text><rect x="130" y="330" width="80" height="80" fill="#666b66" stroke="#555"/><rect x="230" y="330" width="80" height="80" fill="#d5e2d8" stroke="#555"/><rect x="330" y="330" width="80" height="80" fill="#d5e2d8" stroke="#555"/><path d="M170,170 V270 H270 V370" stroke="#514696" stroke-width="4" fill="none"/><circle cx="170" cy="170" r="16" fill="#f5f3eb" stroke="#514696"/><text x="164" y="177" font-size="21">0</text><circle cx="170" cy="270" r="16" fill="#f5f3eb" stroke="#514696"/><text x="164" y="277" font-size="21">1</text><circle cx="270" cy="270" r="16" fill="#f5f3eb" stroke="#514696"/><text x="264" y="277" font-size="21">2</text><circle cx="270" cy="370" r="16" fill="#f5f3eb" stroke="#514696"/><text x="264" y="377" font-size="21">3</text><text x="25" y="460" font-size="18">Topo = linha 0 · base = linha 2</text><text x="25" y="495" font-size="17">Claro: aberto · escuro: fechado</text><text x="25" y="530" font-size="17">Números: distância desde o topo na busca</text><text x="25" y="565" font-size="16">Conectividade ideal, sem modelo de vazão.</text></g></svg>