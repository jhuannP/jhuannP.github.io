<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Colunas e imagem do quadrado</title><desc id="desc">Matriz2,1,0,1 leva o quadrado unitário ao paralelogramo com vértices0,0;2,0;3,1;1,1. A área passa de1 para2, com escala igual nos eixos.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#246555"/></marker></defs><rect width="520" height="440" fill="#faf9f5"/><g font-family="Arial,sans-serif" fill="#23372f"><text x="24" y="35" font-size="25">As colunas viram lados da imagem</text><text x="24" y="70" font-size="20">A=[[2,1],[0,1]] · eixos na mesma escala</text><g stroke="#d7ded8" stroke-width="1"><path d="M170 100V310 M270 100V310 M370 100V310 M70 200H470 M70 100H470"/></g><polygon points="70,300 270,300 370,200 170,200" fill="#bdd3c7" stroke="#246555" stroke-width="2"/><path d="M70 300L170 300L170 200L70 200Z" stroke="#687b71" stroke-dasharray="5 4" fill="none" stroke-width="2"/><path d="M70 90V300H480" fill="none" stroke="#23372f"/><path d="M70 300L270 300" fill="none" stroke="#246555" stroke-width="3" marker-end="url(#arr)"/><path d="M70 300L170 200" fill="none" stroke="#246555" stroke-width="3" marker-end="url(#arr)"/><g font-size="19"><text x="52" y="321">0</text><text x="165" y="321">1</text><text x="265" y="321">2</text><text x="365" y="321">3</text><text x="46" y="206">1</text><text x="46" y="106">2</text><text x="486" y="306">x</text><text x="76" y="100">y</text><text x="180" y="179">T(e₂)=(1,1)</text></g><g font-size="20"><path d="M24 367H74" stroke="#687b71" stroke-dasharray="5 4"/><text x="88" y="374">Quadrado: área 1</text><path d="M24 405H74" stroke="#246555" stroke-width="3"/><text x="88" y="412">Imagem: área 2 · T(e₁)=(2,0)</text></g></g></svg>