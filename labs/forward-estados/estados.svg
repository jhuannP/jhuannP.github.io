<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="t d"><title id="t">Um forward com estados explícitos</title><desc id="d">Entradaa=ln3/2 produz pré-ativaçõesa,menos a,ocultas1/2,menos1/2,logit2eprobabilidade0,880797. Limiar0,5decide1;limiar0,9decide0. Parâmetros permanecem fixos.</desc><rect width="760" height="450" rx="20" fill="#f5f0e5"/><g font-family="sans-serif" fill="#183f43"><text x="35" y="43" font-size="27">Forward calcula. Os pesos ficam fixos.</text><text x="35" y="77" font-size="18">Entrada x=(a,1), a=ln3/2 · rede 2→2→1 · nove parâmetros</text><g fill="none" stroke="#21736f" stroke-width="2"><rect x="35" y="130" width="150" height="110" rx="10"/><rect x="215" y="130" width="150" height="110" rx="10"/><rect x="395" y="130" width="130" height="110" rx="10"/><rect x="555" y="130" width="170" height="110" rx="10"/><path d="M185 185H215 M207 180L215 185L207 190 M365 185H395 M387 180L395 185L387 190 M525 185H555 M547 180L555 185L547 190"/></g><text x="51" y="160" font-size="18">Pré-ativação s</text><text x="66" y="204" font-size="24">(a, −a)</text><text x="235" y="160" font-size="18">h=tanh(s)</text><text x="250" y="204" font-size="24">(½, −½)</text><text x="418" y="160" font-size="18">logit z</text><text x="450" y="204" font-size="24">2</text><text x="574" y="160" font-size="18">p=sigmoid(z)</text><text x="575" y="204" font-size="24">0,880797</text><text x="35" y="305" font-size="22">Mesma probabilidade. Decisões distintas.</text><text x="35" y="347" font-size="21">Limiar 0,5 → classe 1</text><text x="390" y="347" font-size="21" fill="#bd5b39">Limiar 0,9 → classe 0</text><text x="35" y="414" font-size="18">Exemplo sintético com pesos prescritos; sem treino ou calibração.</text></g></svg>