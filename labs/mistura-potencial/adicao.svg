<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 570"><desc>Um mol A e um mol B recebem um mol A, formando dois mols A e um mol B. Composição muda de metade para dois terços, então potencial local não é constante.</desc><rect width="600" height="570" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">Adicionar muda a composição</text><text x="30" y="76" font-size="17">Mistura ideal · mesma temperatura e pressão</text><rect x="50" y="120" width="220" height="140" fill="#dfe2f3" stroke="#434ac3"/><rect x="330" y="120" width="220" height="140" fill="#dfe2f3" stroke="#434ac3"/><text x="76" y="166" font-size="22">1 mol A + 1 mol B</text><text x="76" y="210" font-size="20">xA = 1/2</text><text x="353" y="166" font-size="22">2 mol A + 1 mol B</text><text x="353" y="210" font-size="20">xA = 2/3</text><path d="M277 190h42l-8 -6m8 6-8 6" stroke="#242927" fill="none" stroke-width="2"/><text x="243" y="300" font-size="19">+1 mol A puro</text><text x="30" y="362" font-size="19">ΔGmix/(RT): −0,52325 mol</text><text x="30" y="402" font-size="19">Aproximação local: −0,69315 mol</text><text x="30" y="460" font-size="17">Comparação após retirar a contribuição pura de A.</text><text x="30" y="500" font-size="17">Derivada descreve adição infinitesimal.</text><text x="30" y="535" font-size="17">Nenhuma taxa ou substância real foi medida.</text></g></svg>