<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><title>O que mudou no sinal?</title><desc>Exemplo sintético: intacto tem fluorescência bruta220, fundo20 e100células, resultando2 por célula. Deletado tem70,20 e50,resultando1. Razões bruta22/7,sem fundo4 epor célula2.</desc><rect width="600" height="600" fill="#f6f5ed"/><g font-family="Arial,sans-serif" fill="#202722"><text x="35" y="42" font-size="25">Uma diferença, três razões</text><text x="35" y="80" font-size="18">Dados sintéticos · mesmo leitor · branco compatível</text><g font-size="20"><text x="35" y="140">Construto</text><text x="245" y="140">Intacto</text><text x="405" y="140">Deletado</text><path d="M35 155H565" stroke="#a1a69b"/><text x="35" y="200">F bruto</text><text x="265" y="200">220</text><text x="430" y="200">70</text><text x="35" y="245">Fundo B</text><text x="265" y="245">20</text><text x="430" y="245">20</text><text x="35" y="290">Células N</text><text x="265" y="290">100</text><text x="430" y="290">50</text><path d="M35 315H565" stroke="#a1a69b"/><text x="35" y="360">(F − B) / N</text><text x="265" y="360" fill="#4843bb">2</text><text x="430" y="360" fill="#4843bb">1</text><text x="35" y="430">Razão bruta: 22/7 ≈ 3,14</text><text x="35" y="475">Retirando só o fundo: 4</text><text x="35" y="520" fill="#4843bb">Retirando fundo e dividindo por N: 2</text></g><text x="35" y="565" font-size="16">Normalizar não prova mecanismo ou integração no genoma.</text></g></svg>