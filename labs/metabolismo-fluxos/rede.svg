<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
<title id="title">Estoques constantes não implicam fluxos nulos</title>
<desc id="desc">Modelo fictício de G6P e glicogênio. Estoques A e Y iguais a quatro micromoles de unidades de seis carbonos. Entrada doze, glicólise oito, pentoses quatro, armazenamento e mobilização quatro cada, em micromoles por minuto. Carbono entra e sai à taxa setenta e dois micromoles de carbono por minuto.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426b68"/></marker></defs>
<rect width="760" height="500" fill="#f7f7f0"/>
<g font-family="Arial,sans-serif" fill="#233638">
<text x="26" y="35" font-size="23" font-weight="bold">Estoques constantes, circulação de carbono.</text>
<text x="26" y="63" font-size="16">Modelo prescrito. Fluxos em μmol/min; A e Y em μmol de unidades de 6 C.</text>
<rect x="212" y="88" width="166" height="60" rx="7" fill="#e1e9dd"/><text x="227" y="112" font-size="18">Glicogênio (Y)</text><text x="270" y="137" font-size="18" font-weight="bold">4 μmol</text>
<rect x="190" y="220" width="190" height="94" rx="8" fill="#dcebe7"/><text x="218" y="251" font-size="20">G6P (A)</text><text x="218" y="281" font-size="23" font-weight="bold">4 μmol</text>
<path d="M239 220V151" stroke="#426b68" stroke-width="3" marker-end="url(#arrow)"/><path d="M335 148V217" stroke="#426b68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="108" y="173" font-size="16">síntese vₛ = 4</text><text x="345" y="194" font-size="16">mobilização vₘ = 4</text>
<path d="M35 268H186" stroke="#426b68" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="247" font-size="17">entrada J = 12</text>
<path d="M380 244H536" stroke="#426b68" stroke-width="3" marker-end="url(#arrow)"/><text x="407" y="232" font-size="16">v_g = 8</text>
<path d="M380 294H470V353H536" stroke="#426b68" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="394" y="330" font-size="16">v_p = 4</text>
<rect x="540" y="215" width="193" height="65" rx="7" fill="#e7e8dd"/><text x="553" y="240" font-size="18">Glicólise</text><text x="553" y="264" font-size="14">Piruvato: 16 μmol/min</text>
<rect x="540" y="309" width="193" height="96" rx="7" fill="#e7e8dd"/><text x="552" y="333" font-size="18">Fase oxidativa</text><text x="552" y="358" font-size="14">Pentose/CO₂: 4 μmol/min</text><text x="552" y="383" font-size="14">NADPH: 8 μmol/min</text>
<text x="26" y="444" font-size="20" font-weight="bold">Carbono: entrada 72 = saída 48 + 24 μmol C/min.</text>
<text x="26" y="476" font-size="16">Fluxos e quantidades fictícios; custos de energia e cofatores não estão fechados.</text>
</g></svg>