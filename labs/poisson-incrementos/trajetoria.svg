<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" role="img" aria-labelledby="t desc"><title id="t">Trajetória de contagem não é curva da média</title><desc id="desc">Exemplo ilustrativo com eventos em zero vírgula três, zero vírgula sete, um vírgula oito e dois vírgula três horas. A contagem em três horas é quatro. A média teórica de taxa dois por hora é seis em três horas.</desc><rect width="440" height="500" fill="#faf8f1"/><g font-family="sans-serif" fill="#17333b"><text x="24" y="34" font-size="21">Uma trajetória; outra pergunta</text><text x="24" y="65" font-size="15">Taxa do modelo: λ = 2 h⁻¹</text><text x="24" y="98" font-size="14">número de eventos</text><path d="M60 105 V350 H370" fill="none" stroke="#17333b" stroke-width="2"/><path d="M60 350 L345 110" stroke="#9b4925" stroke-width="3" stroke-dasharray="7 5"/><path d="M60 350 H88.5 V310 H126.5 V270 H231 V230 H278.5 V190 H345" fill="none" stroke="#006b70" stroke-width="3"/><g font-size="14"><text x="40" y="355">0</text><text x="40" y="195">4</text><text x="40" y="115">6</text><text x="58" y="371">0</text><text x="338" y="371">3 h</text></g><text x="24" y="411" font-size="17" fill="#006b70">Contínua em degraus: N(t), exemplo</text><text x="24" y="444" font-size="17" fill="#9b4925">Tracejada: E[N(t)] = 2t</text><text x="24" y="480" font-size="14">Eventos ilustrativos fixados, não dados observados.</text></g></svg>