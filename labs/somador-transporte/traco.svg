<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 535" width="440" height="535" role="img" aria-labelledby="t desc"><title id="t">Soma de quinze mais um: o transporte atravessa quatro posições</title><desc id="desc">Tabela por índice de bit da direita para esquerda da palavra. Na posição zero entram um, um e transporte zero, saem soma zero e transporte um. Nas posições um, dois e três entram um, zero e transporte um, saem soma zero e transporte um. Resultado baixo zero e transporte final um reconstroem dezesseis.</desc><rect width="440" height="535" fill="#faf8f1"/><g font-family="sans-serif" fill="#17353d"><text x="24" y="34" font-size="21">1111 + 0001 = 1 0000</text><text x="24" y="66" font-size="15">Índice0 = posição de menor peso</text><g font-size="15"><text x="33" y="119">i</text><text x="89" y="119">aᵢ</text><text x="146" y="119">bᵢ</text><text x="211" y="119">cᵢ</text><text x="276" y="119">sᵢ</text><text x="337" y="119">cᵢ₊₁</text></g><path d="M24 133 H414" stroke="#a3ada5"/><g font-size="22"><text x="29" y="178">0</text><text x="85" y="178">1</text><text x="142" y="178">1</text><text x="210" y="178">0</text><text x="273" y="178">0</text><text x="350" y="178">1</text><text x="29" y="230">1</text><text x="85" y="230">1</text><text x="142" y="230">0</text><text x="210" y="230">1</text><text x="273" y="230">0</text><text x="350" y="230">1</text><text x="29" y="282">2</text><text x="85" y="282">1</text><text x="142" y="282">0</text><text x="210" y="282">1</text><text x="273" y="282">0</text><text x="350" y="282">1</text><text x="29" y="334">3</text><text x="85" y="334">1</text><text x="142" y="334">0</text><text x="210" y="334">1</text><text x="273" y="334">0</text><text x="350" y="334">1</text></g><path d="M24 353 H414" stroke="#a3ada5"/><text x="24" y="391" font-size="18">Baixo: 0000 · transporte final: 1</text><text x="24" y="428" font-size="19">15 + 1 = 0 + 16 × 1</text><text x="24" y="474" font-size="15">O transporte de uma linha alimenta a seguinte.</text><text x="24" y="513" font-size="14">Traço lógico original; não mede atraso elétrico.</text></g></svg>