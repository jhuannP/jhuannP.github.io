<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><title>O segundo estágio recebe o estado anterior</title><desc>Dois registradores A eB. A recebe D,Brecebe Aantigo,habilitados,resetzero. Dezerozero,entradas1,0,1produzem estados10,01,10. Cada coluna mostra o estado após a borda.</desc><rect width="600" height="600" fill="#f6f5ed"/><g font-family="Arial,sans-serif" fill="#202722"><text x="35" y="43" font-size="24">Calcular primeiro, atualizar depois</text><text x="35" y="85" font-size="20">D → [ A ] → [ B ] · mesmo evento de clock</text><text x="35" y="125" font-size="17">EN_A = EN_B = 1 · reset = 0</text><g font-size="22"><text x="35" y="200">Borda</text><text x="230" y="200">1</text><text x="355" y="200">2</text><text x="480" y="200">3</text><path d="M35 220H550" stroke="#a1a69b"/><text x="35" y="265">D capturado</text><text x="230" y="265">1</text><text x="355" y="265">0</text><text x="480" y="265">1</text><text x="35" y="330">A após borda</text><text x="230" y="330">1</text><text x="355" y="330">0</text><text x="480" y="330">1</text><text x="35" y="395">B após borda</text><text x="230" y="395" fill="#4843bb">0</text><text x="355" y="395" fill="#4843bb">1</text><text x="480" y="395" fill="#4843bb">0</text></g><text x="35" y="465" font-size="19">Antes da borda 1: (A, B) = (0, 0).</text><text x="35" y="510" font-size="19">B recebe A antigo; não recebe D diretamente.</text><text x="35" y="555" font-size="16">Traçado discreto ideal; não é uma forma de onda elétrica.</text></g></svg>