<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430"><title>Uma cauda contém o bloco e o resto</title><desc>Para a série de um sobre n ao quadrado, somar de N mais um até M deixa um resto infinito. As cotas integrais do resto são acrescentadas ao bloco.</desc><rect width="420" height="430" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="40" font-size="21" font-weight="700">Não termine a cauda no corte</text><rect x="24" y="75" width="372" height="82" rx="8" fill="#dce8e1"/><text x="40" y="108" font-size="18">Bloco T: de N + 1 até M</text><text x="40" y="136" font-size="15">Soma finita calculada exatamente</text><text x="196" y="190" font-size="28">+</text><rect x="24" y="210" width="372" height="82" rx="8" fill="#e8e0ce"/><text x="40" y="243" font-size="18">Resto: depois de M, sem fim</text><text x="40" y="271" font-size="15">Entre 1/(M + 1) e 1/M</text><text x="24" y="333" font-size="17" font-weight="700">T + 1/(M + 1) ≤ R_N ≤ T + 1/M</text><text x="24" y="373" font-size="15">Largura: 1/[M(M + 1)]</text><text x="24" y="401" font-size="14">Cotas para a série positiva de 1/n².</text></g></svg>