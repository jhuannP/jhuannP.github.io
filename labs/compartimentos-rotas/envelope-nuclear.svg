<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="title desc">
<title id="title">Nucleoplasma e citosol conectados pelo poro nuclear</title>
<desc id="desc">Corte topológico esquemático, sem escala. Duas membranas delimitam o espaço perinuclear. No poro, elas se unem nas margens, deixando um caminho aquoso seletivo entre citosol e nucleoplasma, distinto do espaço perinuclear.</desc>
