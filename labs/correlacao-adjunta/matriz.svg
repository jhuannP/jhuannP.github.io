<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d"><title id="t">Correlação como matriz e retorno pela transposta</title><desc id="d">Com kernel1,2, a matriz A tem linhas1,2,0,0;0,1,2,0;0,0,1,2. A aplicada a2,menos1,3,0 dá0,5,3. A transposta aplicada a1,menos2,1 dá1,0,menos3,2.</desc><rect width="720" height="470" fill="#f8fafc"/><g font-family="sans-serif" fill="#173041"><text x="28" y="37" font-size="23">Mesmo kernel nas três janelas</text><text x="28" y="68" font-size="17">Passo1 · sem padding · kernel k=(1,2)</text><text x="35" y="165" font-size="25">A =</text><path d="M115 95h-10v140h10M350 95h10v140h-10" stroke="#173041" fill="none" stroke-width="2"/><g font-family="monospace" font-size="27"><text y="130"><tspan x="130">1</tspan><tspan x="185">2</tspan><tspan x="240">0</tspan><tspan x="295">0</tspan></text><text y="180"><tspan x="130">0</tspan><tspan x="185">1</tspan><tspan x="240">2</tspan><tspan x="295">0</tspan></text><text y="230"><tspan x="130">0</tspan><tspan x="185">0</tspan><tspan x="240">1</tspan><tspan x="295">2</tspan></text></g><text x="390" y="138" font-size="21">x=(2,−1,3,0)</text><text x="390" y="188" font-size="21">Ax=(0,5,3)</text><path d="M28 268H690" stroke="#cbd5e1"/><text x="28" y="307" font-size="22">Retorno para L=g·y, com g=(1,−2,1)</text><text x="28" y="351" font-size="23">dx=Aᵀg=(1,0,−3,2)</text><text x="28" y="392" font-size="18">O zero em dx₁ vem de 2×1 + 1×(−2).</text><text x="28" y="441" font-size="17">Transpor devolve gradientes; não é inverter A para recuperar x.</text></g></svg>