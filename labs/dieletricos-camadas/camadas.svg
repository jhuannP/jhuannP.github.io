<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740"><title>Potencial contínuo, campo elétrico descontínuo e deslocamento constante</title><desc>Capacitor de duas camadas sem folha livre: kappa1 igual2, espessura1 e kappa2 igual5, espessura2. Placas em z0 e3, potenciais1,8 e0. Na interface z1, potencial0,8; campoE cai de1 para0,4 e D permanece2. Eixos normalizados distintos para cada grandeza.</desc><rect width="760" height="740" fill="#f7f3e9"/><g font-family="system-ui" fill="#243c38"><text x="28" y="38" font-size="24" font-weight="bold">A interface não quebra o potencial</text><text x="28" y="69" font-size="18">Sem folha livre · V = 9/5 · normal +z →</text><rect x="150" y="90" width="170" height="65" fill="#c9ded0"/><rect x="320" y="90" width="340" height="65" fill="#e9d3bc"/><path d="M150 85V160 M660 85V160" stroke="#243c38" stroke-width="6"/><text x="175" y="119" font-size="18">κ₁ = 2</text><text x="175" y="145" font-size="16">d₁ = 1</text><text x="430" y="119" font-size="18">κ₂ = 5</text><text x="430" y="145" font-size="16">d₂ = 2</text><path d="M320 170V657" stroke="#8c9b92" stroke-dasharray="5 5"/><g fill="none" stroke="#8c9b92"><path d="M150 185V335H680 M150 386V477H680 M150 535V642H680"/></g><g font-size="18"><text x="28" y="216">φ</text><text x="28" y="413">E_z</text><text x="28" y="565">D_z</text><text x="102" y="202">1,8</text><text x="102" y="276">0,8</text><text x="113" y="340">0</text><text x="113" y="407">1</text><text x="100" y="451">0,4</text><text x="113" y="482">0</text><text x="113" y="564">2</text><text x="113" y="647">0</text></g><path d="M150 191L320 271L660 335" fill="none" stroke="#27756b" stroke-width="5"/><circle cx="320" cy="271" r="6" fill="#27756b"/><text x="372" y="239" font-size="18">φ(1) = 4/5</text><text x="372" y="267" font-size="16">inclinação = −E em cada camada</text><path d="M150 400H318 M322 446H660" fill="none" stroke="#b16532" stroke-width="5"/><path d="M320 400V446" fill="none" stroke="#b16532" stroke-width="2" stroke-dasharray="3 3"/><text x="405" y="414" font-size="18">E₂ = 2/5 ≠ E₁ = 1</text><path d="M150 558H660" fill="none" stroke="#416da1" stroke-width="5"/><text x="405" y="591" font-size="18">D₂ = D₁ = 2</text><g font-size="17"><text x="145" y="672">0</text><text x="314" y="672">1</text><text x="655" y="672">3</text><text x="697" y="672">z</text></g><text x="28" y="709" font-size="15">z em ℓref · φ em Eref ℓref · E em Eref · D em ε₀Eref</text><text x="28" y="731" font-size="13">Geometria plana ideal e entradas prescritas; não é medição de material.</text></g></svg>