<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" role="img" aria-labelledby="t d"><title id="t">Uma altura, duas direções</title><desc id="d">No círculo unitário, os ângulos pi sobre 6 e cinco pi sobre 6 têm a mesma coordenada vertical, um meio. O arco seno escolhe pi sobre 6 no ramo entre menos pi sobre 2 e pi sobre 2.</desc><rect width="440" height="450" fill="#f2f1e7"/><g font-family="sans-serif" fill="#262722"><text x="24" y="32" font-size="19" font-weight="bold">Uma altura, duas direções.</text><text x="24" y="62" font-size="16">sin θ=1/2 · círculo unitário</text><circle cx="220" cy="235" r="112" stroke="#777" fill="none"/><path d="M74 235H366 M220 112V361" stroke="#999"/><path d="M123 179H317" stroke="#555" stroke-dasharray="5 4"/><path d="M220 235L123 179" stroke="#555" stroke-width="2"/><path d="M220 235L317 179" stroke="#2348db" stroke-width="3"/><circle cx="123" cy="179" r="5" fill="#555"/><circle cx="317" cy="179" r="6" fill="#2348db"/><g font-size="17"><text x="74" y="156">5π/6</text><text x="303" y="156" fill="#2348db">π/6</text><text x="24" y="188">y=1/2</text><text x="368" y="240">x</text><text x="230" y="115">y</text></g><text x="24" y="394" font-size="17" font-weight="bold">arcsin(1/2)=π/6 no ramo principal.</text><text x="24" y="423" font-size="15">5π/6 também tem seno 1/2.</text></g></svg>
