<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" role="img" aria-labelledby="title desc"><title id="title">Objeto e imagem em dois focos</title><desc id="desc">Lente fina convergente com f dois centímetros, objeto real a quatro centímetros e imagem real a quatro centímetros, invertida e do mesmo tamanho. Um raio paralelo passa pelo foco imagem; outro atravessa o centro sem desvio no modelo fino. Alturas são ampliadas no desenho.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="420" fill="#f7f4eb"/>
<g fill="#182e38" font-family="sans-serif" font-size="21"><text x="20" y="34" font-size="25">p = q = 4 cm · f = 2 cm</text><text x="20" y="69">Alturas ampliadas para visualizar os raios</text></g>
<path d="M20 190H500" stroke="#68766e" stroke-width="1.5"/>
<path d="M260 98V287 M253 108L260 98L267 108 M253 277L260 287L267 277" fill="none" stroke="#68766e" stroke-width="2"/>
