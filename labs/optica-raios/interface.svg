<svg xmlns="http://www.w3.org/2000/svg" width="520" height="480" viewBox="0 0 520 480" role="img" aria-labelledby="title desc"><title id="title">Ângulos medidos pela normal</title><desc id="desc">Raio incidente a trinta graus da normal em n1 igual a um. O refletido também faz trinta graus. Em n2 igual a três meios, o refratado faz aproximadamente dezenove vírgula quarenta e sete graus, aproximando-se da normal.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs>
