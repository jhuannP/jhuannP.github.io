<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc"><title id="title">Previsão e correção do trapézio explícito</title><desc id="desc">No problema y linha igual a menos y, com y inicial um e passo meio: primeira inclinação menos um, previsão meio, segunda inclinação menos meio, inclinação média menos três quartos e valor corrigido cinco oitavos. A previsão não é o valor final nem a solução exata.</desc><rect width="520" height="650" fill="#faf8f2"/><g font-family="system-ui,sans-serif" fill="#17382e"><text x="28" y="42" font-size="24" font-weight="700">Prever não é terminar o passo</text><text x="28" y="77" font-size="18">y′ = −y · y₀ = 1 · h = 1/2</text><path d="M28 99H492" stroke="#17382e"/><g font-size="20"><text x="28" y="139" font-weight="700">1. Inclinação no começo</text><text x="28" y="177" fill="#245fbe">k₁ = −1</text><text x="28" y="235" font-weight="700">2. Previsão por Euler</text><text x="28" y="273" fill="#245fbe">y* = 1 + (1/2)(−1) = 1/2</text><text x="28" y="331" font-weight="700">3. Inclinação na previsão</text><text x="28" y="369" fill="#245fbe">k₂ = −y* = −1/2</text><text x="28" y="427" font-weight="700">4. Média e correção</text><text x="28" y="465" fill="#245fbe">y₁ = 1 + (1/2)(−3/4) = 5/8</text></g><path d="M28 496H492" stroke="#17382e"/><text x="28" y="532" font-size="17">Previsão: 0,5 · correção: 0,625</text><text x="28" y="564" font-size="17">Referência contínua em t = 0,5: ≈ 0,60653</text><text x="28" y="598" font-size="17">Duas avaliações de f por passo.</text><text x="28" y="632" font-size="14">Heun nesta aula = trapézio explícito de ordem 2.</text></g></svg>