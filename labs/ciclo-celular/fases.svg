<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc"><title id="title">Replicar e depois distribuir</title><desc id="desc">Exemplo diploide: G1 com2C, fase S aumentando DNA de2C a4C, G2 com4C e fase M distribuindo o material e dividindo a célula em duas filhas, cada uma2C. Não representa duração.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#246555"/></marker></defs><rect width="520" height="650" fill="#faf9f5"/><g fill="#23372f" font-family="Arial,sans-serif"><text x="24" y="35" font-size="25">Replicar não é dividir a célula</text><text x="24" y="70" font-size="19">Exemplo diploide · quantidade de DNA</text><text x="24" y="125" font-size="26" fill="#246555">G1</text><text x="145" y="125" font-size="24">2 C</text><text x="145" y="154" font-size="19">Antes da replicação</text><path d="M56 137V195" stroke="#246555" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="225" font-size="26" fill="#246555">S</text><text x="145" y="225" font-size="24">2 C → 4 C</text><text x="145" y="254" font-size="19">Replicação do DNA</text><path d="M56 237V295" stroke="#246555" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="325" font-size="26" fill="#246555">G2</text><text x="145" y="325" font-size="24">4 C</text><text x="145" y="354" font-size="19">DNA já replicado</text><path d="M56 337V395" stroke="#246555" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="425" font-size="26" fill="#246555">M</text><text x="145" y="425" font-size="24">distribuição</text><text x="145" y="454" font-size="19">Mitose e citocinese</text><path d="M260 472L160 514" fill="none" stroke="#246555" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 472L360 514" fill="none" stroke="#246555" stroke-width="2" marker-end="url(#arrow)"/><circle cx="150" cy="551" r="31" fill="#d0e0d6"/><circle cx="370" cy="551" r="31" fill="#d0e0d6"/><text x="132" y="559" font-size="24">2 C</text><text x="352" y="559" font-size="24">2 C</text><text x="106" y="600" font-size="19">Duas filhas após citocinese</text><text x="24" y="635" font-size="17">Setas indicam ordem; não duração ou sucesso garantido.</text></g></svg>