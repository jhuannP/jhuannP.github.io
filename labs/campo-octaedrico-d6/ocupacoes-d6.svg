<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" role="img" aria-labelledby="title desc"><title id="title">Duas ocupações usuais para d seis octaédrico</title><desc id="desc">Três orbitais t2g abaixo e dois eg acima. Ocupação usual de spin alto: t2g quatro eg dois, com um par e quatro orbitais simples. Ocupação usual de spin baixo: t2g seis eg zero, com três pares e nenhum orbital simples. O diagrama é qualitativo e não resolve estados de spin.</desc><rect width="360" height="540" fill="#faf9f2"/><g font-family="Arial,sans-serif" fill="#22271b" text-anchor="middle"><text x="180" y="27" font-size="20" font-weight="bold">d⁶ · duas ocupações usuais</text><text x="180" y="63" font-size="18" font-weight="bold">t<tspan baseline-shift="sub" font-size="12">2g</tspan><tspan baseline-shift="super" font-size="12">4</tspan> e<tspan baseline-shift="sub" font-size="12">g</tspan><tspan baseline-shift="super" font-size="12">2</tspan> · caso de spin alto</text><g stroke="#55594c" stroke-width="2"><path d="M130 117 H175 M235 117 H280 M95 197 H140 M180 197 H225 M265 197 H310"/></g><g font-size="18"><text x="48" y="114">e<tspan baseline-shift="sub" font-size="12">g</tspan></text><text x="48" y="194">t<tspan baseline-shift="sub" font-size="12">2g</tspan></text></g><g fill="#2447ae" font-size="24"><text x="152" y="109">↑</text><text x="257" y="109">↑</text><text x="117" y="189">↑↓</text><text x="202" y="189">↑</text><text x="287" y="189">↑</text></g><text x="180" y="231" font-size="16">1 par · 4 orbitais com um elétron</text><line x1="20" y1="254" x2="340" y2="254" stroke="#a0a397"/><text x="180" y="290" font-size="18" font-weight="bold">t<tspan baseline-shift="sub" font-size="12">2g</tspan><tspan baseline-shift="super" font-size="12">6</tspan> e<tspan baseline-shift="sub" font-size="12">g</tspan><tspan baseline-shift="super" font-size="12">0</tspan> · caso de spin baixo</text><g stroke="#55594c" stroke-width="2"><path d="M130 344 H175 M235 344 H280 M95 424 H140 M180 424 H225 M265 424 H310"/></g><g font-size="18"><text x="48" y="341">e<tspan baseline-shift="sub" font-size="12">g</tspan></text><text x="48" y="421">t<tspan baseline-shift="sub" font-size="12">2g</tspan></text></g><g fill="#2447ae" font-size="24"><text x="117" y="416">↑↓</text><text x="202" y="416">↑↓</text><text x="287" y="416">↑↓</text></g><text x="180" y="458" font-size="16">3 pares · nenhum orbital simples</text><text x="180" y="493" font-size="15">Cada traço é um orbital espacial</text><text x="180" y="519" font-size="15">Alturas esquemáticas; não é um espectro</text></g></svg>