<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="t d"><title id="t">IgA: da lâmina própria ao lúmen</title><desc id="d">Um plasmócito secreta IgA dimérica. Ela se liga ao pIgR basolateral e atravessa a célula por vesículas. No lado apical é liberada com componente secretor.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#246153" stroke-width="1.6"/></marker></defs><rect width="720" height="720" fill="#f5f2e9"/><g font-family="sans-serif" fill="#25312b"><text x="36" y="52" font-size="29">IgA: produzir e transportar</text><text x="36" y="110" font-size="25">LÚMEN · face apical</text><text x="36" y="159" font-size="23">IgA + componente secretor</text><path d="M36 204H684" stroke="#9aa897" stroke-width="3"/><rect x="80" y="230" width="560" height="230" rx="18" fill="#e0e9dc" stroke="#9aa897"/><text x="112" y="274" font-size="25">CÉLULA EPITELIAL</text><text x="112" y="329" font-size="23">Tráfego em vesículas</text><text x="112" y="371" font-size="21">através da célula</text><text x="112" y="426" font-size="23">pIgR · ligação basolateral</text><path d="M565 536V188" fill="none" stroke="#246153" stroke-width="4" marker-end="url(#a)"/><text x="36" y="514" font-size="25">LÂMINA PRÓPRIA</text><text x="36" y="562" font-size="23">Plasmócito → IgA dimérica</text><text x="36" y="601" font-size="23">associada à cadeia J</text><path d="M36 636H684" stroke="#b9c1b5"/><text x="36" y="675" font-size="21">Esquema original · sem escala · recorte intestinal</text></g></svg>