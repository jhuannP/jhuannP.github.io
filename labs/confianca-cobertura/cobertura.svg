<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
<title id="title">Cobertura exata de uma regra normal aplicada a quatro variáveis binárias</title>
<desc id="desc">Cinco médias possíveis, seus intervalos de margem 0,98 e massas. Somente as três linhas centrais cobrem a média verdadeira zero. Cobertura 14 sobre 16, ou 87,5 por cento.</desc>
<rect width="760" height="500" fill="#f7f7f0"/>
<g font-family="Arial,sans-serif" fill="#233638">
<text x="30" y="35" font-size="23" font-weight="bold">Mesma regra, outro modelo: a cobertura muda.</text>
<text x="30" y="64" font-size="17">Xᵢ = −1 ou +1, independentes e equiprováveis. n = 4, μ = 0, σ = 1.</text>
<text x="30" y="90" font-size="17">Intervalos: média ± 0,98. Tabela completa, sem sorteios simulados.</text>
<line x1="360" y1="115" x2="360" y2="391" stroke="#526e74" stroke-dasharray="6 5" stroke-width="2"/>
<text x="365" y="118" font-size="15">μ = 0</text>
<text x="30" y="126" font-size="15">média</text>
<text x="620" y="126" font-size="15">probabilidade</text>
<text x="35" y="165" font-size="17">-1</text>
<line x1="122.4" y1="160" x2="357.6" y2="160" stroke="#a3542d" stroke-width="5"/>
<circle cx="240" cy="160" r="6" fill="#a3542d"/>
<text x="635" y="165" font-size="17">1/16</text>
<text x="35" y="213" font-size="17">-0,5</text>
<line x1="182.4" y1="208" x2="417.6" y2="208" stroke="#35746a" stroke-width="5"/>
<circle cx="300.0" cy="208" r="6" fill="#35746a"/>
<text x="635" y="213" font-size="17">4/16</text>
<text x="35" y="261" font-size="17">0</text>
<line x1="242.4" y1="256" x2="477.6" y2="256" stroke="#35746a" stroke-width="5"/>
<circle cx="360" cy="256" r="6" fill="#35746a"/>
<text x="635" y="261" font-size="17">6/16</text>
<text x="35" y="309" font-size="17">0,5</text>
<line x1="302.4" y1="304" x2="537.6" y2="304" stroke="#35746a" stroke-width="5"/>
<circle cx="420.0" cy="304" r="6" fill="#35746a"/>
<text x="635" y="309" font-size="17">4/16</text>
<text x="35" y="357" font-size="17">1</text>
<line x1="362.4" y1="352" x2="597.6" y2="352" stroke="#a3542d" stroke-width="5"/>
<circle cx="480" cy="352" r="6" fill="#a3542d"/>
<text x="635" y="357" font-size="17">1/16</text>
<line x1="105" y1="390" x2="610" y2="390" stroke="#7f9090"/>
<text x="115" y="415" font-size="15">-2</text>
<text x="235" y="415" font-size="15">-1</text>
<text x="355" y="415" font-size="15">0</text>
<text x="475" y="415" font-size="15">1</text>
<text x="595" y="415" font-size="15">2</text>
<text x="30" y="455" font-size="21" font-weight="bold">Cobrem zero: (4 + 6 + 4)/16 = 7/8 = 87,5%.</text>
<text x="30" y="482" font-size="16">O modelo não é normal; usar 1,96 não garante 95% para n pequeno.</text>
</g></svg>