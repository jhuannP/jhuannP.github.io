<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc"><title id="title">Um passo de gradiente em uma unidade logística</title><desc id="desc">Para entrada 2,1 e alvo 1 com taxa 0,2, os pesos 1 e menos 1 passam a 1,2 e menos 0,9; viés menos 1 passa a menos 0,9. O logit vai de zero a 0,6, a saída de 0,5 a aproximadamente 0,6457 e a perda de 0,6931 a 0,4375. É apenas o exemplo usado para atualizar.</desc><rect width="440" height="400" fill="#f4f3eb"/><g font-family="Arial,sans-serif" fill="#20221e" font-size="18"><text x="22" y="30" font-size="21" font-weight="bold">Um passo, um exemplo</text><text x="22" y="59" font-size="16">Dados fixos: x=(2,1), y=1. Taxa η=0,2.</text><text x="22" y="92">Grandeza</text><text x="195" y="92">Antes</text><text x="310" y="92">Depois</text><text x="22" y="120">w₁</text><text x="195" y="120">1</text><text x="310" y="120" fill="#2348db">1,2</text><path d="M22 130H418" stroke="#d3d7c9"/><text x="22" y="152">w₂</text><text x="195" y="152">−1</text><text x="310" y="152" fill="#2348db">−0,9</text><path d="M22 162H418" stroke="#d3d7c9"/><text x="22" y="184">b</text><text x="195" y="184">−1</text><text x="310" y="184" fill="#2348db">−0,9</text><path d="M22 194H418" stroke="#d3d7c9"/><text x="22" y="216">z</text><text x="195" y="216">0</text><text x="310" y="216" fill="#2348db">0,6</text><path d="M22 226H418" stroke="#d3d7c9"/><text x="22" y="248">p</text><text x="195" y="248">0,5</text><text x="310" y="248" fill="#2348db">≈0,6457</text><path d="M22 258H418" stroke="#d3d7c9"/><text x="22" y="280">L</text><text x="195" y="280">≈0,6931</text><text x="310" y="280" fill="#2348db">≈0,4375</text><path d="M22 290H418" stroke="#d3d7c9"/><text x="22" y="351" font-size="16">Perda no mesmo exemplo usado para atualizar.</text><text x="22" y="380" font-size="16">Não é uma avaliação em novos dados.</text></g></svg>