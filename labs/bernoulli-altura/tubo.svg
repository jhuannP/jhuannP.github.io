<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="t d"><title id="t">Um tubo estreita e sobe</title><desc id="d">Seção um com área de quatro centímetros quadrados e rapidez um metro por segundo; seção dois com área de um centímetro quadrado e rapidez quatro metros por segundo, um metro acima. A queda de pressão total é dezessete vírgula cinco quilopascais.</desc><rect width="440" height="430" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="20" y="30" font-size="20" font-weight="bold">Acelerar e subir têm custos distintos.</text><text x="20" y="58" font-size="16">Modelo ideal; desenho sem escala.</text><path d="M35 235H155L290 150H365 M35 325H155L290 210H365" stroke="#2448bc" stroke-width="3" fill="none"/><path d="M40 280H155L290 180H365" stroke="#777b70" stroke-dasharray="5 5" fill="none"/><path d="M68 280H125 M117 274L125 280L117 286 M303 180H347 M339 174L347 180L339 186" stroke="#2448bc" stroke-width="2" fill="none"/><g font-size="16"><text x="22" y="128">Seção 1</text><text x="22" y="157">A₁ = 4 cm²</text><text x="22" y="186">v₁ = 1 m/s</text><text x="255" y="89">Seção 2</text><text x="255" y="116">A₂ = 1 cm²</text><text x="255" y="143">v₂ = 4 m/s</text><path d="M397 180V280 M392 187L397 180L402 187 M392 273L397 280L402 273" stroke="#777b70" fill="none"/><text x="350" y="239">1 m</text><text x="20" y="365">Δp: −7,5 kPa por acelerar</text><text x="20" y="393">e −10 kPa por subir → −17,5 kPa.</text></g></g></svg>