<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Melhor primeiro passo e melhor pior fator são critérios distintos</title><desc id="desc">Partindo de(1,1),passo1/4tem custo após um passo9/32 e pior fator3/4;passo2/5tem custo9/10 e pior fator3/5;passo1/2tem custo17/8 e pior fator1,não converge para todo início.</desc><rect width="760" height="450" rx="18" fill="#f4f0e7"/><g font-family="sans-serif" fill="#20333b"><text x="38" y="48" font-size="25" font-weight="700">Qual critério define o melhor passo?</text><text x="38" y="79" font-size="16">Φ = (x² + 4y²)/2 · início (1,1) · custo inicial 5/2</text><path d="M38 111H722M38 177H722M38 245H722M38 313H722M38 381H722" stroke="#bdc8bf"/><g font-size="18" font-weight="700"><text x="50" y="150">Passo η</text><text x="260" y="150">Custo após 1 passo</text><text x="565" y="150">Pior fator q</text></g><g font-size="24"><text x="70" y="221">1/4</text><text x="335" y="221">9/32</text><text x="607" y="221">3/4</text><text x="70" y="289">2/5</text><text x="335" y="289">9/10</text><text x="607" y="289">3/5</text><text x="70" y="357">1/2</text><text x="335" y="357">17/8</text><text x="620" y="357">1</text></g><text x="38" y="416" font-size="18">q &lt; 1 controla todas as direções; custo de um passo é outra pergunta.</text></g></svg>