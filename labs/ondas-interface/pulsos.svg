<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" role="img" aria-labelledby="title desc">
<title id="title">Reflexão e transmissão de um pulso na junção de cordas</title>
<desc id="desc">Antes: pulso de dez milímetros à esquerda. Depois: reflexão de menos cinco milímetros à esquerda e transmissão de cinco milímetros à direita. Impedâncias dois e seis quilogramas por segundo. A energia refletida é um quarto e a transmitida três quartos.</desc>
<rect width="760" height="550" fill="#f7f7f0"/>
<g font-family="Arial,sans-serif" fill="#233638">
<text x="26" y="35" font-size="23" font-weight="bold">Altura do pulso e energia são contas diferentes.</text>
<text x="26" y="63" font-size="16">Z₁ = 2 kg/s · Z₂ = 6 kg/s · Escala vertical ampliada · Modelo prescrito</text>
<path d="M475 90V395" stroke="#a0aaa2" stroke-dasharray="6 5"/>
<text x="483" y="100" font-size="15">junção x = 0</text>
