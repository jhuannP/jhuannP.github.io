<title id="t">O número inteiro muda ao meio-dia</title><desc id="d">Em 1 de janeiro de 2000, à meia-noite UT1 JD é 2451544,5. Às 6h é 2451544,75. Ao meio-dia é 2451545. Às 18h é 2451545,25. À meia-noite seguinte é 2451545,5.</desc>
<rect width="440" height="390" fill="#f2f1e7"/>
<g font-family="sans-serif" fill="#262722">
<text x="24" y="32" font-size="19" font-weight="bold">Meia-noite não é JD inteiro.</text>
<text x="24" y="59" font-size="15">1 de janeiro de 2000 · leituras UT1</text>
<path d="M48 93V330" stroke="#273fbb" stroke-width="3"/>
<g font-size="17"><text x="74" y="106">00h → 2451544,5</text><text x="74" y="160">06h → 2451544,75</text><text x="74" y="214" fill="#273fbb" font-weight="bold">12h → 2451545,0</text><text x="74" y="268">18h → 2451545,25</text><text x="74" y="322">00h seguinte → 2451545,5</text></g>
<g fill="#273fbb"><circle cx="48" cy="100" r="5"/><circle cx="48" cy="154" r="5"/><circle cx="48" cy="208" r="7"/><circle cx="48" cy="262" r="5"/><circle cx="48" cy="316" r="5"/></g>
<text x="24" y="366" font-size="14">Cada passo de 6h acrescenta 1/4 à data Juliana.</text></g></svg>
