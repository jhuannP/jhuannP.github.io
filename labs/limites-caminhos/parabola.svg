<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450"><title>Uma parábola escapa ao teste de retas</title><desc>Plano xy com escalas iguais. A reta y igual a x e a parábola y igual a x ao quadrado aproximam a origem. Para g, o limite nas retas é zero e na parábola o valor é um meio.</desc><rect width="440" height="450" fill="#f7f6ee"/><g font-family="sans-serif" fill="#252a22"><text x="24" y="33" font-size="20" font-weight="bold">A direção pode mudar no caminho</text><text x="24" y="61" font-size="14">g(x,y) = x²y / (x⁴ + y²), fora da origem</text><path d="M65 115V355H315" fill="none" stroke="#777d70"/><path d="M65 355L295 125" fill="none" stroke="#62675c" stroke-width="2" stroke-dasharray="6 5"/><path d="M65 355Q180 355 295 125" fill="none" stroke="#2453b6" stroke-width="3"/><circle cx="65" cy="355" r="5" stroke="#252a22" fill="#f7f6ee"/><text x="45" y="377" font-size="14">0</text><text x="318" y="374" font-size="15">x</text><text x="48" y="109" font-size="15">y</text><text x="121" y="182" font-size="14">Reta: limite 0</text><text x="223" y="316" font-size="14" fill="#2453b6">y = x²</text><text x="173" y="340" font-size="14" fill="#2453b6">valor constante 1/2</text><text x="24" y="409" font-size="14">Escalas iguais · limites referem-se à origem</text><text x="24" y="434" font-size="13">Caminhos no domínio; não é gráfico de superfície.</text></g></svg>