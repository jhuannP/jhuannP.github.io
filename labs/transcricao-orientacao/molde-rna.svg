<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc"><title id="title">Transcrição ideal de trecho com fita-molde inferior</title><desc id="desc">DNA superior, não molde, de cinco para três: ACGTAACC. DNA inferior, molde, alinhado de três para cinco: TGCATTGG. RNA sintetizado de cinco para três: ACGUAACC. Se a fita superior fosse o molde, o RNA normalizado de cinco para três seria GGUUACGU.</desc><rect width="360" height="500" fill="#faf9f2"/><defs><marker id="rna-tip" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#2447ae"/></marker></defs><g font-family="Arial,sans-serif" fill="#22271b" text-anchor="middle"><text x="180" y="27" font-size="19" font-weight="bold">Mesmo trecho · uma fita-molde</text><text x="180" y="60" font-size="17">DNA superior: não molde</text><g font-family="monospace" font-size="21"><text x="35" y="95">5′</text><text x="180" y="95" letter-spacing="7">ACGTAACC</text><text x="325" y="95">3′</text></g><line x1="66" y1="105" x2="294" y2="105" stroke="#55594c"/><text x="180" y="153" font-size="17">DNA inferior: molde</text><g font-family="monospace" font-size="21"><text x="35" y="188">3′</text><text x="180" y="188" letter-spacing="7">TGCATTGG</text><text x="325" y="188">5′</text></g><line x1="66" y1="198" x2="294" y2="198" stroke="#55594c"/><line x1="75" y1="226" x2="285" y2="226" stroke="#2447ae" stroke-width="2" marker-end="url(#rna-tip)"/><text x="180" y="252" font-size="17">Leitura do molde: 3′ → 5′</text><text x="180" y="300" font-size="17" font-weight="bold">RNA: síntese 5′ → 3′</text><g font-family="monospace" font-size="21" fill="#2447ae"><text x="35" y="337">5′</text><text x="180" y="337" letter-spacing="7">ACGUAACC</text><text x="325" y="337">3′</text></g><text x="180" y="378" font-size="16">RNA complementar à fita-molde</text><text x="180" y="405" font-size="15">T → U compara RNA com a fita não molde</text><line x1="20" y1="423" x2="340" y2="423" stroke="#a0a397"/><text x="180" y="452" font-size="15">Molde superior · RNA reescrito 5′→3′</text><text x="180" y="481" font-family="monospace" font-size="19" fill="#2447ae">5′-GGUUACGU-3′</text></g></svg>