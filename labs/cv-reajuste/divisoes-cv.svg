<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Treino e validação em três divisões</title><desc id="desc">Seis registros. Fold zero valida 0 e5; fold um valida1 e4; fold dois valida2 e3. Os demais quatro registros são treino em cada linha. Cada registro valida uma vez e o modelo é reajustado a cada linha.</desc><rect width="360" height="380" fill="#f5f4eb"/><g font-family="sans-serif" text-anchor="middle"><text x="180" y="35" font-size="22" fill="#20251f">Um novo treino por linha</text><text x="200" y="73" font-size="16" fill="#20251f">Índices dos registros</text><text x="100" y="103" font-size="16" fill="#20251f">0</text><text x="140" y="103" font-size="16" fill="#20251f">1</text><text x="180" y="103" font-size="16" fill="#20251f">2</text><text x="220" y="103" font-size="16" fill="#20251f">3</text><text x="260" y="103" font-size="16" fill="#20251f">4</text><text x="300" y="103" font-size="16" fill="#20251f">5</text><text x="36" y="145" font-size="16" fill="#20251f">Fold 0</text><rect x="82" y="120" width="36" height="36" rx="2" fill="#184bc4" stroke="#939889"/><text x="100" y="145" font-size="19" fill="white">V</text><rect x="122" y="120" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="140" y="145" font-size="19" fill="#20251f">T</text><rect x="162" y="120" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="180" y="145" font-size="19" fill="#20251f">T</text><rect x="202" y="120" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="220" y="145" font-size="19" fill="#20251f">T</text><rect x="242" y="120" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="260" y="145" font-size="19" fill="#20251f">T</text><rect x="282" y="120" width="36" height="36" rx="2" fill="#184bc4" stroke="#939889"/><text x="300" y="145" font-size="19" fill="white">V</text><text x="36" y="193" font-size="16" fill="#20251f">Fold 1</text><rect x="82" y="168" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="100" y="193" font-size="19" fill="#20251f">T</text><rect x="122" y="168" width="36" height="36" rx="2" fill="#184bc4" stroke="#939889"/><text x="140" y="193" font-size="19" fill="white">V</text><rect x="162" y="168" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="180" y="193" font-size="19" fill="#20251f">T</text><rect x="202" y="168" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="220" y="193" font-size="19" fill="#20251f">T</text><rect x="242" y="168" width="36" height="36" rx="2" fill="#184bc4" stroke="#939889"/><text x="260" y="193" font-size="19" fill="white">V</text><rect x="282" y="168" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="300" y="193" font-size="19" fill="#20251f">T</text><text x="36" y="241" font-size="16" fill="#20251f">Fold 2</text><rect x="82" y="216" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="100" y="241" font-size="19" fill="#20251f">T</text><rect x="122" y="216" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="140" y="241" font-size="19" fill="#20251f">T</text><rect x="162" y="216" width="36" height="36" rx="2" fill="#184bc4" stroke="#939889"/><text x="180" y="241" font-size="19" fill="white">V</text><rect x="202" y="216" width="36" height="36" rx="2" fill="#184bc4" stroke="#939889"/><text x="220" y="241" font-size="19" fill="white">V</text><rect x="242" y="216" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="260" y="241" font-size="19" fill="#20251f">T</text><rect x="282" y="216" width="36" height="36" rx="2" fill="#f5f4eb" stroke="#939889"/><text x="300" y="241" font-size="19" fill="#20251f">T</text><text x="180" y="298" font-size="17" fill="#184bc4">V: validação daquela linha</text><text x="180" y="325" font-size="17" fill="#20251f">T: treino daquela linha</text><text x="180" y="361" font-size="14" fill="