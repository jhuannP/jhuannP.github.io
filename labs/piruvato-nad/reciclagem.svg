<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 650" role="img" aria-labelledby="title desc"><title id="title">Carbono segue adiante, cofator circula</title><desc id="desc">Por glicose na rota lactato: seis carbonos passam para dois piruvatos e depois dois lactatos. Dois NAD mais são reduzidos na glicólise e dois NADH são reoxidados pela lactato desidrogenase. O ATP líquido dois vem da glicólise; o passo piruvato para lactato não adiciona ATP. Esquema reduzido omite outras espécies e não é mecanismo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#254fc5"/></marker></defs><rect width="440" height="650" fill="#f6f8ff"/><g font-family="sans-serif" fill="#172545"><text x="24" y="33" font-size="19" font-weight="bold">Carbono segue; cofator é reciclado</text><text x="24" y="62" font-size="15">Por glicose · via ideal de lactato</text>
<text x="55" y="112" font-size="18" font-weight="bold">Glicose · 6 carbonos</text><path d="M110 130 V213" stroke="#254fc5" stroke-width="3" marker-end="url(#arrow)"/><text x="135" y="165" font-size="16">Glicólise</text><text x="135" y="192" font-size="15">2 ATP líquidos</text>
<text x="55" y="252" font-size="18" font-weight="bold">2 Piruvatos · 2×3 carbonos</text><path d="M110 270 V353" stroke="#254fc5" stroke-width="3" marker-end="url(#arrow)"/><text x="135" y="305" font-size="16">Lactato-desidrogenase</text><text x="135" y="332" font-size="15">0 ATP adicional</text>
<text x="55" y="392" font-size="18" font-weight="bold">2 Lactatos · 2×3 carbonos</text>
<path d="M84 470 Q220 424 356 470" stroke="#254fc5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M356 495 Q220 547 84 495" stroke="#254fc5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="51" y="490" font-size="18">2 NAD⁺</text><text x="305" y="490" font-size="18">2 NADH</text><text x="173" y="443" font-size="14">glicólise</text><text x="141" y="548" font-size="14">redução do piruvato</text>
<text x="24" y="591" font-size="15">Saldo de NADH na rota completa: zero.</text><text x="24" y="618" font-size="14">Fluxo não nulo · sem consumo líquido do cofator.</text><text x="24" y="641" font-size="13">Esquema reduzido: omite outras espécies, não é mecanismo.</text></g></svg>