<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc"><title id="title">Duas retas próprias, fatores diferentes</title><desc id="desc">Para matriz dois um, um dois, o vetor um um é multiplicado por três, e o vetor um menos um é preservado. Setas no mesmo sistema de coordenadas mostram os vetores e sua imagem. As retas próprias são y igual a x e y igual a menos x; vetores fora delas geralmente mudam de reta.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245fbe"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b7682c"/></marker></defs><rect width="520" height="650" fill="#faf8f2"/><g font-family="system-ui,sans-serif" fill="#17382e"><text x="28" y="42" font-size="24" font-weight="700">Duas retas, dois fatores</text><text x="28" y="78" font-size="19">A = [[2,1],[1,2]]</text><text x="28" y="112" font-size="17">Mesma escala nos dois eixos</text><g stroke="#d0d5c9" stroke-width="1"><path d="M100 180V480M150 180V480M200 180V480M250 180V480M300 180V480M350 180V480M400 180V480M450 180V480"/><path d="M100 180H450M100 230H450M100 280H450M100 330H450M100 380H450M100 430H450M100 480H450"/></g><path d="M100 380H465M200 490V165" stroke="#17382e" fill="none"/><text x="472" y="386" font-size="18">x</text><text x="191" y="154" font-size="18">y</text><text x="183" y="404" font-size="16">0</text><text x="246" y="404" font-size="16">1</text><text x="180" y="335" font-size="16">1</text><path d="M100 480L400 180M100 280L300 480" stroke="#839178" stroke-dasharray="5 5" fill="none"/><path d="M200 380L350 230" stroke="#245fbe" stroke-width="4" marker-end="url(#blue)"/><path d="M200 380L250 330" stroke="#b7682c" stroke-width="3" marker-end="url(#rust)"/><path d="M200 380L250 430" stroke="#b7682c" stroke-width="3" marker-end="url(#rust)"/><text x="355" y="217" font-size="18">Av₊ = (3,3)</text><text x="265" y="323" font-size="18">v₊ = (1,1)</text><text x="265" y="451" font-size="18">v₋ = Av₋</text><path d="M28 511H492" stroke="#17382e"/><text x="28" y="548" font-size="18">A(1,1) = 3(1,1) · λ = 3</text><text x="28" y="582" font-size="18">A(1,−1) = 1(1,−1) · λ = 1</text><text x="28" y="619" font-size="15">Uma direção própria contém infinitos múltiplos.</text><text x="28" y="642" font-size="14">Figura original; nenhuma medição física.</text></g></svg>