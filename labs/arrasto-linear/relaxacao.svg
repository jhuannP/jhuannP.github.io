<svg xmlns="http://www.w3.org/2000/svg" width="440" height="550" viewBox="0 0 440 550" role="img" aria-labelledby="t d"><title id="t">Mesmo limite, duas velocidades iniciais</title><desc id="d">Velocidade dividida pela terminal em função do tempo dividido por tau. A curva do repouso cresce de zero até um; a curva que começa em duas vezes a velocidade terminal decresce até um. Nenhuma ultrapassa o limite neste modelo linear.</desc>
