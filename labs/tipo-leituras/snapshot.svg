<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720"><title>Cópia defensiva e atualização por um novo valor</title><desc>Passo1 cria a Leituras a partir da lista1,2,3. Passo2 altera a lista de origem para100,2,3,mas a continua com tupla1,2,3 e média2. Passo3 b=a.com_acrescimo6 cria tupla1,2,3,6 com média3; a permanece com três valores e média2. Ambas as instâncias usam unidade metro.</desc><rect width="760" height="720" fill="#f7f3e9"/><g font-family="system-ui" fill="#243c38"><text x="28" y="38" font-size="25" font-weight="bold">Preservar um valor é parte do contrato</text><text x="28" y="72" font-size="18">Leituras · unidade m · números prescritos</text><text x="28" y="118" font-size="21" font-weight="bold">1. Criar a com uma cópia defensiva</text><rect x="28" y="138" width="330" height="90" rx="8" fill="#e9d3bc"/><rect x="400" y="138" width="332" height="90" rx="8" fill="#c9ded0"/><text x="48" y="168" font-size="17">origem · lista mutável</text><text x="48" y="204" font-size="26">[1, 2, 3]</text><text x="420" y="168" font-size="17">a.valores · tupla</text><text x="420" y="204" font-size="26">(1, 2, 3)</text><text x="28" y="276" font-size="21" font-weight="bold">2. Executar origem[0] = 100</text><rect x="28" y="296" width="330" height="90" rx="8" fill="#e9d3bc"/><rect x="400" y="296" width="332" height="90" rx="8" fill="#c9ded0"/><text x="48" y="326" font-size="17">origem alterada</text><text x="48" y="362" font-size="26">[100, 2, 3]</text><text x="420" y="326" font-size="17">a permanece</text><text x="420" y="362" font-size="26">(1, 2, 3)</text><text x="28" y="434" font-size="21" font-weight="bold">3. b = a.com_acrescimo(6)</text><rect x="28" y="454" width="330" height="126" rx="8" fill="#c9ded0"/><rect x="400" y="454" width="332" height="126" rx="8" fill="#d5e0ed"/><text x="48" y="484" font-size="17">a · valor anterior</text><text x="48" y="521" font-size="25">(1, 2, 3)</text><text x="48" y="559" font-size="19">3 leituras · média 2 m</text><text x="420" y="484" font-size="17">b · novo valor</text><text x="420" y="521" font-size="25">(1, 2, 3, 6)</text><text x="420" y="559" font-size="19">4 leituras · média 3 m</text><text x="28" y="629" font-size="18">frozen sozinho não congela uma lista interna.</text><text x="28" y="665" font-size="18">Tupla de racionais + validação + operações que criam valores.</text><text x="28" y="700" font-size="14">Modelo de interface local, sem medição real ou certificação de domínio.</text></g></svg>