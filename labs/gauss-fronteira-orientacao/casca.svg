<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Exterior de qual volume?</title><desc id="d">Na casca esférica,a normal externa da borda maior aponta para fora. Na borda da cavidade,aponta para o centro. As setas são normais,não vetores do campo.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2154a0"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="39" font-size="25" font-weight="bold">Exterior de qual volume?</text><text x="24" y="78" font-size="19">Secção de uma casca • setas de normal</text><circle cx="260" cy="233" r="130" fill="#d9e3f0" stroke="#a7b4c8"/><circle cx="260" cy="233" r="67" fill="#f4f6fa" stroke="#a7b4c8"/><circle cx="260" cy="233" r="3" fill="#192e49"/><path d="M390 233H469" stroke="#2154a0" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M327 233H278" stroke="#2154a0" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="408" y="213" font-size="20">n externa</text><text x="225" y="201" font-size="20">cavidade</text><text x="286" y="267" font-size="19">n interna</text><text x="24" y="393" font-size="20">A normal sai do volume, entrando no buraco.</text><text x="24" y="422" font-size="16">Em H radial: fluxo maior +4π; interno −4π.</text></g></svg>