<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Covariâncias mudam a resposta do total</title><desc id="desc">Par de spins com uma ligação em campozero,T2. Odds de interaçãoa1/3,1,3:covariâncias menos1/2,zero,mais1/2;variâncias totais1,2,3;respostas totais1/2,1,3/2.</desc><rect width="760" height="450" rx="18" fill="#f4f0e7"/><g font-family="sans-serif" fill="#20333b"><text x="38" y="48" font-size="25" font-weight="700">Mesma média zero, flutuações diferentes</text><text x="38" y="79" font-size="16">Dois spins · uma ligação · h = 0 · T = 2 em energia</text><path d="M38 111H722M38 176H722M38 244H722M38 312H722M38 380H722" stroke="#bec9bf"/><g font-size="18" font-weight="700"><text x="50" y="149">a = e^(2J/T)</text><text x="280" y="149">C₁₂</text><text x="425" y="149">Var(M)</text><text x="585" y="149">χ total</text></g><g font-size="24"><text x="80" y="220">1/3</text><text x="275" y="220">−1/2</text><text x="460" y="220">1</text><text x="610" y="220">1/2</text><text x="90" y="288">1</text><text x="295" y="288">0</text><text x="460" y="288">2</text><text x="625" y="288">1</text><text x="90" y="356">3</text><text x="280" y="356">1/2</text><text x="460" y="356">3</text><text x="610" y="356">3/2</text></g><text x="38" y="417" font-size="18">Var(M) = 1 + 1 + 2 C₁₂ · χ total = Var(M)/T</text></g></svg>