<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="t d"><title id="t">Mesmo ponto final, duas variações</title><desc id="d">Grades prescritasA eB terminam emW1. A tem variação1 e soma esquerda0;Btem variação1/4e soma esquerda3/8. Ambas têm soma simétrica1/2.</desc><rect width="760" height="430" rx="20" fill="#f5f0e5"/><g font-family="sans-serif" fill="#183f43"><text x="35" y="43" font-size="27">O ponto final não determina a soma.</text><text x="35" y="75" font-size="18">Grades racionais prescritas · não são simulação browniana</text><path d="M75 285H440 M75 285V100" stroke="#64736d" fill="none"/><polyline points="75,285 160,205 245,285 330,205 415,125" stroke="#bd5b39" stroke-width="4" fill="none"/><polyline points="75,285 160,245 245,205 330,165 415,125" stroke="#21736f" stroke-width="4" fill="none"/><text x="430" y="125" font-size="18">W=1</text><text x="65" y="310" font-size="17">0</text><text x="405" y="310" font-size="17">T=1</text><text x="490" y="150" font-size="20" fill="#bd5b39">A: Q=1 · L=0</text><text x="490" y="188" font-size="20" fill="#21736f">B: Q=¼ · L=⅜</text><text x="490" y="240" font-size="20">S=½ nas duas</text><text x="35" y="365" font-size="21">S − L = Q/2 em qualquer grade finita.</text><text x="35" y="404" font-size="17">Refinar a interpolação linear faz Q diminuir; não prova Q→T.</text></g></svg>