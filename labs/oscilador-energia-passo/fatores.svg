<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">Três métodos, três energias</title><desc id="desc">Depois de um passo h igual um com omega igual um, a razão da energia é dois para Euler, cinco quartos para Heun e quinhentos e sessenta e nove sobre quinhentos e setenta e seis para RK4. A referência exata é um.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="38" font-size="25" font-weight="bold">Três métodos, três energias</text><text x="24" y="76" font-size="20">Um passo h=1, ω=1; início (q,p)=(1,0)</text><text x="230" y="106" font-size="18">Referência física: 1</text><path d="M305 115V330" stroke="#8292a8" stroke-dasharray="5 4"/><text x="24" y="151" font-size="21">Euler</text><rect x="145" y="128" width="320" height="30" fill="#2154a0"/><text x="478" y="151" font-size="21">2</text><text x="24" y="226" font-size="21">Heun</text><rect x="145" y="203" width="200" height="30" fill="#2154a0"/><text x="358" y="226" font-size="21">1,25</text><text x="24" y="301" font-size="21">RK4</text><rect x="145" y="278" width="158.055556" height="30" fill="#2154a0"/><text x="318" y="301" font-size="20">569/576</text><path d="M145 120V340H520" stroke="#263e5d" stroke-width="2" fill="none"/><text x="139" y="365" font-size="18">0</text><text x="300" y="365" font-size="18">1</text><text x="460" y="365" font-size="18">2</text><text x="258" y="398" font-size="21">Razão E₁/E₀</text><text x="24" y="426" font-size="16">Sem atrito; os fatores numéricos são exatos neste caso.</text></g></svg>