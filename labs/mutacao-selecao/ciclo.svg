<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490"><title>Compor os processos do ciclo</title><desc>Seleção sobe a frequência de um quarto a dois quintos; mutação baixa a três décimos. A população finita é amostrada depois, podendo perder o alelo.</desc><rect width="420" height="490" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="37" font-size="20" font-weight="700">A ordem faz parte do modelo</text><rect x="24" y="66" width="372" height="65" rx="8" fill="#e7e8e2"/><text x="40" y="94" font-size="16">Início · frequência de A</text><text x="40" y="118" font-size="18">p = 1/4</text><text x="40" y="160" font-size="15">↓ Seleção · pesos 2 para A, 1 para a</text><rect x="24" y="178" width="372" height="65" rx="8" fill="#dce8e1"/><text x="40" y="205" font-size="16">Após normalizar as contribuições</text><text x="40" y="231" font-size="18">p_sel = 2/5</text><text x="40" y="272" font-size="15">↓ Mutação A → a · μ = 1/4</text><rect x="24" y="290" width="372" height="65" rx="8" fill="#e8e0ce"/><text x="40" y="318" font-size="16">Após conservar 3/4 das cópias A</text><text x="40" y="343" font-size="18">F(p) = 3/10</text><text x="40" y="389" font-size="15">↓ Amostragem · M = 4 cópias</text><text x="24" y="426" font-size="17">K pode ser 0, 1, 2, 3 ou 4.</text><text x="24" y="456" font-size="15">P(K=0) = 2401/10000</text><text x="24" y="478" font-size="12">Exemplo sintético; não é uma população observada.</text></g></svg>
