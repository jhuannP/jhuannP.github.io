<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Somar toda a fronteira, com o sinal certo</title><desc id="desc">À esquerda, Stokes no gráfico inclinado: quatro bordas4,42,menos10,menos24 somam12, igual ao fluxo do rotacional. À direita, Gauss na caixa: seis faces menos12,36,menos16,40,menos18,42 somam72, igual à integral da divergência. Campos diferentes nos dois casos.</desc><rect width="760" height="450" rx="18" fill="#f4f0e7"/><g font-family="sans-serif" fill="#20333b"><text x="38" y="48" font-size="25" font-weight="700">Toda a fronteira, orientação consistente</text><text x="38" y="79" font-size="16">Dois exemplos matemáticos originais · campos distintos</text><path d="M380 112V405" stroke="#b9c6bd"/><g font-size="22" font-weight="700"><text x="50" y="139">Stokes: quatro arestas</text><text x="410" y="139">Gauss: seis faces</text></g><g font-size="17"><text x="50" y="172">F = (−y, x, z)</text><text x="410" y="172">G = (x, y, z)</text><text x="50" y="207">Superfície inclinada, normal acima</text><text x="410" y="207">Caixa, todas normais para fora</text></g><g font-size="23"><text x="50" y="253">4 + 42 − 10 − 24</text><text x="410" y="253">−12 + 36 − 16 + 40</text><text x="410" y="284">− 18 + 42</text></g><g font-size="25" font-weight="700" fill="#24665f"><text x="50" y="331">Circulação = 12</text><text x="410" y="331">Fluxo total = 72</text></g><g font-size="17"><text x="50" y="371">Fluxo de curl F = 2 × 2 × 3 = 12</text><text x="410" y="371">Integral de div G = 3 × 24 = 72</text><text x="50" y="422">Não são duas fórmulas intercambiáveis para a mesma integral.</text></g></g></svg>