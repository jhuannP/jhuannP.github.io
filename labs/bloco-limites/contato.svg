<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Força horizontal desloca a reação normal</title><desc id="desc">Bloco retangular empurrado à direita por90N à altura1,2m. Peso300N central, atrito90N à esquerda. Normal300N atua0,36m à direita do centro, dentro da meia base0,4m. Tombamento limite100N; atrito máximo120N.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315a4e"/></marker></defs><rect width="760" height="500" fill="#f5f3e8"/><g font-family="sans-serif" fill="#263c35"><text x="30" y="38" font-size="24" font-weight="bold">Forças fecham; o contato também precisa caber.</text><text x="30" y="72" font-size="18">Modelo hipotético · W300N · B0,8m · H1,2m · μ0,4</text><rect x="200" y="105" width="240" height="285" fill="#dbe7df" stroke="#667c70" stroke-width="2"/><path d="M95 390H650" stroke="#667c70" stroke-width="3"/><path d="M320 230V350 M320 390H190 M428 385V250" fill="none" stroke="#315a4e" stroke-width="3" marker-end="url(#arrow)"/><path d="M125 165H290" fill="none" stroke="#315a4e" stroke-width="3" marker-end="url(#arrow)"/><text x="86" y="145" font-size="19">P90N →</text><text x="333" y="215" font-size="19">W300N</text><text x="452" y="275" font-size="19">N300N</text><text x="118" y="367" font-size="18">atrito90N ←</text><path d="M320 396V416M428 396V416M320 408H428" stroke="#aa785c" stroke-width="2"/><text x="304" y="442" font-size="18">x = PH/W = 0,36m</text><text x="30" y="478" font-size="18">Limiares: tombar100N; deslizar120N. Setas sem escala de força.</text></g></svg>