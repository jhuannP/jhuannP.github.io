<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="t d"><title id="t">Razões menores que um podem se aproximar de um</title><desc id="d">Razões de termos consecutivos das séries um sobre n e um sobre n ao quadrado são menores que um, mas ambas se aproximam de um. A primeira série diverge, a segunda converge. Uma razão constante três quartos permanece separada de um.</desc><rect width="440" height="440" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384b"><text x="20" y="32" font-size="20" font-weight="bold">A distância até 1 importa</text><text x="20" y="58" font-size="14">Razão |aₙ₊₁/aₙ|, não a soma da série</text><path d="M50 90 V310 H400" fill="none" stroke="#adb6c2"/><path d="M50 110 H400" fill="none" stroke="#a3513c" stroke-dasharray="5 4"/><text x="27" y="114" font-size="13">1</text><text x="18" y="214" font-size="13">0,5</text><text x="29" y="314" font-size="13">0</text><text x="175" y="338" font-size="14">n: 1 a 12</text><polyline points="50.00,210.00 79.00,176.67 108.00,160.00 137.00,150.00 166.00,143.33 195.00,138.57 224.00,135.00 253.00,132.22 282.00,130.00 311.00,128.18 340.00,126.67 369.00,125.38" fill="none" stroke="#285eaa" stroke-width="2"/><circle cx="50.00" cy="210.00" r="2.5" fill="#285eaa"/><circle cx="79.00" cy="176.67" r="2.5" fill="#285eaa"/><circle cx="108.00" cy="160.00" r="2.5" fill="#285eaa"/><circle cx="137.00" cy="150.00" r="2.5" fill="#285eaa"/><circle cx="166.00" cy="143.33" r="2.5" fill="#285eaa"/><circle cx="195.00" cy="138.57" r="2.5" fill="#285eaa"/><circle cx="224.00" cy="135.00" r="2.5" fill="#285eaa"/><circle cx="253.00" cy="132.22" r="2.5" fill="#285eaa"/><circle cx="282.00" cy="130.00" r="2.5" fill="#285eaa"/><circle cx="311.00" cy="128.18" r="2.5" fill="#285eaa"/><circle cx="340.00" cy="126.67" r="2.5" fill="#285eaa"/><circle cx="369.00" cy="125.38" r="2.5" fill="#285eaa"/><polyline points="50.00,260.00 79.00,221.11 108.00,197.50 137.00,182.00 166.00,171.11