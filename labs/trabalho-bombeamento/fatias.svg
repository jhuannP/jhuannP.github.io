<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 550" width="440" height="550" role="img" aria-labelledby="t desc"><title id="t">Cone e fatia horizontal: área vezes distância de elevação</title><desc id="desc">Cone com vértice em y zero, altura quatro e raio superior dois metros. Uma fatia na altura y tem raio y dividido por dois. Saída em y seis; distância de elevação é seis menos y.</desc><rect width="440" height="550" fill="#faf8f1"/><g font-family="sans-serif" fill="#17353d"><text x="24" y="30" font-size="21">Cada altura tem outra distância</text><text x="24" y="64" font-size="15">Cone: H = 4 m; saída em y = 6 m</text><path d="M120 200 L220 400 L320 200 Z" fill="#dceae6" stroke="#406e70" stroke-width="2"/><path d="M220 370 H355 V100 H397" fill="none" stroke="#8c5e3d" stroke-width="4"/><path d="M348 115 L355 105 L362 115" fill="none" stroke="#8c5e3d" stroke-width="2"/><text x="313" y="87" font-size="15">saída</text><path d="M220 188 H320" stroke="#17353d" stroke-width="2"/><text x="230" y="177" font-size="15">raio 2 m</text><ellipse cx="220" cy="300" rx="50" ry="10" fill="#e0b87f" stroke="#7a542f"/><path d="M220 300 H270" stroke="#17353d" stroke-width="2"/><text x="274" y="300" font-size="15">r(y)=y/2</text><path d="M96 100 V300 M89 100 H103 M89 300 H103" fill="none" stroke="#17353d" stroke-width="2"/><text x="28" y="220" font-size="15">6−y</text><text x="28" y="240" font-size="13">metros</text><text x="128" y="205" font-size="14">y=4</text><text x="154" y="324" font-size="14">fatia em y</text><text x="205" y="422" font-size="14">y=0</text><text x="24" y="462" font-size="17">Área: A(y)=πy²/4</text><text x="24" y="495" font-size="17">dW = ρg A(y)(6−y) dy</text><text x="24" y="531" font-size="13">Geometria sem escala; cotas definem o modelo.</text></g></svg>