<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">Busca e certificado em soma de subconjunto</title><desc id="desc">Valores dois, cinco e nove; alvo onze. Oito máscaras de três bits representam todos os subconjuntos. Máscara de bits um, zero, um corresponde aos índices zero e dois, soma onze. Conferir esse candidato usa dois valores e não exige testar os outros sete.</desc><rect width="440" height="460" rx="12" fill="#f4f6f2"/><g fill="#183038" font-family="Arial,sans-serif"><text x="24" y="34" font-size="21" font-weight="700">Busca e certificado</text><text x="24" y="64" font-size="17">Valores [2,5,9] · alvo 11 · índices 0,1,2</text><g font-size="15"><text x="30" y="100">b₂b₁b₀</text><text x="148" y="100">Índices</text><text x="335" y="100">Soma</text></g><g font-family="monospace" font-size="19"><text x="30" y="132">000</text><text x="148" y="132">[]</text><text x="350" y="132">0</text><text x="30" y="162">001</text><text x="148" y="162">[0]</text><text x="350" y="162">2</text><text x="30" y="192">010</text><text x="148" y="192">[1]</text><text x="350" y="192">5</text><text x="30" y="222">011</text><text x="148" y="222">[0,1]</text><text x="350" y="222">7</text><text x="30" y="252">100</text><text x="148" y="252">[2]</text><text x="350" y="252">9</text><rect x="18" y="260" width="404" height="28" rx="4" fill="#dce7ff"/><text x="30" y="282">101</text><text x="148" y="282">[0,2]</text><text x="350" y="282">11</text><text x="30" y="312">110</text><text x="148" y="312">[1,2]</text><text x="350" y="312">14</text><text x="30" y="342">111</text><text x="148" y="342">[0,1,2]</text><text x="350" y="342">16</text></g><text x="24" y="402" font-size="17" fill="#243faa">Certificado [0,2]: 2 + 9 = 11 ✓</text><text x="24" y="431" font-size="14">Lista completa: evidencia oito possibilidades.</text></g></svg>