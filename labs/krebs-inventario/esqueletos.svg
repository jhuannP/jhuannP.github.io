<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="t d"><title id="t">Esqueletos carbônicos e regeneração</title><desc id="d">O grupo acetil de dois carbonos e oxaloacetato de quatro formam citrato de seis. Duas descarboxilações reduzem seis a cinco e a quatro; a sequência regenera oxaloacetato de quatro carbonos.</desc><rect width="440" height="620" fill="#f3f6ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Carbonos: entrada, perdas e retorno</text><text x="24" y="67" font-size="14">Esqueleto do intermediário · CoA fora da contagem</text><text x="25" y="108" font-size="17">Oxaloacetato + acetil</text><text x="310" y="108" font-size="17" fill="#294dbc">4 + 2</text><text x="38" y="135" font-size="18" fill="#294dbc">↓</text><text x="25" y="159" font-size="17">Citrato</text><text x="310" y="159" font-size="17" fill="#294dbc">6</text><text x="38" y="186" font-size="18" fill="#294dbc">↓</text><text x="25" y="210" font-size="17">Isocitrato</text><text x="310" y="210" font-size="17" fill="#294dbc">6</text><text x="38" y="237" font-size="18" fill="#294dbc">↓</text><text x="25" y="261" font-size="17">α-Cetoglutarato</text><text x="310" y="261" font-size="17" fill="#294dbc">5  + CO₂</text><text x="38" y="288" font-size="18" fill="#294dbc">↓</text><text x="25" y="312" font-size="17">Succinil-CoA</text><text x="310" y="312" font-size="17" fill="#294dbc">4  + CO₂</text><text x="38" y="339" font-size="18" fill="#294dbc">↓</text><text x="25" y="363" font-size="17">Succinato</text><text x="310" y="363" font-size="17" fill="#294dbc">4</text><text x="38" y="390" font-size="18" fill="#294dbc">↓</text><text x="25" y="414" font-size="17">Fumarato</text><text x="310" y="414" font-size="17" fill="#294dbc">4</text><text x="38" y="441" font-size="18" fill="#294dbc">↓</text><text x="25" y="465" font-size="17">L-Malato</text><text x="310" y="465" font-size="17" fill="#294dbc">4</text><text x="38" y="492" font-size="18" fill="#294dbc">↓</text><text x="25" y="516" font-size="17">Oxaloacetato regenerado</text><text x="310" y="516" font-size="17" fill="#294dbc">4</text><path d="M24 553 H416" stroke="#cbd4e8"/><text x="24" y="579" font-size="14">Saldo por volta: entram 2C e saem 2CO₂.</text><text x="24" y="604" font-size="12">Figura original · não identifica a posição de cada átomo</text></g></svg>