<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 555" width="440" height="555" role="img" aria-labelledby="t desc"><title id="t">Medição em x muda as estatísticas de uma medição posterior em z</title><desc id="desc">Estado inicial mais z. Medir z diretamente dá mais com probabilidade um. Medir x e selecionar mais x tem chance meio; no ramo selecionado, mais z tem chance meio e a chance conjunta é um quarto. Medir x sem selecionar dá chance meio para mais z.</desc><rect width="440" height="555" fill="#faf8f1"/><g font-family="sans-serif" fill="#17343d"><text x="24" y="34" font-size="21">Qual procedimento foi feito?</text><text x="24" y="67" font-size="16">Preparação inicial: |+z〉</text><rect x="24" y="98" width="390" height="93" rx="5" fill="#d9e8e2"/><text x="40" y="128" font-size="18">1. Medir z diretamente</text><text x="40" y="162" font-size="18">P(+z) = 1</text><rect x="24" y="209" width="390" height="164" rx="5" fill="#e5e0d4"/><text x="40" y="239" font-size="18">2. Medir x; selecionar +x</text><text x="40" y="274" font-size="16">P(+x) = 1/2</text><text x="40" y="307" font-size="16">Depois: P(+z | +x) = 1/2</text><text x="40" y="345" font-size="17">P(+x e depois +z) = 1/4</text><rect x="24" y="392" width="390" height="95" rx="5" fill="#e4dce9"/><text x="40" y="422" font-size="18">3. Medir x; não selecionar</text><text x="40" y="458" font-size="18">Depois: P(+z) = 1/2</text><text x="24" y="528" font-size="14">Medições projetivas ideais; sem modelo do aparelho.</text></g></svg>