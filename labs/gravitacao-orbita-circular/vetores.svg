<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Gravidade curva a velocidade</title><desc id="d">Um corpo central e um satélite à direita. A força aponta à esquerda para o centro e a velocidade para cima,tangente à órbita. Raio orbital é R mais h.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2154a0"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="38" font-size="25" font-weight="bold">Velocidade tangente, força central</text><text x="24" y="75" font-size="19">r = R + h • modelo circular, sem escala</text><circle cx="235" cy="236" r="115" fill="none" stroke="#a7b4c8" stroke-dasharray="5 5"/><circle cx="235" cy="236" r="45" fill="#d2dfef" stroke="#a7b4c8"/><circle cx="350" cy="236" r="6" fill="#2154a0"/><path d="M343 236H288" stroke="#2154a0" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M350 228V142" stroke="#2154a0" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="300" y="219" font-size="22">Fg</text><text x="365" y="175" font-size="22">v</text><text x="224" y="243" font-size="20">M</text><path d="M235 295h45 M280 295h70" stroke="#192e49" fill="none"/><path d="M235 288v14 M280 288v14 M350 288v14" stroke="#192e49" fill="none"/><text x="250" y="324" font-size="20">R</text><text x="310" y="324" font-size="20">h</text><text x="24" y="389" font-size="20">Fg é a resultante centrípeta.</text><text x="24" y="420" font-size="17">Ausência de apoio não significa gravidade nula.</text></g></svg>