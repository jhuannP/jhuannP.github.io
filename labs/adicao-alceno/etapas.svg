<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="t d"><title id="t">Adição iônica ao propeno</title><desc id="d">O par pi liga C1 ao hidrogênio Ha e o par H–Cl vai ao cloro. O carbocátion em C2 é então capturado por cloreto. Cada estado conserva26elétrons.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#246153" stroke-width="1.5"/></marker></defs><rect width="900" height="650" fill="#f5f2e9"/><g font-family="sans-serif" fill="#25312b"><text x="40" y="55" font-size="29">Do par π à nova ligação</text><text x="40" y="95" font-size="22">Caso clássico · átomos marcados · via iônica formal</text><text x="40" y="150" font-size="22">1. Protonação</text><text x="80" y="226" font-size="29">C₁H₂</text><path d="M185 213H230M185 227H230M325 220H345M625 220H675" stroke="#25312b" stroke-width="2"/><text x="246" y="226" font-size="29">C₂H</text><text x="358" y="226" font-size="29">C₃H₃</text><text x="570" y="226" font-size="29">Hₐ</text><text x="692" y="226" font-size="29">Cl</text><path d="M208 213 Q400 105 582 205" stroke="#246153" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M650 220 Q680 163 707 207" stroke="#246153" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="80" y="297" font-size="28">C₁H₂(Hₐ) – C₂H⁺ – C₃H₃   +   Cl⁻</text><text x="80" y="341" font-size="22">C₂: 6 elétrons · CF +1     |     Cl⁻: 4 pares livres</text><path d="M40 374H850" stroke="#b5bfb0"/><text x="40" y="424" font-size="22">2. Captura de cloreto: par livre → C₂</text><text x="80" y="490" font-size="29">C₁H₂(Hₐ) – C₂H(Cl) – C₃H₃</text><text x="80" y="535" font-size="24">2-cloropropano · octetos completos · carga total 0</text><path d="M40 568H850" stroke="#b5bfb0"/><text x="40" y="615" font-size="22">26 elétrons em cada estado ≠ prova de mecanismo ou rendimento</text></g></svg>