<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">O que a fonte mantém fixo?</title><desc id="desc">Na primeira coluna, tensão fixa e resistência dobrada dão corrente e potência pela metade. Na segunda, corrente fixa e resistência dobrada dão tensão e potência em dobro.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="39" font-size="25" font-weight="bold">O que a fonte mantém fixo?</text><text x="24" y="78" font-size="20">Duas comparações entre R e 2R</text><path d="M24 101h512" stroke="#acb9ca"/><text x="28" y="147" font-size="24" font-weight="bold">V fixo</text><text x="318" y="147" font-size="24" font-weight="bold">I fixo</text><text x="28" y="196" font-size="22">P = V²/R</text><text x="318" y="196" font-size="22">P = I²R</text><text x="28" y="240" font-size="21">R → 2R</text><text x="318" y="240" font-size="21">R → 2R</text><path d="M115 258v31m0 0l-6 -8m6 8l6 -8M405 258v31m0 0l-6 -8m6 8l6 -8" fill="none" stroke="#2154a0" stroke-width="2"/><text x="28" y="329" font-size="28" fill="#2154a0">P → P/2</text><text x="318" y="329" font-size="28" fill="#2154a0">P → 2P</text><text x="28" y="372" font-size="21">I → I/2</text><text x="318" y="372" font-size="21">V → 2V</text><text x="24" y="418" font-size="17">Fontes ideais; resistência avaliada em cada estado.</text></g></svg>