<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="t d"><title id="t">Translação conjunta conserva a separação</title><desc id="d">Duas configurações de massas um e três. A segunda é deslocada cinco metros para a direita; a distância entre as partículas permanece três metros e a deformação da mola permanece um metro. O centro de massa muda de zero para cinco metros.</desc><rect width="440" height="460" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384b"><text x="20" y="34" font-size="20" font-weight="bold">Mover as duas, manter a relação</text><text x="20" y="61" font-size="14">m₁=1 kg · m₂=3 kg · ℓ₀=2 m</text><text x="20" y="103" font-size="16" font-weight="bold">Antes: R=0 m</text><path d="M20 145 H140 M20 175 H390" fill="none" stroke="#aab5c3"/><path d="M20 145 L35 135 L45 155 L55 135 L65 155 L75 135 L85 155 L95 135 L105 155 L120 145 H140" fill="none" stroke="#6f839f" stroke-width="2"/><circle cx="20" cy="145" r="12" fill="#285ea8"/><circle cx="140" cy="145" r="8" fill="#9c6a3b"/><text x="20" y="207" font-size="14">x₂=−0,75</text><text x="122" y="207" font-size="14">x₁=2,25 m</text><text x="20" y="251" font-size="16" font-weight="bold">Depois: a=+5 m → R=5 m</text><path d="M220 295 H340 M20 325 H390" fill="none" stroke="#aab5c3"/><path d="M220 295 L235 285 L245 305 L255 285 L265 305 L275 285 L285 305 L295 285 L305 305 L320 295 H340" fill="none" stroke="#6f839f" stroke-width="2"/><circle cx="220" cy="295" r="12" fill="#285ea8"/><circle cx="340" cy="295" r="8" fill="#9c6a3b"/><text x="190" y="357" font-size="14">x₂=4,25</text><text x="316" y="357" font-size="14">x₁=7,25 m</text><text x="20" y="405" font-size="16">Nos dois casos: x₁−x₂=3 m, U=1,5 J</text><text x="20" y="437" font-size="13">Esquema de posições; mola ideal, sem suporte fixo.</text></g></svg>