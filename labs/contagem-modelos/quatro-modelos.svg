<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">Mesmo n e k, quatro contagens</title><desc id="d">Com cinco opções e três escolhas: ordem conta e sem repetição, 60; sem ordem e sem repetição, 10; ordem conta com repetição, 125; sem ordem com repetição, 35.</desc><rect width="440" height="420" fill="#f2f1e7"/><g font-family="sans-serif" fill="#262722"><text x="24" y="31" font-size="19" font-weight="bold">Cinco opções. Três escolhas.</text><g font-size="16" text-anchor="middle"><text x="216" y="74">Ordem conta</text><text x="349" y="74">Sem ordem</text></g><path d="M150 95H416 M150 220H416 M150 345H416 M150 95V345 M283 95V345 M416 95V345" stroke="#777" fill="none"/><g font-size="16"><text x="24" y="147">Sem</text><text x="24" y="171">repetir</text><text x="24" y="273">Pode</text><text x="24" y="297">repetir</text></g><g font-size="28" fill="#273fbb" font-weight="bold" text-anchor="middle"><text x="216" y="151">60</text><text x="349" y="151">10</text><text x="216" y="277">125</text><text x="349" y="277">35</text></g><g font-size="15" text-anchor="middle"><text x="216" y="182">5×4×3</text><text x="349" y="182">60/3!</text><text x="216" y="308">5³</text><text x="349" y="308">C(7,3)</text></g><text x="24" y="380" font-size="15">A fórmula vem depois do modelo de escolha.</text><text x="24" y="405" font-size="14">São contagens, sem atribuição de probabilidades.</text></g></svg>
