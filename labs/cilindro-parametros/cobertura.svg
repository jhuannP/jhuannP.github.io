<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="t d"><title id="t">A mesma lateral, uma ou duas voltas</title><desc id="d">Uma volta sobre o cilindro conta área12π. Duas voltas no mesmo domínio contam24π,com multiplicidade. A área geométrica permanece12π.</desc><rect width="900" height="540" fill="#f5f2e9"/><g font-family="sans-serif" fill="#25312b"><text x="40" y="58" font-size="29">A mesma lateral pode ser contada duas vezes</text><text x="40" y="102" font-size="23">R = 2 m · H = 3 m · área geométrica = 12π m²</text><g fill="#e0e9dc" stroke="#7c8c77"><rect x="40" y="164" width="360" height="164" rx="4"/><rect x="480" y="164" width="360" height="164" rx="4"/></g><path d="M660 164V328" stroke="#7c8c77" stroke-dasharray="7 5"/><text x="70" y="212" font-size="24">θ = 2πu</text><text x="510" y="212" font-size="24">θ = 4πu</text><text x="70" y="273" font-size="24">1 volta</text><text x="510" y="273" font-size="24">1ª volta</text><text x="686" y="273" font-size="24">2ª volta</text><g fill="#246153" font-size="30"><text x="40" y="390">Integral: 12π m²</text><text x="480" y="390">Integral: 24π m²</text></g><path d="M40 430H840" stroke="#b9c1b5"/><text x="40" y="476" font-size="23">0 ≤ u,v ≤ 1 · z = 3v · retângulos de parâmetros</text><text x="40" y="515" font-size="21">Duas coberturas não satisfazem a hipótese de bijeção.</text></g></svg>