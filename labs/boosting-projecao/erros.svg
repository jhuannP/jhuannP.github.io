<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Treino melhora, ponto reservado piora</title><desc id="desc">Tabela para rodadas zero, um, dois e cinco. MSE de treino 1, um quarto, um dezesseis e um sobre 1024. Erro no ponto reservado zero, um quarto, nove dezesseis e 961 sobre 1024.</desc><rect width="760" height="450" rx="18" fill="#12242c"/><g fill="#eef5ef" font-family="sans-serif"><text x="32" y="48" font-size="25">Um ajuste melhor pode errar o intervalo</text><text x="32" y="82" font-size="17">Dados sintéticos · passo 1/2 · alvo reservado (1,5; 1)</text><g font-size="19"><text x="45" y="140">Rodadas</text><text x="230" y="140">MSE treino</text><text x="470" y="140">Erro reservado</text><text x="75" y="190">0</text><text x="260" y="190">1</text><text x="510" y="190">0</text><text x="75" y="235">1</text><text x="260" y="235">1/4</text><text x="510" y="235">1/4</text><text x="75" y="280">2</text><text x="260" y="280">1/16</text><text x="510" y="280">9/16</text><text x="75" y="325">5</text><text x="260" y="325">1/1024</text><text x="510" y="325">961/1024</text></g><text x="32" y="387" font-size="17" fill="#97d9bf">O treino não determina o valor entre suas observações.</text><text x="32" y="418" font-size="16">Escolher rodadas por esse ponto o transforma em validação.</text></g></svg>