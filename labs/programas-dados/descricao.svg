<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" role="img" aria-labelledby="title desc"><title id="title">Uma descrição, duas leituras</title><desc id="desc">O programa ADD3 e MUL2 pode ser interpretado com entrada zero e dar zero, três, seis. Sua forma simbólica é dois x mais seis, que dá quatorze para entrada quatro. A descrição JSON é um dado, diferente das operações aplicadas a ela.</desc><rect width="520" height="420" fill="#f6f3eb"/><g font-family="sans-serif" fill="#172845"><text x="20" y="40" font-size="28" font-weight="bold">Uma descrição, duas leituras</text><text x="20" y="92" font-size="23" font-family="monospace">[["ADD",3],["MUL",2]]</text><path d="M20 120 H500" stroke="#264bb5" stroke-width="2"/><text x="20" y="166" font-size="25">Interpretar com x=0:</text><text x="20" y="210" font-size="28" fill="#264bb5">0 → 3 → 6</text><text x="20" y="268" font-size="25">Transformar simbolicamente:</text><text x="20" y="311" font-size="28" fill="#264bb5">a=2, b=6 → f(x)=2x+6</text><text x="20" y="373" font-size="25">Com x=4, as duas formas dão 14.</text></g></svg>
