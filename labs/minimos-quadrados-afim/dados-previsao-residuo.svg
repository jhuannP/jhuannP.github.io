<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" role="img" aria-labelledby="title desc"><title id="title">Dados, previsão e resíduo</title><desc id="desc">Para abscissas zero, um, dois, os dados um, dois, dois são aproximados pela reta de intercepto sete sextos e inclinação um meio. Previsões sete sextos, cinco terços, treze sextos. Resíduos um sexto, menos um terço, um sexto; soma zero e produto por x com soma zero. Soma de quadrados um sexto.</desc><rect width="430" height="450" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="35" font-size="23" font-weight="bold">ŷ = 7/6 + (1/2)x</text><text x="22" y="67" font-size="18">r = previsão − observado</text><text x="30" y="117" font-size="22" font-weight="bold">x</text><text x="110" y="117" font-size="22" font-weight="bold">y</text><text x="210" y="117" font-size="22" font-weight="bold">ŷ</text><text x="320" y="117" font-size="22" font-weight="bold">r</text><path d="M22 137H408" stroke="#aab7ae"/><text x="30" y="169" font-size="23">0</text><text x="110" y="169" font-size="23">1</text><text x="210" y="169" font-size="23">7/6</text><text x="320" y="169" font-size="23">1/6</text><path d="M22 194H408" stroke="#aab7ae"/><text x="30" y="226" font-size="23">1</text><text x="110" y="226" font-size="23">2</text><text x="210" y="226" font-size="23">5/3</text><text x="320" y="226" font-size="23">−1/3</text><path d="M22 251H408" stroke="#aab7ae"/><text x="30" y="283" font-size="23">2</text><text x="110" y="283" font-size="23">2</text><text x="210" y="283" font-size="23">13/6</text><text x="320" y="283" font-size="23">1/6</text><path d="M22 310H408" stroke="#aab7ae"/><text x="22" y="349" font-size="21">Σ r = 0 · Σ xr = 0</text><text x="22" y="389" font-size="23" font-weight="bold">Σ r² = 1/6</text><text x="22" y="427" font-size="18">Ajuste mínimo, erro não nulo.</text></g></svg>