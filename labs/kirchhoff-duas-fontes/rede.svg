<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="title desc"><title id="title">Duas fontes ligadas ao nó U</title><desc id="desc">Nó superior U igual a 8 volts e inferior zero. Ramo esquerdo: resistor 2 ohms e fonte 12 volts, polo positivo acima. Ramo direito: resistor 3 ohms e fonte 6 volts, polo positivo acima. Ramo central: resistor 6 ohms. I1 e I2 são orientadas para cima; I3 para baixo. I1 é 2 ampères, I2 menos dois terços e I3 quatro terços.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2348db"/></marker></defs><rect width="440" height="430" fill="#f4f3eb"/><g font-family="Arial,sans-serif" fill="#20221e" font-size="17"><text x="22" y="30" font-size="21" font-weight="bold">O sentido vem antes da conta</text><text x="22" y="57">Setas de referência, fontes ideais e corrente DC.</text><g fill="none" stroke="#20221e" stroke-width="2"><path d="M70 150V105H370V150 M70 200V242 M70 288V335H370V288 M370 242V200 M220 105V185 M220 250V335"/><rect x="55" y="150" width="30" height="50"/><rect x="355" y="150" width="30" height="50"/><rect x="205" y="185" width="30" height="65"/><circle cx="70" cy="265" r="23"/><circle cx="370" cy="265" r="23"/></g><circle cx="220" cy="105" r="4"/><circle cx="220" cy="335" r="4"/><text x="175" y="90">U=8 V</text><text x="232" y="359">0 V</text><text x="22" y="136">R₁=2 Ω</text><text x="324" y="136">R₂=3 Ω</text><text x="244" y="220">R₃=6 Ω</text><text x="62" y="260">+</text><text x="62" y="280">−</text><text x="362" y="260">+</text><text x="362" y="280">−</text><text x="20" y="316">E₁=12 V</text><text x="322" y="316">E₂=6 V</text><g stroke="#2348db" stroke-width="2" marker-end="url(#arrow)"><path d="M105 242V205"/><path d="M405 242V205"/><path d="M183 184V226"/></g><text x="112" y="231" fill="#2348db">I₁</text><text x="405" y="268" fill="#2348db">I₂</text><text x="157" y="219" fill="#2348db">I₃</text><text x="22" y="393">I₁=2 A; I₂=−2/3 A; I₃=4/3 A.</text><text x="22" y="419" font-size="16">I₂ negativa: fluxo real oposto à seta escolhida.</text></g></svg>