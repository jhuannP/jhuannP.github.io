<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450" role="img" aria-labelledby="t d"><title id="t">Fatores de um passo com duas escalas</title><desc id="d">Emh0,1,a taxa lenta1 tem fatores0,9,10/11 e exp−0,1. A taxa rápida100 tem fatores−9,1/11 e exp−10. O implícito estável ainda difere da queda rápida exata.</desc><rect width="440" height="450" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">O passo precisa enxergar a escala</text><text x="24" y="67" font-size="16">h = 0,1 · valores iniciais iguais a 1</text><text x="180" y="112" font-size="16" font-weight="bold">lento: λ = 1</text><text x="302" y="112" font-size="16" font-weight="bold">rápido: λ = 100</text><path d="M24 132 H416" stroke="#ccd3e6"/><text x="24" y="173" font-size="16">Explícito</text><text x="185" y="173" font-size="19">0,9</text><text x="325" y="173" font-size="19" fill="#294dbc">−9</text><text x="24" y="228" font-size="16">Implícito</text><text x="185" y="228" font-size="19">10/11</text><text x="325" y="228" font-size="19" fill="#294dbc">1/11</text><text x="24" y="283" font-size="16">Exato (aprox.)</text><text x="185" y="283" font-size="17">0,90484</text><text x="315" y="283" font-size="17">0,0000454</text><path d="M24 312 H416" stroke="#ccd3e6"/><text x="24" y="351" font-size="15">1/11 ≈ 0,09091: decai, mas não resolve</text><text x="24" y="377" font-size="15">com precisão o transiente rápido neste passo.</text><text x="24" y="427" font-size="12">Figura original · fatores adimensionais, não dados medidos</text></g></svg>