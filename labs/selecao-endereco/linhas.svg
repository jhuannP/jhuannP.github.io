<svg xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410"><title>Endereço dois ativa a linha dois</title><desc>Bits de endereço s um igual a um e s zero igual a zero entram no decodificador. EN um. D dois é um, demais linhas zero.</desc><rect width="420" height="410" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="36" font-size="20" font-weight="700">Código não é dado selecionado</text><text x="24" y="77" font-size="16">s₁s₀ = 10 · índice = 2 · EN = 1</text><rect x="24" y="117" width="152" height="148" rx="8" fill="#dce8e1"/><text x="39" y="177" font-size="17">Decodificador</text><text x="39" y="207" font-size="17">2 bits → 4 linhas</text><path d="M176 137H290M176 172H290M176 207H290M176 242H290" stroke="#bdc7bf" stroke-width="2"/><path d="M176 207H290" stroke="#205bc1" stroke-width="4"/><text x="304" y="143" font-size="17">D₀ = 0</text><text x="304" y="178" font-size="17">D₁ = 0</text><text x="304" y="213" font-size="17" fill="#205bc1">D₂ = 1</text><text x="304" y="248" font-size="17">D₃ = 0</text><text x="24" y="306" font-size="18">Lista por índice: [0, 0, 1, 0]</text><text x="24" y="346" font-size="15">Com EN = 0: [0, 0, 0, 0]</text><text x="24" y="382" font-size="13">Modelo lógico ideal; não representa atrasos.</text></g></svg>
