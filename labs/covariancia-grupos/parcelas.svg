<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Covariância dentro,entre e total</title><desc id="d">No modelo de grupos equiprováveis,a parcela dentro émenosum,a parcela entre équatro ea soma étrês.</desc><rect width="900" height="500" fill="#f5f2e9"/><g font-family="sans-serif" fill="#25312b"><text x="40" y="55" font-size="29">A soma pode ter outro sinal</text><text x="40" y="97" font-size="23">q = 1/2 · modelo finito conhecido · sem dados reais</text><path d="M410 145V375" stroke="#8e9a89" stroke-width="2"/><g font-size="24"><text x="40" y="192">Dentro dos grupos</text><text x="40" y="274">Entre as médias</text><text x="40" y="356">Total</text></g><rect x="335" y="165" width="75" height="40" fill="#8c4c2f"/><rect x="410" y="247" width="300" height="40" fill="#246153"/><rect x="410" y="329" width="225" height="40" fill="#246153"/><g font-size="24"><text x="289" y="194">−1</text><text x="725" y="276">+4</text><text x="650" y="358">+3</text></g><text x="403" y="411" font-size="21">0</text><text x="40" y="465" font-size="23">Cov(X,Y) = −1 + 4 = 3 · não é uma decomposição causal</text></g></svg>