<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-labelledby="title desc"><title id="title">O mesmo corte deixa caudas diferentes</title><desc id="desc">Para corte B igual a dez, as barras representam a fração da integral total já acumulada e a fração ainda na cauda. Expoente dois deixa dez por cento; expoente três deixa um por cento; expoente um vírgula um deixa aproximadamente setenta e nove vírgula quarenta e três por cento. As integrais totais são diferentes e cada barra foi normalizada separadamente.</desc><rect width="520" height="620" fill="#faf8f2"/><g font-family="system-ui,sans-serif" fill="#17382e"><text x="28" y="43" font-size="24" font-weight="700">O mesmo corte B = 10</text><text x="28" y="76" font-size="17">Cada barra = 100% da sua integral total</text><rect x="28" y="101" width="15" height="15" fill="#245fbe"/><text x="51" y="114" font-size="16">Parte acumulada</text><rect x="265" y="101" width="15" height="15" fill="#b7682c"/><text x="288" y="114" font-size="16">Cauda restante</text><text x="28" y="161" font-size="20" font-weight="700">p = 2 · total = 1</text><rect x="28" y="180" width="414" height="32" fill="#245fbe"/><rect x="442" y="180" width="46" height="32" fill="#b7682c"/><text x="28" y="241" font-size="18">Acumulado: 0,9 · cauda: 0,1 (10%)</text><text x="28" y="297" font-size="20" font-weight="700">p = 3 · total = 1/2</text><rect x="28" y="316" width="455.4" height="32" fill="#245fbe"/><rect x="483.4" y="316" width="4.6" height="32" fill="#b7682c"/><text x="28" y="377" font-size="18">Acumulado: 0,495 · cauda: 0,005 (1%)</text><text x="28" y="433" font-size="20" font-weight="700">p = 1,1 · total = 10</text><rect x="28" y="452" width="94.609" height="32" fill="#245fbe"/><rect x="122.609" y="452" width="365.391" height="32" fill="#b7682c"/><text x="28" y="513" font-size="18">Cauda ≈ 7,943 (79,43% do total)</text><path d="M28 541H488" stroke="#17382e"/><text x="28" y="573" font-size="17">Convergência não garante um corte pequeno.</text><text x="28" y="602" font-size="15">Valores do terceiro caso e larguras arredondados.</text></g></svg>