<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" role="img" aria-labelledby="title desc"><title id="title">Entradas e saídas em duas pontas de actina</title><desc id="desc">Reservatório a dois micromolar. Ponta mais: entrada seis, saída três, saldo mais três. Ponta menos: entrada dois, saída cinco, saldo menos três. Todas as taxas em subunidades por segundo. O saldo total é zero, embora haja renovação. Diagrama de balanços sem escala geométrica.</desc><rect width="420" height="470" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="35" font-size="23" font-weight="bold">Concentração livre: 2 μM</text><text x="22" y="65" font-size="18">Taxas em subunidades/s</text><path d="M22 88H398" stroke="#aab7ae"/><text x="22" y="118" font-size="22" font-weight="bold">Ponta mais (+)</text><text x="22" y="153" font-size="21">Entrada 6 − saída 3</text><text x="22" y="188" font-size="22">Saldo: +3</text><path d="M22 228H398" stroke="#aab7ae"/><text x="22" y="258" font-size="22" font-weight="bold">Ponta menos (−)</text><text x="22" y="293" font-size="21">Entrada 2 − saída 5</text><text x="22" y="328" font-size="22">Saldo: −3</text><path d="M22 370H398" stroke="#aab7ae"/><text x="22" y="409" font-size="23" font-weight="bold">Saldo total: 0</text><text x="22" y="443" font-size="18">Tamanho médio constante ≠ imobilidade</text></g></svg>