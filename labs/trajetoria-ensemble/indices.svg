<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" role="img" aria-labelledby="t d"><title id="t">Média por instante e média por trajetória</title><desc id="d">Duas trajetórias equiprováveis constantes, uma sempre menos um e outra sempre mais um. A média entre elas é zero em cada instante, mas suas médias no tempo são menos um e mais um.</desc><rect width="440" height="350" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822" font-size="16"><text x="20" y="30" font-size="20" font-weight="bold">Qual índice permanece fixo?</text><text x="20" y="58">Duas trajetórias, cada uma com peso 1/2</text><text x="25" y="103">n</text><text x="104" y="103">0</text><text x="164" y="103">1</text><text x="224" y="103">2</text><text x="284" y="103">3</text><text x="346" y="103">média</text><text x="20" y="146">ω₋</text><text x="96" y="146">−1</text><text x="156" y="146">−1</text><text x="216" y="146">−1</text><text x="276" y="146">−1</text><text x="351" y="146" fill="#2448bc">−1</text><text x="20" y="195">ω₊</text><text x="100" y="195">+1</text><text x="160" y="195">+1</text><text x="220" y="195">+1</text><text x="280" y="195">+1</text><text x="351" y="195" fill="#2448bc">+1</text><path d="M80 117H398 M80 212H398 M326 88V258" stroke="#777b70" fill="none"/><text x="20" y="246">média</text><text x="104" y="246" fill="#2448bc">0</text><text x="164" y="246" fill="#2448bc">0</text><text x="224" y="246" fill="#2448bc">0</text><text x="284" y="246" fill="#2448bc">0</text><text x="20" y="290">Mais instantes repetem o mesmo sinal.</text><text x="20" y="320">Não criam novas realizações independentes.</text></g></svg>