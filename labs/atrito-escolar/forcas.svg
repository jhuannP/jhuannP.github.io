<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><title>Diagrama do bloco em repouso e início de deslizamento</title><desc>Em ambos os casos massa quatro quilogramas, peso e normal quarenta newtons. À esquerda força aplicada dez e atrito menos dez mantêm repouso. À direita força vinte e quatro e atrito menos doze iniciam deslizamento para a direita com aceleração três. Escala de três pixels por newton em todas as setas.</desc><defs><marker id="forceArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="900" height="500" fill="#f5f3eb"/><g font-family="sans-serif" fill="#252720"><text x="35" y="36" font-size="23">Atrito se ajusta ao repouso; deslizamento muda a regra</text><text x="35" y="68" font-size="16">m = 4 kg · g = 10 m/s² · μs = 0,5 · μk = 0,3 · setas: 3 px/N</text><text x="100" y="92" font-size="19">Repouso admissível</text><path d="M75,280 H375" stroke="#777"/><rect x="185" y="225" width="80" height="50" fill="#e1dfd4" stroke="#555"/><path d="M225,225 L225,105" stroke="#245a50" stroke-width="2.8" marker-end="url(#forceArrow)"/><path d="M225,275 L225,395" stroke="#245a50" stroke-width="2.8" marker-end="url(#forceArrow)"/><path d="M265,250 L295,250" stroke="#635485" stroke-width="2.8" marker-end="url(#forceArrow)"/><path d="M185,250 L155,250" stroke="#8b552f" stroke-width="2.8" marker-end="url(#forceArrow)"/><text x="237" y="145" font-size="17">N = 40 N</text><text x="237" y="380" font-size="17">P = 40 N</text><text x="270" y="228" font-size="17" fill="#635485">F = 10 N</text><text x="70" y="228" font-size="17" fill="#8b552f">f = −10 N</text><text x="100" y="435" font-size="18">a = 0 m/s²</text><text x="550" y="92" font-size="19">Início para a direita</text><path d="M525,280 H825" stroke="#777"/><rect x="635" y="225" width="80" height="50" fill="#e1dfd4" stroke="#555"/><path d="M675,225 L675,105" stroke="#245a50" stroke-width="2.8" marker-end="url(#forceArrow)"/><path d="M675,275 L675,395" stroke="#245a50" stroke-width="2.8" marker-end="url(#forceArrow)"/><path d="M715,250 L787,250" stroke="#635485" stroke-width="2.8" marker-end="url(#forceArrow)"/><path d="M635,250 L599,250" stroke="#8b552f" stroke-width="2.8" marker-end="url(#forceArrow)"/><text x="687" y="145" font-size="17">N = 40 N</text><text x="687" y="380" font-size="17">P = 40 N</text><text x="720" y="228" font-size="17" fill="#635485">F = 24 N</text><text x="520" y="228" font-size="17" fill="#8b552f">f = −12 N</text><text x="550" y="435" font-size="18">a = 3 m/s²</text><text x="35" y="480" font-size="17">Modelo de contato ideal · valores escolhidos, não medidos · eixo x positivo à direita</text></g></svg>