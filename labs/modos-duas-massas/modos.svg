<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Modos em fase e em oposição</title><desc id="desc">Duas massas iguais entre paredes com molas externas k zero e mola central k c. No modo simétrico as massas se deslocam no mesmo sentido e a mola central não muda de comprimento: omega s ao quadrado igual a k zero por m. No modo antissimétrico as massas vão em sentidos opostos: omega a ao quadrado igual a k zero mais dois k c por m.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#172b45"/></marker></defs><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="26" y="42" font-size="24">Dois movimentos coletivos</text><text x="26" y="78" font-size="17">Mesmo sistema • massas iguais</text><text x="26" y="120" font-size="19">Em fase: x₁ = x₂</text><path d="M30 152V198 M400 152V198" stroke="#172b45" stroke-width="3"/><path d="M30 175L38.5 168L47.0 182L55.5 168L64.0 182L72.5 168L81.0 182L89.5 168L98.0 182L106.5 168L115 175" fill="none" stroke="#6d7784" stroke-width="2"/><path d="M175 175L183.0 168L191.0 182L199.0 168L207.0 182L215.0 168L223.0 182L231.0 168L239.0 182L247.0 168L255 175" fill="none" stroke="#6d7784" stroke-width="2"/><path d="M315 175L323.5 168L332.0 182L340.5 168L349.0 182L357.5 168L366.0 182L374.5 168L383.0 182L391.5 168L400 175" fill="none" stroke="#6d7784" stroke-width="2"/><rect x="115" y="155" width="60" height="40" rx="3" fill="#386b9b"/><rect x="255" y="155" width="60" height="40" rx="3" fill="#386b9b"/><path d="M125 143H169" stroke="#172b45" stroke-width="2" marker-end="url(#arrow)"/><path d="M265 143H309" stroke="#172b45" stroke-width="2" marker-end="url(#arrow)"/><text x="26" y="239" font-size="19">ωs² = k₀/m</text><text x="26" y="310" font-size="19">Em oposição: x₁ = −x₂</text><path d="M30 342V388 M400 342V388" stroke="#172b45" stroke-width="3"/><path d="M30 365L38.5 358L47.0 372L55.5 358L64.0 372L72.5 358L81.0 372L89.5 358L98.0 372L106.5 358L115 365" fill="none" stroke="#6d7784" stroke-width="2"/><path d="M175 365L183.0 358L191.0 372L199.0 358L207.0 372L215.0 358L223.0 372L231.0 358L239.0 372L247.0 358L255 365" fill="none" stroke="#6d7784" stroke-width="2"/><path d="M315 365L323.5 358L332.0 372L340.5 358L349.0 372L357.5 358L366.0 372L374.5 358L383.0 372L391.5 358L400 365" fill="none" stroke="#6d7784" stroke-width="2"/><rect x="115" y="345" width="60" height="40" rx="3" fill="#386b9b"/><rect x="255" y="345" width="60" height="40" rx="3" fill="#386b9b"/><path d="M125 333H169" stroke="#172b45" stroke-width="2" marker-end="url(#arrow)"/><path d="M305 333H261" stroke="#172b45" stroke-width="2" marker-end="url(#arrow)"/><text x="26" y="429" font-size="19">ωa² = (k₀ + 2kc)/m</text><text x="26" y="490" font-size="15">Setas: padrão de deslocamento, não forças.</text><text x="26" y="519" font-size="14">Figura esquemática; amplitudes não estão em escala.</text><text x="26" y="545" font-size="14">Molas laterais k₀; mola central kc.</text></g></svg>