<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="title desc"><title id="title">Regularização de uma inclinação</title><desc id="desc">Dados sintéticos x menos um, zero, um; y duas vezes x. Com penalidade soma dos erros quadrados mais lambda vezes w ao quadrado, w vale quatro dividido por dois mais lambda. Para lambda zero, dois e seis, w vale dois, um e zero vírgula cinco, e SSE de treino vale zero, dois e quatro vírgula cinco. Não se afirma ganho em teste.</desc><rect width="440" height="520" rx="12" fill="#f4f6f0"/><g fill="#183038" font-family="Arial,sans-serif"><text x="24" y="34" font-size="21" font-weight="700">Regularizar muda o ajuste</text><text x="24" y="63" font-size="16">x = [−1,0,1], y = 2x · intercepto livre</text><path d="M56 83V270H408" stroke="#183038" fill="none"/><g font-size="15"><text x="35" y="94">2</text><text x="35" y="185">1</text><text x="35" y="276">0</text><text x="53" y="294">0</text><text x="137" y="294">2</text><text x="305" y="294">6</text><text x="403" y="294">λ</text><text x="65" y="89">w</text></g><path d="M140 270V180H56" stroke="#7c8b85" stroke-dasharray="5 4" fill="none"/><polyline points="56.00,90.00 59.36,96.92 62.72,103.33 66.08,109.29 69.44,114.83 72.80,120.00 76.16,124.84 79.52,129.38 82.88,133.64 86.24,137.65 89.60,141.43 92.96,145.00 96.32,148.38 99.68,151.58 103.04,154.62 106.40,157.50 109.76,160.24 113.12,162.86 116.48,165.35 119.84,167.73 123.20,170.00 126.56,172.17 129.92,174.26 133.28,176.25 136.64,178.16 140.00,180.00 143.36,181.76 146.72,183.46 150.08,185.09 153.44,186.67 156.80,188.18 160.16,189.64 163.52,191.05 166.88,192.41 170.24,193.73 173.60,195.00 176.96,196.23 180.32,197.42 183.68,198.57 187.04,199.69 190.40,200.77 193.76,201.82 197.12,202.84 200.48,203.82 203.84,204.78 207.20,205.71 210.56,206.62 213.92,207.50 217.28,208.36 220.64,209.19 224.00,210.00 227.36,210.79 230.72,211.56 234.08,212.31 237.44,213.04 240.80,213.75 244.16,214.44 247.52,215.12 250.88,215.78 254.