<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">Compartilhar ou construir linhas distintas</title><desc id="desc">Repetir uma linha duas vezes faz M[0] e M[1] referirem-se à mesma linha. Após escrever sete em M[0][1], ambas mostram zero e sete. Criando uma linha nova por iteração, a segunda permanece com dois zeros.</desc><rect width="360" height="560" fill="#faf9f2"/><defs><marker id="row-tip" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#2447ae"/></marker></defs><g font-family="Arial,sans-serif" fill="#22271b" text-anchor="middle"><text x="180" y="28" font-size="20" font-weight="bold">Linhas compartilhadas</text><text x="180" y="57" font-size="17" font-family="monospace">M = [[0, 0]] * 2</text><g font-size="18"><text x="50" y="113">M[0]</text><text x="50" y="175">M[1]</text></g><path d="M86 108 L217 138 M86 170 L217 142" fill="none" stroke="#2447ae" stroke-width="2" marker-end="url(#row-tip)"/><rect x="224" y="113" width="112" height="53" fill="none" stroke="#55594c"/><text x="280" y="146" font-size="21">[0, 7]</text><text x="180" y="210" font-size="17">Depois de M[0][1] = 7</text><text x="180" y="238" font-size="16">Duas referências para a mesma linha</text><line x1="20" y1="263" x2="340" y2="263" stroke="#a0a397"/><text x="180" y="299" font-size="20" font-weight="bold">Linhas independentes</text><text x="180" y="329" font-size="14" font-family="monospace">M = [[0, 0] for _ in range(2)]</text><g font-size="18"><text x="50" y="387">M[0]</text><text x="50" y="461">M[1]</text></g><path d="M86 381 L216 381 M86 455 L216 455" fill="none" stroke="#2447ae" stroke-width="2" marker-end="url(#row-tip)"/><g fill="none" stroke="#55594c"><rect x="224" y="355" width="112" height="53"/><rect x="224" y="429" width="112" height="53"/></g><g font-size="21"><text x="280" y="388">[0, 7]</text><text x="280" y="462">[0, 0]</text></g><text x="180" y="518" font-size="17">A escrita muda só a primeira linha</text><text x="180" y="546" font-size="15">Setas representam referências</text></g></svg>