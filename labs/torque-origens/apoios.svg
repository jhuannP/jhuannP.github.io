<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Equilíbrio de uma viga: reações de sete e onze newtons</title><desc id="desc">Viga horizontal de seis metros, apoios A e B nas extremidades. Peso doze newtons para baixo em x3 e carga seis newtons para baixo em x5. Reações sete e onze para cima. Balanço em A: seis vezes onze menos três vezes doze menos cinco vezes seis igual a zero.</desc>
<rect width="760" height="460" rx="18" fill="#f4f0e7"/><g font-family="sans-serif" fill="#20333b"><text x="38" y="48" font-size="25" font-weight="700">Apoios: fechar força e momento</text><text x="38" y="78" font-size="16">Barra uniforme e forças prescritas · origem A · sentido positivo anti-horário</text>
<path d="M90 242H666" stroke="#263f44" stroke-width="10"/><g fill="none" stroke-width="3"><path d="M90 335V258m-9 12 9-12 9 12M666 335V258m-9 12 9-12 9 12" stroke="#226c65"/><path d="M378 117V225m-9-12 9 12 9-12M570 117V225m-9-12 9 12 9-12" stroke="#a24c39"/></g>
<g font-size="19"><text x="42" y="368">RA = 7 N</text><text x="604" y="368">RB = 11 N</text><text x="320" y="106">W = 12 N</text><text x="534" y="106">P = 6 N</text></g>
<g font-size="16"><text x="66" y="224">A: 0 m</text><text x="350" y="279">3 m</text><text x="550" y="279">5 m</text><text x="642" y="224">B: 6 m</text></g>
<path d="M90 393H666" stroke="#b5c1ba"/><text x="90" y="422" font-size="19">Força: 7 + 11 − 12 − 6 = 0 N</text><text x="90" y="449" font-size="18">Momento em A: 6×11 − 3×12 − 5×6 = 0 N m</text></g></svg>