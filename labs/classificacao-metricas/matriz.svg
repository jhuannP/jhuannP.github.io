<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" role="img" aria-labelledby="t desc"><title id="t">Matriz de confusão no limiar meio</title><desc id="desc">Linhas são classes reais zero e um; colunas são previsões zero e um. Três negativos verdadeiros, dois falsos positivos, um falso negativo e dois positivos verdadeiros. Total oito observações.</desc><rect width="440" height="500" fill="#faf8f1"/><g font-family="sans-serif" fill="#17333b"><text x="24" y="34" font-size="21">Contagens antes dos resumos</text><text x="24" y="65" font-size="15">Regra: prever 1 se score ≥ 0,5</text><text x="138" y="111" font-size="16">Previsto 0</text><text x="279" y="111" font-size="16">Previsto 1</text><text x="25" y="180" font-size="16">Real 0</text><text x="25" y="293" font-size="16">Real 1</text><rect x="113" y="129" width="130" height="100" rx="5" fill="#d8e8e3"/><rect x="254" y="129" width="130" height="100" rx="5" fill="#eadbd2"/><rect x="113" y="241" width="130" height="100" rx="5" fill="#eadbd2"/><rect x="254" y="241" width="130" height="100" rx="5" fill="#d8e8e3"/><g font-size="27"><text x="160" y="178">3</text><text x="303" y="178">2</text><text x="160" y="290">1</text><text x="303" y="290">2</text></g><g font-size="14"><text x="164" y="207">TN</text><text x="304" y="207">FP</text><text x="164" y="321">FN</text><text x="304" y="321">TP</text></g><text x="24" y="387" font-size="17">Precisão: 2/(2+2) = 1/2</text><text x="24" y="420" font-size="17">Recall: 2/(2+1) = 2/3</text><text x="24" y="453" font-size="17">Acurácia: (3+2)/8 = 5/8</text><text x="24" y="484" font-size="14">Dados e scores sintéticos, sem calibração provada.</text></g></svg>