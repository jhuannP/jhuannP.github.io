<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" role="img" aria-labelledby="title desc"><title id="title">Correntes iônicas que se cancelam</title><desc id="desc">No estado didático de menos sessenta milivolt, potássio sai da célula com corrente mais cento e vinte picoampere e sódio entra com corrente menos cento e vinte picoampere. A soma é zero. Gradientes são mantidos por reservatórios; não é equilíbrio de cada espécie.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2454c7"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#20372e"/></marker></defs><rect width="440" height="450" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="35" font-size="23" font-weight="bold">V interno − V externo = −60 mV</text><text x="26" y="90" font-size="19">Intracelular</text><text x="278" y="90" font-size="19">Extracelular</text><path d="M220 108V316" stroke="#aab7ae" stroke-width="9"/><text x="95" y="148" font-size="22">K⁺ · I_K = +120 pA</text><path d="M75 175H365" stroke="#2454c7" stroke-width="4" marker-end="url(#arrow)"/><text x="89" y="246" font-size="22">Na⁺ · I_Na = −120 pA</text><path d="M365 275H75" stroke="#20372e" stroke-width="4" marker-end="url(#back)"/><path d="M22 338H418" stroke="#aab7ae"/><text x="22" y="379" font-size="24" font-weight="bold">Soma: +120 − 120 = 0 pA</text><text x="22" y="418" font-size="19">Reservatórios iônicos mantidos.</text></g></svg>