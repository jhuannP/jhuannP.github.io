<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc">
<title id="title">Órbita de energia constante do oscilador livre</title>
<desc id="desc">No plano x por v dividido por ômega, uma órbita de amplitude um metro é um círculo. O estado inicial tem x igual a 0,6 metro e v por ômega igual a 0,8 metro. Um quarto de período depois tem x igual a 0,8 e v por ômega igual a menos 0,6. O sentido temporal é horário. As duas energias totais são quatro joules.</desc>
<rect width="440" height="400" rx="16" fill="#f4f3e9"/>
<g font-family="sans-serif" fill="#212c28"><text x="22" y="30" font-size="18" font-weight="bold">Mesmo movimento, outra representação</text>
<path d="M45 205H390 M220 65V350" stroke="#73867c" fill="none"/>
<circle cx="220" cy="205" r="112" fill="none" stroke="#2456c2" stroke-width="3"/>
<text x="370" y="226" font-size="16">x (m)</text><text x="228" y="60" font-size="16">v/ω (m)</text>
<text x="203" y="223" font-size="14">0</text>
<circle cx="287.2" cy="115.4" r="6" fill="#2456c2"/>
<text x="300" y="99" font-size="15">t = 0</text>
<text x="294" y="121" font-size="14">(0,6; 0,8)</text>
<circle cx="309.6" cy="272.2" r="6" fill="#202e28"/>
<text x="320" y="285" font-size="15">t = T/4</text>
<text x="295" y="307" font-size="14">(0,8; −0,6)</text>
<path d="M331 184 Q338 207 330 232 M325 223L330 232L339 225" stroke="#2456c2" stroke-width="2" fill="none"/>
<text x="22" y="371" font-size="16">E = 4 J · A = 1 m · sentido horário</text>
</g></svg>