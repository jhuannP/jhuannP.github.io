<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">Que chave estamos contando?</title><desc id="d">Após strip,casefold e NFC,duas formas de física têm contagem dois. Física com vírgula,fisica sem acento e código têm um cada. Um vazio é descartado.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="40" font-size="25" font-weight="bold">Seis registros, quatro chaves</text><text x="24" y="80" font-size="20">strip → casefold → NFC</text><path d="M24 104h512 M24 313h512" stroke="#a7b4c8" fill="none"/><text x="28" y="147" font-size="24" fill="#2154a0">física</text><text x="463" y="147" font-size="24">2</text><text x="28" y="196" font-size="24" fill="#2154a0">física,</text><text x="463" y="196" font-size="24">1</text><text x="28" y="245" font-size="24" fill="#2154a0">fisica</text><text x="463" y="245" font-size="24">1</text><text x="28" y="294" font-size="24" fill="#2154a0">código</text><text x="463" y="294" font-size="24">1</text><text x="24" y="355" font-size="22">5 aceitos + 1 vazio descartado = 6</text><text x="24" y="393" font-size="19">Não removemos vírgula ou acento.</text><text x="24" y="422" font-size="16">A contagem depende também da regra de preparação.</text></g></svg>