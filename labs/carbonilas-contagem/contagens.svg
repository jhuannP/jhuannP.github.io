<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450" role="img" aria-labelledby="t d"><title id="t">Dezoito elétrons, diferentes coordenações</title><desc id="d">Cr,Fe eNi em carbonilas neutras somam18 elétrons formais, mas têm seis,cinco e quatro ligantes respectivamente.</desc><rect width="440" height="450" fill="#f4f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Mesma contagem, estruturas distintas</text><text x="24" y="64" font-size="15">metal + doação dos CO = total formal</text><text x="24" y="110" font-size="21" font-weight="bold">Cr(CO)₆</text><text x="210" y="110" font-size="20" fill="#294dbc">6 + 12 = 18</text><text x="24" y="138" font-size="15">grupo 6 · carga 0</text><text x="210" y="138" font-size="15">coordenação 6</text><path d="M24 160 H416" stroke="#ccd4e7"/><text x="24" y="210" font-size="21" font-weight="bold">Fe(CO)₅</text><text x="210" y="210" font-size="20" fill="#294dbc">8 + 10 = 18</text><text x="24" y="238" font-size="15">grupo 8 · carga 0</text><text x="210" y="238" font-size="15">coordenação 5</text><path d="M24 260 H416" stroke="#ccd4e7"/><text x="24" y="310" font-size="21" font-weight="bold">Ni(CO)₄</text><text x="210" y="310" font-size="20" fill="#294dbc">10 + 8 = 18</text><text x="24" y="338" font-size="15">grupo 10 · carga 0</text><text x="210" y="338" font-size="15">coordenação 4</text><path d="M24 360 H416" stroke="#ccd4e7"/><text x="24" y="408" font-size="14">A conta não determina sozinha a geometria.</text><text x="24" y="435" font-size="12">Esquema original · um metal e CO terminais neutros</text></g></svg>