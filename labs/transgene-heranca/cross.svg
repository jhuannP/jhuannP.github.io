<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" role="img" aria-labelledby="title desc"><title id="title">Um locus: genótipo e presença não são a mesma leitura</title><desc id="desc">Quadrado de combinações de T/+ por T/+: quatro resultados equiprováveis, T/T, T/+, T/+ e +/+. Presença em três quartos na concepção; se T/T não sobreviver no cenário, presença entre sobreviventes é dois terços. Não prediz expressão ou função.</desc><rect width="620" height="500" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#242825"><text x="28" y="32" font-size="20">Uma segregação ideal, duas leituras</text><text x="28" y="60" font-size="15">T/+ × T/+ · um locus · gametas equiprováveis</text><g fill="#eeedf9" stroke="#aaa"><rect x="170" y="120" width="125" height="100"/><rect x="295" y="120" width="125" height="100"/><rect x="170" y="220" width="125" height="100"/><rect x="295" y="220" width="125" height="100" fill="#f5f3eb"/></g><g font-size="22"><text x="225" y="104">T</text><text x="350" y="104">+</text><text x="135" y="178">T</text><text x="135" y="278">+</text><text x="214" y="177">T/T</text><text x="337" y="177">T/+</text><text x="213" y="277">T/+</text><text x="337" y="277">+/+</text></g><g font-size="14"><text x="213" y="201">1/4</text><text x="338" y="201">1/4</text><text x="213" y="301">1/4</text><text x="338" y="301">1/4</text></g><text x="28" y="360" font-size="17">Na concepção: presença de T em 3/4.</text><text x="28" y="392" font-size="16">Se T/T não sobrevive: 2/3 dos sobreviventes têm T.</text><path d="M28 416H590" stroke="#ccc"/><text x="28" y="445" font-size="14">Sobrevivência diferencial é hipótese deste exemplo.</text><text x="28" y="474" font-size="14">Inserção presente ≠ expressão ≠ função demonstrada.</text></g></svg>