<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d"><title id="t">Carbonos de uma cadeia C14</title><desc id="d">Após três voltas saem três unidades C2 e permanece C8. Ao final de seis voltas há sete unidades acetil C2. Última volta C4 produz dois acetil-CoA.</desc><rect width="680" height="420" fill="#f7f5ed"/><g fill="#1f292c" font-family="Arial,sans-serif"><text x="30" y="39" font-size="25">Cada carbono continua no inventário</text><text x="30" y="75" font-size="18">C14 saturada par — modelo sem cinética</text><text x="30" y="120" font-size="20">Entrada</text><rect x="200" y="96" width="420" height="34" rx="5" fill="#304bcb"/><text x="380" y="120" fill="white" font-size="20">C14</text><text x="30" y="195" font-size="20">3 voltas</text><rect x="200" y="170" width="240" height="34" rx="5" fill="#304bcb"/><text x="300" y="194" fill="white" font-size="20">C8</text><rect x="450" y="170" width="60" height="34" fill="#28776b"/><rect x="520" y="170" width="60" height="34" fill="#28776b"/><rect x="590" y="170" width="60" height="34" fill="#28776b"/><text x="454" y="194" fill="white" font-size="17">C2</text><text x="524" y="194" fill="white" font-size="17">C2</text><text x="594" y="194" fill="white" font-size="17">C2</text><text x="200" y="235" font-size="18">8 + 3 × 2 = 14 carbonos</text><text x="30" y="290" font-size="20">6 voltas</text><text x="200" y="290" font-size="23" fill="#28776b">7 acetil-CoA × C2 = C14</text><text x="30" y="345" font-size="19">Última volta: C4 → C2 + C2</text><text x="30" y="382" font-size="17">Sem CO2 nesta sequência básica; ATP é estimado à parte.</text></g></svg>