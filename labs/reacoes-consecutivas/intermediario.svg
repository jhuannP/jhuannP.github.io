<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" role="img" aria-labelledby="title desc"><title id="title">O intermediário acumula antes de diminuir</title><desc id="desc">Modelo A para I para P com constantes iguais a um por minuto e concentração inicial um milimolar. A decai, I começa em zero e atinge um sobre e no minuto um, enquanto P aumenta. As três concentrações somam um em todo instante; curvas calculadas analiticamente, sem dados experimentais.</desc><rect width="440" height="570" fill="#f6f8ff"/><g font-family="sans-serif" fill="#172545"><text x="24" y="34" font-size="19" font-weight="bold">A → I → P: o meio também evolui</text><text x="24" y="64" font-size="15">k₁=k₂=1 min⁻¹ · A₀=1 mmol/L</text><text x="24" y="96" font-size="15">Concentração, em mmol/L</text><path d="M65 125 V375 H385" stroke="#99a7c1" fill="none"/><polyline points="65.00,155.00 66.88,160.43 68.75,165.73 70.62,170.90 72.50,175.94 74.38,180.85 76.25,185.64 78.12,190.32 80.00,194.88 81.88,199.33 83.75,203.66 85.62,207.89 87.50,212.02 89.38,216.04 91.25,219.97 93.12,223.80 95.00,227.53 96.88,231.17 98.75,234.72 100.62,238.19 102.50,241.56 104.38,244.86 106.25,248.07 108.12,251.20 110.00,254.26 111.88,257.24 113.75,260.15 115.62,262.99 117.50,265.75 119.38,268.45 121.25,271.08 123.12,273.65 125.00,276.15 126.88,278.59 128.75,280.97 130.62,283.29 132.50,285.55 134.38,287.76 136.25,289.92 138.12,292.02 140.00,294.07 141.88,296.06 143.75,298.01 145.62,299.91 147.50,301.77 149.38,303.58 151.25,305.34 153.12,307.06 155.00,308.74 156.88,310.37 158.75,311.97 160.62,313.53 162.50,315.04 164.38,316.52 166.25,317.97 168.12,319.38 170.00,320.75 171.88,322.09 173.75,323.39 175.62,324.67 177.50,325.91 179.38,327.12 181.25,328.31 183.12,329.46 185.00,330.58 186.88,331.68 188.75,332.75 190.62,333.79 192.50,334.81 194.38,335.80 196.25,336.77 198.12,337.71 200.00,338.63 201.88,339.53 203.75,340.41 205.62,341.26 207.50,342.09 209.38,342.91 211.25,343.70 213.12,344.47 215.00,345.23 216.88,345.96 21