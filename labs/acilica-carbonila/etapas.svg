<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590"><title>Três etapas da hidrólise básica do éster</title><desc>Adição abre a ligação pi para o oxigênio. Colapso do intermediário tetraédrico restaura a carbonila e libera etóxido. Transferência de próton gera carboxilato e etanol. Esquema de conectividade, sem escala espacial.</desc><rect width="440" height="590" fill="#f7f6ee"/><g font-family="sans-serif" fill="#252a22"><text x="24" y="33" font-size="20" font-weight="bold">Adição → eliminação → próton</text><text x="24" y="60" font-size="14">Conectividade e cargas · sem escala espacial</text><text x="24" y="102" font-size="16" font-weight="bold">1. Adicionar OH⁻ e abrir π(C=O)</text><text x="24" y="134" font-size="17">CH₃CH₂C(=O)OCH₂CH₃ + OH⁻</text><text x="210" y="163" font-size="22">↓</text><text x="24" y="194" font-size="17">CH₃CH₂C(O⁻)(OH)(OCH₂CH₃)</text><text x="24" y="221" font-size="14">Quatro ligações simples no carbono central</text><path d="M24 243H416" stroke="#c0c5b7"/><text x="24" y="278" font-size="16" font-weight="bold">2. Recompor C=O e liberar etóxido</text><text x="24" y="312" font-size="17">CH₃CH₂C(=O)OH + ⁻OCH₂CH₃</text><text x="24" y="342" font-size="14">Ácido + alcóxido: ainda há transferência de H⁺</text><path d="M24 366H416" stroke="#c0c5b7"/><text x="24" y="403" font-size="16" font-weight="bold">3. Transferir o próton do ácido</text><text x="24" y="438" font-size="17">CH₃CH₂COO⁻ + HOCH₂CH₃</text><text x="24" y="468" font-size="14">Carboxilato + álcool no balanço básico</text><text x="24" y="524" font-size="15" fill="#2453b6">Cada linha conserva átomos e carga total −1.</text><text x="24" y="554" font-size="13">Esquema conceitual; não determina tempo ou rendimento.</text></g></svg>