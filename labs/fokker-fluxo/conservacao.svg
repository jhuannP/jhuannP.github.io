<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="t desc"><title id="t">Conservar a soma não basta</title><desc id="desc">Quatro médias de densidade em células de largura um quarto. Um passo estável dá2,3 sobre2,0,1 sobre2; um passo grande dá menos4,6,0,2. Ambos somam probabilidade1 ao multiplicar pela largura, mas o segundo tem densidade negativa.</desc><rect width="760" height="460" rx="18" fill="#f5f4ed"/><g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="40" font-size="25" font-weight="bold">Conservar a soma não basta.</text><text x="28" y="72" font-size="16">Modelo periódico original • Δx = 1/4 • densidade inicial (4,0,0,0)</text><text x="28" y="109" font-size="17">c = 1/4, D = 1/32 • números nas caixas são médias celulares</text><text x="28" y="153" font-size="19" font-weight="bold">Δt = 1/4 • pesos não negativos • massa = 1</text><rect x="28" y="175" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="110" y="220" font-size="27" text-anchor="middle">2</text><rect x="208" y="175" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="290" y="220" font-size="27" text-anchor="middle">3/2</text><rect x="388" y="175" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="470" y="220" font-size="27" text-anchor="middle">0</text><rect x="568" y="175" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="650" y="220" font-size="27" text-anchor="middle">1/2</text><rect x="28" y="325" width="164" height="72" rx="10" fill="#ebcfc6" stroke="#386b70"/><text x="110" y="370" font-size="27" text-anchor="middle">−4</text><rect x="208" y="325" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="290" y="370" font-size="27" text-anchor="middle">6</text><rect x="388" y="325" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="470" y="370" font-size="27" text-anchor="middle">0</text><rect x="568" y="325" width="164" height="72" rx="10" fill="#e1ece6" stroke="#386b70"/><text x="650" y="370" font-size="27" text-anchor="middle">2</text><text x="28" y="301" font-size="19" font-weight="bold">Δt = 1 • um peso negativo • massa = 1</text><text x="28" y="434" font-size="17">Segundo caso: falha de positividade, não perda na soma total.</text></g></svg>