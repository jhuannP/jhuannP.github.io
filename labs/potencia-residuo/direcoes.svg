<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="t d"><title id="t">Potência com dois inícios</title><desc id="d">Para diagonal3,1, o início1,1 aproxima a direção horizontal; o início0,1 permanece vertical com resíduo zero e autovalor1.</desc><rect width="760" height="430" rx="20" fill="#f5f0e5"/><g font-family="sans-serif" fill="#183f43"><text x="38" y="45" font-size="27">Mesmo A. Dois destinos.</text><text x="38" y="76" font-size="19">A = diag(3, 1) · vetores em norma infinita</text><path d="M90 300H350 M90 300V120 M430 300H700 M430 300V120" stroke="#183f43" fill="none"/><path d="M90 300L310 120 M90 300L310 240 M90 300L310 280" stroke="#21736f" stroke-width="4"/><path d="M430 300V120" stroke="#bd5b39" stroke-width="5"/><text x="180" y="128" font-size="18">k = 0</text><text x="285" y="232" font-size="18">k = 1</text><text x="285" y="273" font-size="18">k = 2</text><text x="460" y="160" font-size="20">x = (0, 1)</text><text x="460" y="190" font-size="20">ρ = 1 · resíduo = 0</text><text x="90" y="336" font-size="19">xₖ = (1, 3⁻ᵏ)</text><text x="430" y="336" font-size="19">Não alcança a direção de3.</text><text x="38" y="391" font-size="20">Resíduo pequeno verifica a relação; não escolhe o autovalor.</text></g></svg>