<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc"><title id="title">Uma anotação fornecida, duas isoformas</title><desc id="desc">O segmento precursor de dezessete nucleotídeos contém E1, I1, E2, I2 e E3. A montagem A retém E1, E2 e E3, total de nove nucleotídeos. A montagem B retém E1 e E3, total de seis nucleotídeos. Cap e cauda poli-A não são representados nas strings nem incluídos nas contagens. É uma miniatura computacional sem predição de viabilidade.</desc><rect width="520" height="650" fill="#faf8f2"/><g font-family="system-ui,sans-serif" fill="#17382e"><text x="28" y="42" font-size="24" font-weight="700">Uma anotação, duas montagens</text><text x="28" y="77" font-size="17">Segmento sintético fornecido · sentido 5′ → 3′</text><text x="28" y="121" font-size="19" font-weight="700">Precursor: 17 nucleotídeos</text><g font-size="18" text-anchor="middle"><rect x="28" y="144" width="80" height="40" fill="#245fbe"/><rect x="108" y="144" width="112" height="40" fill="#e3d8c9"/><rect x="220" y="144" width="80" height="40" fill="#245fbe"/><rect x="300" y="144" width="112" height="40" fill="#e3d8c9"/><rect x="412" y="144" width="80" height="40" fill="#245fbe"/><g fill="white"><text x="68" y="170">E1</text><text x="260" y="170">E2</text><text x="452" y="170">E3</text></g><text x="164" y="170">I1</text><text x="356" y="170">I2</text></g><text x="28" y="216" font-size="16">Éxons: 3 nt cada · intervalos omitidos: 4 nt cada</text><text x="28" y="275" font-size="20" font-weight="700">Montagem A · 9 nucleotídeos</text><g fill="#245fbe"><rect x="28" y="296" width="80" height="40"/><rect x="108" y="296" width="80" height="40"/><rect x="188" y="296" width="80" height="40"/></g><g font-size="18" fill="white" text-anchor="middle"><text x="68" y="323">E1</text><text x="148" y="323">E2</text><text x="228" y="323">E3</text></g><text x="28" y="371" font-size="19">5′ AUG GAA UAG 3′</text><text x="28" y="429" font-size="20" font-weight="700">Montagem B · 6 nucleotídeos</text><g fill="#245fbe"><rect x="28" y="450" width="80" height="40"/><rect x="108" y="450" width="80" height="40"/></g><g font-size="18" fill="white" text-anchor="middle"><text x="68" y="477">E1</text><text x="148" y="477">E3</text></g><text x="28" y="525" font-size="19">5′ AUG UAG 3′</text><path d="M28 549H492" stroke="#17382e"/><text x="28" y="578" font-size="16">Cap e poli-A não estão nas strings ou contagens.</text><text x="28" y="606" font-size="16">Miniatura computacional; não prova expressão.</text><text x="28" y="635" font-size="14">E = bloco retido na anotação · I = intervalo omitido</text></g></svg>