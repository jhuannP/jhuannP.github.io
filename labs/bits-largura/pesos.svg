<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Cada posição tem um peso</title><desc id="desc">O byte 00101110 tem bits ligados nos pesos trinta e dois, oito, quatro e dois, somando quarenta e seis. Os grupos de quatro bits 0010 e 1110 são dois e E em hexadecimal. O inteiro trezentos em dois bytes é 01 2C em big endian e 2C 01 em little endian; a ordem precisa ser declarada.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="26" y="42" font-size="24">Posição dá valor ao bit.</text><text x="26" y="80" font-size="17">00101110 • palavra sem sinal de 8 bits</text><text x="33" y="143" font-size="15">128</text><text x="41" y="188" font-size="25">0</text><text x="81" y="143" font-size="15">64</text><text x="89" y="188" font-size="25">0</text><text x="129" y="143" font-size="15">32</text><text x="137" y="188" font-size="25">1</text><path d="M128 204H161" stroke="#386b9b" stroke-width="4"/><text x="177" y="143" font-size="15">16</text><text x="185" y="188" font-size="25">0</text><text x="225" y="143" font-size="15">8</text><text x="233" y="188" font-size="25">1</text><path d="M224 204H257" stroke="#386b9b" stroke-width="4"/><text x="273" y="143" font-size="15">4</text><text x="281" y="188" font-size="25">1</text><path d="M272 204H305" stroke="#386b9b" stroke-width="4"/><text x="321" y="143" font-size="15">2</text><text x="329" y="188" font-size="25">1</text><path d="M320 204H353" stroke="#386b9b" stroke-width="4"/><text x="369" y="143" font-size="15">1</text><text x="377" y="188" font-size="25">0</text><text x="26" y="252" font-size="22">32 + 8 + 4 + 2 = 46</text><text x="26" y="299" font-size="19">0010 | 1110 → 2 | E → 0x2E</text><text x="26" y="365" font-size="19">300 em dois bytes sem sinal</text><text x="26" y="408" font-size="20">big: 01 2C • little: 2C 01</text><text x="26" y="454" font-size="16">Trocar bytes não inverte os bits de cada byte.</text><text x="26" y="508" font-size="14">Pesos na linha superior; sublinhado marca bit 1.</text><text x="26" y="535" font-size="14">O valor exige largura, ordem e interpretação.</text></g></svg>