<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480" role="img" aria-labelledby="t d"><title id="t">Uma especiação, depois uma duplicação</title><desc id="d">S separa A e B. D em A gera A1 e A2. B1 é ortólogo de ambas; A1 e A2 são parálogos. Ramos sem escala.</desc><rect width="420" height="480" fill="#f7f6ef"/><g font-family="Arial,sans-serif" fill="#242b25"><text x="24" y="32" font-size="21">Uma cópia em B, duas em A</text><text x="24" y="58" font-size="14">História fictícia com eventos fornecidos</text><g stroke="#596354" stroke-width="2" fill="none"><path d="M210 114L125 215L70 326M125 215L180 326M210 114L320 326"/></g><circle cx="210" cy="114" r="21" fill="#3c4ca3"/><circle cx="125" cy="215" r="21" fill="#90562b"/><g fill="white" text-anchor="middle" font-size="19"><text x="210" y="120">S</text><text x="125" y="221">D</text></g><g text-anchor="middle" font-size="20"><text x="70" y="351">A1</text><text x="180" y="351">A2</text><text x="320" y="351">B1</text></g><text x="24" y="390" font-size="16">A1 ↔ A2: parálogos</text><text x="24" y="416" font-size="16">A1 ↔ B1 e A2 ↔ B1: ortólogos</text><text x="24" y="451" font-size="14">S: especiação · D: duplicação · sem escala</text></g></svg>
