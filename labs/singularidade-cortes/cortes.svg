<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Cortes diferentes, somas diferentes</title><desc id="desc">Para integrar um sobre x de menos um a um, remova o intervalo de menos epsilon esquerdo a epsilon direito. Com cortes iguais a soma truncada é zero. Com corte esquerdo igual ao dobro do direito, a soma é log de dois. Cada lado diverge isoladamente; nenhum desses cortes prova convergência usual.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="26" y="42" font-size="24">Cancelar depende do corte.</text><text x="26" y="78" font-size="17">Integral de 1/x • dois lados do zero</text><text x="26" y="133" font-size="18">Cortes iguais: εL = εR</text><path d="M40 180H188 M252 180H400" stroke="#386b9b" stroke-width="5"/><path d="M188 171V189 M220 166V194 M252 171V189" stroke="#172b45" stroke-width="2"/><g font-size="14"><text x="35" y="210">−1</text><text x="164" y="210">−εL</text><text x="215" y="210">0</text><text x="244" y="210">εR</text><text x="392" y="210">1</text></g><text x="26" y="252" font-size="20">Soma truncada: 0</text>
<text x="26" y="313" font-size="18">Corte esquerdo maior: εL = 2εR</text><path d="M40 360H156 M252 360H400" stroke="#386b9b" stroke-width="5"/><path d="M156 351V369 M220 346V374 M252 351V369" stroke="#172b45" stroke-width="2"/><g font-size="14"><text x="35" y="391">−1</text><text x="132" y="391">−εL</text><text x="215" y="391">0</text><text x="244" y="391">εR</text><text x="392" y="391">1</text></g><text x="26" y="433" font-size="20">Soma truncada: ln 2</text><text x="26" y="488" font-size="16">Soma = ln(εL / εR)</text><text x="26" y="520" font-size="14">Azul: domínio mantido; branco: intervalo removido.</text><text x="26" y="545" font-size="14">Esquema dos cortes, não gráfico do integrando.</text></g></svg>