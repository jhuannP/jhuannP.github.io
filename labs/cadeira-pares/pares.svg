<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="t d"><title id="t">Dois grupos cis em carbonos1 e2</title><desc id="d">R eT permanecem acima nas duas cadeiras. Na cadeiraA R é axial eT equatorial; naB trocam tipos. Penalidades fictícias3 e5 produzem probabilidades5/8 e3/8. O quadro não desenha uma estrutura3D.</desc><rect width="760" height="540" fill="#f3f1e5"/><g font-family="Arial,sans-serif" fill="#263b38"><text x="36" y="43" font-size="24" font-weight="bold">Cis permanece cis; axial troca de grupo.</text><text x="36" y="76" font-size="17">C1–R acima · C2–T acima · duas cadeiras ideais, sem trajetória</text><rect x="36" y="108" width="320" height="280" rx="10" fill="#dbe4dc"/><rect x="402" y="108" width="320" height="280" rx="10" fill="#e5ded0"/><g font-size="20"><text x="58" y="145" font-weight="bold">Cadeira A</text><text x="424" y="145" font-weight="bold">Cadeira B</text><text x="58" y="194">R: axial, acima</text><text x="58" y="230">T: equatorial, acima</text><text x="424" y="194">R: equatorial, acima</text><text x="424" y="230">T: axial, acima</text><text x="58" y="284">Peso = 1/3</text><text x="424" y="284">Peso = 1/5</text><text x="58" y="344" font-size="30">P(A) = 5/8</text><text x="424" y="344" font-size="30">P(B) = 3/8</text></g><text x="36" y="435" font-size="20" font-weight="bold">Uma posição axial em cada cadeira não implica pesos iguais.</text><text x="36" y="473" font-size="17">Penalidades fictícias: rR = 3, rT = 5 · normalização: 1/3 + 1/5 = 8/15</text><text x="36" y="510" font-size="16">Quadro de estados, não estrutura 3D ou proporção experimental de um composto.</text></g></svg>