<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc"><title id="title">Dois estados e quatro probabilidades</title><desc id="desc">Estado A com laço4/5 e transição A para B1/5. Estado B com laço3/5 e transição B para A2/5. Linhas somam um. Distribuição estacionária A2/3,B1/3; primeira chegada de A a B tem média cinco passos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315c54"/></marker></defs><rect width="680" height="420" rx="18" fill="#f5f1e8"/><g font-family="Arial,sans-serif" fill="#183f38"><text x="28" y="36" font-size="22" font-weight="bold">Uma regra de transição; muitos caminhos</text><circle cx="175" cy="205" r="45" fill="#dbe9db" stroke="#315c54" stroke-width="2"/><circle cx="505" cy="205" r="45" fill="#e5dfcb" stroke="#315c54" stroke-width="2"/><text x="175" y="214" text-anchor="middle" font-size="28">A</text><text x="505" y="214" text-anchor="middle" font-size="28">B</text><path d="M216 185Q340 95 463 185" fill="none" stroke="#315c54" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M464 226Q340 311 216 226" fill="none" stroke="#315c54" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M148 169C60 75 270 75 202 168" fill="none" stroke="#315c54" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M477 168C400 75 610 75 532 169" fill="none" stroke="#315c54" stroke-width="2.5" marker-end="url(#arrow)"/><text x="328" y="129" font-size="21">1/5</text><text x="328" y="301" font-size="21">2/5</text><text x="155" y="98" font-size="21">4/5</text><text x="487" y="98" font-size="21">3/5</text><text x="28" y="356" font-size="18">Estacionária: (2/3, 1/3) · primeira chegada A→B: média 5 passos</text><text x="28" y="393" font-size="15">Rede e figura próprias · passos discretos, sem duração física calibrada</text></g></svg>