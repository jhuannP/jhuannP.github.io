<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="t d"><title id="t">Mesmo número de elétrons, núcleos diferentes</title><desc id="d">Tabela esquemática de O dois menos, F menos, Ne, Na mais, Mg dois mais e Al três mais. Todos têm dez elétrons, mas de oito a treze prótons. A figura não mostra raios.</desc><rect width="440" height="440" fill="#f8f7f1"/><g font-family="sans-serif" fill="#25344a"><text x="22" y="35" font-size="20" font-weight="bold">Isoeletrônico não é idêntico</text><text x="22" y="61" font-size="14">Nₑ=Z−q · q é a carga em unidades de e</text><path d="M22 113 H415 M22 354 H415" stroke="#adb5bf"/><g font-size="15" font-weight="bold"><text x="30" y="99">Espécie</text><text x="157" y="99">Z</text><text x="235" y="99">q</text><text x="330" y="99">Nₑ</text></g><g font-size="18"><text x="30" y="146">O²⁻</text><text x="157" y="146">8</text><text x="235" y="146">−2</text><text x="330" y="146">10</text><text x="30" y="183">F⁻</text><text x="157" y="183">9</text><text x="235" y="183">−1</text><text x="330" y="183">10</text><text x="30" y="220">Ne</text><text x="157" y="220">10</text><text x="235" y="220">0</text><text x="330" y="220">10</text><text x="30" y="257">Na⁺</text><text x="157" y="257">11</text><text x="235" y="257">+1</text><text x="330" y="257">10</text><text x="30" y="294">Mg²⁺</text><text x="157" y="294">12</text><text x="235" y="294">+2</text><text x="330" y="294">10</text><text x="30" y="331">Al³⁺</text><text x="157" y="331">13</text><text x="235" y="331">+3</text><text x="330" y="331">10</text></g><text x="22" y="384" font-size="15">A configuração pode ser a mesma;</text><text x="22" y="407" font-size="15">a atração nuclear muda. Não são raios.</text></g></svg>