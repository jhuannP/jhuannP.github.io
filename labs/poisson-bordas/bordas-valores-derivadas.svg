<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 415" role="img" aria-labelledby="title desc"><title id="title">Valores e derivadas são dados de borda distintos</title><desc id="desc">No intervalo de zero a L, Dirichlet homogêneo fixa u em zero nas duas pontas. Neumann homogêneo fixa a derivada em zero nas duas pontas, exige integral da fonte igual a zero e mantém uma constante livre até escolher a média.</desc><rect width="360" height="415" fill="#faf9f2"/><g font-family="Arial,sans-serif" fill="#22271b" text-anchor="middle"><text x="180" y="28" font-size="20" font-weight="bold">Mesma expressão: −u″ = g</text><text x="180" y="76" font-size="20" font-weight="bold">Dirichlet homogêneo</text><text x="180" y="103" font-size="16">Fixa os valores nas pontas</text><line x1="50" y1="132" x2="310" y2="132" stroke="#55594c" stroke-width="2"/><g fill="#2447ae"><circle cx="50" cy="132" r="6"/><circle cx="310" cy="132" r="6"/></g><g font-size="18"><text x="65" y="165">u(0) = 0</text><text x="295" y="165">u(L) = 0</text></g><text x="180" y="196" font-size="15">Fonte contínua: solução clássica única</text><line x1="20" y1="218" x2="340" y2="218" stroke="#a0a397"/><text x="180" y="256" font-size="20" font-weight="bold">Neumann homogêneo</text><text x="180" y="282" font-size="16">Fixa as derivadas nas pontas</text><line x1="50" y1="310" x2="310" y2="310" stroke="#55594c" stroke-width="2"/><g stroke="#2447ae" stroke-width="2"><path d="M50 294 V326 M310 294 V326"/></g><g font-size="18"><text x="70" y="347">u′(0) = 0</text><text x="290" y="347">u′(L) = 0</text></g><text x="180" y="379" font-size="15">Exige ∫g dx = 0; resta uma constante livre</text><text x="180" y="404" font-size="15">Escolher a média remove essa liberdade</text></g></svg>