<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="t d"><title id="t">Atribuição guarda o resultado daquele momento</title><desc id="d">Primeiro tempo em minutos recebe dois e tempo em segundos recebe cento e vinte. Depois só tempo em minutos recebe três, enquanto segundos continua cento e vinte. Apenas após recalcular tempo em segundos ele passa para cento e oitenta.</desc>
<rect width="440" height="560" fill="#f6f8fb"/><g font-family="sans-serif" fill="#172b43">
<text x="24" y="35" font-size="21" font-weight="bold">Cada linha usa o estado atual</text>
<text x="24" y="68" font-size="15">tempo_s = tempo_min * 60 calcula uma vez.</text>
<text x="24" y="115" font-size="17" font-weight="bold">1. Calcular com tempo_min = 2</text>
<text x="24" y="152" font-size="17">tempo_min → 2</text><text x="24" y="183" font-size="17" fill="#255fbc">tempo_s → 120</text>
<path d="M24 212H416" stroke="#cbd5e1"/>
<text x="24" y="252" font-size="17" font-weight="bold">2. Executar só tempo_min = 3</text>
<text x="24" y="289" font-size="17">tempo_min → 3</text><text x="24" y="320" font-size="17" fill="#255fbc">tempo_s → 120</text>
<path d="M24 349H416" stroke="#cbd5e1"/>
<text x="24" y="389" font-size="17" font-weight="bold">3. Recalcular tempo_s</text>
<text x="24" y="426" font-size="17">tempo_min → 3</text><text x="24" y="457" font-size="17" fill="#255fbc">tempo_s → 180</text>
<text x="24" y="504" font-size="15">A expressão não fica ligada ao nome anterior.</text>
<text x="24" y="541" font-size="13">Figura original. Nomes e resultados em três estados.</text>
</g></svg>