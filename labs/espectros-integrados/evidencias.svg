<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470" role="img" aria-labelledby="t d"><title id="t">As evidências restringem uma lista de candidatos</title><desc id="d">Quatro candidatos de fórmula C três H seis O: propanona, propanal, prop dois en um ol e ciclopropanol. Massa nominal cinquenta e oito é compatível com todos. Carbonila no infravermelho mantém propanona e propanal. Um conjunto de seis prótons equivalentes na RMN ideal seleciona propanona entre os candidatos.</desc><rect width="440" height="470" fill="#f8f7f1"/><g font-family="sans-serif" fill="#28384b"><text x="20" y="32" font-size="20" font-weight="bold">Nenhuma técnica decide sozinha</text><text x="20" y="58" font-size="14">Caso sintético · lista explícita de quatro candidatos</text><rect x="20" y="82" width="400" height="88" rx="7" fill="#edf0f5"/><text x="36" y="109" font-size="15">Propanona · propanal</text><text x="36" y="134" font-size="15">Prop-2-en-1-ol · ciclopropanol</text><text x="36" y="156" font-size="13">C₃H₆O e massa nominal 58: todos compatíveis</text><path d="M220 172 V209" fill="none" stroke="#8294ad" stroke-width="2"/><text x="238" y="196" font-size="14">IR: carbonila</text><rect x="20" y="211" width="400" height="57" rx="7" fill="#dce7f4"/><text x="36" y="245" font-size="17">Propanona · propanal</text><path d="M220 270 V308" fill="none" stroke="#8294ad" stroke-width="2"/><text x="238" y="294" font-size="14">RMN: um conjunto de H</text><rect x="20" y="311" width="400" height="57" rx="7" fill="#e0ece5"/><text x="36" y="346" font-size="18" font-weight="bold">Propanona: dois grupos CH₃ equivalentes</text><text x="20" y="408" font-size="15">m/z 43: compatibilidade, não identidade exclusiva.</text><text x="20" y="439" font-size="13">Esquema lógico; não representa espectros medidos.</text></g></svg>