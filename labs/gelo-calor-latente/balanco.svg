<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">O calor cedido não derrete todo o gelo</title><desc id="desc">Duzentos gramas de água a quarenta graus cedem 33600 joules ao chegar a zero. Cem gramas de gelo a menos dez graus usam 2100 joules para chegar a zero; sobram 31500 joules para fusão, que completa exigiria 33400. Restam aproximadamente 5,69 gramas de gelo e a temperatura final é zero.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="28" y="42" font-size="23">A temperatura chega a zero.</text><text x="28" y="72" font-size="23">A fusão não termina.</text><text x="28" y="113" font-size="16">Água: 200 g, de 40°C para 0°C</text><text x="28" y="142" font-size="18">Energia cedida: 33 600 J</text><rect x="28" y="158" width="340" height="30" fill="#386b9b"/>
<text x="28" y="232" font-size="16">Gelo: 100 g, de −10°C para 0°C</text><text x="28" y="262" font-size="18">Aquecimento: 2 100 J</text><rect x="28" y="278" width="21.25" height="30" fill="#386b9b"/><text x="28" y="350" font-size="16">Energia restante para fundir gelo</text><text x="28" y="380" font-size="18">31 500 J &lt; 33 400 J necessários</text><rect x="28" y="396" width="318.75" height="30" fill="#386b9b"/><text x="28" y="473" font-size="20">Final: T = 0°C • gelo ≈ 5,69 g</text><text x="28" y="515" font-size="14">Barras de energia: origem zero e mesma escala.</text><text x="28" y="540" font-size="14">Modelo ideal; não são medidas experimentais.</text></g></svg>