<svg xmlns="http://www.w3.org/2000/svg" width="440" height="390" viewBox="0 0 440 390" role="img" aria-labelledby="t d"><title id="t">Somas finitas e resto até dois</title><desc id="d">Quatro linhas mostram soma e resto para razão um meio. N igual a um tem soma um e resto um; N dois, soma três meios e resto um meio; N três, soma sete quartos e resto um quarto; N quatro, soma quinze oitavos e resto um oitavo.</desc><rect width="440" height="390" fill="#f3f5ff"/><g font-family="Arial,sans-serif" fill="#192b45"><text x="24" y="35" font-size="20" font-weight="bold">Somar mais termos reduz o resto</text><text x="24" y="65" font-size="16">a = 1 · r = 1/2 · limite S = 2</text><text x="24" y="105" font-size="15">N</text><text x="75" y="105" font-size="15">soma Sₙ</text><text x="272" y="105" font-size="15">resto Rₙ</text><g font-size="18"><text x="26" y="145">1</text><text x="80" y="145">1</text><text x="285" y="145">1</text><text x="26" y="205">2</text><text x="80" y="205">3/2</text><text x="285" y="205">1/2</text><text x="26" y="265">3</text><text x="80" y="265">7/4</text><text x="285" y="265">1/4</text><text x="26" y="325">4</text><text x="80" y="325">15/8</text><text x="285" y="325">1/8</text></g><g stroke-width="8"><path d="M75 160 H225" stroke="#2e52c0"/><path d="M225 160 H375" stroke="#8898bb"/><path d="M75 220 H300" stroke="#2e52c0"/><path d="M300 220 H375" stroke="#8898bb"/><path d="M75 280 H337.5" stroke="#2e52c0"/><path d="M337.5 280 H375" stroke="#8898bb"/><path d="M75 340 H356.25" stroke="#2e52c0"/><path d="M356.25 340 H375" stroke="#8898bb"/></g><text x="24" y="375" font-size="13">Figura original · em cada linha, Sₙ + Rₙ = 2</text></g></svg>
