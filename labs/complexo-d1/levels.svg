<svg xmlns="http://www.w3.org/2000/svg" width="620" height="490" viewBox="0 0 620 490" role="img" aria-labelledby="title desc"><title id="title">d¹ octaédrico: diferença de energia e restrição de dipolo</title><desc id="desc">Três orbitais inferiores a menos 6400 e dois superiores a mais 9600 por centímetro. Diferença de 16000 por centímetro corresponde a 625 nanômetros, mas estados pares e operador ímpar dão integral de dipolo zero no modelo ideal.</desc><rect width="620" height="490" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#242826"><text x="30" y="32" font-size="20">Energia possível não fixa intensidade</text><text x="30" y="58" font-size="14">d¹ ideal · Δ/(hc) = 16000 cm⁻¹ · sem spin–órbita</text><path d="M60 290V90m-6 8 6-8 6 8" fill="none" stroke="#333" stroke-width="2"/><text x="30" y="86" font-size="13">E/(hc)</text><path d="M92 196H560" stroke="#888" stroke-dasharray="5 5"/><text x="470" y="188" font-size="13">baricentro 0</text><g stroke="#4545b4" stroke-width="4"><path d="M120 260H175m25 0h55m25 0h55M150 100H220m30 0h70"/></g><text x="360" y="108" font-size="16">e_g : +9600 cm⁻¹</text><text x="360" y="267" font-size="16">t₂g : −6400 cm⁻¹</text><path d="M155 256V224m-5 7 5-7 5 7" stroke="#252525" fill="none" stroke-width="2"/><path d="M110 250V112" stroke="#97624b" stroke-width="2" stroke-dasharray="5 5"/><text x="130" y="153" font-size="14">Δ = hc/λ</text><text x="130" y="176" font-size="14">λ = 625 nm</text><path d="M30 312H590" stroke="#ccc"/><text x="30" y="345" font-size="18">Dipolo elétrico no centro de inversão</text><text x="30" y="377" font-size="17">estado g × operador u × estado g = u</text><text x="30" y="406" font-size="16">Pares r e −r cancelam: integral = 0.</text><text x="30" y="440" font-size="14">Seta tracejada indica diferença energética, não intensidade.</text><text x="30" y="465" font-size="14">Mistura e vibração exigem um modelo adicional.</text></g></svg>