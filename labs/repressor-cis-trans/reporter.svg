<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">Mesmo meio, sítios diferentes</title><desc id="desc">Duas cópias repórteres compartilham r igual trinta nanomolar. A tem operador funcional com fração livre um quarto e média quatro RNA. B tem sítio sem ligação, fração livre um e média dezesseis RNA. Demais parâmetros são mantidos iguais por hipótese.</desc><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="38" font-size="25" font-weight="bold">Mesmo meio, sítios diferentes</text><text x="24" y="77" font-size="21">Repressor livre ativo: r = 30 nM</text><path d="M24 104h512" stroke="#acb9ca"/><text x="26" y="151" font-size="23" font-weight="bold">A: operador funcional</text><path d="M28 181h100" stroke="#192e49" stroke-width="3"/><rect x="58" y="167" width="60" height="28" fill="#2154a0"/><text x="140" y="188" font-size="19">Sítio com ligação</text><text x="28" y="225" font-size="21">Livre: 1/4 → produção: 2 RNA/min</text><text x="28" y="259" font-size="24" fill="#2154a0">Média estacionária: 4 RNA</text><text x="26" y="304" font-size="23" font-weight="bold">B: sítio sem ligação</text><path d="M28 331h100" stroke="#192e49" stroke-width="3"/><rect x="58" y="317" width="60" height="28" fill="#f4f6fa" stroke="#2154a0" stroke-width="2"/><path d="M61 320l54 22m0 -22l-54 22" stroke="#2154a0" stroke-width="2"/><text x="140" y="338" font-size="19">Livre: 1 → 8 RNA/min</text><text x="28" y="383" font-size="24" fill="#2154a0">Média estacionária: 16 RNA</text><text x="24" y="420" font-size="17">α = 8 RNA/min; δ = 0,5 min⁻¹, iguais por hipótese.</text></g></svg>