<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">Faixas garantidas para a harmônica alternada</title><desc id="desc">Intervalos de somas consecutivas para N quatro, cinco, oito e nove; todos contêm logaritmo natural de dois. Ponto escuro marca a soma parcial: extremo inferior para N par e superior para N ímpar. A faixa se estreita com mais termos.</desc><rect width="440" height="460" rx="12" fill="#f4f6f0"/><g fill="#183038" font-family="Arial,sans-serif"><text x="24" y="34" font-size="21" font-weight="700">Somar mais, estreitar a garantia</text><text x="24" y="63" font-size="16">Σ(−1)ⁿ⁻¹/n · ponto escuro = Sₙ</text><path d="M220.32 92V337" stroke="#73807b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="205.32" y="86" font-size="15">ln 2</text><text x="20" y="125" font-size="16">N=4</text><path d="M97.33 120H321.33" stroke="#2f5db4" stroke-width="6"/><circle cx="97.33" cy="120" r="6" fill="#132d42"/><text x="20" y="189" font-size="16">N=5</text><path d="M134.67 184H321.33" stroke="#2f5db4" stroke-width="6"/><circle cx="321.33" cy="184" r="6" fill="#132d42"/><text x="20" y="253" font-size="16">N=8</text><path d="M154.67 248H279.11" stroke="#2f5db4" stroke-width="6"/><circle cx="154.67" cy="248" r="6" fill="#132d42"/><text x="20" y="317" font-size="16">N=9</text><path d="M167.11 312H279.11" stroke="#2f5db4" stroke-width="6"/><circle cx="279.11" cy="312" r="6" fill="#132d42"/><path d="M60 363H396" stroke="#73807b"/><g font-size="15"><path d="M116.00 358V368" stroke="#73807b"/><text x="104.00" y="389">0,6</text><path d="M228.00 358V368" stroke="#73807b"/><text x="216.00" y="389">0,7</text><path d="M340.00 358V368" stroke="#73807b"/><text x="328.00" y="389">0,8</text></g><text x="24" y="420" font-size="15">S está entre Sₙ e Sₙ₊₁, sob as hipóteses.</text><text x="24" y="445" font-size="14">Largura = próximo módulo; não é erro exato.</text></g></svg>