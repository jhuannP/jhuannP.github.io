<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Quatro spins sem campo</title><desc id="desc">Probabilidades de M menos4, menos2, zero,2,4:1,4,6,4,1 sobre16. Média zero mas probabilidade de zero é3/8.</desc><rect width="760" height="450" rx="20" fill="#f5f0e5"/><g font-family="sans-serif" fill="#183f43"><text x="42" y="48" font-size="27">Média zero. Flutuação presente.</text><text x="42" y="79" font-size="18">N = 4 · h = 0 · spins independentes</text><path d="M80 110V320H690" stroke="#183f43" fill="none"/><text x="30" y="112" font-size="17">P(M)</text><rect x="98" y="292" width="64" height="28" rx="5" fill="#21736f"/><text x="130" y="280" text-anchor="middle" font-size="20">1/16</text><text x="130" y="348" text-anchor="middle" font-size="21">-4</text><rect x="218" y="208" width="64" height="112" rx="5" fill="#21736f"/><text x="250" y="196" text-anchor="middle" font-size="20">4/16</text><text x="250" y="348" text-anchor="middle" font-size="21">-2</text><rect x="338" y="152" width="64" height="168" rx="5" fill="#bd5b39"/><text x="370" y="140" text-anchor="middle" font-size="20">6/16</text><text x="370" y="348" text-anchor="middle" font-size="21">0</text><rect x="458" y="208" width="64" height="112" rx="5" fill="#21736f"/><text x="490" y="196" text-anchor="middle" font-size="20">4/16</text><text x="490" y="348" text-anchor="middle" font-size="21">2</text><rect x="578" y="292" width="64" height="28" rx="5" fill="#21736f"/><text x="610" y="280" text-anchor="middle" font-size="20">1/16</text><text x="610" y="348" text-anchor="middle" font-size="21">4</text><text x="707" y="325" font-size="20">M</text><text x="42" y="397" font-size="21">⟨M⟩ = 0     Var(M) = 4     P(M = 0) = 3/8</text><text x="42" y="428" font-size="17">Distribuição de equilíbrio; não é trajetória no tempo.</text></g></svg>