<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430" role="img" aria-labelledby="t d"><title id="t">Reamostrar posições preserva seus pesos</title><desc id="d">Amostra1,1,4. Entre27sequências,médias1,2,3,4têm contagens8,12,6,1.</desc><rect width="420" height="430" fill="#f7f6ef"/><g font-family="Arial,sans-serif" fill="#252c25"><text x="24" y="33" font-size="21">Amostra fixa: [1, 1, 4]</text><text x="24" y="60" font-size="15">27 sequências de posições equiprováveis</text><text x="24" y="91" font-size="14">Contagem de cada média</text><path d="M50 110V300H390" fill="none" stroke="#737969"/><g fill="#3e4ca6"><rect x="70" y="188" width="48" height="112"/><rect x="150" y="132" width="48" height="168"/><rect x="230" y="216" width="48" height="84"/><rect x="310" y="286" width="48" height="14"/></g><g text-anchor="middle" font-size="17"><text x="94" y="174">8</text><text x="174" y="118">12</text><text x="254" y="202">6</text><text x="334" y="272">1</text><text x="94" y="325">1</text><text x="174" y="325">2</text><text x="254" y="325">3</text><text x="334" y="325">4</text></g><text x="390" y="352" text-anchor="end" font-size="14">Média da reamostra</text><text x="24" y="387" font-size="17">E*(média) = 2 · Var*(média) = 2/3</text><text x="24" y="416" font-size="14">Condicional aos dados; não é a população.</text></g></svg>
