<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560"><desc>Custos SSE dos três cortes: meia unidade dá vinte e seis terços; uma e meia dá cinco; duas e meia dá dois. Modelo constante custa quatorze.</desc><rect width="600" height="560" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">Um corte escolhido pelo treino</text><text x="30" y="75" font-size="17">x: 0, 1, 2, 3 · y: 0, 1, 2, 5</text><text x="30" y="117" font-size="17">SSE · menor é melhor neste critério</text><path d="M100 155v255h440" fill="none" stroke="#555"/><rect x="150" y="254" width="70" height="156" fill="#b3b7d9"/><rect x="280" y="320" width="70" height="90" fill="#b3b7d9"/><rect x="410" y="374" width="70" height="36" fill="#434ac3"/><path d="M100 158h440" stroke="#555" stroke-dasharray="5 5"/><text x="327" y="146" font-size="16">constante: 14</text><text x="160" y="240" font-size="20">26/3</text><text x="306" y="306" font-size="20">5</text><text x="438" y="361" font-size="20">2</text><text x="170" y="442" font-size="19">0,5</text><text x="300" y="442" font-size="19">1,5</text><text x="430" y="442" font-size="19">2,5</text><text x="250" y="475" font-size="17">limiar do corte</text><text x="30" y="520" font-size="17">Um ponto por folha permitido · sem teste externo</text></g></svg>