<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">Refinar pode aumentar ou diminuir a soma quadrática</title><desc id="desc">Dois exemplos determinísticos de incrementos. Um sobe um e desce um: soma fina dois, grossa zero. Outro sobe um e sobe um: soma fina dois, grossa quatro. Não são amostras brownianas.</desc><rect width="440" height="460" fill="#f8f7f1"/><g font-family="sans-serif" fill="#252e40"><text x="22" y="35" font-size="20" font-weight="bold">A malha muda os termos</text><text x="22" y="61" font-size="14">Mesmos pontos finais; dois exemplos finitos.</text><text x="22" y="97" font-size="16" font-weight="bold">1. Os incrementos se cancelam</text><path d="M40 195 H395" stroke="#9da4b1" stroke-width="2"/><path d="M40 195 L210 120 L395 195" fill="none" stroke="#2756a8" stroke-width="4"/><g fill="#2756a8"><circle cx="40" cy="195" r="5"/><circle cx="210" cy="120" r="5"/><circle cx="395" cy="195" r="5"/></g><text x="115" y="149" font-size="15">+1</text><text x="300" y="149" font-size="15">−1</text><text x="22" y="226" font-size="16">Fina: 1²+(−1)²=2 · Grossa: 0²=0</text><text x="22" y="266" font-size="16" font-weight="bold">2. Os incrementos se somam</text><path d="M40 365 L395 285" stroke="#9da4b1" stroke-width="7" stroke-dasharray="6 5"/><path d="M40 365 L210 325 L395 285" fill="none" stroke="#2756a8" stroke-width="3"/><g fill="#2756a8"><circle cx="40" cy="365" r="5"/><circle cx="210" cy="325" r="5"/><circle cx="395" cy="285" r="5"/></g><text x="110" y="328" font-size="15">+1</text><text x="300" y="292" font-size="15">+1</text><text x="22" y="400" font-size="16">Fina: 1²+1²=2 · Grossa: 2²=4</text><text x="22" y="437" font-size="14">Desenhos esquemáticos; não são Brownianos.</text></g></svg>