<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="t d"><title id="t">Expansões isotérmica e adiabática reversíveis</title><desc id="d">Curvas normalizadas começam no estado A, volume e pressão iguais a um. Ao dobrar o volume, a isotérmica reversível termina em B, pressão um meio. A adiabática reversível com gamma cinco terços termina em C, pressão aproximadamente zero vírgula trezentos e quinze. A expansão livre termina em B, mas não percorre a curva isotérmica de equilíbrio e seu trabalho é zero.</desc><rect width="440" height="430" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="20" y="30" font-size="20" font-weight="bold">Curvas distintas, balanços distintos.</text><path d="M20 65H65" stroke="#2448bc" stroke-width="3"/><text x="76" y="71" font-size="16">Isotérmica reversível</text><path d="M20 94H65" stroke="#555c50" stroke-width="3" stroke-dasharray="6 4"/><text x="76" y="100" font-size="16">Adiabática reversível, γ=5/3</text><path d="M80 125V320H399" stroke="#777b70" fill="none"/><text x="22" y="127" font-size="16">p/p₁</text><path d="M80.00,140.00 L87.50,144.39 L95.00,148.57 L102.50,152.56 L110.00,156.36 L117.50,160.00 L125.00,163.48 L132.50,166.81 L140.00,170.00 L147.50,173.06 L155.00,176.00 L162.50,178.82 L170.00,181.54 L177.50,184.15 L185.00,186.67 L192.50,189.09 L200.00,191.43 L207.50,193.68 L215.00,195.86 L222.50,197.97 L230.00,200.00 L237.50,201.97 L245.00,203.87 L252.50,205.71 L260.00,207.50 L267.50,209.23 L275.00,210.91 L282.50,212.54 L290.00,214.12 L297.50,215.65 L305.00,217.14 L312.50,218.59 L320.00,220.00 L327.50,221.37 L335.00,222.70 L342.50,224.00 L350.00,225.26 L357.50,226.49 L365.00,227.69 L372.50,228.86 L380.00,230.00" stroke="#2448bc" stroke-width="3" fill="none"/><path d="M80.00,140.00 L87.50,147.26 L95.00,154.06 L102.50,160.44 L110.00,166.44 L117.50,172.08 L125.00,177.40 L132.50,182.42 L140.00,187.17 L147.50,191.65 L155.00,195.90 L162.50,199.93 L170.00,203.76 L177.50,207.39 L1