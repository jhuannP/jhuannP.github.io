<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590"><desc>Um microestado de energia zero e três de energia Delta. Em beta Delta igual a ln três,o nível inferior tem metade da probabilidade e cada microestado superior tem um sexto.</desc><rect width="600" height="590" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">Nível não é microestado</text><text x="30" y="79" font-size="17">βΔ=ln 3 · Δ=1 unidade de energia</text><text x="30" y="152" font-size="20">E=Δ</text><path d="M140 157h100M280 157h100M420 157h100" stroke="#434ac3" stroke-width="4"/><text x="165" y="197" font-size="19">1/6</text><text x="305" y="197" font-size="19">1/6</text><text x="445" y="197" font-size="19">1/6</text><text x="30" y="281" font-size="20">E=0</text><path d="M280 285h100" stroke="#434ac3" stroke-width="4"/><text x="305" y="325" font-size="19">1/2</text><text x="30" y="397" font-size="20">Probabilidade do nível excitado: 3×1/6=1/2</text><text x="30" y="444" font-size="20">U=1/2 · Var(E)=1/4</text><text x="30" y="490" font-size="20">C/kB=(ln 3)²/4 ≈ 0,301737</text><text x="30" y="547" font-size="17">Pesos fornecidos pelo modelo; sem taxa temporal.</text></g></svg>