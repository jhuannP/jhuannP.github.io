<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440" role="img" aria-labelledby="t d"><title id="t">Cortes de uma singularidade</title><desc id="d">Retângulo retido de a a um e de b a um dentro do quadrado unitário. Os limites dependem da razão a sobre b.</desc><rect width="420" height="440" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="36" font-size="22">Primeiro corte, depois limite</text><path d="M70 90H350V350H70Z" fill="none" stroke="#99a5ad"/><path d="M140 90H350V280H140Z" fill="#285e88" fill-opacity=".18" stroke="#285e88" stroke-width="2"/><path d="M55 350H370M70 365V70" fill="none" stroke="#242c35" stroke-width="2"/><g font-size="19"><text x="49" y="375">0</text><text x="133" y="375">a</text><text x="345" y="375">1</text><text x="43" y="286">b</text><text x="44" y="99">1</text><text x="376" y="354">x</text><text x="65" y="64">y</text><text x="187" y="176">[a,1] × [b,1]</text><text x="179" y="211">a &gt; 0 · b &gt; 0</text></g><text x="24" y="416" font-size="18">A razão a/b muda o limite.</text></g></svg>