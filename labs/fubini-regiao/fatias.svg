<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title desc"><title id="title">A mesma região entre y igual a x ao quadrado e y igual a x</title><desc id="desc">Região no quadrado de zero a um, acima da parábola y igual a x ao quadrado e abaixo da reta y igual a x. Uma fatia vertical em x um meio vai de y um quarto a um meio. Uma fatia horizontal em y um quarto vai de x um quarto a um meio. As duas fatias descrevem o mesmo domínio.</desc><rect width="440" height="440" fill="#f4f3eb"/><g font-family="Arial,sans-serif" font-size="17" fill="#20221e"><text x="22" y="29" font-size="21" font-weight="bold">Mesma região, duas leituras</text><text x="22" y="58">D: x²≤y≤x, com 0≤x≤1.</text><path d="M60 350L320 90Q190 350 60 350Z" fill="#e3e7f7"/><path d="M60 80V350H350" stroke="#7c8574" stroke-width="1.5" fill="none"/><path d="M60 350L320 90 M60 350Q190 350 320 90" fill="none" stroke="#20221e" stroke-width="2"/><text x="331" y="92">y=x</text><text x="309" y="170">y=x²</text><path d="M190 220V285" stroke="#2348db" stroke-width="3"/><path d="M125 285H190" stroke="#2348db" stroke-width="3" stroke-dasharray="6 3"/><circle cx="190" cy="220" r="3" fill="#2348db"/><circle cx="190" cy="285" r="3" fill="#2348db"/><circle cx="125" cy="285" r="3" fill="#2348db"/><text x="204" y="232" fill="#2348db">x=1/2</text><text x="204" y="303" fill="#2348db">y=1/4</text><text x="36" y="96">1</text><text x="42" y="354">0</text><text x="315" y="372">1</text><text x="352" y="355">x</text><text x="37" y="78">y</text><text x="22" y="402">Vertical: x²≤y≤x.</text><text x="22" y="430">Horizontal: y≤x≤√y.</text></g></svg>