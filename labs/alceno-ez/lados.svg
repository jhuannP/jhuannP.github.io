<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc"><title id="title">Prioridades por carbono e dois descritores</title><desc id="desc">Dois desenhos de alceno. Em ambos, carbono esquerdo tem cloro acima e flúor abaixo. No desenho E, bromo está acima e iodo abaixo no carbono direito. No Z, iodo acima e bromo abaixo. Cloro e iodo são as maiores prioridades locais, marcadas em verde.</desc><rect width="680" height="430" rx="18" fill="#f5f1e8"/><g font-family="Arial,sans-serif" fill="#183f38"><text x="28" y="35" font-size="22" font-weight="bold">Ordene um par em cada carbono</text><text x="28" y="67" font-size="17">Cl (17) &gt; F (9) · I (53) &gt; Br (35)</text><g transform="translate(0,0)"><text x="155" y="99" text-anchor="middle" font-size="26" font-weight="bold">E</text><path d="M115 205H205M115 213H205M109 201L65 153M109 217L65 265M211 201L255 153M211 217L255 265" stroke="#315c54" stroke-width="3" fill="none"/><text x="91" y="217" font-size="22">C</text><text x="210" y="217" font-size="22">C</text><text x="34" y="146" font-size="23" font-weight="bold" fill="#176454">Cl</text><text x="42" y="294" font-size="23">F</text><text x="257" y="146" font-size="23">Br</text><text x="257" y="294" font-size="23" font-weight="bold" fill="#176454">I</text><text x="155" y="341" text-anchor="middle" font-size="17">Cl e I: lados opostos</text></g><g transform="translate(330,0)"><text x="155" y="99" text-anchor="middle" font-size="26" font-weight="bold">Z</text><path d="M115 205H205M115 213H205M109 201L65 153M109 217L65 265M211 201L255 153M211 217L255 265" stroke="#315c54" stroke-width="3" fill="none"/><text x="91" y="217" font-size="22">C</text><text x="210" y="217" font-size="22">C</text><text x="34" y="146" font-size="23" font-weight="bold" fill="#176454">Cl</text><text x="42" y="294" font-size="23">F</text><text x="257" y="146" font-size="23" font-weight="bold" fill="#176454">I</text><text x="257" y="294" font-size="23">Br</text><text x="155" y="341" text-anchor="middle" font-size="17">Cl e I: mesmo lado</text></g><text x="28" y="391" font-size="16">Verde: maior prioridade de cada par; não é escala de estabilidade.</text><text x="28" y="417" font-size="14">Diagramas originais · comprimentos e ângulos ilustrativos · sem dados experimentais</text></g></svg>