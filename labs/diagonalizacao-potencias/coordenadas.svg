<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470"><title>Duas aplicações de A por coordenadas próprias</title><desc>O vetor um zero tem coordenadas um meio um meio na base própria. D ao quadrado produz nove meios um meio. Retornar pela matriz P produz cinco quatro.</desc><rect width="440" height="470" fill="#f7f6ee"/><g font-family="sans-serif" fill="#252a22"><text x="24" y="33" font-size="20" font-weight="bold">Uma base, dois fatores de escala</text><text x="24" y="63" font-size="15">A = [[2,1],[1,2]] · duas aplicações</text><text x="24" y="115" font-size="16">Coordenadas usuais</text><text x="24" y="145" font-size="23" fill="#2453b6">v = (1, 0)</text><text x="210" y="179" font-size="20">↓ P⁻¹</text><text x="24" y="216" font-size="16">Na base ((1,1), (1,−1))</text><text x="24" y="247" font-size="23" fill="#2453b6">(α, β) = (1/2, 1/2)</text><text x="210" y="285" font-size="20">↓ D²</text><text x="24" y="322" font-size="23" fill="#2453b6">(9/2, 1/2)</text><text x="210" y="360" font-size="20">↓ P</text><text x="24" y="401" font-size="23" fill="#2453b6">A²v = (5, 4)</text><text x="24" y="441" font-size="14">P⁻¹ entra na base própria; P retorna à usual.</text></g></svg>