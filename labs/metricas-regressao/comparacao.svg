<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420"><title>Métricas podem preferir previsões diferentes</title><desc>Alvo um dois três. A prevê um dois sete,com erros zero zero quatro: MAE quatro terços,MSE dezesseis terços,RMSE quatro sobre raiz de três. B prevê três quatro cinco: MAE dois,MSE quatro,RMSE dois.</desc><rect width="440" height="420" fill="#f7f6ee"/><g font-family="sans-serif" fill="#252a22"><text x="24" y="33" font-size="20" font-weight="bold">Qual erro importa para a pergunta?</text><text x="24" y="63" font-size="15">Alvo y = (1, 2, 3) m · previsões fixas</text><text x="24" y="112" font-size="16" font-weight="bold">A: (1, 2, 7) m</text><text x="24" y="140" font-size="15">Erros (0, 0, 4) m</text><text x="24" y="185" font-size="15" fill="#2453b6">MAE = 4/3 m</text><text x="218" y="185" font-size="15">MSE = 16/3 m²</text><text x="24" y="213" font-size="15">RMSE = 4/√3 m ≈ 2,31 m</text><path d="M24 238H416" stroke="#bdc5b5"/><text x="24" y="273" font-size="16" font-weight="bold">B: (3, 4, 5) m</text><text x="24" y="301" font-size="15">Erros (2, 2, 2) m</text><text x="24" y="345" font-size="15">MAE = 2 m</text><text x="218" y="345" font-size="15" fill="#2453b6">MSE = 4 m²</text><text x="24" y="373" font-size="15">RMSE = 2 m</text><text x="24" y="407" font-size="14">MAE prefere A; MSE e RMSE preferem B.</text></g></svg>