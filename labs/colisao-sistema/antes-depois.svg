<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
<title id="title">Dois corpos aderem: momento conservado, energia cinética reduzida</title><desc id="desc">Antes: dois corpos de um quilograma, primeiro com velocidade quatro metros por segundo para a direita e segundo parado. Depois de aderirem: massa total dois quilogramas e velocidade comum dois metros por segundo para a direita. Momento total quatro quilogramas metro por segundo antes e depois; energia cinética de oito para quatro joules.</desc>
<rect width="360" height="430" fill="#faf9f2"/>
<defs><marker id="velocity-tip" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#2447ae"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#22271b" text-anchor="middle">
<text x="180" y="27" font-size="20" font-weight="bold">Antes da adesão</text><text x="180" y="54" font-size="16">Eixo positivo para a direita →</text>
<g fill="none" stroke="#55594c" stroke-width="1.5"><rect x="25" y="101" width="70" height="57"/><rect x="265" y="101" width="70" height="57"/><line x1="15" y1="161" x2="345" y2="161"/></g>
<g font-size="18"><text x="60" y="136">1 kg</text><text x="300" y="136">1 kg</text><text x="300" y="87">u₂ = 0</text></g>
<line x1="70" y1="81" x2="210" y2="81" stroke="#2447ae" stroke-width="2.5" marker-end="url(#velocity-tip)"/><text x="145" y="72" fill="#2447ae" font-size="18">u₁ = 4 m/s</text>
<text x="180" y="190" font-size="18">p = 4 kg·m/s · K = 8 J</text>
<text x="180" y="235" font-size="20" font-weight="bold">Depois: ficam juntos</text>
<g fill="none" stroke="#55594c" stroke-width="1.5"><rect x="95" y="289" width="85" height="57"/><rect x="180" y="289" width="85" height="57"/><line x1="15" y1="349" x2="345" y2="349"/></g>
<g font-size="18"><text x="137" y="324">1 kg</text><text x="222" y="324">1 kg</text></g>
<line x1="145" y1="269" x2="215" y2="269" stroke="#2447ae" stroke-width="2.5" marker-end="url(#velocity-tip)"/><text x="180" y="260" fill="#2447ae" font-size="18">v = 2 m/s</text>
<text x="180" y="379" font-size="18">p = 4 kg·m/s · K = 4 J</text><text x="180" y="410" font-size="16">Queda de K: 4 J · sem impulso externo</text></g></svg>