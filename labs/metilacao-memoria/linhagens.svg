<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450"><title>Metilação sem manutenção em duas rodadas</title><desc>Um DNA inicialmente com duas fitas marcadas gera dois hemimetilados na primeira rodada. Na segunda, há dois hemimetilados e dois sem marca. O desenho representa marcas em fitas, não bases pareadas.</desc><rect width="440" height="450" fill="#f7f6ee"/><g font-family="sans-serif" fill="#242821"><text x="22" y="32" font-size="19" font-weight="bold">Sem manutenção: duas marcas persistem</text><text x="22" y="59" font-size="14">Um sítio abstrato por DNA; ● = fita marcada</text><text x="22" y="101" font-size="16">Início</text><text x="22" y="221" font-size="16">1ª rodada</text><text x="22" y="351" font-size="16">2ª rodada</text></g><g stroke="#2453b6" stroke-width="4"><path d="M201 90h60 M201 107h60 M141 210h45 M141 227h45 M291 210h45 M291 227h45 M121 340h35 M121 357h35 M201 340h35 M201 357h35 M281 340h35 M281 357h35 M361 340h35 M361 357h35"/></g><g fill="#2453b6"><circle cx="230" cy="90" r="6"/><circle cx="230" cy="107" r="6"/><circle cx="164" cy="210" r="6"/><circle cx="314" cy="210" r="6"/><circle cx="138" cy="340" r="6"/><circle cx="298" cy="340" r="6"/></g><g fill="none" stroke="#73786e" stroke-width="1.5"><path d="M225 130l-61 60 M235 130l79 60 M164 249l-26 69 M164 249l54 69 M314 249l-16 69 M314 249l64 69"/></g><g font-family="sans-serif" font-size="14" fill="#242821"><text x="22" y="401">4 DNAs · 8 citosinas-alvo · 2 marcas</text><text x="22" y="426">Fração de alvos marcados: 2/8 = 1/4</text></g></svg>