<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430"><title>Linhagem após duas rodadas</title><desc>Probabilidades de S2 igual a zero até quatro: 25,20,14,4,1 divididos por64. Distribuição calculada do modelo independente com p um meio.</desc><rect width="440" height="430" fill="#f7f6ee"/><g font-family="sans-serif" fill="#242821"><text x="24" y="34" font-size="20" font-weight="bold">Mesma média, destinos diferentes</text><text x="24" y="61" font-size="15">Modelo independente · p = 1/2 · duas rodadas</text><text x="24" y="96" font-size="14">Probabilidade</text><rect x="57" y="153.75" width="38" height="156.25" fill="#2453b6"/><text x="76" y="141.75" text-anchor="middle" font-size="14">25/64</text><text x="76" y="335" text-anchor="middle" font-size="16">0</text><rect x="129" y="185.0" width="38" height="125.0" fill="#2453b6"/><text x="148" y="173.0" text-anchor="middle" font-size="14">20/64</text><text x="148" y="335" text-anchor="middle" font-size="16">1</text><rect x="201" y="222.5" width="38" height="87.5" fill="#2453b6"/><text x="220" y="210.5" text-anchor="middle" font-size="14">14/64</text><text x="220" y="335" text-anchor="middle" font-size="16">2</text><rect x="273" y="285.0" width="38" height="25.0" fill="#2453b6"/><text x="292" y="273.0" text-anchor="middle" font-size="14">4/64</text><text x="292" y="335" text-anchor="middle" font-size="16">3</text><rect x="345" y="303.75" width="38" height="6.25" fill="#2453b6"/><text x="364" y="291.75" text-anchor="middle" font-size="14">1/64</text><text x="364" y="335" text-anchor="middle" font-size="16">4</text><path d="M45 310H403" fill="none" stroke="#74786e"/><text x="220" y="364" text-anchor="middle" font-size="14">S₂: células-tronco da linhagem</text><text x="24" y="399" font-size="15">Média = 1 · variância = 1 · P(S₂=0) = 25/64</text></g></svg>