<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-labelledby="title desc"><title id="title">Uma hipótese de mistura, não uma identificação</title><desc id="desc">Cem eventos prescritos. Sessenta com faces equiprováveis dão trinta inversões e trinta retenções. Quarenta eventos de inversão dão quarenta inversões. Total setenta inversões e trinta retenções. Outro mecanismo pode gerar a mesma proporção.</desc><rect width="700" height="480" fill="#f2efe5"/><g font-family="Arial,sans-serif" fill="#203b39"><text x="28" y="40" font-size="24" font-weight="bold">70:30 não identifica um mecanismo.</text><text x="28" y="74" font-size="17">100 eventos prescritos · exemplo próprio, sem dados reais</text><text x="350" y="130" text-anchor="middle" font-size="22">100</text><g stroke="#718580" fill="none" stroke-width="2"><path d="M335 146L182 184M365 146L518 184M180 237L105 291M180 237L288 291M520 237L518 291"/></g><text x="180" y="212" text-anchor="middle" font-size="22">60: duas faces iguais</text><text x="520" y="212" text-anchor="middle" font-size="22">40: só inversão</text><text x="105" y="320" text-anchor="middle" font-size="19">30 inversões</text><text x="288" y="320" text-anchor="middle" font-size="19">30 retenções</text><text x="518" y="320" text-anchor="middle" font-size="19">40 inversões</text><path d="M28 351H672" stroke="#b5bbb1"/><text x="28" y="389" font-size="22">Total: 70 inversões + 30 retenções</text><text x="28" y="423" font-size="16">Excesso normalizado: (70−30)/100 = 0,40</text><text x="28" y="455" font-size="15">Atribuir os 40 eventos a par iônico ou SN2 exige evidência adicional.</text></g></svg>