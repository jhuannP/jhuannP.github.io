<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t desc"><title id="t">Descreva a região antes da integral</title><desc id="desc">Vista superior de um quarto de anel entre raios1 e2, com ângulo entre0 e pi sobre2. Seção meridional mostra1 até2 em R e0 até4 menos R ao quadrado em Z. Coordenadas sem dimensão obtidas dividindo comprimentos por L.</desc><rect width="760" height="440" rx="18" fill="#f5f4ed"/><g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="40" font-size="25" font-weight="bold">Descreva a região antes da integral.</text><text x="28" y="84" font-size="19" font-weight="bold">Vista superior (X,Y)</text><text x="410" y="84" font-size="19" font-weight="bold">Seção meridional (R,Z)</text><path d="M255 310 A190 190 0 0 0 65 120 L65 215 A95 95 0 0 1 160 310Z" fill="#cddfd4" stroke="#23696d" stroke-width="2"/><path d="M45 310H285 M65 330V105" stroke="#18343a" stroke-width="1.5"/><path d="M110 310 A45 45 0 0 0 65 265" stroke="#a77d3e" stroke-width="2" fill="none"/><g font-size="17"><text x="280" y="335">X</text><text x="42" y="113">Y</text><text x="46" y="335">0</text><text x="151" y="335">1</text><text x="250" y="335">2</text><text x="120" y="282">θ</text><text x="95" y="365">0 ≤ θ ≤ π/2</text></g><polygon points="525,340 525.00,145.00 529.38,150.53 533.75,156.28 538.12,162.27 542.50,168.47 546.88,174.90 551.25,181.56 555.62,188.45 560.00,195.56 564.38,202.89 568.75,210.45 573.12,218.24 577.50,226.25 581.88,234.49 586.25,242.95 590.62,251.64 595.00,260.56 599.38,269.70 603.75,279.06 608.12,288.65 612.50,298.47 616.88,308.52 621.25,318.78 625.62,329.28 630.00,340.00" fill="#e5d9bd" stroke="#876b42" stroke-width="2"/><path d="M408 340H710 M420 355V102" stroke="#18343a" stroke-width="1.5"/><path d="M420 145H525" stroke="#876b42" stroke-dasharray="5 5" fill="none"/><g font-size="17"><text x="712" y="346">R</text><text x="404" y="103">Z</text><text x="404" y="364">0</text><text x="520" y="364">1</text><text x="626" y="364">2</text><text x="398" y="151">3</text><text x="554" y="131">Z = 4 − R²</text><text x="544" y="290">região</text></g><text x="28" y="405" font-size="17">R = r/L, Z = z/L • θ em radianos • desenho original</text><text x="28" y="430" font-size="15">Duas projeções do mesmo sólido; não é uma imagem experimental.</text></g></svg>