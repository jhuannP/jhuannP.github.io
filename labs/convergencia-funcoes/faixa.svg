<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><title>Erro pequeno vezes comprimento finito</title><desc>No intervalo2a5,erro uniforme no máximo1/4produz limite de erro da integral3/4. Em domínio não limitado,um retângulo de comprimento n ealtura1/n mantém área1.</desc><rect width="600" height="600" fill="#f6f5ed"/><g font-family="Arial,sans-serif" fill="#202722"><text x="35" y="43" font-size="23">O comprimento também entra na conta</text><text x="35" y="85" font-size="18">Cota uniforme E = 1/4 · intervalo [2, 5]</text><rect x="110" y="140" width="360" height="100" fill="#e5e4fa" stroke="#4843bb"/><path d="M65 240H530M110 260V115" stroke="#8b9387" fill="none"/><g font-size="18"><text x="85" y="285">2</text><text x="460" y="285">5</text><text x="38" y="153">1/4</text><text x="200" y="195">Área da faixa = 3/4</text><text x="35" y="337">|∫fₙ − ∫f| ≤ (5 − 2) · E = 3/4</text><path d="M35 365H565" stroke="#b0b6aa"/><text x="35" y="410">No semieixo, outra sequência:</text><text x="35" y="452">hₙ = 1/n em [0, n]; zero no restante.</text><text x="35" y="494">Supremo 1/n → 0, mas área = 1.</text><text x="35" y="545" font-size="17">Uniformidade sozinha não controla uma cauda infinita.</text></g></g></svg>