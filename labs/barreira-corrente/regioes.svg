<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440"><title>Barreira finita e três soluções</title><desc>Potencial zero fora de zero a a e V zero dentro. Energia constante abaixo do topo; duas exponenciais são necessárias dentro da região finita.</desc><rect width="420" height="440" rx="16" fill="#f4f2ed"/><g font-family="system-ui,sans-serif" fill="#203332"><text x="24" y="36" font-size="20" font-weight="700">E constante, soluções diferentes</text><rect x="155" y="90" width="110" height="140" fill="#e8e0ce"/><path d="M30 230H155V90H265V230H390" stroke="#203332" stroke-width="3" fill="none"/><path d="M30 160H390" stroke="#205bc1" stroke-width="2" stroke-dasharray="7 5"/><text x="35" y="150" font-size="16" fill="#205bc1">E</text><text x="175" y="78" font-size="16">V₀ &gt; E</text><text x="147" y="255" font-size="15">0</text><text x="259" y="255" font-size="15">a</text><text x="381" y="255" font-size="15">x</text><text x="24" y="293" font-size="16">I · Incidente + refletida</text><text x="24" y="323" font-size="16">II · C exp(κx) + D exp(−κx)</text><text x="24" y="353" font-size="16">III · Apenas transmitida</text><path d="M24 376H396" stroke="#bdc7bf"/><text x="24" y="405" font-size="14">V(x) é energia potencial, não densidade.</text><text x="24" y="425" font-size="13">Modelo 1D; regiões externas iguais.</text></g></svg>
