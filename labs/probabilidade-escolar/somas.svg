<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d"><title id="t">As somas não são equiprováveis</title><desc id="d">Para dois dados ideais e independentes de seis faces, os números de pares que geram as somas de 2 a 12 são 1,2,3,4,5,6,5,4,3,2,1. A soma 7 tem seis pares entre 36 e a soma 2 apenas um.</desc><rect width="440" height="420" fill="#f2f1e7"/><g font-family="sans-serif" fill="#262722"><text x="24" y="32" font-size="19" font-weight="bold">As somas não são equiprováveis.</text><text x="24" y="61" font-size="15">Dois dados ideais e independentes.</text><text x="24" y="92" font-size="16">Número de pares</text><path d="M40 110V300H400" fill="none" stroke="#777"/><rect x="50" y="272" width="20" height="28" fill="#2348db"/><text x="60" y="264" text-anchor="middle" font-size="16">1</text><text x="60" y="324" text-anchor="middle" font-size="16">2</text><rect x="80" y="244" width="20" height="56" fill="#2348db"/><text x="90" y="236" text-anchor="middle" font-size="16">2</text><text x="90" y="324" text-anchor="middle" font-size="16">3</text><rect x="110" y="216" width="20" height="84" fill="#2348db"/><text x="120" y="208" text-anchor="middle" font-size="16">3</text><text x="120" y="324" text-anchor="middle" font-size="16">4</text><rect x="140" y="188" width="20" height="112" fill="#2348db"/><text x="150" y="180" text-anchor="middle" font-size="16">4</text><text x="150" y="324" text-anchor="middle" font-size="16">5</text><rect x="170" y="160" width="20" height="140" fill="#2348db"/><text x="180" y="152" text-anchor="middle" font-size="16">5</text><text x="180" y="324" text-anchor="middle" font-size="16">6</text><rect x="200" y="132" width="20" height="168" fill="#2348db"/><text x="210" y="124" text-anchor="middle" font-size="16">6</text><text x="210" y="324" text-anchor="middle" font-size="16">7</text><rect x="230" y="160" width="20" height="140" fill="#2348db"/><text x="240" y="152" text-anchor="middle" font-size="16">5</text><text x="240" y="324" text-anchor="middle" font-size="16">8</text><rect x="260" y="188" width="20" height="112" fill="#2348db"/><text x="270" y="180" text-anchor="middle" font-size="16">4</text><text x="270" y="324" text-anchor="middle" font-size="16">9</text><rect x="290" y="216" width="20" height="84" fill="#2348db"/><text x="300" y="208" text-anchor="middle" font-size="16">3</text><text x="300" y="324" text-anchor="middle" font-size="16">10</text><rect x="320" y="244" width="20" height="56" fill="#2348db"/><text x="330" y="236" text-anchor="middle" font-size="16">2</text><text x="330" y="324" text-anchor="middle" font-size="16">11</text><rect x="350" y="272" width="20" height="28" fill="#2348db"/><text x="360" y="264" text-anchor="middle" font-size="16">1</text><text x="360" y="324" text-anchor="middle" font-size="16">12</text><text x="156" y="354" font-size="15">Soma dos resultados</text><text x="24" y="387" font-size="15">Probabilidade da soma = contagem / 36.</text><text x="24" y="410" font-size="16">Cada um dos 36 pares tem probabilidade 1/36.</text></g></svg>