<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t d"><title id="t">Três perguntas sobre campos</title><desc id="d">Gradiente dá variação direcional de escalar. Divergência compara fluxo externo e área. Rotacional compara circulação anti-horária e área. No campo afim do exemplo, div1 e curlz4.</desc><rect width="760" height="440" rx="20" fill="#f5f0e5"/><g font-family="sans-serif" fill="#183f43"><text x="36" y="45" font-size="27">O operador depende da pergunta.</text><path d="M260 95V350 M510 95V350" stroke="#c2c8be"/><text x="36" y="103" font-size="22">Gradiente</text><text x="280" y="103" font-size="22">Divergência</text><text x="532" y="103" font-size="22">Rotacional</text><text x="36" y="136" font-size="17">escalar → vetor</text><text x="280" y="136" font-size="17">vetor → escalar</text><text x="532" y="136" font-size="17">vetor → vetor</text><path d="M60 265L185 175 M185 175L166 178 M185 175L181 195" stroke="#21736f" stroke-width="5" fill="none"/><text x="36" y="308" font-size="18">Dᵤφ = ∇φ · u</text><rect x="336" y="190" width="75" height="75" fill="none" stroke="#21736f" stroke-width="3"/><path d="M374 192V159 M374 159L368 170 M374 159L380 170 M410 228H445 M445 228L434 222 M445 228L434 234" stroke="#21736f" stroke-width="3" fill="none"/><text x="280" y="308" font-size="18">fluxo / área</text><path d="M571 262V190H652V262H571 M571 230L565 220 M571 230L577 220" stroke="#bd5b39" stroke-width="3" fill="none"/><text x="532" y="308" font-size="18">circulação / área</text><text x="36" y="383" font-size="21">F = (2x − 3y + 1, x − y + 2, 0)</text><text x="36" y="417" font-size="18">div F = 1 · (curl F)z = 4 · Esquemas conceituais, sem escala.</text></g></svg>