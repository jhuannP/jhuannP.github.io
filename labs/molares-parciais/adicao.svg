<svg xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410" role="img" aria-labelledby="t d"><title id="t">Derivada e adição finita</title><desc id="d">No modelo: volume inicial357cm³. Adição de meio mol de B aumenta volume em29cm³. Aproximação linear28,875cm³. Diferença0,125cm³.</desc><rect width="420" height="410" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="38" font-size="22">Adicionar muda a composição</text><text x="24" y="82" font-size="19">Inicial: 3 mol A + 1 mol B</text><text x="24" y="121" font-size="25">V = 357 cm³</text><path d="M24 147H396" stroke="#bcc4ca"/><text x="24" y="185" font-size="19">Adicionar 0,5 mol de B</text><text x="24" y="228" font-size="23" fill="#285e88">ΔV exato: 29 cm³</text><text x="24" y="270" font-size="21">Linear: 28,875 cm³</text><text x="24" y="320" font-size="19">Diferença: 0,125 cm³</text><text x="24" y="379" font-size="17">T e P fixas · modelo sintético</text></g></svg>