<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">Força constante, aceleração coordenada variável</title>
<desc id="desc">Três estados exatos da trajetória retilínea a partir do repouso. q=0,3/4,4/3; beta=0,3/5,4/5; A=1,64/125,27/125.</desc>
<rect width="720" height="510" rx="22" fill="#f2eee2"/>
<g font-family="sans-serif" fill="#193d3a">
<text x="28" y="40" font-size="27" font-weight="700">Mesma força. Outra aceleração.</text>
<text x="28" y="76" font-size="20">Movimento prescrito desde o repouso • F &gt; 0</text>
<rect x="22" y="112" width="216" height="272" rx="15" fill="#e0e7db" stroke="#146a62"/>
<text x="40" y="151" font-size="27" font-weight="700">q = 0</text>
<text x="40" y="200" font-size="23">γ = 1</text>
<text x="40" y="248" font-size="23">β = v/c = 0</text>
<text x="40" y="296" font-size="23">X = 0</text>
<text x="40" y="344" font-size="23">A = 1</text>
<rect x="258" y="112" width="216" height="272" rx="15" fill="#e0e7db" stroke="#146a62"/>
<text x="276" y="151" font-size="27" font-weight="700">q = 3/4</text>
<text x="276" y="200" font-size="23">γ = 5/4</text>
<text x="276" y="248" font-size="23">β = v/c = 3/5</text>
<text x="276" y="296" font-size="23">X = 1/4</text>
<text x="276" y="344" font-size="23">A = 64/125</text>
<rect x="494" y="112" width="216" height="272" rx="15" fill="#e0e7db" stroke="#146a62"/>
<text x="512" y="151" font-size="27" font-weight="700">q = 4/3</text>
<text x="512" y="200" font-size="23">γ = 5/3</text>
<text x="512" y="248" font-size="23">β = v/c = 4/5</text>
<text x="512" y="296" font-size="23">X = 2/3</text>
<text x="512" y="344" font-size="23">A = 27/125</text>
<text x="28" y="421" font-size="20">q = Ft/(mc)     X = Fx/(mc²)     A = ma/F</text>
<text x="28" y="456" font-size="20">Momento cresce; velocidade permanece abaixo de c.</text>
<text x="28" y="489" font-size="18">Valores adimensionais do modelo • não são medições</text>
</g></svg>