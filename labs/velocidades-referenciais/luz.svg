<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="t d"><title id="t">A direção muda, o módulo não</title><desc id="d">Um vetor velocidade da luz dividido por c é vertical em S, com componentes zero e um. Em S linha, com boost positivo três quintos ao longo de x, passa a menos três quintos e quatro quintos. Ambos têm módulo um.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2154a0"/></marker></defs><rect width="560" height="430" fill="#f4f6fa"/><g font-family="sans-serif" fill="#192e49"><text x="24" y="39" font-size="25" font-weight="bold">Luz: mesma rapidez c</text><text x="24" y="74" font-size="19">Boost b = 3/5 ao longo de x</text><text x="118" y="119" font-size="23" font-weight="bold">S</text><text x="381" y="119" font-size="23" font-weight="bold">S′</text><circle cx="137" cy="259" r="100" fill="none" stroke="#a7b4c8"/><circle cx="406" cy="259" r="100" fill="none" stroke="#a7b4c8"/><path d="M27 259h220 M137 369V147 M296 259h220 M406 369V147" fill="none" stroke="#a7b4c8"/><path d="M137 259V159" fill="none" stroke="#2154a0" stroke-width="3" marker-end="url(#arrow)"/><path d="M406 259L346 179" fill="none" stroke="#2154a0" stroke-width="3" marker-end="url(#arrow)"/><text x="236" y="284" font-size="17">aₓ</text><text x="145" y="152" font-size="17">aᵧ</text><text x="502" y="284" font-size="17">aₓ′</text><text x="414" y="152" font-size="17">aᵧ′</text><text x="73" y="397" font-size="23">(0, 1)</text><text x="319" y="397" font-size="23">(−3/5, 4/5)</text><text x="24" y="424" font-size="16">Componentes em unidades de c; círculos de norma 1.</text></g></svg>