<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">Resíduos podem somar zero sem serem zero</title><desc id="desc">Treino sintético com x zero um dois e y um dois dois. Reta ajustada y chapéu igual a x sobre dois mais sete sextos. Previsões sete sextos, cinco terços e treze sextos. Resíduos previsão menos observação: um sexto, menos um terço e um sexto. Somam zero, mas MSE é um dezoito avos.</desc><rect width="480" height="520" fill="#f7f4ec"/><g fill="#202b29" font-family="Georgia,serif"><text x="28" y="42" font-size="25">Equilibrar não é zerar o erro</text><text x="28" y="82" font-size="20">Reta: ŷ=x/2+7/6 · treino sintético</text><path d="M28 107H452 M28 171H452 M28 355H452" stroke="#89938b"/><text x="40" y="149" font-size="20">x</text><text x="135" y="149" font-size="20">y</text><text x="230" y="149" font-size="20">ŷ</text><text x="330" y="149" font-size="20">e=ŷ−y</text><text x="40" y="216" font-size="22">0</text><text x="135" y="216" font-size="22">1</text><text x="230" y="216" font-size="22">7/6</text><text x="330" y="216" font-size="22">1/6</text><text x="40" y="274" font-size="22">1</text><text x="135" y="274" font-size="22">2</text><text x="230" y="274" font-size="22">5/3</text><text x="330" y="274" font-size="22">−1/3</text><text x="40" y="332" font-size="22">2</text><text x="135" y="332" font-size="22">2</text><text x="230" y="332" font-size="22">13/6</text><text x="330" y="332" font-size="22">1/6</text><text x="28" y="405" font-size="23" fill="#265e50">Σe=0 · Σxe=0</text><text x="28" y="450" font-size="23">MSE=(1/36+1/9+1/36)/3=1/18</text><text x="28" y="495" font-size="17">Condição do ajuste ≠ teste de generalização</text></g></svg>