<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Dois vizinhos não obrigam três linhas</title><desc id="desc">Três modelos de primeira ordem com dois vizinhos spin meio. J iguais a seis hertz dão deslocamentos menos seis,zero,seis com pesos um quarto,um meio,um quarto. J seis e dois dão quatro linhas menos quatro,menos dois,dois,quatro com pesos iguais a um quarto. Dois J seis prescritos separadamente produzem o mesmo tripleto,sem provar equivalência química. As alturas desenhadas são pesos de linhas discretas,sem largura ou ruído.</desc>
<rect width="760" height="620" rx="18" fill="#f4f0e5"/>
<g font-family="Arial,sans-serif" fill="#203b39">
<text x="34" y="42" font-size="24" font-weight="bold">Dois vizinhos ≠ sempre três linhas</text>
<text x="34" y="73" font-size="17">Modelos prescritos · spin 1/2 · primeira ordem · área total = 1</text>
<rect x="26" y="93" width="708" height="142" rx="12" fill="#e4e9e1"/>
<text x="44" y="119" font-size="18" font-weight="bold">Mesmo J: 6 Hz e 6 Hz</text>
<path d="M132 198 H654 M195 198 V171 M393 198 V144 M591 198 V171" stroke="#ae563c" stroke-width="4" fill="none"/>
<text x="182" y="224" font-size="16">−6</text><text x="388" y="224" font-size="16">0</text><text x="585" y="224" font-size="16">+6 Hz</text>
<text x="180" y="160" font-size="15">1/4</text><text x="379" y="139" font-size="15">1/2</text><text x="578" y="160" font-size="15">1/4</text>
<rect x="26" y="249" width="708" height="142" rx="12" fill="#e4e9e1"/>
<text x="44" y="276" font-size="18" font-weight="bold">J distintos: 6 Hz e 2 Hz</text>
<path d="M132 354 H654 M261 354 V327 M327 354 V327 M459 354 V327 M525 354 V327" stroke="#ae563c" stroke-width="4" fill="none"/>
<text x="248" y="380" font-size="16">−4</text><text x="314" y="380" font-size="16">−2</text><text x="448" y="380" font-size="16">+2</text><text x="514" y="380" font-size="16">+4 Hz</text>
<text x="44" y="303" font-size="16">1/4 cada</text>
<rect x="26" y="405" width="708" height="142" rx="12" fill="#e4e9e1"/>
<text x="44" y="432" font-size="18" font-weight="bold">Dois grupos com J = 6 Hz também coincidem</text>
<path d="M132 510 H654 M195 510 V483 M393 510 V456 M591 510 V483" stroke="#ae563c" stroke-width="4" fill="none"/>
<text x="182" y="536" font-size="16">−6</text><text x="388" y="536" font-size="16">0</text><text x="585" y="536" font-size="16">+6 Hz</text>
<text x="34" y="578" font-size="18" font-weight="bold">Mesmo desenho não prova equivalência química.</text>
<text x="34" y="604" font-size="15">Posições relativas ao centro · traços são pesos, não altura de linhas reais</text>
</g></svg>