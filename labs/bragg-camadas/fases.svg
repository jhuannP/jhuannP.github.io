<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t desc"><title id="t">Mesma geometria de célula, amplitudes que podem cancelar</title><desc id="desc">Quatro células ilustradas com espalhadores em j d e j d mais d sobre dois. Para pesos iguais, ordem ímpar soma amplitudes opostas e ordem par soma amplitudes iguais. O desenho não representa intensidades medidas.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#23696d"/></marker></defs><rect width="760" height="440" rx="18" fill="#f5f4ed"/><g font-family="Arial,sans-serif" fill="#18343a"><text x="28" y="40" font-size="24" font-weight="bold">Uma direção possível não garante um pico.</text><text x="28" y="70" font-size="16">Modelo 1D original • dois espalhadores por célula • pesos 1 e b</text><path d="M70 140H680" stroke="#b2b9b1" stroke-width="2"/>
<g fill="#23696d"><circle cx="72" cy="140" r="10"/><circle cx="232" cy="140" r="10"/><circle cx="392" cy="140" r="10"/><circle cx="552" cy="140" r="10"/></g><g fill="#a77d3e"><circle cx="152" cy="140" r="10"/><circle cx="312" cy="140" r="10"/><circle cx="472" cy="140" r="10"/><circle cx="632" cy="140" r="10"/></g>
<path d="M72 105H232" stroke="#23696d" marker-start="url(#a)" marker-end="url(#a)"/><text x="152" y="98" font-size="18" text-anchor="middle">d</text><g text-anchor="middle" font-size="15"><text x="72" y="173">0</text><text x="152" y="173">d/2</text><text x="232" y="173">d</text><text x="312" y="173">3d/2</text><text x="392" y="173">2d</text><text x="472" y="173">5d/2</text><text x="552" y="173">3d</text><text x="632" y="173">7d/2</text></g>
<rect x="28" y="205" width="340" height="150" rx="12" fill="#e1ece6"/><rect x="390" y="205" width="342" height="150" rx="12" fill="#ede4d5"/><g font-size="19" font-weight="bold"><text x="48" y="238">b = 1 • ordem ímpar</text><text x="410" y="238">b = 1 • ordem par</text></g><g font-size="31"><text x="62" y="291">→ + ← = 0</text><text x="425" y="291">→ + → = 2</text></g><g font-size="16"><text x="48" y="329">Fases opostas: cancelamento</text><text x="410" y="329">Mesma fase: reforço</text></g><text x="28" y="391" font-size="16">Setas: amplitudes e fases, não direção de propagação.</text><text x="28" y="418" font-size="16">Com b = 1, o período mínimo do modelo é d/2; d é célula escolhida.</text></g></svg>