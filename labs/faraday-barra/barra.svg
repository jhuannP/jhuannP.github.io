<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 550" width="440" height="550" role="img" aria-labelledby="t desc"><title id="t">Barra móvel: corrente horária e força de frenagem</title><desc id="desc">Trilhos horizontais unidos à esquerda por um resistor e à direita por uma barra vertical movendo para a direita. Campo sai do plano. Corrente desce na barra, força magnética para esquerda, força externa para direita.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#17363d" stroke-width="1.5"/></marker></defs><rect width="440" height="550" fill="#faf8f1"/><g font-family="sans-serif" fill="#17363d"><text x="24" y="33" font-size="21">A energia vem de quem puxa</text><text x="24" y="64" font-size="15">B sai do plano · área aumenta</text><g fill="#819b94"><circle cx="130" cy="160" r="2.5"/><circle cx="130" cy="205" r="2.5"/><circle cx="130" cy="250" r="2.5"/><circle cx="130" cy="295" r="2.5"/><circle cx="180" cy="160" r="2.5"/><circle cx="180" cy="205" r="2.5"/><circle cx="180" cy="250" r="2.5"/><circle cx="180" cy="295" r="2.5"/><circle cx="230" cy="160" r="2.5"/><circle cx="230" cy="205" r="2.5"/><circle cx="230" cy="250" r="2.5"/><circle cx="230" cy="295" r="2.5"/></g><path d="M70 145 H350 M70 315 H350 M70 145 V195 L60 205 L80 220 L60 235 L80 250 L70 265 V315" fill="none" stroke="#476a68" stroke-width="3"/><path d="M290 145 V315" stroke="#9c4b24" stroke-width="8"/><path d="M308 178 V251" fill="none" stroke="#17363d" stroke-width="2" marker-end="url(#a)"/><path d="M168 130 H230" fill="none" stroke="#17363d" stroke-width="2" marker-end="url(#a)"/><path d="M180 329 H118" fill="none" stroke="#17363d" stroke-width="2" marker-end="url(#a)"/><path d="M300 111 H366" stroke="#17363d" stroke-width="2.5" marker-end="url(#a)"/><text x="314" y="99" font-size="16">v &gt; 0</text><path d="M280 281 H220" stroke="#17363d" stroke-width="2.5" marker-end="url(#a)"/><text x="198" y="306" font-size="14">F magnética</text><text x="320" y="220" font-size="15">I desce</text><text x="42" y="230" font-size="16">R</text><text x="24" y="379" font-size="16">Normal +z: contorno positivo anti-horário</text><text x="24" y="416" font-size="18">fem = −BLv; I = fem/R &lt; 0</text><text x="24" y="453" font-size="18">F externa v = I²R</text><text x="24" y="493" font-size="14">Velocidade mantida; autoindutância desprezada.</text><text x="24" y="525" font-size="14">Setas no circuito mostram corrente convencional.</text></g></svg>