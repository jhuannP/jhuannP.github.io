<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590"><desc>Duas linhas um,três e onze,treze são normalizadas separadamente. Cada linha centralizada é menos um,um;com epsilon três,a saída é menos meio,meio.</desc><rect width="600" height="590" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">Normalizar cada linha separadamente</text><text x="30" y="78" font-size="17">Último eixo de tamanho 2 · sem parâmetros afins</text><rect x="45" y="120" width="215" height="75" fill="#dfe2f3" stroke="#434ac3"/><rect x="45" y="225" width="215" height="75" fill="#dfe2f3" stroke="#434ac3"/><text x="98" y="166" font-size="25">[1, 3]</text><text x="83" y="271" font-size="25">[11, 13]</text><path d="M275 158h35l-8 -5m8 5-8 5 M275 263h35l-8 -5m8 5-8 5" stroke="#242927" fill="none"/><text x="340" y="166" font-size="24">[−1/2, 1/2]</text><text x="340" y="271" font-size="24">[−1/2, 1/2]</text><text x="30" y="355" font-size="20">Médias: 2 e 12 · variância: 1 em cada linha</text><text x="30" y="398" font-size="20">ε=3 → divisor √(1+3)=2</text><text x="30" y="452" font-size="20">Média de z: 0 · variância de z: 1/4</text><text x="30" y="510" font-size="17">Epsilon grande apenas para tornar a conta visível.</text><text x="30" y="551" font-size="17">As duas linhas não foram misturadas num único grupo.</text></g></svg>