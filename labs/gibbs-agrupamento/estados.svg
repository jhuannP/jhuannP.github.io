<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">Microestados e informação dentro dos grupos</title><desc id="desc">Quatro probabilidades um meio, um quarto, um oitavo e um oitavo agrupadas em A de massa três quartos e B de massa um quarto. Dentro de A as probabilidades são dois terços e um terço; dentro de B são um meio e um meio. A entropia microscópica é a entropia dos grupos mais a média das entropias internas.</desc><rect width="440" height="560" fill="#f5f4ef"/><g font-family="sans-serif" fill="#172b45"><text x="28" y="43" font-size="24">O rótulo não conta tudo</text><text x="28" y="76" font-size="16">p = [1/2, 1/4, 1/8, 1/8]</text>
<text x="28" y="124" font-size="18">Grupo A • P(A) = 3/4</text><text x="28" y="152" font-size="16">Microestado 0: 1/2</text><rect x="28" y="165" width="340" height="23" rx="3" fill="#386b9b"/><text x="28" y="217" font-size="16">Microestado 1: 1/4</text><rect x="28" y="230" width="170" height="23" rx="3" fill="#386b9b"/><text x="28" y="284" font-size="16">Dado A: [2/3, 1/3]</text>
<text x="28" y="332" font-size="18">Grupo B • P(B) = 1/4</text><text x="28" y="360" font-size="16">Microestado 2: 1/8</text><rect x="28" y="373" width="85" height="23" rx="3" fill="#386b9b"/><text x="28" y="425" font-size="16">Microestado 3: 1/8</text><rect x="28" y="438" width="85" height="23" rx="3" fill="#386b9b"/><text x="28" y="492" font-size="16">Dado B: [1/2, 1/2]</text><text x="28" y="533" font-size="14">Barras: massas micro; mesma escala e origem zero.</text></g></svg>