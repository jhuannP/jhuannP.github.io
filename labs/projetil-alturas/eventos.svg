<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="title desc"><title id="title">Três eventos na trajetória de um projétil</title><desc id="desc">Lançamento em x zero y quinze metros, velocidade inicial oito e dez metros por segundo, gravidade dez. Ápice em um segundo, x oito e y vinte. Retorno à altura quinze em dois segundos, x dezesseis. Chegada ao solo em três segundos, x vinte e quatro. A velocidade no ápice é horizontal e não nula.</desc><defs><marker id="blue-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2348db"/></marker></defs><rect width="440" height="430" fill="#f4f3eb"/><g fill="#20221e" font-family="Arial,sans-serif" font-size="17"><text x="22" y="30" font-size="20" font-weight="bold">O evento determina o tempo</text><text x="22" y="58">x=8t; y=15+10t−5t². Unidades SI.</text><path d="M55 80V340H400" stroke="#7c8574" stroke-width="1.5" fill="none"/><path d="M55 160H247" stroke="#7c8574" stroke-dasharray="5 5"/><path d="M55 160Q199 -20 343 340" stroke="#2348db" stroke-width="3" fill="none"/><g fill="#2348db"><circle cx="55" cy="160" r="4"/><circle cx="151" cy="100" r="4"/><circle cx="247" cy="160" r="4"/><circle cx="343" cy="340" r="4"/></g><path d="M151 100H203" stroke="#2348db" stroke-width="2" marker-end="url(#blue-arrow)"/><text x="211" y="106" fill="#2348db">vₓ=8 m/s</text><text x="95" y="86">Ápice: 1 s</text><text x="66" y="188">0 s</text><text x="258" y="160">2 s</text><text x="225" y="316">Solo: 3 s</text><text x="22" y="106">20</text><text x="22" y="166">15</text><text x="35" y="344">0</text><text x="47" y="365">0</text><text x="147" y="365">8</text><text x="238" y="365">16</text><text x="333" y="365">24</text><text x="377" y="365">x (m)</text><text x="22" y="78">y (m)</text><text x="22" y="402">Mesma altura: 2 s. Solo mais baixo: 3 s.</text></g></svg>