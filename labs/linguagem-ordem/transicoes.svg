<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="title desc"><title id="title">Três estados para reconhecer a*b*</title><desc id="desc">A é inicial e aceita: com a vai a A, com b vai a B. B aceita: com a vai a X, com b fica B. X rejeita: com a ou b fica X. A palavra aba percorre A, A, B, X e é rejeitada.</desc><rect width="440" height="340" fill="#f4f3eb"/><g font-family="Arial,sans-serif" fill="#20221e" font-size="18"><text x="22" y="32" font-size="21" font-weight="bold">Um estado resume o prefixo</text><text x="22" y="62" font-size="16">Estado inicial: A. A entrada deve estar em {a,b}*.</text><text x="22" y="102">Estado</text><text x="130" y="102">Lê a</text><text x="220" y="102">Lê b</text><text x="305" y="102">Ao terminar</text><path d="M22 113H418 M22 160H418 M22 207H418 M22 254H418" stroke="#d3d7c9"/><text x="22" y="144">A (inicial)</text><text x="130" y="144">A</text><text x="220" y="144">B</text><text x="305" y="144" fill="#2348db">Aceita</text><text x="22" y="191">B</text><text x="130" y="191">X</text><text x="220" y="191">B</text><text x="305" y="191" fill="#2348db">Aceita</text><text x="22" y="238">X</text><text x="130" y="238">X</text><text x="220" y="238">X</text><text x="305" y="238">Rejeita</text><text x="22" y="288">aba: A → A → B → X</text><text x="22" y="319" font-size="16">Depois da violação, acrescentar letras não a desfaz.</text></g></svg>