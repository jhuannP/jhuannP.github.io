<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="t d"><title id="t">Separar os campos no material</title><desc id="d">H2000 A/m e M2 A/m somam B/mu0 igual a2002 A/m. Parâmetros n1000por metro,I2A,chi1/1000.</desc><rect width="420" height="420" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="38" font-size="22">Corrente e resposta do meio</text><text x="24" y="80" font-size="18">n = 1000 m⁻¹ · I = 2 A</text><text x="24" y="114" font-size="18">χ = 1/1000 · solenoide ideal</text><path d="M24 141H396" stroke="#bfc6cb"/><text x="24" y="190" font-size="27">H = 2000 A/m</text><text x="24" y="239" font-size="27">M = 2 A/m</text><path d="M24 268H396" stroke="#bfc6cb"/><text x="24" y="316" font-size="27" fill="#285e88">B/μ₀ = 2002 A/m</text><text x="24" y="369" font-size="18">Multiplique por μ₀ para obter B.</text><text x="24" y="401" font-size="17">Modelo linear · não é histerese</text></g></svg>