<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" role="img" aria-labelledby="t d"><title id="t">Raízes sem limite, mas com uma cota comum</title><desc id="d">Valores de a_n elevado a1/n são1/3 em índices ímpares e1/2 em pares. Todos ficam abaixo ou sobre1/2. A figura contém oito valores discretos, não prova um limite por amostra.</desc><rect width="620" height="430" fill="#faf9f4"/><g font-family="Arial,sans-serif" fill="#292929"><text x="22" y="32" font-size="21">Raízes distintas; uma majorante comum</text><text x="22" y="59" font-size="15">rₙ = (aₙ)^(1/n) · aₙ positivo · n inteiro</text><path d="M65 105V300H580" stroke="#777" fill="none"/><path d="M65 150H570" stroke="#4f46a5" stroke-width="2" stroke-dasharray="7 5"/><path d="M65 200H570" stroke="#aaa" stroke-dasharray="4 5"/><text x="18" y="155" font-size="16">1/2</text><text x="18" y="205" font-size="16">1/3</text><circle cx="85" cy="200" r="6" fill="#4f46a5"/><text x="85" y="325" text-anchor="middle" font-size="16">1</text><circle cx="149" cy="150" r="6" fill="#4f46a5"/><text x="149" y="325" text-anchor="middle" font-size="16">2</text><circle cx="213" cy="200" r="6" fill="#4f46a5"/><text x="213" y="325" text-anchor="middle" font-size="16">3</text><circle cx="277" cy="150" r="6" fill="#4f46a5"/><text x="277" y="325" text-anchor="middle" font-size="16">4</text><circle cx="341" cy="200" r="6" fill="#4f46a5"/><text x="341" y="325" text-anchor="middle" font-size="16">5</text><circle cx="405" cy="150" r="6" fill="#4f46a5"/><text x="405" y="325" text-anchor="middle" font-size="16">6</text><circle cx="469" cy="200" r="6" fill="#4f46a5"/><text x="469" y="325" text-anchor="middle" font-size="16">7</text><circle cx="533" cy="150" r="6" fill="#4f46a5"/><text x="533" y="325" text-anchor="middle" font-size="16">8</text><text x="35" y="305" font-size="15">0</text><text x="583" y="325" font-size="16">n</text><text x="22" y="366" font-size="17">rₙ ≤ 1/2 implica aₙ ≤ (1/2)ⁿ para todo n ≥ 1.</text><text x="22" y="397" font-size="14">Sem ligar pontos: são índices discretos; a prova usa a fórmula.</text></g></svg>