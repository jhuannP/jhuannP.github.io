<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img" aria-labelledby="t d"><title id="t">Três propostas conservam energia; uma viola a segunda lei</title><desc id="d">Reservatórios a seiscentos e trezentos kelvin, calor quente mil e duzentos joules. Rejeitar seiscentos dá trabalho seiscentos e entropia total zero. Rejeitar oitocentos dá trabalho quatrocentos e entropia total mais dois terços joule por kelvin. Rejeitar quatrocentos dá trabalho oitocentos e entropia total menos dois terços, incompatível com a segunda lei.</desc><rect width="440" height="390" fill="#f5f3e9"/><g font-family="Arial,sans-serif" fill="#252822"><text x="20" y="30" font-size="20" font-weight="bold">Conservar energia ainda não basta.</text><text x="20" y="62" font-size="16">TH=600 K; TC=300 K; QH=1.200 J.</text><g font-size="16"><text x="20" y="112">Proposta</text><text x="163" y="112">QC (J)</text><text x="246" y="112">W (J)</text><text x="333" y="108">ΔStot</text><text x="337" y="129">(J/K)</text><path d="M20 141H417 M20 304H417" stroke="#777b70" fill="none"/><text x="20" y="178">Limite</text><text x="172" y="178">600</text><text x="253" y="178">600</text><text x="352" y="178" fill="#2448bc">0</text><text x="20" y="232">Irreversível</text><text x="172" y="232">800</text><text x="253" y="232">400</text><text x="335" y="232" fill="#2448bc">+2/3</text><text x="20" y="286">Excluída</text><text x="172" y="286">400</text><text x="253" y="286">800</text><text x="335" y="286">−2/3</text><text x="20" y="337">Todas: QH=W+QC.</text><text x="20" y="367">Última: ΔStot&lt;0 viola a segunda lei.</text></g></g></svg>