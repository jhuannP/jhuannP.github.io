<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><desc>Comprimento sintético cresce de três a cinco micrômetros em dez segundos,encurta a três em quatro segundos e cresce a quatro nos cinco segundos finais. A observação termina sem nova catástrofe.</desc><rect width="600" height="600" fill="#f5f4ec"/><g font-family="Arial" fill="#242927"><text x="30" y="42" font-size="23">Um filamento, três trechos fornecidos</text><text x="30" y="77" font-size="17">Valores sintéticos · nenhuma célula medida</text><text x="30" y="116" font-size="17">comprimento / μm</text><path d="M80 145v280h450" fill="none" stroke="#555"/><path d="M80 281L300 185L388 281L498 233" fill="none" stroke="#434ac3" stroke-width="4"/><g font-size="17"><text x="53" y="431">0</text><text x="53" y="287">3</text><text x="53" y="191">5</text><text x="77" y="451">0</text><text x="288" y="451">10</text><text x="377" y="451">14</text><text x="487" y="451">19</text><text x="250" y="479">tempo / s</text><text x="256" y="161">catástrofe</text><text x="364" y="314">resgate</text><text x="402" y="207">fim observado</text><text x="30" y="529">G: 15 s de exposição · 1 catástrofe</text><text x="30" y="566">S: 4 s de exposição · 1 resgate</text></g><path d="M80 425v-5M300 425v-5M388 425v-5M498 425v-5" stroke="#555"/></g></svg>