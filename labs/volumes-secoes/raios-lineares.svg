<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440" role="img" aria-labelledby="t d"><title id="t">Mesma espessura, áreas diferentes</title><desc id="d">Anel em x zero: R um, r zero, área pi. Anel em x um: R dois, r um, área três pi.</desc><rect width="420" height="440" fill="#f7f5ee"/><g font-family="Arial,sans-serif" fill="#242c35"><text x="24" y="38" font-size="22">A espessura não basta</text><text x="24" y="72" font-size="18">R = 1+x · r = x · 0 ≤ x ≤ 1</text><circle cx="95" cy="190" r="40" fill="#285e88"/><circle cx="295" cy="190" r="80" fill="#285e88"/><circle cx="295" cy="190" r="40" fill="#f7f5ee"/><path d="M95 190H135M295 190H375" stroke="#242c35" stroke-width="2"/><g font-size="18"><text x="65" y="294">x = 0</text><text x="263" y="294">x = 1</text><text x="43" y="326">R=1 · r=0</text><text x="244" y="326">R=2 · r=1</text><text x="57" y="360">A = π</text><text x="257" y="360">A = 3π</text><text x="24" y="410">Nos dois cortes: R − r = 1</text></g></g></svg>