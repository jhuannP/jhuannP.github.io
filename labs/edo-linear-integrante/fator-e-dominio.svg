<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 490" role="img" aria-labelledby="title desc"><title id="title">Fator integrante e intervalo</title><desc id="desc">Em t maior que zero, y linha mais dois sobre t vezes y igual a três, com y de um igual a dois. Multiplicar por t ao quadrado produz a derivada de t ao quadrado y igual a três t ao quadrado. Integrar dá t ao quadrado y igual a t ao cubo mais um. Dividir fornece y igual a t mais um sobre t ao quadrado. Zero permanece excluído.</desc><rect width="440" height="490" fill="#faf8f2"/><g font-family="Arial,sans-serif" fill="#20372e"><text x="22" y="36" font-size="24" font-weight="bold">O domínio acompanha a conta</text><text x="22" y="70" font-size="21">t &gt; 0 · y(1) = 2</text><path d="M22 94H418" stroke="#aab7ae"/><text x="22" y="119" font-size="20" font-weight="bold">1. Equação linear</text><text x="22" y="154" font-size="25">y′ + (2/t)y = 3</text><path d="M22 183H418" stroke="#aab7ae"/><text x="22" y="208" font-size="20" font-weight="bold">2. Multiplicar por μ = t²</text><text x="22" y="243" font-size="25">(t²y)′ = 3t²</text><path d="M22 272H418" stroke="#aab7ae"/><text x="22" y="297" font-size="20" font-weight="bold">3. Integrar e usar o PVI</text><text x="22" y="332" font-size="25">t²y = t³ + 1</text><path d="M22 361H418" stroke="#aab7ae"/><text x="22" y="386" font-size="20" font-weight="bold">4. Dividir por t² ≠ 0</text><text x="22" y="421" font-size="25">y = t + 1/t²</text><text x="22" y="465" font-size="19">A equação original exclui t = 0.</text></g></svg>